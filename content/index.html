<style>

body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}
/* 폰: 입력칸 글자가 16px보다 작으면 아이폰이 칸을 누를 때 화면을 확대해 버린다 → 왼쪽이 잘리고 아래 탭이 밀림 */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{max-width:100%;overflow-x:clip}
@media (pointer:coarse){input,textarea,select{font-size:16px!important}}
:root{--g-bg:var(--bg);--g-fg:var(--ink);--g-mut:var(--muted);--g-card:var(--surface);--g-line:var(--line);--g-acc:var(--accent);--g-acc-ink:var(--accent-ink);--g-warn:var(--accent);--g-ok:var(--ok)}
#gate{position:fixed;inset:0;z-index:50;background:var(--g-bg);color:var(--g-fg);display:grid;place-items:center;padding:24px;font-family:inherit}
#gate .gbox{width:100%;max-width:340px;display:grid;gap:10px;justify-items:stretch}
#gate img{border-radius:14px;justify-self:start}
#gate h1{font-size:24px;margin:0}#gate .gsub{color:var(--g-mut);margin:0 0 8px}
#gate label{font-size:13px;color:var(--g-mut);margin-top:4px}
#gate input{font:inherit;font-size:16px;color:var(--g-fg);background:var(--g-card);border:1px solid var(--g-line);border-radius:10px;padding:11px 12px;width:100%}
#gate button{font:inherit;font-weight:600;cursor:pointer;margin-top:8px;padding:11px 14px;border-radius:999px;border:1px solid var(--g-line);background:var(--g-card);color:var(--g-fg)}
#gate button[type=submit]{background:var(--g-acc);border-color:var(--g-acc);color:var(--g-acc-ink)}
#gate .gerr{color:var(--g-warn);font-size:13px;min-height:18px}
/* 새로고침 버튼 (세 앱 공통, shim.js) — 오른쪽 위 작은 알약: 실시간 점 · ↻ · 마지막 동기화/반영 상태 */
#bsync{position:fixed;z-index:11;top:calc(8px + env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));display:inline-flex;align-items:center;gap:6px;max-width:min(62vw,240px);height:30px;padding:0 11px 0 9px;border-radius:999px;border:1px solid var(--g-line);background:var(--g-card);color:var(--g-mut);font:inherit;font-size:12px;font-weight:600;line-height:1;cursor:pointer;-webkit-tap-highlight-color:transparent}
#bsync:hover{color:var(--g-fg)}#bsync:focus-visible{outline:2px solid var(--g-acc);outline-offset:2px}
#bsync .bs-tx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
#bsync .bs-ic{font-size:14px;color:var(--g-acc)}
#bsync.busy{color:var(--g-fg);border-color:var(--g-acc)}#bsync.busy .bs-ic{animation:bsspin 1s linear infinite}
#bsync.macoff{border-style:dashed}
@keyframes bsspin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#bsync.busy .bs-ic{animation:none}}
#rtdot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--g-line)}
#rtdot.on{background:var(--g-ok)}#rtdot.off{background:var(--g-warn)}
#bsync-tip{position:fixed;z-index:11;top:calc(44px + env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));max-width:min(86vw,340px);padding:8px 12px;border-radius:12px;border:1px solid var(--g-line);background:var(--g-card);color:var(--g-fg);font-size:13px;line-height:1.45;box-shadow:0 4px 14px rgba(0,0,0,.12)}
header>.brand{padding-right:min(46vw,190px)}

</style>

<style>
/* 틀: 좁은 한 줄 기둥, 위에 탭, 아래 카드 (맥 단축키·체화 단어장과 같은 뼈대·같은 이름).
   색은 밝은 한 벌만 쓴다 (2026-11-16 동욱: 편집 믹서가 어두우니 이 앱은 밝고 세련되게) — 종이색 바탕 · 흰 카드 · 코발트 강조,
   상품 = 코랄(--prod) · 정체성 = 청록(--iden). 색·그림자·둥글기는 :root 값만 고친다.
   이 앱은 조종판이다: 브랜드(단어·즐겨찾기·레퍼런스 채널) → 키워드(씨앗 → ★ 선별 → 콘텐츠 검색) → 콘텐츠(☆) → 추천 → 대본 초안 (탭 순서는 TABS). 데이터는 볼트 파일이 정본이고 여기서는 읽기만,
   앱이 쓰는 것은 설정(ct.set)과 맥에 보내는 명령(cmd)뿐이다. */
:root{
  color-scheme:light;
  --bg:#F7F6F2; --surface:#FFFFFF; --surface-2:#F4F2EC; --ink:#1B1D22; --muted:#6B6F78; --line:#E7E4DC;
  --accent:#3B5BFF; --accent2:#8A6BFF; --accent-ink:#FFFFFF; --accent-bg:color-mix(in srgb,var(--accent) 10%,#fff);   /* 브랜드를 고르면 그 브랜드 키트 색으로 바뀐다 (applyKit) */
  --prod:#E4572E; --prod-bg:#FDEEE8; --iden:#0E8F7E; --iden-bg:#E3F5F1;
  --ok:#17915F; --no:#8A8E96;
  --ok-bg:#E5F6EE; --warn-bg:#FFF4D9; --blue-bg:var(--accent-bg);
  --shadow:0 1px 2px rgba(27,29,34,.04),0 10px 28px rgba(27,29,34,.06);
  --f-body:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 90px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding-block:16px 10px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:4px 12px;flex-wrap:wrap}
h1{font-size:22px;font-weight:800;margin:0;letter-spacing:-.03em;display:flex;align-items:center;gap:9px}
h1::before{content:"";width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,var(--accent),var(--accent2))}
.brand .links{flex-basis:100%;font-family:var(--f-body);font-size:12px}
.links a,.links button{font:inherit;color:inherit;background:none;border:0;padding:0;text-decoration:underline;cursor:pointer}
nav{display:flex;gap:2px;margin-top:12px;overflow-x:auto;scrollbar-width:none;background:var(--surface);border-radius:14px;padding:4px;box-shadow:var(--shadow)}
nav::-webkit-scrollbar{display:none}
nav button{flex:1 0 auto;text-align:center;padding:8px 11px;border-radius:10px;color:var(--muted);background:none;border:0;font:inherit;font-weight:600;font-size:14px;white-space:nowrap;cursor:pointer}
nav button.on{background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 30%,transparent)}
nav button span{font-family:var(--f-mono);font-weight:500;font-size:11px;opacity:.75;margin-right:4px}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{display:flex;flex-direction:column;gap:16px;padding-top:14px}
.card{background:var(--surface);border-radius:20px;padding:20px 22px;box-shadow:var(--shadow)}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
.card-h h3{font-size:18px;font-weight:750;margin:0;line-height:1.35;letter-spacing:-.02em}
.card-h .n{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
h4{font-size:14px;font-weight:700;margin:14px 0 4px}
.lead{font-size:13px;color:var(--muted);margin:0 0 6px;line-height:1.55}
p{margin:0}a{color:inherit}
.muted{color:var(--muted)} .small{font-size:13px} .mono{font-family:var(--f-mono)}
.empty{padding:22px 4px;text-align:center;color:var(--muted);font-size:14px}
.note{font-size:13px;padding:10px 12px;border-radius:10px;background:var(--warn-bg);line-height:1.55}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:7px 12px;border-radius:999px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip span{font-family:var(--f-mono);font-weight:500;font-size:11px;opacity:.75;margin-left:3px}
.chip i.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}.chip i.dot.p{background:var(--prod)}.chip i.dot.i{background:var(--iden)}
.chip.dash{border-style:dashed;color:var(--accent)}
/* 브랜드 고르기 — 편집 믹서의 채널 탭처럼 맨 위에서 고르면 그 브랜드 화면·색으로 열린다 */
#brands{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}#brands::-webkit-scrollbar{display:none}
#brands button{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:7px 13px 7px 9px;border-radius:999px;font:inherit;font-size:13.5px;font-weight:650;cursor:pointer;white-space:nowrap}
#brands button i{width:14px;height:14px;border-radius:50%;flex:none}
#brands button.on{color:var(--ink);border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-bg)}
.sw{display:inline-block;width:18px;height:18px;border-radius:6px;vertical-align:-4px;margin-right:4px;border:1px solid var(--line)}
.bars{display:flex;gap:6px;align-items:flex-end;height:74px;margin-top:8px}.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;font-size:12px;color:var(--muted)}.bars i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:var(--accent);min-height:2px}
input[type=date]{font:inherit;font-size:13px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:11px 17px;border-radius:12px;font:inherit;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 26%,transparent)}
.btn.sm{padding:6px 11px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
input[type=text],textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
textarea{min-height:150px;resize:vertical;line-height:1.5}
/* 표시 딱지 — 종류(상품·정체성)·역할(풀링·키)·단계·판정 */
.tag{display:inline-block;font-size:12px;font-weight:600;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;vertical-align:1px}
.tag.p{color:var(--prod);background:var(--prod-bg);border-color:transparent}
.tag.i{color:var(--iden);background:var(--iden-bg);border-color:transparent}
.tag.ok{color:var(--ok);background:var(--ok-bg);border-color:transparent}
.tag.fill{background:var(--ink);color:#fff;border-color:var(--ink)}
/* 한 줄 목록 */
.list{display:flex;flex-direction:column}
.it{display:flex;gap:10px;padding:11px 0;border-top:1px solid var(--line);align-items:flex-start}
.it:first-child{border-top:0}
.it-m{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.it-h b{font-weight:700;font-size:15px}
.it-d{font-size:13px;color:var(--muted);line-height:1.5}
.it.off .it-m{opacity:.5}
.num{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.mk{width:38px;height:38px;border-radius:11px;margin-left:2px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:14px;cursor:pointer;padding:0;line-height:1;flex:none}
.mk[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mk.no[aria-pressed=true]{background:var(--no);border-color:var(--no);color:#fff}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--muted);font-size:13px;white-space:nowrap}.kv dd{margin:0;min-width:0}
details>summary{cursor:pointer;font-weight:600;font-size:13px;color:var(--muted);list-style:none}details>summary::-webkit-details-marker{display:none}
details>summary::after{content:" ▾"}details[open]>summary::after{content:" ▴"}
.pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.65}
/* 비율 */
input[type=range]{width:100%;height:30px;accent-color:var(--ink);margin:8px 0 0}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.step{display:inline-flex;align-items:center;gap:6px}
.step button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.step b{min-width:26px;text-align:center;font-family:var(--f-mono)}
.row2{display:flex;gap:8px;align-items:center}.row2>input,.row2>select{flex:1;min-width:0}
/* 한눈에 — 여섯 단계 상자 */
.pfield{margin-top:12px}.pfield .pl{display:block;font-size:13px;font-weight:650;color:var(--muted);margin-bottom:3px}.pfield textarea{min-height:0}
.pv{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.pv>span:first-child,.pv>div:first-child{flex:1;min-width:0}
.prow{display:flex;gap:6px;align-items:center;margin-top:6px}.prow input{min-width:0}.prow input[data-pf=name]{flex:0 0 32%}.prow input[data-pf=what]{flex:1}
.ref-t{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}.ref-t .mk{width:34px;height:34px;flex:none}.mk.fav[aria-pressed=true]{background:#F5B700;border-color:#F5B700;color:#fff}
.x0{background:none;border:0;color:inherit;font:inherit;cursor:pointer;padding:0 0 0 4px}
.card.next{border:1.5px solid var(--accent);background:color-mix(in srgb,var(--accent) 4%,var(--surface))}
.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stepbox{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:14px;padding:10px 12px;font:inherit;color:var(--ink);cursor:pointer;min-width:0}
.stepbox b{font-size:13.5px}.stepbox .big{font-family:var(--f-mono);font-size:20px;font-weight:600;line-height:1.3}.stepbox .it-d{font-size:12px;overflow-wrap:anywhere}
.stepbox:hover{border-color:var(--accent)}
@media (min-width:640px){.flow{grid-template-columns:repeat(6,1fr)}}
.rows{display:grid;gap:8px;margin-top:6px}.rows>div{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
/* 맥에 보낸 명령 상태 */
.run{display:flex;gap:10px;align-items:flex-start;font-size:13px;padding:12px 14px;border-radius:14px;background:var(--blue-bg);line-height:1.5}
.run.done{background:var(--ok-bg)}.run.bad{background:var(--warn-bg)}
.run b{white-space:nowrap}.run .x{margin-left:auto;background:none;border:0;color:var(--muted);cursor:pointer;font:inherit}
/* 레퍼런스 카드 */
.ref{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.ref:first-child{border-top:0}
.ref img{width:128px;height:72px;object-fit:cover;border-radius:12px;flex:none;background:var(--surface-2)}
.ref-m{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
/* 단계 사다리 — 브랜드.json stages 를 위(마지막 단계)에서 아래(첫 단계)로 쌓는다. 칸 색은 아래에서 위로 갈수록 브랜드 강조색이 짙어진다 */
.ladder{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.rung{position:relative;display:flex;gap:12px;align-items:stretch;border:1px solid var(--line);border-left:4px solid color-mix(in srgb,var(--accent) var(--lv),#fff);border-radius:12px;background:color-mix(in srgb,var(--accent) calc(var(--lv) / 6),#fff);padding:10px 12px;min-height:64px}
.rung+.rung::before{content:"";position:absolute;top:-13px;left:30px;border:6px solid transparent;border-top:0;border-bottom:8px solid color-mix(in srgb,var(--accent) var(--lv),#fff)}
.rung-h{flex:none;width:76px;display:flex;flex-direction:column;justify-content:center;gap:2px;border-right:1px solid var(--line);padding-right:10px}
.rung-h b{font-size:14px}.rung-h span{font-size:11px;color:var(--muted);line-height:1.35}
.rung-i{flex:1;min-width:0;display:flex;gap:10px;overflow-x:auto;align-items:flex-start}
.rung-i a,.rung-i .chipx{flex:none;width:132px;text-decoration:none;color:var(--ink);font-size:12px;font-weight:600;line-height:1.35}

<script>
"use strict";
/* 내용은 볼트가 정본이다 — `4_Outputs/콘텐츠 기획 앱/<브랜드>/` 의 JSON 을 맥 동기화(content_app.py)가 Supabase `ct.data/<브랜드>[.부분]` 으로 올린다.
   목록·문구를 바꾸려면 볼트 파일(또는 그 파일을 쓰는 세 스킬)을 고친다. 코드에 넣지 않는다.
   앱이 쓰는 것: `ct.set/<브랜드>` (비율·고정·빼기·고른 추천) · `cmd/<id>` (맥의 Claude 에게 보내는 일, from: "content"). */
var DB = null;
var RAW = {};                       // ct.data 문서 id → data
var SETS = {};                      // 브랜드 id → 설정
var CMDS = [];                      // 이 앱이 보낸 명령 (최근 것부터)
var cur = new URLSearchParams(location.search).get("b") || load("ct.brand", "");     // 지금 브랜드 — 주소 ?b=<id> 로 바로 연다 (브랜드마다 홈 화면 바로가기를 따로 둘 수 있다)
var tab = load("ct.tab", "sum");
var ui = { kwKind: "all", kwMore: 60, refRole: "all", refSort: "mix", refBuyer: true, refView: "videos", refMore: 20, bdView: load("ct.bdView", "cards"), bdDoc: "", newBrand: false, hide: load("ct.hide", {}) };
var TABS = [["sum", "한눈에"], ["brand", "브랜드"], ["kw", "키워드"], ["ref", "콘텐츠"], ["rec", "추천"], ["build", "구축"], ["script", "대본"]];
var PARTS = { search: ".search", chancand: ".chancand", kw: ".kw", trend: ".trend", ref: ".ref", live: ".live", chan: ".chan", rec: ".rec", build: ".build", script: ".script", source: ".source", log: ".log" };

function load(k, d){ try{ var v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v }catch(e){ return d } }
function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)) }catch(e){} }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c] }) }
function md(s){ return esc(s).replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/\[\[([^\]|]+)(?:\|[^\]]+)?\]\]/g, "$1") }
function fmt(n){ return n == null ? "—" : Number(n).toLocaleString("ko-KR") }
function ago(iso){ var m = Math.round((Date.now() - Date.parse(iso || 0)) / 60000); return isNaN(m) ? "" : m < 1 ? "방금" : m < 60 ? m + "분 전" : m < 1440 ? Math.round(m / 60) + "시간 전" : Math.round(m / 1440) + "일 전" }
function day(iso){ return String(iso || "").slice(0, 10) }

/* ── 데이터 꺼내기 ── */
function brands(){ return Object.keys(RAW).filter(function(id){ return id.indexOf(".") < 0 && RAW[id].name }).map(function(id){ return RAW[id] }).sort(function(a, b){ return (a.order || 9) - (b.order || 9) }) }
function pickBrand(id){
  cur = id; save("ct.brand", cur);
  try{ history.replaceState(null, "", location.pathname + "?b=" + encodeURIComponent(cur) + location.hash) }catch(e){}
  render();
}
/* 브랜드 키트(브랜드.json kit) → 화면 강조색. 색을 바꾸려면 볼트의 그 브랜드 파일을 고친다 */
function applyKit(){
  var k = (B() && B().kit) || {}, st = document.documentElement.style;
  if(k.accent){ st.setProperty("--accent", k.accent); st.setProperty("--accent2", k.accent2 || k.accent) }
  else { st.removeProperty("--accent"); st.removeProperty("--accent2") }   // 키트가 없으면 :root 의 기본색
}
function B(){   // 브랜드 정본(ct.data) + 앱에서 고친 브랜드 정보(ct.set profile — 맥이 정본에 적기 전까지 겹쳐 본다)
  var r = RAW[cur] || null, pf = (SETS[cur] || {}).profile;
  return r && pf ? Object.assign({}, r, pf, { identity: Object.assign({}, r.identity || {}, pf.identity || {}) }) : r;
}
function part(name){ return RAW[cur + PARTS[name]] || null }
/* 쇼츠는 안 한다 (2026-11-16 동욱 "쇼츠는 하지 말고 다 미드폼 롱폼 기준으로" · 11-17 "쇼츠 우선 제외") —
   지난 회차의 숏폼 레퍼런스·추천은 시트·데이터 파일에 그대로 두고 앱에서만 뺀다 */
function isLong(x){ return x.form !== "숏폼" }
function isLongRec(x){ return !/^숏폼/.test(x.format || "") }
function pickedIds(s){ var r = part("rec"), rd = r && r.rounds && r.rounds[r.rounds.length - 1];   // 최신 회차에서 고른 미드폼·롱폼 추천만
  return rd ? rd.items.filter(function(x){ return isLongRec(x) && s.pick[x.id] }).map(function(x){ return x.id }) : [] }
function S(){
  var b = B(), d = (b && b.defaults) || {}, s = SETS[cur] || {};
  var share = {}; ((b && b.products) || []).forEach(function(p){ share[p.name] = (s.share && s.share[p.name] != null) ? s.share[p.name] : p.share });
  return { ratio: s.ratio != null ? s.ratio : (d.ratio != null ? d.ratio : 70), count: s.count || d.count || 20, share: share,
    mid: s.mid != null ? s.mid : (d.mid != null ? d.mid : 10),
    perWeek: s.perWeek || d.perWeek || 2, plan: s.plan || {},
    roles: roleNames().reduce(function(o, n){ o[n] = (s.roles && s.roles[n] != null) ? s.roles[n] : ((d.roles && d.roles[n] != null) ? d.roles[n] : 3); return o }, {}), buyOnly: s.buyOnly !== false, fresh: s.fresh !== false, pinOnly: !!s.pinOnly,
    pin: s.pin || {}, ex: s.ex || {}, pick: s.pick || {} };
}
/* 역할(풀링·키)과 단계(5개)는 브랜드.json 이 정본 — roles · stages 를 읽는다 (2026-11-16 동욱: 신뢰 역할 없앰) */
function roleNames(){ var b = B(); return ((b && b.roles) || []).map(function(x){ return x.name }) }
function stageList(){ var b = B(); return (b && b.stages) || [] }
function stageTag(x){ return x && x.stage ? "<span class=\"tag\">" + esc(x.stage) + "</span>" : "" }
/* 사다리 — items 를 단계 칸에 나눠 위(마지막 단계)부터 그린다. cell(x) 는 칸 안 한 개의 HTML */
function ladderHtml(items, cell){
  var st = stageList(), n = st.length;
  return "<div class=\"ladder\">" + st.slice().reverse().map(function(g, i){
    var lv = 100 - Math.round(70 * i / Math.max(1, n - 1)), its = items.filter(function(x){ return x.stage === g.name });   // 맨 위(마지막 단계)가 가장 짙다
    return "<div class=\"rung\" style=\"--lv:" + lv + "%\"><div class=\"rung-h\"><b>" + esc(g.name) + "</b><span>" + esc(g.what || "") + "</span></div><div class=\"rung-i\">" +
      (its.length ? its.map(cell).join("") : "<span class=\"none\">아직 없음</span>") + "</div></div>";
  }).join("") + (items.some(function(x){ return !x.stage }) ? "<p class=\"lead\">단계가 안 붙은 " + items.filter(function(x){ return !x.stage }).length + "개는 사다리에서 빠졌어요.</p>" : "") + "</div>";
}
function setS(patch){
  var s = Object.assign({}, SETS[cur] || {}, patch, { updatedAt: new Date().toISOString() });
  SETS[cur] = s;
  s.cand = candidates(S()).map(function(k){ return { kw: k.kw, score: k.score } });   // 그때 조사 후보 — 맥이 설정.json 으로 받아 기록 PDF 에 쓴다
  if(DB) DB.doc("ct.set/" + cur).set(s).catch(function(){});
  render();
}

/* ── 맥에 일 보내기 — cmd 문서 하나. 맥의 cmd_runner 가 집어 Claude(세 스킬)를 돌린다 ── */
var KIND = { discover: "키워드·레퍼런스 조사", trends: "구글 트렌드 받기", refresh: "레퍼런스 최신화", recommend: "콘텐츠 추천", script: "대본 초안", source: "소재 찾기", chanfind: "소재 채널 찾기", brief: "새 브랜드 프로필" };
function isOpen(c){ return /보내는 중|맥 대기|처리 중/.test(c.status || "") }
function openCmd(kind){ return CMDS.filter(function(c){ return c.kind === kind && c.brand === cur && isOpen(c) })[0] }
function send(kind, text, params){
  if(!DB || openCmd(kind)) return;
  var id = "c" + Date.now().toString(36), at = new Date().toISOString(), b = B();
  var data = { text: "🎬 콘텐츠 기획 — " + (b ? b.name : (params && params.name) || "") + " " + text, from: "content", app: "content", kind: kind,
    brand: cur || "", params: params || {}, createdAt: at, sentAt: at, status: "보내는 중", result: "" };
  CMDS.unshift(Object.assign({ id: id }, data));
  DB.doc("cmd/" + id).set(data).catch(function(){ CMDS[0].status = "못 보냄"; CMDS[0].result = "못 보냈어요 — 인터넷을 확인하고 다시 눌러 주세요"; render() });
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });   // 상태 줄은 맨 위에 뜬다 — 버튼이 아래에 있어도 보이게
}
function runHtml(kinds){
  var out = "";
  kinds.forEach(function(k){
    var c = CMDS.filter(function(x){ return x.kind === k && (x.brand === cur || k === "brief") })[0];
    if(!c || ui.hide[c.id]) return;
    var open = isOpen(c), bad = /멈춤|못 보냄/.test(c.status || "");
    if(!open && Date.now() - Date.parse(c.doneAt || c.createdAt) > 3 * 86400000) return;
    var step = c.steps ? " · " + c.steps.n + "/" + c.steps.total + " " + esc(c.steps.now || "") : "";
    out += "<div class=\"run" + (open ? "" : bad ? " bad" : " done") + "\"><b>" + (open ? "⏳" : bad ? "⚠" : "✓") + " " + KIND[k] + "</b><span>" +
      (open ? esc(c.status) + step + " · 보낸 지 " + ago(c.createdAt).replace(" 전", "") + (c.status === "처리 중" ? " — 맥의 Claude가 하고 있어요. 몇 분에서 수십 분 걸려요." : " — 맥이 켜져 있으면 곧 받아서 시작해요.")
            : esc(String(c.result || c.status || "").split("\n").slice(0, 4).join(" · ")) + " <span class=\"muted\">(" + ago(c.doneAt || c.createdAt) + ")</span>") +
      "</span>" + (open ? "" : "<button class=\"x\" data-hide=\"" + c.id + "\" aria-label=\"닫기\">✕</button>") + "</div>";
  });
  return out;
}

/* ── 점수 기준 (참고용) — 키워드 점수·레퍼런스 점수를 매길 때만 쓰는 비중 ──
   2026-11-17 동욱: "비율·믹서 탭은 없애고 참고 수준으로 너가 가지고 있어. 믹서는 점수를 매기는 기준으로 필요할 때만."
   화면에서 고치는 곳은 없다. 비중은 볼트 「콘텐츠 기획 앱/믹서.json」(ct.data/mixer.def)의 브랜드 템플릿 값이 정본 — 바꿔야 하면 Claude 가 그 파일을 고친다. */
function mixTpl(){
  var d = RAW["mixer.def"] || { templates: [] }, id = (SETS[cur] || {}).template || (B() && B().template) || "base";
  return d.templates.filter(function(t){ return t.id === id })[0] || d.templates[0] || { id: id, name: id, values: {} };
}
function M(){ return Object.assign({}, mixTpl().values, (SETS[cur] || {}).mixer || {}) }   // 지금 적용되는 비중
function wsum(pairs){   // [[가중치, 0~100 점수], …] → 가중 평균
  var w = 0, t = 0; pairs.forEach(function(p){ w += p[0]; t += p[0] * p[1] }); return w ? t / w : 0;
}

/* ── 키워드 탭 — 점수 매기기 · 비율대로 후보 뽑기 · 화면 ──
   점수(0~100)는 종류마다 다르게 본다. 무엇을 얼마나 볼지는 판정 믹서 값이다 (content-mixer.js · 볼트 믹서.json) — 여기에 비중을 적지 않는다:
     상품    = 검색량(kw_vol) · 광고 클릭률(kw_ctr) · 상승세(kw_rise) 의 가중 평균   (사려는 사람이 찾는 말인지가 중요)
               클릭률은 월 검색 200 미만이면 그만큼 덜 믿는다 (검색 20에 클릭 4번이면 20%가 나오므로)
     정체성  = 검색량(id_vol) · 상승세(id_rise) 의 가중 평균   (채널 성격에 맞는 넓은 주제 — 클릭률은 안 본다)
   검색량은 로그로 눌러 큰 키워드 하나가 다 가져가지 않게 한다. 상승세 = 구글 트렌드 최근 4주 ÷ 그 앞 8주. */
/* 다른 도구에서 가져온 보는 법 (자료는 네이버 검색광고 값 그대로 — 새로 추정하지 않는다)
     난이도 (Ahrefs 키워드 난이도) = 광고 경쟁: 경쟁정도 높음 + 노출 광고 9개 이상 → 어려움 · 노출 광고 5개 이하나 경쟁정도 낮음 → 쉬움 · 그 사이 보통
     주제 묶음 (Ahrefs 상위 주제) = 브랜드.json clusters 의 말이 든 키워드끼리 묶어 검색량을 더한다 — 키워드 하나가 아니라 주제의 크기를 본다
     빈 곳 (Ahrefs 콘텐츠 갭) = 구매 결인 상품 키워드인데 아직 조사하지 않았고, 레퍼런스 검색어·추천 제목 어디에도 안 나온 것 */
/* 씨앗 단어 — 브랜드마다 「브랜드 정체성 단어」와 「상품별 판매 단어」를 동욱이 넣고 뺀다 (브랜드 탭 · 한 쪽에 SEED_MAX 개까지).
   맥이 씨앗마다 연관 검색어를 받아 키워드.json 에 seed 를 달아 둔다 (content_app.py seeds). 받는 곳(seedSrc) = 네이버 검색광고 · 구글 트렌드 · 둘 다.
   고친 것은 ct.set(Supabase)에 바로 쓰이고, 맥 동기화가 설정.json 과 브랜드.json 정본에도 적는다 → ct.data/<브랜드> 도 따라 바뀐다. */
var SEED_MAX = 10;

function seedsOf(){ return ((SETS[cur] || {}).seeds || (B() && B().seeds) || []).filter(function(x){ return x.word }) }
function seedSrc(){ return (SETS[cur] || {}).seedSrc || (B() && B().seedSrc) || "naver" }
function isFar(x, word){ return (x.far || []).indexOf(word) >= 0 }   // 씨앗이 안 든 말 — 구글 관련 검색어로만 들어온 것
function seedItems(word, far){ return scored().filter(function(x){ return (x.seed || []).indexOf(word) >= 0 && (far == null || isFar(x, word) === far) }).sort(function(a, b){ return b.total - a.total || (b.gTop || 0) - (a.gTop || 0) }) }

/* 선별한 키워드로 콘텐츠 검색 — ★(즐겨찾기)한 키워드 중 고른 것으로 맥이 유튜브를 검색해 미드폼·롱폼 영상을 읽어 온다 (Claude 없이, content_app.py search).
   요청은 ct.set searchReq {at, kws} 하나 — 맥 동기화가 보고 검색해 검색.json(ct.data .search)에 쓴다. 결과는 콘텐츠 탭 「키워드로 찾은 콘텐츠」. */
function searchState(){ var r = (SETS[cur] || {}).searchReq, d = part("search"); return { req: r, data: d, busy: !!(r && (!d || d.reqAt !== r.at || d.busy)) } }
function searchBoxHtml(){

      "<div class=\"acts\"><button class=\"btn primary\" data-act=\"search\"" + (!use.length || st.busy ? " disabled" : "") + ">" + (st.busy ? "맥이 검색하는 중…" : "★ " + use.length + "개로 콘텐츠 검색") + "</button>" +
      (d && d.items && d.items.length ? "<button class=\"btn\" data-go=\"ref|refView=search\">찾은 콘텐츠 " + d.items.length + "개 보기 →</button>" : "") + "</div>" +
      (st.busy ? "<p class=\"lead\" style=\"margin-top:8px\">키워드 하나에 30초쯤 걸려요. 맥이 켜져 있어야 해요.</p>" : d && d.updatedAt ? "<p class=\"lead\" style=\"margin-top:8px\">마지막 검색 " + esc(day(d.updatedAt)) + " " + esc(String(d.updatedAt).slice(11, 16)) + "</p>" : "")
      : "<p class=\"note\">아직 ★한 키워드가 없어요. 위 씨앗 단어별 연관 검색어에서 좋은 키워드에 ★을 누르세요.</p>") + "</section>";

function diffOf(x){ return x.comp === "높음" && x.ads >= 9 ? "어려움" : (x.ads <= 5 || x.comp === "낮음") ? "쉬움" : "보통" }
function clusterOf(kw){
  var cs = (B() && B().clusters) || [];
  for(var i = 0; i < cs.length; i++){ if(new RegExp(cs[i].match).test(kw)) return cs[i].name }
  return "그 밖";
}
function coveredText(){
  var r = part("ref"), rc = part("rec"), t = "";
  if(r) r.items.forEach(function(x){ t += " " + x.query });
  if(rc) rc.rounds.forEach(function(rd){ rd.items.forEach(function(x){ t += " " + x.title }) });
  return t.replace(/\s+/g, "");
}
function riseOf(kw){ var t = part("trend"); var x = t && t.items && t.items[kw]; return x ? x : null }
function scored(){
  var k = part("kw"); if(!k || !k.items) return [];
  var max = { "상품": 0, "정체성": 0 };
  k.items.forEach(function(x){ if(x.total > (max[x.kind] || 0)) max[x.kind] = x.total });
  var cov = coveredText(), m = M();
  function w(id){ return m[id] != null ? m[id] : 1 }   // 믹서 정의가 아직 안 왔으면 고르게
  return k.items.map(function(x){
    var tr = riseOf(x.kw), rise = tr ? tr.rise : null;
    var vol = max[x.kind] ? Math.log10(x.total + 1) / Math.log10(max[x.kind] + 1) * 100 : 0;
    var ctr = Math.min(x.ctr || 0, 10) * 10 * Math.min(1, x.total / 200);
    var up = rise == null ? 50 : Math.max(0, Math.min(1, (rise - 0.5) / 1.5)) * 100;
    var score = x.kind === "상품" ? wsum([[w("kw_vol"), vol], [w("kw_ctr"), ctr], [w("kw_rise"), up]]) : wsum([[w("id_vol"), vol], [w("id_rise"), up]]);
    return Object.assign({}, x, { rise: rise, w: tr ? tr.w : null, score: Math.round(score), buy: /^구매/.test(x.intent || "") && !/경쟁사 이름/.test(x.intent || ""), diff: diffOf(x), cluster: clusterOf(x.kw) });
  }).map(function(x){ return Object.assign(x, { gap: x.kind === "상품" && x.buy && !x.surveyed && x.total >= 10 && cov.indexOf(x.kw) < 0 });
  }).sort(function(a, b){ return b.score - a.score || b.total - a.total });
}
/* 비율 → 몇 개씩: 상품 nP · 정체성 nI, 상품 안에서는 상품 비중대로 (나머지는 큰 쪽부터) */
function split(s){
  var nP = Math.round(s.count * s.ratio / 100), nI = s.count - nP, names = Object.keys(s.share);
  var sum = names.reduce(function(a, n){ return a + s.share[n] }, 0), per = {}, used = 0;
  var fr = names.map(function(n){ var raw = sum ? nP * s.share[n] / sum : 0; per[n] = Math.floor(raw); used += per[n]; return [n, raw - per[n]] })
    .sort(function(a, b){ return b[1] - a[1] });
  for(var i = 0; used < nP && fr.length; i = (i + 1) % fr.length){ per[fr[i][0]]++; used++ }
  return { nP: nP, nI: nI, per: per };
}
/* 이번 조사 후보: 고정한 것 먼저, 그다음 점수순. 뺀 것·(켜 두면) 이미 조사한 것·구매 결 아닌 상품 키워드는 뺀다 */
function candidates(s){   // ★(검증한 키워드)은 비율·조건과 상관없이 먼저 다 넣고, 「★만 조사」가 아니면 남은 자리를 비율대로 점수순으로 채운다
  var all = scored(), out = all.filter(function(x){ return s.pin[x.kw] && !s.ex[x.kw] });
  if(s.pinOnly && out.length) return out;
  var sp = split(Object.assign({}, s, { count: Math.max(0, s.count - out.length) }));
  function ok(x){ return !s.ex[x.kw] && (s.pin[x.kw] || ((!s.fresh || !x.surveyed) && (x.kind !== "상품" || !s.buyOnly || x.buy))) }
  function take(pool, n){ pool.filter(function(x){ return out.indexOf(x) < 0 }).slice(0, n).forEach(function(x){ out.push(x) }) }
  Object.keys(sp.per).forEach(function(name){ take(all.filter(function(x){ return x.kind === "상품" && x.product === name && ok(x) }), sp.per[name]) });
  var short = sp.nP - out.filter(function(x){ return x.kind === "상품" && !s.pin[x.kw] }).length;   // 어느 상품 후보가 모자라면 다른 상품 키워드로 채운다
  if(short > 0) take(all.filter(function(x){ return x.kind === "상품" && ok(x) && out.indexOf(x) < 0 }), short);
  take(all.filter(function(x){ return x.kind === "정체성" && ok(x) }), sp.nI);
  return out;
}
function spark(w){

  return "<svg class=\"spark\" width=\"" + W + "\" height=\"" + H + "\" viewBox=\"0 0 " + W + " " + H + "\" aria-hidden=\"true\"><polyline points=\"" + pts + "\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linejoin=\"round\"/></svg>";
}
var RISE_UP = 1.15, RISE_DOWN = 0.85;   // 상승세를 「오르는 중」·「내리는 중」으로 보는 선

function riseHtml(x){

}

/* ── 브랜드 탭 그 자리에서 고치기 — 브랜드의 모든 칸(이름·채널·소개·타깃·첫 질문·훅 규칙·판매 상품·콘텐츠 축·필러·구매자 욕구·역할·단계)을
   칸마다 ✎ 고치기 · ✕ 빼기 · 넣기로 바로 바꾼다 (2026-11-17 동욱: "처음에 정한 게 기본값이 되는 게 아니라 모든 자체를 수정하고 뺄 수 있게").
   바꾼 것은 ct.set/<브랜드> profile 에 바로 쓰이고(Supabase), 맥 동기화가 볼트 브랜드.json 정본에 적는다 → ct.data/<브랜드> 도 따라 바뀐다.
   맥이 받기 전에도 화면이 바뀐 값으로 보이게 B() 가 profile 을 겹쳐 본다. 레퍼런스 채널·포맷·주제 은행은 볼트 레퍼런스 카드가 정본이라 여기서 고치지 않는다. */
var PROF_KEYS = ["name", "handle", "one", "target", "firstQuestion", "hook", "products", "identity", "roles", "stages"];
/* 목록 칸 — 어디에 있고, 한 줄 글과 어떻게 오가나 (짝 칸은 「앞 — 뒤」로 적는다) */
var PLIST = {
  "identity.axes": { label: "콘텐츠 축", hint: "콘텐츠 축 넣기" },
  "identity.needs": { label: "구매자 욕구", hint: "구매자 욕구 넣기" },
  "identity.pillars": { label: "필러", hint: "A — 사람이 안 오는 이유", pair: ["id", "name"] },
  "roles": { label: "역할", hint: "풀링 — 사람을 모으기", pair: ["name", "what"] },
  "stages": { label: "단계", hint: "궁금 의문 — 저건 왜 저래?", pair: ["name", "what"] }
};
function profNow(){
  var b = B() || {}, o = {};
  PROF_KEYS.forEach(function(k){ if(b[k] != null) o[k] = JSON.parse(JSON.stringify(b[k])) });
  o.identity = o.identity || {}; o.products = o.products || [];
  return o;
}
function pget(o, path){ return path.split(".").reduce(function(a, k){ return a ? a[k] : undefined }, o) }
function pset(o, path, v){ var ks = path.split("."), t = o; ks.slice(0, -1).forEach(function(k){ t = t[k] = t[k] || {} }); t[ks[ks.length - 1]] = v }
function itemText(def, x){ return def.pair ? x[def.pair[0]] + (x[def.pair[1]] ? " — " + x[def.pair[1]] : "") : x }
function itemParse(def, t){ t = t.trim(); if(!def.pair) return t; var i = t.indexOf("—"), o = {}; o[def.pair[0]] = (i < 0 ? t : t.slice(0, i)).trim(); o[def.pair[1]] = i < 0 ? "" : t.slice(i + 1).trim(); return o }
/* 고친 값 저장 — 상품 이름이 바뀌면 그 상품의 판매 단어(seeds)·비중(share)도 따라가고, 뺀 상품의 판매 단어는 같이 뺀다 */
function profSave(p, ren){
  var patch = { profile: p }, names = (p.products || []).map(function(x){ return x.name });
  ren = ren || {};
  var sd = seedsOf().map(function(x){ return x.kind === "상품" && ren[x.product] ? Object.assign({}, x, { product: ren[x.product] }) : x })
    .filter(function(x){ return x.kind !== "상품" || names.indexOf(x.product) >= 0 });
  if(JSON.stringify(sd) !== JSON.stringify(seedsOf())) patch.seeds = sd;
  var sh = (SETS[cur] || {}).share; if(sh){ var ns = {}; Object.keys(sh).forEach(function(k){ var nk = ren[k] || k; if(names.indexOf(nk) >= 0) ns[nk] = sh[k] }); patch.share = ns }
  ui.pedit = ""; ui.pdraft = {}; setS(patch);
}
function draft(key, val){ return (ui.pdraft || {})[key] != null ? ui.pdraft[key] : (val == null ? "" : val) }
function editBtns(key){ return "<button class=\"btn sm primary\" data-act=\"psave\" data-k=\"" + esc(key) + "\">저장</button><button class=\"btn sm\" data-act=\"pcancel\">취소</button>" }
function penBtn(key, label){ return "<button class=\"mk\" data-act=\"pedit\" data-k=\"" + esc(key) + "\" aria-label=\"" + esc(label) + " 고치기\" title=\"고치기\">✎</button>" }
/* 글 칸 하나 — 보기 ↔ 고치기 */
function ptextHtml(key, label, multi){
  var v = profNow()[key] || "";
  if(ui.pedit === key) return "<div class=\"pfield\"><span class=\"pl\">" + esc(label) + "</span>" +
    (multi ? "<textarea data-pfin=\"" + key + "\" rows=\"3\">" + esc(draft(key, v)) + "</textarea>" : "<input type=\"text\" data-pfin=\"" + key + "\" value=\"" + esc(draft(key, v)) + "\">") +
    "<div class=\"acts\">" + editBtns(key) + "</div></div>";
  return "<div class=\"pfield\"><span class=\"pl\">" + esc(label) + "</span><div class=\"pv\"><span>" + (v ? esc(v) : "<span class=\"muted\">비어 있음</span>") + "</span>" + penBtn(key, label) + "</div></div>";

/* 목록 칸 — 줄마다 ✎ · ✕, 맨 아래 넣기 */
function plistHtml(path){
  var def = PLIST[path], list = pget(profNow(), path) || [];
  return "<div class=\"pfield\"><span class=\"pl\">" + esc(def.label) + " <span class=\"num muted\">" + list.length + "</span></span><div class=\"list\">" + list.map(function(x, i){

    return "<div class=\"it\"><div class=\"it-m\">" + (def.pair ? "<div><b>" + esc(x[def.pair[0]]) + "</b>" + (x[def.pair[1]] ? " " + esc(x[def.pair[1]]) : "") + "</div>" : "<div>" + esc(x) + "</div>") + "</div>" +
      penBtn(key, def.label) + "<button class=\"mk no\" data-act=\"pdel\" data-k=\"" + esc(key) + "\" aria-label=\"빼기\" title=\"빼기\">✕</button></div>";
  }).join("") + "</div>" +

      "<div class=\"prow\"><input type=\"text\" data-pfin=\"" + key + ":name\" maxlength=\"30\" placeholder=\"상품 이름\" value=\"" + esc(draft(key + ":name", p.name)) + "\">" +
        "<input type=\"text\" data-pfin=\"" + key + ":what\" maxlength=\"120\" placeholder=\"무엇을 파나 (한 줄)\" value=\"" + esc(draft(key + ":what", p.what)) + "\"></div><div class=\"acts\">" + editBtns(key) + "</div>"
      : "<div class=\"pv\"><div><div class=\"it-h\"><b>" + esc(p.name) + "</b></div><div class=\"it-d\">" + esc(p.what || "") + "</div></div><span style=\"display:flex;gap:2px\">" + penBtn(key, p.name) +
        "<button class=\"mk no\" data-act=\"pdelprod\" data-i=\"" + i + "\" aria-label=\"" + esc(p.name) + " 빼기\" title=\"상품 빼기\">✕</button></span></div>";
    return "<div class=\"it\"><div class=\"it-m\">" + head + productWordsHtml(p.name) + "</div></div>";
  }).join("") + "</div>" +
    "<h4>＋ 상품 더하기</h4><div class=\"prow\"><input type=\"text\" data-pfin=\"prod:new:name\" maxlength=\"30\" placeholder=\"새 상품 이름\" value=\"" + esc(draft("prod:new:name", "")) + "\">" +
    "<input type=\"text\" data-pfin=\"prod:new:what\" maxlength=\"120\" placeholder=\"무엇을 파나 (한 줄)\" value=\"" + esc(draft("prod:new:what", "")) + "\"><button class=\"btn sm primary\" data-act=\"paddprod\">더하기</button></div>";
}
function pval(key){ var el = [].filter.call(document.querySelectorAll("[data-pfin]"), function(x){ return x.dataset.pfin === key })[0]; return el ? el.value.trim() : "" }
function profAct(name, el){
  var k = el && el.dataset.k, p = profNow();
  if(name === "pedit"){ ui.pedit = k; ui.pdraft = {}; render(); var f = [].filter.call(document.querySelectorAll("[data-pfin]"), function(x){ return x.dataset.pfin.indexOf(k) === 0 })[0]; if(f) f.focus(); return true }
  if(name === "pcancel"){ ui.pedit = ""; ui.pdraft = {}; render(); return true }
  if(name === "psave"){
    if(k.indexOf("prod:") === 0){
      var i = +k.split(":")[1], nm = pval(k + ":name"), old = p.products[i].name, ren = {};
      if(!nm){ alert("상품 이름을 적어 주세요."); return true }
      if(p.products.some(function(x, j){ return j !== i && x.name === nm })){ alert("같은 이름의 상품이 이미 있어요."); return true }
      if(nm !== old) ren[old] = nm;
      p.products[i] = Object.assign({}, p.products[i], { name: nm, what: pval(k + ":what") }); profSave(p, ren); return true;
    }
    if(k.indexOf(":") > 0){ var path = k.split(":")[0], j = +k.split(":")[1], t = pval(k), arr = pget(p, path) || [];
      if(!t){ arr.splice(j, 1) } else arr[j] = itemParse(PLIST[path], t);
      pset(p, path, arr); profSave(p); return true }
    p[k] = pval(k); profSave(p); return true;
  }
  if(name === "pdel"){ var pp = k.split(":")[0], jj = +k.split(":")[1], a2 = pget(p, pp) || [];
    if(!confirm("「" + itemText(PLIST[pp], a2[jj]) + "」을 뺄까요?")) return true;
    a2.splice(jj, 1); pset(p, pp, a2); profSave(p); return true }
  if(name === "padd"){ var t2 = pval(k + ":new"); if(!t2){ alert("넣을 내용을 적어 주세요."); return true }
    var a3 = (pget(p, k) || []).concat([itemParse(PLIST[k], t2)]); pset(p, k, a3); profSave(p); return true }
  if(name === "pdelprod"){ var di = +el.dataset.i, dn = p.products[di].name;
    if(!confirm("「" + dn + "」 상품을 뺄까요? 이 상품의 판매 단어도 같이 빠져요.")) return true;
    p.products.splice(di, 1); profSave(p); return true }
  if(name === "paddprod"){ var nn = pval("prod:new:name"); if(!nn){ alert("새 상품 이름을 적어 주세요."); return true }
    if(p.products.some(function(x){ return x.name === nn })){ alert("같은 이름의 상품이 이미 있어요."); return true }
    p.products.push({ name: nn, what: pval("prod:new:what"), share: 5 }); profSave(p); return true }
  return false;
}

    (lg && lg.items.length ? "<p class=\"small mono\" style=\"margin-bottom:6px\">" + esc(lg.where) + "</p><div class=\"list\">" + lg.items.slice(0, 12).map(function(x){
      return "<div class=\"it\"><span class=\"num muted\">" + esc(x.date) + "</span><div class=\"it-m\"><div>" + esc(String(x.file).replace(/^\S+ /, "").replace(/\.pdf$/, "")) + "</div></div><span class=\"num muted\">" + esc(String(x.at).slice(11, 16)) + "</span></div>" }).join("") + "</div>"
      : "<p class=\"empty\">아직 기록이 없어요.</p>") + "</section>";
  h += "<p class=\"lead\" style=\"text-align:center\">정본: 볼트 <span class=\"mono\">" + esc(b.profile || b.planCard || "") + "</span>" + (b.sheet ? " · <a href=\"" + esc(b.sheet) + "\" target=\"_blank\" rel=\"noopener\">조사 시트</a>" : "") + "</p>";
  return h;
}



/* ── 그리기 ──
   맥·저장소에서 온 변화(renderSoft)는 동욱이 칸에 글을 쓰는 중이면 그리지 않고 미뤘다가, 칸에서 나가면 그린다
   (2026-11-17 동욱: "씨앗 단어 자체가 새로 안 써져" — 단어를 넣으면 맥이 검색어를 받아 올리는 동안 화면이 여러 번 다시 그려져 쓰던 칸·한글 조합이 끊겼다) */
function typing(){ var a = document.activeElement; return !!(a && /^(INPUT|TEXTAREA)$/.test(a.tagName) && !/^(range|checkbox|file|date)$/.test(a.type) && document.getElementById("view").contains(a)) }
function renderSoft(){ if(typing()){ ui.later = true; return } render() }
document.addEventListener("focusout", function(){ if(ui.later) setTimeout(function(){ if(ui.later && !typing()){ ui.later = false; render() } }, 0) });
function render(){
  var b = B();
  applyKit();
  document.body.classList.toggle("wide", tab === "build");   // 구축 보드는 편집기 앱처럼 넓게 (왼쪽 퍼널 · 가운데 문서 · 오른쪽 다시 착안한 추천)
  document.title = (b ? b.name + " · " : "") + "콘텐츠 기획";
  document.getElementById("brands").innerHTML = brands().map(function(x){ return "<button role=\"tab\" class=\"" + (x.id === cur ? "on" : "") + "\" data-brand=\"" + esc(x.id) + "\"><i style=\"background:" + ((x.kit || {}).accent ? "linear-gradient(135deg," + esc(x.kit.accent) + "," + esc(x.kit.accent2 || x.kit.accent) + ")" : "var(--muted)") + "\"></i>" + esc(x.name) + "</button>" }).join("");
  document.getElementById("nav").innerHTML = TABS.map(function(t, i){ return "<button role=\"tab\" class=\"" + (tab === t[0] ? "on" : "") + "\" data-tab=\"" + t[0] + "\"><span>" + (i + 1) + "</span>" + t[1] + "</button>" }).join("");
  var v0 = { sum: viewSum, brand: viewBrand, kw: viewKw, ref: viewRef, rec: viewRec, build: viewBuild, script: viewScript }[tab] || viewBrand;
  ui.later = false;
  var act0 = document.activeElement, key = act0 && (act0.dataset.addseed != null ? "[data-addseed=\"" + CSS.escape(act0.dataset.addseed) + "\"]" : act0.dataset.pfin != null ? "[data-pfin=\"" + CSS.escape(act0.dataset.pfin) + "\"]" : act0.id ? "#" + act0.id : "");
  var v = function(){ return v0() + ({ brand: 1, kw: 1, rec: 1 }[tab] && B() ? nextHtml() : "") };   // 브랜드·키워드·추천 탭 맨 아래에도 「다음 할 일」
  document.getElementById("view").innerHTML = runHtml(Object.keys(KIND)) + v();
  if(key){ var back = document.querySelector(key); if(back) back.focus({ preventScroll: true }) }   // 다시 그려도 쓰던 슬라이더·입력칸에 초점을 돌려준다 (키보드로 이어서 움직이게)
}

document.addEventListener("click", function(e){
  var t = e.target.closest("[data-tab],[data-brand],[data-act],[data-hide],[data-set],[data-ui],[data-pin],[data-ex],[data-pick],[data-copy],[data-go]");
  if(!t) return;
  var d = t.dataset;
  if(d.go){ var gp = d.go.split("|"); if(gp[1]){ var gk = gp[1].split("="); ui[gk[0]] = gk[1] } tab = gp[0]; save("ct.tab", tab); window.scrollTo(0, 0); render(); return }   // 한눈에 → 그 탭 (필요하면 그 탭의 보기도 맞춘다)
  if(d.tab){ tab = d.tab; save("ct.tab", tab); window.scrollTo(0, 0); render(); return }
  if(d.brand){ pickBrand(d.brand); return }
  if(d.hide){ ui.hide[d.hide] = 1; save("ct.hide", ui.hide); render(); return }
  if(d.ui){ var kv = d.ui.split("="); ui[kv[0]] = kv[1] === "true" ? true : kv[1] === "false" ? false : (kv[1] === "" || isNaN(+kv[1])) ? kv[1] : +kv[1]; render();
    if(kv[0] === "bdView") save("ct.bdView", kv[1]);   // 구축 보드 세로/시트는 기기마다 기억
    if(kv[0] === "kwCluster" && kv[1]){ var kl = document.getElementById("kw-list"); if(kl) window.scrollTo(0, kl.getBoundingClientRect().top + window.scrollY - 150) }   // 고른 묶음의 목록은 아래 카드에 생긴다
    return }
  if(d.set){ var p = {}, sv = d.set.split("="); p[sv[0]] = sv[1] === "true"; setS(p); return }
  if(d.pin || d.ex){ var key = d.pin ? "pin" : "ex", s = S(), m = Object.assign({}, s[key]), k = d.pin || d.ex, o = {};
    if(m[k]) delete m[k]; else m[k] = 1; o[key] = m;
    if(m[k]){ var other = key === "pin" ? "ex" : "pin", om = Object.assign({}, s[other]); delete om[k]; o[other] = om }
    setS(o); return }
  if(d.pick){ var pk = Object.assign({}, S().pick); if(pk[d.pick]) delete pk[d.pick]; else pk[d.pick] = 1; setS({ pick: pk }); return }
  if(d.copy){ var el = document.getElementById(d.copy); if(el && navigator.clipboard) navigator.clipboard.writeText(el.innerText).then(function(){ t.textContent = "복사했어요" }); return }
  if(d.act) act(d.act, t);
});
document.addEventListener("input", function(e){
  if(e.target.dataset.pfin != null){ ui.pdraft = Object.assign({}, ui.pdraft); ui.pdraft[e.target.dataset.pfin] = e.target.value }
  if(e.target.dataset.addseed != null){ ui.seedDraft = Object.assign({}, ui.seedDraft); ui.seedDraft[e.target.dataset.addseed] = e.target.value }
});
function enterAct(t){   // Enter 로 넣기·저장 — 칸마다 할 일
  if(t.dataset.addseed != null){ act("seedadd", t); return true }
  if(t.dataset.pfin != null && t.tagName === "INPUT"){ var pk = t.dataset.pfin;
    if(/^prod:new/.test(pk)) act("paddprod", t);
    else if(/:new$/.test(pk)) act("padd", { dataset: { k: pk.replace(/:new$/, "") } });
    else act("psave", { dataset: { k: ui.pedit } });
    return true }
  return false;
}
/* 한글을 쓰다 Enter 를 누르면 그 Enter 는 조합을 끝내는 데 쓰인다(keydown isComposing) — 조합이 끝난 뒤 keyup 에서 넣어 한 번에 들어가게 한다 */
var enterWait = null;
document.addEventListener("keydown", function(e){
  if(e.key !== "Enter") return;
  if(e.isComposing || e.keyCode === 229){ enterWait = e.target; return }
  enterWait = null;
  if(enterAct(e.target)) e.preventDefault();
});
document.addEventListener("keyup", function(e){
  if(e.key !== "Enter" || !enterWait || enterWait !== e.target) return;
  var t = enterWait; enterWait = null; enterAct(t);
});
document.addEventListener("change", function(e){
  if(e.target.dataset.plan){ var pl = Object.assign({}, S().plan); if(e.target.value) pl[e.target.dataset.plan] = e.target.value; else delete pl[e.target.dataset.plan]; setS({ plan: pl }) }
  if(e.target.id === "nb-file" && e.target.files[0]){
    var f = e.target.files[0], rd = new FileReader();
    rd.onload = function(){ var ta = document.getElementById("nb-doc"); if(ta) ta.value = String(rd.result).slice(0, 60000); var nm = document.getElementById("nb-name"); if(nm && !nm.value) nm.value = f.name.replace(/\.[^.]+$/, "") };
    rd.readAsText(f);
  }
});
function act(name, el){
  if(profAct(name, el)) return;   // 브랜드 탭 그 자리 고치기 (content-profile.js)
  var s = S();
  if(name === "buildpdf"){ window.print(); return }   // 구축 문서 PDF — 인쇄 창에서 「PDF로 저장」 (인쇄할 땐 가운데 문서만 남는다)
  if(name === "newbrand"){ ui.newBrand = !ui.newBrand; render(); return }
  if(name === "sendbrief"){
    var nm = (document.getElementById("nb-name").value || "").trim(), doc = (document.getElementById("nb-doc").value || "").trim();
    if(!nm || doc.length < 50){ alert("브랜드 이름과 기획서 내용(50자 이상)을 넣어 주세요."); return }
    send("brief", "새 브랜드 「" + nm + "」 기획서로 프로필 초안 만들기", { name: nm, doc: doc.slice(0, 60000) }); ui.newBrand = false; render(); return;
  }
  if(name === "discover"){ var c = candidates(s); send("discover", "키워드·레퍼런스 조사 (상품 " + s.ratio + " : 정체성 " + (100 - s.ratio) + " · " + c.length + "개)",
    { ratio: s.ratio, count: s.count, share: s.share, mid: s.mid, keywords: c.map(function(k){ return { kw: k.kw, kind: k.kind, product: k.product } }) }); return }
  if(name === "trends"){ send("trends", "구글 트렌드 다시 받기", {}); return }
  if(name === "seedadd"){   // 씨앗 단어 넣기 — key 「정체성」 또는 「상품:<상품>」. 띄어쓰기는 빼고(네이버가 붙여 쓴 말로 받는다), 같은 단어는 한 번만
    var key = el.dataset.key || el.dataset.addseed, inp = [].filter.call(document.querySelectorAll("[data-addseed]"), function(x){ return x.dataset.addseed === key })[0];
    var w = ((inp && inp.value) || "").replace(/\s+/g, "").slice(0, 20), cur3 = seedsOf();
    if(!w){ alert("넣을 단어를 적어 주세요."); if(inp) inp.focus(); return }
    if(cur3.some(function(x){ return x.word === w })){ alert("「" + w + "」은 이미 씨앗 단어예요."); return }
    var nx = key.indexOf("상품:") === 0 ? { kind: "상품", word: w, product: key.slice(3) } : { kind: "정체성", word: w };
    ui.seedDraft = Object.assign({}, ui.seedDraft); ui.seedDraft[key] = ""; ui.seed = w;
    setS({ seeds: cur3.concat([nx]) }); return;
  }
  if(name === "chanfind"){ var sd2 = seedsOf(); if(!sd2.length) return;
    var pk2 = (SETS[cur] || {}).chanpick || {}, skip = (((part("chancand") || {}).items) || []).filter(function(x){ return pk2[x.id] === "skip" }).map(function(x){ return x.name });
    send("chanfind", "소재 채널 찾기 — " + sd2.map(function(x){ return x.word }).join(" · "), { seeds: sd2, have: (B().channels || []).map(function(c){ return c.name }), skip: skip }); return }
  if(name === "chanpick"){ var cp = Object.assign({}, (SETS[cur] || {}).chanpick || {}); if(el.dataset.v) cp[el.dataset.id] = el.dataset.v; else delete cp[el.dataset.id]; setS({ chanpick: cp }); return }
  if(name === "stoggle"){ ui.sOff = Object.assign({}, ui.sOff); if(ui.sOff[el.dataset.kw]) delete ui.sOff[el.dataset.kw]; else ui.sOff[el.dataset.kw] = 1; render(); return }
  if(name === "search"){ var off = ui.sOff || {}, kws = scored().filter(function(x){ return s.pin[x.kw] && !s.ex[x.kw] && !off[x.kw] }).map(function(x){ return x.kw }).slice(0, 10);
    if(!kws.length || searchState().busy) return; setS({ searchReq: { at: new Date().toISOString(), kws: kws } }); return }
  if(name === "favc"){ var fv = Object.assign({}, (SETS[cur] || {}).favc || {}), vid = el.dataset.vid;
    if(fv[vid]) delete fv[vid]; else fv[vid] = Object.assign(videoOf(vid), { at: new Date().toISOString() });
    setS({ favc: fv }); return }
  if(name === "seedsrc"){ if(el.dataset.v !== seedSrc()) setS({ seedSrc: el.dataset.v }); return }
  if(name === "seeddel"){ var wd = el.dataset.word; if(!confirm("씨앗 단어 「" + wd + "」을 뺄까요? 이 단어에서만 나온 검색어는 다음에 받을 때 목록에서 빠져요 (★한 것은 남아요).")) return;
    setS({ seeds: seedsOf().filter(function(x){ return x.word !== wd }) }); return }
  if(name === "autoplan"){ setS({ plan: autoPlan(s) }); return }
  if(name === "clearplan"){ setS({ plan: {} }); return }
  if(name === "refresh"){ send("refresh", "레퍼런스 반응·채널 새 영상 최신화", {}); return }
  if(name === "recommend"){ var pk = scored().filter(function(x){ return s.pin[x.kw] && !s.ex[x.kw] });   // ★한 검증 키워드 위주로 추천받는다
    send("recommend", "콘텐츠 추천 (" + roleNames().map(function(n){ return n + " " + s.roles[n] }).join(" · ") + (pk.length ? " · ★ 검증 키워드 " + pk.length + "개 위주" : "") + ")",
      { roles: s.roles, ratio: s.ratio, keywords: pk.map(function(x){ return { kw: x.kw, kind: x.kind, product: x.product, total: x.total } }), seeds: seedsOf(),
        favContents: Object.keys((SETS[cur] || {}).favc || {}).map(function(v){ return Object.assign({ vid: v }, SETS[cur].favc[v]) }) }); return }
  if(name === "script"){ var ids = pickedIds(s).filter(function(id){ return !scriptOf(id) }); if(!ids.length) return;
    send("script", "대본 초안 — " + ids.join(" · "), { ids: ids }); tab = "script"; save("ct.tab", tab); render(); return }
  if(name === "source"){ var sids = el.dataset.id ? [el.dataset.id] : pickedIds(s); if(!sids.length) return;
    send("source", "소재 찾기 — " + sids.join(" · "), { ids: sids }); return }   // 소재 채널(정체성·판매 상품)을 돌며 대본 소재·출처를 찾는다 — content-source 스킬 (2026-11-17)   // 고른 추천을 바로 대본으로 — 잘된 영상·레퍼런스 채널에서 가져온 구성이 대본에 같이 붙는다 (2026-11-16 참고 탭 없앰)
}

/* ── 시작: 저장소 붙이기 ── */
(function(){
  if(!window.claude || typeof claude.use !== "function"){ render(); return }
  claude.use("db").then(function(d){
    if(!d){ render(); return }
    DB = d;
    DB.collection("ct.data").onSnapshot(function(q){
      RAW = {}; q.docs.forEach(function(x){ RAW[x.id] = x.data() });
      if(!RAW[cur] || !RAW[cur].name){ var first = brands().filter(function(x){ return RAW[x.id + ".kw"] })[0] || brands()[0]; cur = first ? first.id : ""; }
      if(cur && new URLSearchParams(location.search).get("b") !== cur){ try{ history.replaceState(null, "", location.pathname + "?b=" + encodeURIComponent(cur) + location.hash) }catch(e){} }   // 주소가 늘 지금 브랜드를 가리키게 (없는 브랜드로 열었을 때도)
      renderSoft();
    }, function(){});
    DB.collection("ct.set").onSnapshot(function(q){ q.docs.forEach(function(x){ SETS[x.id] = x.data() }); renderSoft() }, function(){});
    DB.collection("cmd").onSnapshot(function(q){
      CMDS = q.docs.map(function(x){ return Object.assign({ id: x.id }, x.data()) }).filter(function(c){ return c.from === "content" })
        .sort(function(a, b){ return String(b.createdAt).localeCompare(String(a.createdAt)) });
      renderSoft();
    }, function(){});
  }, function(){ render() });
})();
render();
