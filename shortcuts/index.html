function groupInfo(g){
  if(g === A_CC || g === A_TERM){
    var G = GROUPS.filter(function(x){ return x.g === CC_SPLIT })[0] || {};
    return g === A_CC ? { g: g, cat: "터미널·AI", lead: G.lead || G.hint } : { g: g, cat: "터미널·AI", hint: "창 분할·이동과 터미널 기본 명령. 한 창에 claude, 한 창에 결과." };
  }
  return GROUPS.filter(function(x){ return x.g === g })[0] || null;
}
var TERM_RE = /iterm|아이템|아이텀|터미널|terminal|claude|클로드|셸|shell|zsh|bash/i;
function catOf(g){ var G = groupInfo(g); return (G && G.cat) || CAT_OF[g] || (TERM_RE.test(g) ? "터미널·AI" : "앱에서 넣은 것") }
function areaList(){
  var names = [];
  GROUPS.forEach(function(G){ if(G.g === CC_SPLIT) names.push(A_CC, A_TERM); else names.push(G.g) });
  ADDED.forEach(function(s){ var a = areaOf(s); if(names.indexOf(a) < 0) names.push(a) });
  return names;
}
function catList(){
  var cs = CATS.slice();
  areaList().forEach(function(g){ var c = catOf(g); if(cs.indexOf(c) < 0) cs.push(c) });
  return cs.filter(function(c){ return areaList().some(function(g){ return catOf(g) === c }) });
}
function areaLead(name){
  var G = groupInfo(name);
  if(G && (G.lead || G.hint)) return G.lead || G.hint;
  if(ADDED.some(function(s){ return areaOf(s) === name }))
    return "앱에서 채운 영역이에요. <b>공식 문서로 검증한 값이 아니에요</b> — 눌러 보고 안 먹으면 ✕로 빼요.";
  return "";
}

function load(k, fb){ try{ var v = localStorage.getItem(k); return v ? JSON.parse(v) : fb }catch(e){ return fb } }
function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)) }catch(e){} }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c] }) }

/* ── 표시 셋 — 하나만 붙는다 ── */
var marks = load("mk.marks", null);
if(!marks){
  marks = {};
  (load("mk.favs", []) || []).forEach(function(id){ marks[id] = "fav" });
  (load("mk.core", []) || []).forEach(function(id){ marks[id] = "pass" });

}
Object.keys(marks).forEach(function(k){ if(marks[k] === "known") marks[k] = "pass" });
var MK = {
  fav:  { i:"★", n:"즐겨찾기", t:"즐겨찾기 — 목록에 남고 「즐겨찾기」 탭에도 모여요" },
  pass: { i:"✓", n:"외웠어",   t:"외웠어 — 목록에서 빠지고 「외웠어」 탭으로" },
  no:   { i:"✕", n:"필요없어", t:"필요없어 — 목록에서 빠지고 「필요없어」 탭으로" }

function gone(m){ return m === "pass" || m === "no" }
function mkBtns(attr, id, cur, label){

function legend(){

function setMark(id, kind){

  save("mk.marks", marks);
  if(DB && DB.doc) DB.doc("sc.marks/main").set({ marks: marks, updatedAt: new Date().toISOString() }).catch(function(){});

/* ── 고칠 단축키 (2026-11-24 동욱 — 체화 단어장의 「고칠 단어」와 같은 방식) — 「이 단축키는 고쳐요」 표시 + 무엇을 고칠지 적는 글 한 칸을 하나로.
   sc.marks/req 의 reqs: id→{fix, text, at, t} (예전 「수정 요청」 글만 있던 것도 고칠 단축키로 본다). 「전체」 탭의 「고칠 단축키」 칩에 모이고,
   「✦ Brainy에게 고치기 맡기기」로 Brainy 가 볼트 노트를 vault_write 로 고친다 (부탁 글은 세 앱 공통 부품 brainy-parts.js) ── */
var reqs = load("sc.reqs", {}) || {}, reqEdit = null, reqOnly = false, reqPend = false;
function reqOf(id){ var r = reqs[id]; return r && r.text ? String(r.text) : "" }
function isFix(id){ return !!reqs[id] }
function fixItems(){ return ITEMS.filter(function(s){ return isFix(s.id) }) }
function reqCount(){ return fixItems().length }
function setReq(id, text, on){   // on: 고칠 표시 (false 면 글까지 지운다)
  text = String(text || "").trim().slice(0, 300);
  reqs = Object.assign({}, reqs);
  if(on) reqs[id] = { fix: true, text: text, at: new Date().toISOString(), t: BY_ID[id] ? String(BY_ID[id].t).replace(/<[^>]*>/g, "") : "" };
  else delete reqs[id];
  save("sc.reqs", reqs);
  if(DB && DB.doc) DB.doc("sc.marks/req").set({ reqs: reqs, updatedAt: new Date().toISOString() }).catch(function(){});
}
function fixAskText(list){
  return BRAINY_PARTS.fixAsk({ app: "맥 단축키", what: "단축키", source: "볼트 4_Outputs/단축키 앱/단축키 데이터.json · 위키 「맥 핵심 단축키」", clearTool: "shortcut_fix_clear",
    items: list.map(function(s){ var t = String(s.t).replace(/<[^>]*>/g, ""); return { name: t + " [" + areaOf(s) + " · " + s.k.map(function(c){ return c.join("") }).join(" / ") + "]", note: reqOf(s.id) } }) });
}
function reqTyping(){ var a = document.activeElement; return !!(a && a.classList && a.classList.contains("rq-in")) }
function reqHtml(s){
  var r = reqOf(s.id), id = esc(s.id);
  if(reqEdit === s.id) return "<div class=\"rq\"><p class=\"lbl\">고칠 단축키 — 무엇을 고칠지 (비워 둬도 돼요)</p>" +
    "<textarea class=\"rq-in\" id=\"rq-" + id + "\" maxlength=\"300\" placeholder=\"예: 키가 틀림 / 다른 항목과 중복 / 설명이 너무 기본적임\" aria-label=\"" + esc(s.t) + " 고칠 내용\">" + esc(r) + "</textarea>" +
    "<div class=\"rq-b\"><button type=\"button\" class=\"btn primary sm\" data-rq=\"save\" data-id=\"" + id + "\">저장</button><button type=\"button\" class=\"btn ghost sm\" data-rq=\"cancel\" data-id=\"" + id + "\">닫기</button>" +
    "<button type=\"button\" class=\"btn ghost sm\" data-rq=\"del\" data-id=\"" + id + "\">표시 풀기</button></div></div>";
  if(isFix(s.id)) return "<div class=\"rq\"><p class=\"lbl\">✓ 고칠 단축키로 표시됨" + (reqs[s.id].at ? " · " + esc(String(reqs[s.id].at).slice(0, 10)) : "") + "</p>" +
    (r ? "<span class=\"rq-t\">" + esc(r) + "</span>" : "<span class=\"rq-t\" style=\"color:var(--muted)\">적은 글 없음 — Brainy가 틀린 곳·중복을 살펴봐요</span>") +
    "<div class=\"rq-b\"><button type=\"button\" class=\"btn ghost sm\" data-rq=\"edit\" data-id=\"" + id + "\">" + (r ? "글 고치기" : "글 적기") + "</button><button type=\"button\" class=\"btn ghost sm\" data-rq=\"ask\" data-id=\"" + id + "\">✦ Brainy에게 맡기기</button><button type=\"button\" class=\"btn ghost sm\" data-rq=\"del\" data-id=\"" + id + "\">표시 풀기</button></div></div>";
  return "<button type=\"button\" class=\"it-src\" data-rq=\"mark\" data-id=\"" + id + "\">✎ 이 단축키는 고쳐요</button>";
}

/* ── 그리기 조각 ── */
function cap(k){ return "<kbd>" + k + "</kbd>" }
function combo(cs){
  return "<span class=\"combo\">" + cs.map(function(c){ return c.map(cap).join("") }).join("<span class=\"sep\">/</span>") + "</span>";
}
function row(s, o){
  var m = marks[s.id] || "";
  return "<div class=\"it" + (m ? " m-" + m : "") + "\"><div class=\"it-m\">" +
    "<div class=\"it-h\"><b>" + s.t + "</b>" + (s.tag ? "<span class=\"tag" + (s.unver ? " unver" : "") + "\">" + s.tag + "</span>" : "") + (isFix(s.id) ? "<span class=\"tag req\">고칠 단축키</span>" : "") + "</div>" +
    (s.d ? "<div class=\"it-d\">" + s.d + "</div>" : "") +
    "<div class=\"it-k\">" + combo(s.k) + "</div>" +
    (o && o.src ? "<button type=\"button\" class=\"it-src\" data-goarea=\"" + esc(areaOf(s)) + "\">" + esc(catOf(areaOf(s))) + " · " + esc(areaOf(s)) + "</button>" : "") +
    reqHtml(s) + "</div>" + mkBtns("data-mark", s.id, m, esc(s.t)) + "</div>";
}
function card(title, inner, o){
  o = o || {};
  return "<section class=\"card" + (o.cls ? " " + o.cls : "") + "\"" + (o.attr || "") + "><div class=\"card-h\"><h3>" + title + "</h3>" +
    (o.right != null ? o.right : (o.n != null ? "<span class=\"n\">" + o.n + "</span>" : "")) + "</div>" +
    (o.lead ? "<p class=\"lead\">" + o.lead + "</p>" : "") + inner + "</section>";
}
function listCard(title, list, o){
  o = o || {};
  var inner = list.length ? "<div class=\"list\">" + list.map(function(s){ return row(s, o) }).join("") + "</div>"
                          : "<p class=\"empty\">" + (o.empty || "없어요") + "</p>";
  return card(title, inner, { n: o.n != null ? o.n : list.length, lead: o.lead, cls: o.cls, right: o.right });
}

/* ── 탭 ── */
var TABS = [["now","지금"], ["field","분야"], ["course","강의"], ["all","전체"], ["fav","★ 즐겨찾기"], ["pass","✓ 외웠어"], ["no","✕ 필요없어"]];
var VIEWS = {}; TABS.forEach(function(t){ VIEWS[t[0]] = 1 });
var current = load("sc.tab", "now"); if(!VIEWS[current]) current = "now";
var area = load("sc.area", "맥 공통"), st = "todo", query = "", ctxText = "", pickedMode = null;
function counts(){
  var c = { fav:0, pass:0, no:0 };
  ITEMS.forEach(function(s){ var m = marks[s.id]; if(c[m] != null) c[m]++ });
  if(typeof csMarkCount === "function"){ var k = csMarkCount(); c.fav += k.fav; c.pass += k.pass; c.no += k.no }
  return c;
}
function renderNav(){
  var c = counts();
  document.getElementById("nav").innerHTML = TABS.map(function(t){
    var n = c[t[0]];
    return "<button type=\"button\" role=\"tab\" data-tab=\"" + t[0] + "\" class=\"" + (current === t[0] ? "on" : "") + "\" aria-selected=\"" + (current === t[0]) + "\">" +
      t[1] + (n ? "<span>" + n + "</span>" : "") + "</button>";
  }).join("");
  var left = ITEMS.filter(function(s){ return !gone(marks[s.id]) }).length;
  document.getElementById("sub").textContent = "단축키 " + ITEMS.length + "개 · 남은 것 " + left + " · 외웠어 " + c.pass;
}
function show(name){
  if(!VIEWS[name]) name = "now";
  current = name; save("sc.tab", name);
  render();
  window.scrollTo({ top: 0, behavior: "instant" });
}
function render(){
  if(reqTyping()){ reqPend = true; renderNav(); return }   // 수정 요청을 치는 중엔 다시 그리지 않는다 — 저장·취소 때 함께 반영
  reqPend = false;
  renderNav();
  var v = document.getElementById("view");
  if(current === "now"){ v.innerHTML = viewNow(); fillNow(); }
  else if(current === "field") v.innerHTML = viewField();
  else if(current === "course") v.innerHTML = typeof viewCourse === "function" ? viewCourse() : "<p class=\"empty\">강의를 불러오는 중…</p>";
  else if(current === "all"){ v.innerHTML = viewAll(); fillAll(); }
  else v.innerHTML = viewMarked(current);
}
// 입력칸이 있는 탭(지금·전체)은 칸은 두고 아래만 다시 그린다 — 치는 중에 커서가 안 튄다
function refresh(){
  if(reqTyping()){ reqPend = true; renderNav(); return }
  renderNav();
  if(current === "now" && document.getElementById("now-out")) fillNow();
  else if(current === "all" && document.getElementById("all-out")) fillAll();
  else render();
}
function repaint(){ reindex(); refresh() }
function renderList(kind){ if(current === kind) render() }   // 옛 이름 — 강의·Brainy 가 부른다

/* ── 지금: 하는 일을 적거나 고르면 그 일에 쓰는 것만 ── */
function matchMode(text){
  var t = (text || "").toLowerCase();
  if(!t.trim()) return null;
  var best = null, bestN = 0;
  MODES.forEach(function(M){
    var n = 0; M.keys.forEach(function(w){ if(t.indexOf(w) > -1) n++ });
    if(n > bestN){ bestN = n; best = M }
  });
  return best;
}
function viewNow(){
  return card("지금 무슨 일을 하는 중?",
      "<input id=\"ctx\" type=\"text\" placeholder=\"예: EP3 컷 편집 / 위키 ingest 정리 / 견적 보내는 중\" autocomplete=\"off\" value=\"" + esc(ctxText) + "\">" +
      "<div class=\"modes\" id=\"modes\"></div>") +
    "<div id=\"now-out\" style=\"display:flex;flex-direction:column;gap:14px\"></div>" +
    card("여기 없어요?",
      "<div class=\"row2\"><input id=\"ask\" type=\"text\" placeholder=\"예: 슬랙 / 피그마 / 줌 미팅 / 카카오톡 PC\" autocomplete=\"off\"><button class=\"btn primary\" id=\"ask-go\" type=\"button\">찾아서 넣기</button></div>" +
      "<p class=\"status\" id=\"ask-status\" hidden></p>",
      { lead: "쓰려는 앱이나 하는 일을 적으면 찾아서 「분야」에 넣어요. 모든 기기에서 보여요." }) +
    "<details class=\"card\"><summary>프로젝트별로 쓸 것</summary>" + boardHtml() + "</details>";
}
function fillNow(){
  var auto = matchMode(ctxText);
  var M = pickedMode ? MODES.filter(function(m){ return m.id === pickedMode })[0] : auto;
  var md = document.getElementById("modes");
  if(md) md.innerHTML = MODES.map(function(m){
    return "<button type=\"button\" class=\"chip" + (M && M.id === m.id ? " on" : "") + "\" data-mode=\"" + m.id + "\">" + m.name + "</button>";
  }).join("");
  var out = document.getElementById("now-out"); if(!out) return;
  if(!M){
    var open = STARTER.filter(function(s){ return !gone(marks[s.id]) });
    var pick = open.length ? open[Math.floor(Date.now() / 86400000) % open.length] : null;
    out.innerHTML = listCard("먼저 이것만 " + STARTER.length + "개", open, {
      n: open.length + "/" + STARTER.length,
      lead: "하루 열 번 하는 동작부터" + (pick ? " — 오늘은 <b>" + pick.t + "</b>" : "") + ". 위에서 하는 일을 고르면 그 일에 쓰는 것만 나와요.",
      empty: STARTER.length + "개 다 붙였어요 — 「외웠어」 탭에 있어요." });
    return;
  }
  var list = M.ids.map(function(id){ return BY_ID[id] }).filter(Boolean);
  var shown = list.filter(function(s){ return !gone(marks[s.id]) });
  var obs = shown.filter(function(s){ return s.g === "옵시디언" }).length;
  out.innerHTML = listCard(M.name, shown, {
    n: shown.length + (list.length > shown.length ? "/" + list.length : ""),
    lead: M.why + (auto && !pickedMode ? " <span class=\"muted\">(적은 내용으로 골랐어요)</span>" : "") +
      (obs ? " 옵시디언 키 " + obs + "개는 <code>hotkeys.json</code>에 걸어 둔 것 — 옵시디언을 ⌘Q로 껐다 켜야 먹어요." : ""),
    empty: "이 일에 쓰는 건 다 외웠거나 뺐어요." });
}
function boardHtml(){
  return PROJECTS.map(function(p){
    return "<div class=\"proj\"><h4>" + p.name + "</h4><span class=\"role\">" + p.role + "</span><ul>" +
      p.ids.map(function(id){ var s = BY_ID[id]; return s ? "<li><span>" + s.t + "</span>" + combo(s.k) + "</li>" : "" }).join("") + "</ul></div>";
  }).join("");
}

/* ── 분야: 큰 묶음 → 앱 → 아직 / ★ / ✓ / ✕ ── */
var ST = [["todo","아직"], ["fav","★ 즐겨찾기"], ["pass","✓ 외웠어"], ["no","✕ 필요없어"], ["all","전체"]];
function stOk(s, k){ var m = marks[s.id] || ""; return k === "all" || (k === "todo" ? !gone(m) : m === k) }
function viewField(){
  var names = areaList(); if(names.indexOf(area) < 0) area = names[0];
  var h = catList().map(function(c){
    return "<div><p class=\"lbl\">" + esc(c) + "</p><div class=\"chips\">" + names.filter(function(g){ return catOf(g) === c }).map(function(g){
      var left = ITEMS.filter(function(s){ return areaOf(s) === g && !gone(marks[s.id]) }).length;
      return "<button type=\"button\" class=\"chip" + (g === area ? " on" : "") + "\" data-area=\"" + esc(g) + "\">" + esc(g) + "<span>" + left + "</span></button>";
    }).join("") + "</div></div>";
  }).join("");
  var all = ITEMS.filter(function(s){ return areaOf(s) === area });
  h += "<div class=\"chips\">" + ST.map(function(x){
    var n = all.filter(function(s){ return stOk(s, x[0]) }).length;
    return "<button type=\"button\" class=\"chip" + (st === x[0] ? " on" : "") + "\" data-st=\"" + x[0] + "\">" + x[1] + "<span>" + n + "</span></button>";
  }).join("") + "</div>";
  var list = all.filter(function(s){ return stOk(s, st) });
  // 처음 붙일 7개는 맨 위로
  if(st === "todo" || st === "all") list.sort(function(a, b){ return (b.starter ? 1 : 0) - (a.starter ? 1 : 0) });
  h += listCard(esc(area), list, {
    n: list.length, lead: (st === "todo" ? areaLead(area) : ""),
    empty: st === "todo" ? "이 앱은 다 외웠거나 뺐어요 — 위 ✓·✕ 칸에 있어요." : "여기엔 아직 없어요." });
  return h + legend();
}

/* ── 전체: 찾기 + 모든 단축키 ── */
function viewAll(){
  return "<input id=\"q\" type=\"search\" placeholder=\"이름·키·앱으로 찾기 — 복사, 캡처, ⌘K, premiere…\" autocomplete=\"off\" value=\"" + esc(query) + "\">" +
    "<div id=\"all-out\" style=\"display:flex;flex-direction:column;gap:14px\"></div>";
}
function fillAll(){
  var out = document.getElementById("all-out"); if(!out) return;
  var t = query.trim().toLowerCase(), nr = reqCount();
  if(!nr) reqOnly = false;
  var chips = nr ? "<div class=\"chips\"><button type=\"button\" class=\"chip" + (reqOnly ? "" : " on") + "\" data-reqonly=\"0\">전체</button>" +
    "<button type=\"button\" class=\"chip" + (reqOnly ? " on" : "") + "\" data-reqonly=\"1\"" + (reqOnly ? "" : " style=\"color:var(--accent);border-color:var(--accent)\"") + ">고칠 단축키<span>" + nr + "</span></button></div>" : "";
  if(reqOnly){
    var rl = fixItems().filter(function(s){ return !t || (s.t + " " + (s.d || "") + " " + areaOf(s) + " " + reqOf(s.id)).toLowerCase().indexOf(t) > -1 });
    var ask = rl.length ? card("✦ Brainy에게 고치기 맡기기", "<button type=\"button\" class=\"btn primary\" data-rqask=\"1\">✦ Brainy에게 고치기 맡기기 (" + rl.length + "개)</button>",
      { lead: "아래 고칠 단축키를 Brainy가 볼트 노트(단축키 데이터 · 위키)에서 바로 고치거나 새 페이지를 만들어요. 맥이 켜져 있으면 몇 초 안에 볼트와 이 앱에 들어가요." }) : "";
    out.innerHTML = chips + ask + listCard("고칠 단축키", rl, { src: true, lead: "「이 단축키는 고쳐요」로 표시한 단축키예요. 줄 안에서 고칠 내용을 적거나 표시를 풀 수 있어요.", empty: "고칠 단축키로 표시한 게 없어요. 줄 안의 「이 단축키는 고쳐요」를 누르면 여기에 모여요." });
    return;
  }

  e.preventDefault();
  var v = (document.getElementById("cs-addin").value || "").trim();
  if(v){ csAdd = false; csRequest({ text: v.slice(0, 120) }); }
});
document.addEventListener("click", function(e){
  var b = e.target.closest("[data-csmk],[data-cspick],[data-csfilt],[data-cslpick],[data-cshere],[data-csjump],[data-cscopy],[data-csadd],[data-csreq],[data-csrm],[data-csx],[data-csopen]");
  if(!b) return;
  if(b.hasAttribute("data-csmk")){ csSetMark(b.getAttribute("data-id"), b.getAttribute("data-csmk")); refresh(); return; }
  if(b.hasAttribute("data-cspick")){ CPROG.cur = b.getAttribute("data-cspick"); csFilt = "all"; csSave(); renderCourse(); return; }
  if(b.hasAttribute("data-csfilt")){ csFilt = b.getAttribute("data-csfilt"); renderCourse(); return; }
  if(b.hasAttribute("data-cslpick")){ csLPick(b.getAttribute("data-cslpick")); window.scrollTo({ top: 0, behavior: "instant" }); return; }
  if(b.hasAttribute("data-cshere")){ csGo(b.getAttribute("data-cshere"), true); return; }
  if(b.hasAttribute("data-csjump")){ var p = b.getAttribute("data-csjump").split("|"); CPROG.cur = p[0]; if(p[1]) CPROG.pk[p[0]] = p[1]; csSave(); query = ""; show("course"); return; }
  if(b.hasAttribute("data-cscopy")){
    var txt = b.getAttribute("data-cscopy"), done = function(){ b.textContent = "복사됨 ✓"; setTimeout(function(){ b.textContent = "복사"; }, 1400); };
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, function(){ b.textContent = "길게 눌러 복사"; });
    else b.textContent = "길게 눌러 복사";
    return;
  }
  if(b.hasAttribute("data-csadd")){ csAdd = !csAdd; renderCourse(); if(csAdd){ var i = document.getElementById("cs-addin"); if(i) i.focus(); } return; }
  if(b.hasAttribute("data-csreq")){ csAdd = false; csRequest({ text: b.getAttribute("data-csreq") }); return; }
  if(b.hasAttribute("data-csrm")){ if(confirm("「" + b.getAttribute("data-csrmname") + "」을 강의 목록에서 뺄까요? (볼트 교안은 그대로예요)")){ csAdd = false; csRequest({ action: "remove", course: b.getAttribute("data-csrm"), text: b.getAttribute("data-csrmname") }); } return; }
  var id = b.getAttribute("data-csx") || b.getAttribute("data-csopen"), r = CREQ.filter(function(x){ return x.id === id; })[0];
  if(b.hasAttribute("data-csopen") && r && r.course){ CPROG.cur = r.course; csSave(); }
  if(r){ r.status = "닫음"; if(DB && id.indexOf("tmp") !== 0) DB.collection("sc.creq").doc(id).update({ status: "닫음" }).catch(function(){}); }
  renderCourse();
});
document.addEventListener("keydown", function(e){
  if(current !== "course" || e.metaKey || e.ctrlKey || e.altKey) return;
  var a = document.activeElement; if(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
  if(e.key === "ArrowRight"){ e.preventDefault(); csNext(1); }
  if(e.key === "ArrowLeft"){ e.preventDefault(); csNext(-1); }
});


/* ── 누르기 ── */
document.addEventListener("click", function(e){
  var b;
  if((b = e.target.closest("[data-mark]"))){ setMark(b.getAttribute("data-id"), b.getAttribute("data-mark")); refresh(); return }
  if((b = e.target.closest("[data-rq]"))){
    var rid = b.getAttribute("data-id"), act = b.getAttribute("data-rq");
    if(act === "ask"){ if(window.BRAINY_CHAT && BY_ID[rid]) BRAINY_CHAT.ask(fixAskText([BY_ID[rid]])); return }
    if(act === "save" || act === "del"){ var box2 = document.getElementById("rq-" + rid); setReq(rid, act === "save" && box2 ? box2.value : "", act === "save"); reqEdit = null }
    else if(act === "mark"){ setReq(rid, "", true); reqEdit = rid }   // 표시하고 바로 글 칸을 연다 — 비워 둬도 표시는 남는다
    else reqEdit = act === "edit" ? rid : null;
    if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
    refresh();
    if(reqEdit){ var ta = document.getElementById("rq-" + rid); if(ta) ta.focus() }
    return;
  }
  if((b = e.target.closest("[data-rqask]"))){ var fl = fixItems(); if(fl.length && window.BRAINY_CHAT) BRAINY_CHAT.ask(fixAskText(fl)); return }
  if((b = e.target.closest("[data-reqonly]"))){ reqOnly = b.getAttribute("data-reqonly") === "1"; fillAll(); return }
  if((b = e.target.closest("[data-tab]"))){ show(b.getAttribute("data-tab")); return }
  if((b = e.target.closest("[data-area]"))){ area = b.getAttribute("data-area"); save("sc.area", area); render(); return }
  if((b = e.target.closest("[data-goarea]"))){ area = b.getAttribute("data-goarea"); save("sc.area", area); st = "all"; show("field"); return }
  if((b = e.target.closest("[data-st]"))){ st = b.getAttribute("data-st"); render(); return }
  if((b = e.target.closest("[data-mode]"))){ var mid = b.getAttribute("data-mode"); pickedMode = pickedMode === mid ? null : mid; fillNow(); return }
  if((b = e.target.closest("[data-fill]"))){
    query = ""; show("now");
    var box = document.getElementById("ask"); box.value = b.getAttribute("data-fill"); askFor(box.value); return;
  }
  if(e.target.closest("#ask-go")){ askFor(document.getElementById("ask").value); return }
});
document.addEventListener("input", function(e){
  if(e.target.id === "ctx"){ ctxText = e.target.value; pickedMode = null; fillNow() }
  if(e.target.id === "q"){ query = e.target.value; fillAll() }
});
document.addEventListener("keydown", function(e){
  var a = document.activeElement, typing = a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName);
  if(e.target.id === "ask" && e.key === "Enter"){ e.preventDefault(); askFor(e.target.value); return }
  if(e.key === "/" && !typing){ e.preventDefault(); if(current !== "all") show("all"); var q = document.getElementById("q"); if(q) q.focus(); return }
  if(e.key === "Escape" && a && a.id === "q"){ query = ""; a.value = ""; fillAll(); a.blur() }
});

/* ── 없어요 → 채우기: Claude에게 묻고 db에 남긴다 ── */
var SAMPLE = null, DB = null, askBusy = false;
function slug(s){
  return String(s || "").replace(/[^0-9A-Za-z가-힣]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 32) || "x";
}
function statusMsg(t, err){
  var el = document.getElementById("ask-status"); if(!el) return;
  el.hidden = !t; el.textContent = t || ""; el.className = "status" + (err ? " err" : "");
}
function docToItems(id, v){
  var out = [];
  (v.items || []).forEach(function(it, i){
    if(!it || !Array.isArray(it.keys) || !it.keys.length) return;
    var keys = it.keys.map(function(c){ return Array.isArray(c) ? c.map(String) : [String(c)] });
    out.push({ id: "add-" + id + "-" + i, k: keys, t: esc(String(it.title || "").slice(0, 60)),
      d: esc(String(it.desc || "").slice(0, 90)), g: String(v.area || "추가됨").slice(0, 20),
      tag: it.confidence === "low" ? "확인 필요" : "앱 추가", unver: 1,
      x: String((v.area || "") + " " + (it.title || "") + " " + (v.q || "")) });
  });
  return out;
}
var capReady;   // sample·db 준비가 끝나면 resolve
(function(){
  var done;
  capReady = new Promise(function(r){ done = r });
  if(!window.claude || typeof claude.use !== "function"){ done(); return }
  var a = claude.use("sample").then(function(s){ SAMPLE = s }, function(){});
  var b = claude.use("db").then(function(d){
    if(!d) return;
    DB = d;
    DB.doc("sc.data/main").onSnapshot(function(s){
      var v = s.exists ? s.data() : null;
      if(!v || !Array.isArray(v.items) || !v.items.length) return;
      GROUPS = v.groups || []; D = v.items; MODES = v.modes || []; PROJECTS = v.projects || [];
      STARTER = D.filter(function(x){ return x.starter });
      repaint();
    }, function(){});
    DB.doc("sc.data/course").onSnapshot(function(s){
      var v = s.exists ? s.data() : null;
      if(!v || !Array.isArray(v.courses) || !v.courses.length) return;
      COURSE = v; save("sc.course.data", v); refresh();
    }, function(){});
    DB.collection("sc.creq").onSnapshot(function(q){ csSetReqs(q.docs.map(function(d){ return Object.assign({ id: d.id }, d.data()); })); }, function(){});
    DB.doc("sc.marks/course").onSnapshot(function(s){
      var v = s.exists ? s.data() : null;
      if(v && v.at){ CPROG = { cur: v.cur || "", at: v.at || {}, done: v.done || {}, sd: v.sd || {}, all: !!v.all, cp: v.cp || {}, cf: v.cf || {}, cn: v.cn || {}, pk: v.pk || {} }; save("sc.course", CPROG); refresh(); }
      else if(CPROG.cur || Object.keys(CPROG.at).length) csSave();
    }, function(){});
    DB.doc("sc.marks/main").onSnapshot(function(s){
      var v = s.exists ? s.data() : null;
      if(v && v.marks){ marks = v.marks; save("mk.marks", marks); refresh(); }
      else if(Object.keys(marks).length){ DB.doc("sc.marks/main").set({ marks: marks, updatedAt: new Date().toISOString() }).catch(function(){}); }
    }, function(){});
    DB.doc("sc.marks/req").onSnapshot(function(s){
      var v = s.exists ? s.data() : null;
      if(v && v.reqs){ reqs = v.reqs; save("sc.reqs", reqs); refresh(); }
      else if(Object.keys(reqs).length){ DB.doc("sc.marks/req").set({ reqs: reqs, updatedAt: new Date().toISOString() }).catch(function(){}); }
    }, function(){});
    try{
      DB.collection("additions").onSnapshot(function(snap){
        ADDED = [];
        snap.docs.forEach(function(doc){ var v = doc.data(); if(v) ADDED = ADDED.concat(docToItems(doc.id, v)) });
        repaint();
      }, function(){});
    }catch(e){}
  }, function(){});
  Promise.all([a, b]).then(function(){ done() }, function(){ done() });
  setTimeout(done, 12000);
})();
var ASK_RULES =
 "너는 macOS 키보드 단축키 레퍼런스다. 아래 요청에 해당하는 맥 단축키를 JSON으로만 답한다.\n\n" +
 "규칙:\n" +
 "- macOS 조합만. 기호는 ⌘ ⌥ ⌃ ⇧ fn 를 쓰고 글자는 대문자 한 글자로 쓴다. Windows의 Ctrl 버전은 쓰지 않는다.\n" +
 "- 하루에 여러 번 쓰는 동작만 6~12개. 전부 나열하지 않는다.\n" +
 "- 확실하지 않은 항목은 confidence를 \"low\"로 한다. 모르면 아예 넣지 않는다. 지어내지 않는다.\n" +
 "- title과 desc는 한국어. desc는 한 줄, 없으면 빈 문자열.\n" +
 "- area는 그 도구나 작업의 짧은 한국어 이름 (예: 슬랙, 피그마, 줌, 카카오톡).\n" +
 "- 그 도구에 단축키가 없거나 요청이 단축키와 무관하면 items를 빈 배열로 둔다.\n\n" +
 "형식 — 이 JSON 값 하나만, 다른 말 없이:\n" +
 "{\"area\":\"슬랙\",\"items\":[{\"keys\":[[\"⌘\",\"K\"]],\"title\":\"대화로 이동\",\"desc\":\"채널·사람 이름으로\",\"confidence\":\"high\"}]}\n" +
 "keys는 조합의 배열이다 — 대안이 둘이면 [[\"⌘\",\"K\"],[\"⌘\",\"T\"]].\n\n요청: ";
function finishAsk(){
  askBusy = false;
  var b = document.getElementById("ask-go");
  if(b){ b.disabled = false; b.textContent = "찾아서 넣기" }
}
function logRequest(q, why){
  if(!DB){ statusMsg(why + " 이 화면에서는 저장도 안 돼요 — Brainy에게 “단축키에 " + q + " 넣어줘”라고 해 주세요.", true); finishAsk(); return }
  DB.collection("requests").doc(slug(q) + "-" + Date.now().toString(36).slice(-4))
    .set({ q: q, createdAt: new Date().toISOString(), done: false })
    .then(function(){ var a = document.getElementById("ask"); if(a) a.value = ""; statusMsg(why + " 요청으로 남겼어요 — 맥의 Brainy가 공식 문서로 찾아 넣어요.") })
    .catch(function(){ statusMsg(why + " 저장도 안 됐어요 — Brainy에게 말해 주세요.", true) })
    .then(finishAsk);
}
function askFor(q){
  q = String(q || "").trim();
  if(!q || askBusy) return;
  askBusy = true;
  var btn = document.getElementById("ask-go");
  if(btn){ btn.disabled = true; btn.textContent = "찾는 중…" }
  statusMsg("준비 중…");
  capReady.then(function(){
    if(!SAMPLE){ logRequest(q, "이 화면에서는 바로 찾을 수 없어요."); return }
    statusMsg("맥의 Brainy가 찾는 중… (보통 10~20초)");
    SAMPLE.json(ASK_RULES + q).then(function(v){
      var items = (v && Array.isArray(v.items)) ? v.items : [];
      if(!items.length){ statusMsg("쓸 만한 게 안 나왔어요. 더 좁혀서 — 예: “슬랙 메시지 작성”, “줌 음소거”.", true); finishAsk(); return }
      var ar = String((v && v.area) || q).slice(0, 20);
      var id = slug(ar) + "-" + Date.now().toString(36).slice(-4);
      var body = { area: ar, q: q, items: items.slice(0, 14), createdAt: new Date().toISOString(), verified: false };
      function land(local){
        if(local){ ADDED = ADDED.concat(docToItems(id, body)); reindex() }
        finishAsk();
        area = ar; save("sc.area", area); st = "todo"; show("field");
      }
      if(DB) DB.collection("additions").doc(id).set(body).then(function(){ land(false) }, function(){ land(true) });
      else land(true);
    }, function(e){
      var code = e && e.code;
      if(code === "not_granted" || code === "sampling_disabled" || code === "not_declared") logRequest(q, "Claude에게 묻는 것이 허용되지 않았어요.");
      else if(code === "rate_limited"){ statusMsg("지금은 너무 자주 불렀어요. 잠시 뒤에 다시.", true); finishAsk() }
      else if(code === "invalid_json" || code === "empty_completion"){ statusMsg("답이 깨졌어요. 더 짧게 — 예: “피그마”.", true); finishAsk() }
      else if(code === "cancelled"){ statusMsg(""); finishAsk() }
      else { statusMsg("못 가져왔어요 (" + (code || "오류") + "). 잠시 뒤에 다시.", true); finishAsk() }
    });
  });
}

render();

<script>
/* 맥 단축키 — Brainy 연결 (build.py 가 brainy-chat.js 앞에 붙인다)
   ctx(): 지금 앱 상태를 Brainy 에게 알려 준다 · tools: Brainy 가 답한 뒤 이 화면에서 실행하는 앱 도구 */
(function () {
  function norm(s) { return String(s || "").toLowerCase().replace(/\s+/g, ""); }
  function findItem(q) {
    var n = norm(q); if (!n) return null;
    return BY_ID[q] || ITEMS.filter(function (s) { return norm(s.t) === n; })[0] ||
      ITEMS.filter(function (s) { return norm(s.t).indexOf(n) >= 0 || norm(s.x || "").indexOf(n) >= 0; })[0] || null;
  }
  function findCourse(q) {
    var list = (COURSE.courses || []), n = norm(q);
    if (!n) return csCourse();
    return list.filter(function (c) { return c.id === q || norm(c.name).indexOf(n) >= 0 || norm(c.tag) === n; })[0] || null;
  }
  function findChapter(c, q) {
    var n = norm(q);
    return c.chapters.filter(function (ch) { return ch.id === q; })[0] ||
      c.chapters.filter(function (ch) { return norm(ch.title).indexOf(n) >= 0; })[0] || null;
  }
  window.BRAINY_HOOK = {
    chips: ["지금 들을 강의 단축키 알려 줘", "Git 명령어 즐겨찾기 해 줘", "이 앱에서 ○○ 고쳐 줘"],
    ctx: function () {
      var c = csCourse(), here = c ? csHere(c) : null;
      var favs = ITEMS.filter(function (s) { return marks[s.id] === "fav"; }).map(function (s) { return s.t; });
      var pass = ITEMS.filter(function (s) { return marks[s.id] === "pass"; }).length;
      var no = ITEMS.filter(function (s) { return marks[s.id] === "no"; }).length;
      var L = ["[지금 앱 상태 — 맥 단축키]",
        "- 보고 있는 탭: " + current + " (now 지금 · field 분야 · course 강의 · all 전체 · fav ★즐겨찾기 · pass ✓외웠어 · no ✕필요없어)" + (current === "field" ? " · 고른 앱: " + area : ""),
        "- 분야: " + catList().map(function (c) { return c + "(" + areaList().filter(function (g) { return catOf(g) === c; }).join(", ") + ")"; }).join(" / "),
        "- 단축키 목록 " + ITEMS.length + "개 · ★ " + favs.length + "개" + (favs.length ? "(" + favs.slice(0, 25).join(", ") + ")" : "") + " · ✓외웠어 " + pass + "개 · ✕필요없어 " + no + "개 (표시는 하나만, ✓·✕는 목록에서 빠짐)",
        "- 고칠 단축키(동욱이 「이 단축키는 고쳐요」로 표시 + 적은 글, sc.marks/req) " + fixItems().length + "개: " + fixItems().slice(0, 30).map(function (s) { return s.t + (reqOf(s.id) ? " — " + reqOf(s.id).slice(0, 80) : ""); }).join(" / "),
        "- 단축키 목록의 정본은 볼트 4_Outputs/단축키 앱/단축키 데이터.json (+ 위키 「맥 핵심 단축키」). 고칠 땐 vault_read 로 읽고 vault_write 로 고친다 — 맥의 동기화가 몇 초 안에 이 앱(sc.data/main)으로 올린다",
        "- 강의들: " + csList().map(function (x) { return (x.tag ? x.tag + " " : "") + x.name + " [" + x.id + "]"; }).join(" / ")];
      if (c) {
        L.push("- 고른 강의: " + c.name + " · 지금 들을 강의(챕터): " + (here ? here.title : "-") + " · 그 강의 단축키·명령어 " + (c.cheat || []).length + "개");
        var mine = (c.cheat || []).filter(function (x) { return here && x.ch === here.id; }).slice(0, 30);
        if (mine.length) L.push("- 지금 들을 강의의 단축키·명령어: " + mine.map(function (x) { return x.t + " = " + (x.code || (x.k || []).map(function (a) { return a.join(""); }).join(" / ")); }).join(" · "));
      }
      L.push("- 앱 저장소(app_doc): sc.data/main(단축키 목록) · sc.marks/main(marks: id→fav|pass|no) · sc.data/course(강의·단축키·명령어) · sc.marks/course(진도 · cp✓ cf★ cn✕) · sc.marks/req(reqs: id→{fix, text, at, t} 고칠 단축키)");
      return L.join("\n");
    },
    tools: [
      { name: "shortcut_mark", description: "맥 단축키 목록의 단축키 하나에 ★즐겨찾기(fav)·✓외웠어(pass)·✕필요없어(no) 중 하나를 붙이거나 뗀다(none). query 는 단축키 이름이나 id.",
        inputSchema: { type: "object", properties: { query: { type: "string" }, mark: { type: "string", enum: ["fav", "pass", "no", "none"] } }, required: ["query", "mark"] },
        execute: function (i) { var s = findItem(i.query); if (!s) throw new Error("「" + i.query + "」 단축키를 못 찾았어요"); if (i.mark === "none" || marks[s.id] !== i.mark) setMark(s.id, i.mark); refresh(); return s.t + " → " + i.mark; } },
      { name: "shortcut_fix_clear", description: "고칠 단축키 표시(「이 단축키는 고쳐요」 + 적은 글)를 푼다. 볼트 노트에서 그 단축키를 다 고친 뒤, 또는 동욱이 풀라고 할 때만. query 는 단축키 이름이나 id.",
        inputSchema: { type: "object", properties: { query: { type: "string" } }, required: ["query"] },
        execute: function (i) { var s = findItem(i.query); if (!s) throw new Error("「" + i.query + "」 단축키를 못 찾았어요"); if (isFix(s.id)) setReq(s.id, "", false); refresh(); return s.t + " → 고칠 표시 풂"; } },
      { name: "course_item_mark", description: "강의 탭의 단축키·명령어 하나에 ★즐겨찾기(fav)·✓외웠어(pass)·✕필요없어(no) 중 하나를 붙이거나 뗀다(none). course 는 강의 이름(비우면 지금 고른 강의), query 는 명령(code)이나 이름(t).",
        inputSchema: { type: "object", properties: { course: { type: "string" }, query: { type: "string" }, mark: { type: "string", enum: ["fav", "pass", "no", "none"] } }, required: ["query", "mark"] },
        execute: function (i) {

<script>

<script>

    /* 다른 기기끼리 같은 대화(새 기기가 처음 열 때 이어받은 것 · 이어받아 더 쓴 것)는 가장 긴 하나만 — 한쪽이 다른 쪽의 앞부분이면 같은 대화

    var shot = LOCAL ? [] : pics.splice(0);   // 이번에 같이 보낼 사진
    q = String(q || "").trim(); if (!q && shot.length) q = "이 사진 봐 주세요.";
    if (!q || busy) { if (shot.length) { pics = shot; paintPics(); } return; }
    if (shot.length) paintPics();
    if (!LOCAL && !sample) { turns.push({ role: "user", content: q }, { role: "assistant", content: "⚠ 지금은 Brainy를 부를 수 없어요. 로그인을 확인해 주세요." }); keep(); render(); return; }
    var hist = turns.filter(function (t) { return t.content && !t.err; }).slice(-10).map(function (t) { return { role: t.role, content: t.imgs ? "(사진 " + t.imgs + "장을 같이 보냄) " + t.content : t.content }; });
    var me = { role: "user", content: q }; if (shot.length) { me.imgs = shot.length; me.shots = shot.map(function (p) { return p.url; }); }
    turns.push(me); var ai = { role: "assistant", content: "", steps: [] }; turns.push(ai);
    busy = true; t0 = Date.now(); openOld = false; ctl = new AbortController(); text.value = ""; text.style.height = ""; render();
    function live(u) {
      ai.content = u; var el = document.getElementById("bc-last");
      if (el) { el.textContent = u; } if (box.hidden) { unread = true; paintFab(); }
      msgs.scrollTop = msgs.scrollHeight;
    }
    var run = LOCAL
      ? localSend({ q: q, ctx: ctxText() }, { signal: ctl.signal, onText: live, onStep: function (s) { ai.steps.push(s); render(); } })
      : sample([{ role: "user", content: rules() }].concat(hist).concat([{ role: "user", content: q }]), Object.assign({
          signal: ctl.signal, cache: false, tools: HOOK.tools || [], images: shot.map(function (p) { return p.blob; }), onText: function (u) { live(u.text); }
        }, HOOK.mode ? HOOK.mode() : {}));   // 앱이 정한 대화 방식 — where(맥·클라우드) · model (콘텐츠 기획 「Claude 모드」)
    run.then(function (r) { ai.content = (r && r.text) || ai.content; }, function (e) {
      ai.content = (e && e.text) || ai.content || ""; ai.err = 1;
      ai.content += (ai.content ? "\n\n" : "") + (e && (e.code === "cancelled" || e.name === "AbortError") ? "멈췄어요." : "⚠ " + ((e && e.message) || "답을 받지 못했어요"));
    }).then(function () { busy = false; ctl = null; if (box.hidden) unread = true; keep(); render(); });
  }
  /* 아래 막대(탭 막대 등)를 가리지 않게 단추·창을 그만큼 올린다 · 폰 키보드가 올라오면 창을 키보드 위로 */
  function lift() {
    var bar = HOOK.avoid !== false && document.querySelector(HOOK.avoid || "#tabbar"), h = 0;
    if (bar) { var r = bar.getBoundingClientRect(); var cs = getComputedStyle(bar); if (r.height > 0 && cs.display !== "none" && Math.abs(r.bottom - window.innerHeight) <= 2 && r.top > window.innerHeight * 0.3 && !(document.documentElement.classList.contains("bc-push") && r.right < window.innerWidth - 300)) h = Math.round(r.height); }   // 앱이 비켜서서 막대가 창 밑에 없으면 안 올린다   // 화면 바닥에 딱 붙은 막대만 (화면 밖으로 이어지는 흐름 속 칸은 무시)
    document.documentElement.style.setProperty("--bc-lift", h + "px");
    var vv = window.visualViewport, kb = vv ? Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop)) : 0;
    box.style.setProperty("--bc-kb", (kb > 80 ? kb : 0) + "px"); box.classList.toggle("kb", kb > 80);
    if (kb > 80 && vv) box.style.height = Math.min(Math.round(vv.height - 16), Math.round(window.innerHeight * 0.68)) + "px"; else box.style.height = "";
  }
  window.addEventListener("resize", lift);
  if (window.visualViewport) { visualViewport.addEventListener("resize", lift); visualViewport.addEventListener("scroll", lift); }
  setInterval(lift, 1500);   // 앱이 탭 막대를 나중에 그려도 맞춘다
  function open() { box.hidden = false; fab.hidden = true; if (HOOK.push !== false) document.documentElement.classList.add("bc-push"); window.dispatchEvent(new Event("resize")); unread = false; lift(); render(); try { localStorage.setItem(KEY + ".open", "1"); } catch (e) {} if (window.matchMedia("(pointer: fine)").matches) setTimeout(function () { try { text.focus(); } catch (e) {} }, 50); }
  function close() { box.hidden = true; fab.hidden = false; document.documentElement.classList.remove("bc-push"); window.dispatchEvent(new Event("resize")); paintFab(); try { localStorage.removeItem(KEY + ".open"); } catch (e) {} }
  window.BRAINY_CHAT = { open: open, close: close, ask: function (q) { open(); go(q); } };   // 앱 안 다른 단추에서 대화를 열 때
  fab.addEventListener("click", open);
  box.addEventListener("click", function (e) {
    var up = e.target.closest("[data-bc-unpic]");
    if (up) { var k = +up.getAttribute("data-bc-unpic"), drop = pics.splice(k, 1)[0]; if (drop) URL.revokeObjectURL(drop.url); paintPics(); return; }
    var pp = e.target.closest("[data-bc-past]"); if (pp) { viewPast = +pp.getAttribute("data-bc-past"); render(); return; }
    var po = e.target.closest("[data-bc-other]"); if (po) { viewPast = 1000 + (+po.getAttribute("data-bc-other")); render(); return; }
    var bm = e.target.closest("[data-bp-model]");
    if (bm) { if (!DBC) return; aiModel = bm.getAttribute("data-bp-model"); paintModels(); P.setModel(DBC, aiModel); return; }
    var b = e.target.closest("[data-bc],[data-bc-chip]"); if (!b) return;
    var a = b.getAttribute("data-bc");
    if (a === "close") return close();
    if (a === "new") { if (ctl) ctl.abort(); archive(); turns = []; showHist = false; try { localStorage.removeItem(SID); } catch (e) {} keep(); render(); return; }
    if (a === "hist") { showHist = !(showHist && viewPast < 0); viewPast = -1; render(); return; }
    if (a === "delpast") { var dp = past[viewPast]; if (dp && confirm("이 지난 대화를 지울까요? 다른 기기에서도 지워져요.")) { gone.push(pkey(dp)); past.splice(viewPast, 1); viewPast = -1; keep(); render(); } return; }
    if (a === "resume") { var other = viewPast >= 1000, pr = other ? others()[viewPast - 1000] : past[viewPast]; if (pr && !busy) {
      if (!other) { gone.push(pkey(pr)); past.splice(viewPast, 1); }   // 꺼낸 지난 대화는 지운 표시 — 다른 기기 기록과 합쳐도 다시 안 생긴다
      archive(); turns = pr.turns.slice(); showHist = false; viewPast = -1; keep(); render(); } return; }
    if (a === "old") { openOld = !openOld; render(); return; }
    var c = b.getAttribute("data-bc-chip");
    if (c) { if (c.indexOf("○○") >= 0) { text.value = c.split("○○")[0]; text.focus(); } else go(c); }
  });
  send.addEventListener("click", function () { if (busy) { if (ctl) ctl.abort(); } else go(text.value); });
  if (att) {
    att.addEventListener("click", function () { file.click(); });
    file.addEventListener("change", function () { addPics(file.files); file.value = ""; text.focus(); });
    text.addEventListener("paste", function (e) {   // 캡처한 화면을 바로 붙여 넣기 — 글과 같이 붙여도 글은 그대로 들어간다
      var cd = e.clipboardData; if (!cd) return;
      var fs = [].slice.call(cd.files || []);
      if (!fs.length) fs = [].slice.call(cd.items || []).filter(function (it) { return it.kind === "file"; }).map(function (it) { return it.getAsFile(); });
      if (addPics(fs) && !cd.getData("text/plain")) e.preventDefault();
    });
    box.addEventListener("dragover", function (e) { if (e.dataTransfer && [].indexOf.call(e.dataTransfer.types || [], "Files") >= 0) { e.preventDefault(); box.classList.add("bc-drop"); } });
    box.addEventListener("dragleave", function (e) { if (!box.contains(e.relatedTarget)) box.classList.remove("bc-drop"); });
    box.addEventListener("drop", function (e) { box.classList.remove("bc-drop"); if (e.dataTransfer && e.dataTransfer.files.length) { e.preventDefault(); addPics(e.dataTransfer.files); } });
  }
  text.addEventListener("input", function () { text.style.height = "auto"; text.style.height = Math.min(text.scrollHeight + 2, 132) + "px"; text.style.overflowY = text.scrollHeight > 130 ? "auto" : "hidden"; });
  text.addEventListener("keydown", function (e) { if (e.key === "Enter" && !e.shiftKey && !e.isComposing && e.keyCode !== 229 && window.matchMedia("(pointer: fine)").matches) { e.preventDefault(); go(text.value); } });
  text.addEventListener("focus", function () { setTimeout(lift, 60); setTimeout(lift, 350); });
  text.addEventListener("blur", function () { setTimeout(lift, 60); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !box.hidden) close(); });
  function ready() { var was = false; try { was = localStorage.getItem(KEY + ".open") === "1"; } catch (e) {} lift(); if (was) open(); else fab.hidden = false; }
  if (LOCAL) ready();
  else if (window.claude && claude.use) {
    claude.use("sample").then(function (s) { sample = s; if (s) ready(); }, function () {});   // 로그인돼 Brainy를 부를 수 있을 때만
    claude.use("db").then(function (db) {   // 다른 기기에서 이어 쓴 기록을 받는다 — 더 새것만
      if (!db) return; DBC = db;
      if (PICK) { paintModels(); P.watchModel(db, function (v) { aiModel = v; paintModels(); }); }
      db.doc(PATH).onSnapshot(function (snap) {
        if (!snap.exists) { if (turns.length || past.length) keep(); return; }
        var d = snap.data() || {}; remote = d;
        var before = JSON.stringify([past, gone]);
        gone = gone.concat((d.gone || []).filter(function (k) { return gone.indexOf(k) < 0; }));
        mergePast((d.past || []).concat(past));
        if (firstOpen && !clean(turns).length && !busy) {   // 처음 여는 기기 — 가장 최근에 쓴 지금 대화를 이어받는다 (한 번만)
          var devs = Object.assign({}, d.devs || {}, d.cur ? { legacy: { at: d.at, turns: d.cur } } : {}), best = null;
          Object.keys(devs).forEach(function (k) { var x = devs[k]; if (x && clean(x.turns).length && (!best || x.at > best.at)) best = x; });
          if (best && !past.some(function (p) { return sig(p.turns) === sig(best.turns); })) turns = clean(best.turns);
        }
        firstOpen = false;
        local();
        if (JSON.stringify([past, gone]) !== before && !busy) keep();   // 이 기기에만 있던 지난 대화를 저장소에도
        if (!box.hidden && !busy) render();
      });
    }, function () {});
  }
})();
