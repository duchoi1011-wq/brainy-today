<script>/* Brainy 공통 부품 — 모든 앱이 같이 쓴다 (모델 버튼 줄 · 첫 안내 · 노트 쓰기 규칙 · 「고쳐요」 칸) */
/* Brainy 공통 부품 — 모든 앱(Brainy 홈 · 맥 단축키 · 체화 단어장 · 콘텐츠 기획)이 같이 쓴다. 여기 한 곳만 고치면 모든 앱이 바뀐다 (2026-11-24 동욱).
   원본 html 의 앱 스크립트 바로 앞, 이 파일을 끼우는 include 자리에 들어간다 → 앱 코드와 대화창(brainy-chat.js)보다 먼저 선다.
   · 답할 모델 버튼 줄 — modelRow() · 고른 값은 config/ai 의 model 하나를 모든 앱이 공유 (클라우드 Brainy 가 다음 질문부터 이 모델로, 짧은 일은 늘 Haiku)
   · 첫 안내문 — hello() · 노트 쓰기 도구(vault_write) 규칙 — NOTE_RULE
   · 「이 ○○는 고쳐요」 표시 + Brainy에게 맡기기 — fixHtml() · fixAsk() · ask()
   · 위 것들의 생김새 — 앱의 색(--ink·--accent …, 없으면 --g-*)을 따른다 */
(function () {
  "use strict";
  if (window.BRAINY_PARTS) return;
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  /* ── 생김새 ── */
  var css = document.createElement("style");
  css.textContent =
    /* 색 — 네 앱이 같이 쓰는 이름(--ink·--muted·--line·--surface·--accent)을 먼저, 없으면 받침의 --g-* */
    ".bp-models,.bp-hello,.bp-fix,.bp-fix-done,.bp-fix-tag,.bp-fixask{--bp-fg:var(--ink,var(--bp-fg));--bp-mut:var(--muted,var(--bp-mut));--bp-line:var(--line,var(--bp-line));" +
    "--bp-bg:var(--bg,var(--g-bg,#fff));--bp-card:var(--surface,var(--g-card,#fff));--bp-acc:var(--accent,var(--g-acc,#2f6f5e));--bp-acc-ink:var(--accent-ink,var(--g-acc-ink,#fff))}" +
    /* 모델 버튼 줄 */
    ".bp-models{display:flex;gap:4px;padding:8px 10px;border-bottom:1px solid var(--bp-line);background:var(--bp-card);min-width:0}" +
    ".bp-m{flex:1;min-width:0;min-height:44px;padding:4px 2px;border:1px solid var(--bp-line);border-radius:12px;background:var(--bp-bg);color:var(--bp-fg);font:inherit;line-height:1.2;display:grid;place-content:center;text-align:center;cursor:pointer}" +
    ".bp-m b{display:block;font-size:13.5px;white-space:nowrap}.bp-m small{display:block;font-size:11px;color:var(--bp-mut)}" +
    ".bp-m:hover{border-color:var(--bp-acc)}.bp-m:disabled{opacity:.5;cursor:default}" +
    ".bp-m[aria-pressed=true]{background:var(--bp-acc);border-color:var(--bp-acc);color:var(--bp-acc-ink)}.bp-m[aria-pressed=true] small{color:inherit;opacity:.85}" +
    /* 첫 안내문 */
    ".bp-hello{align-self:flex-start;justify-self:start;max-width:90%}.bp-hello b{display:block;font-size:17px;margin-bottom:4px}" +
    ".bp-hello p{margin:0;font-size:13.5px;line-height:1.6;color:var(--bp-mut)}" +
    /* 「이 ○○는 고쳐요」 칸 */
    ".bp-fix{display:flex;flex-direction:column;gap:8px;padding:10px 12px;border-radius:10px;background:var(--surface-2,var(--bp-card));border-left:3px solid var(--bp-acc);font-size:14px;color:var(--bp-fg)}" +
    ".bp-fix-l{display:block;font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--bp-mut)}" +
    ".bp-fix textarea{width:100%;box-sizing:border-box;min-height:64px;resize:vertical;font:inherit;color:var(--bp-fg);background:var(--bp-card);border:1px solid var(--bp-line);border-radius:10px;padding:9px 11px}" +
    ".bp-fix textarea:focus-visible{outline:2px solid var(--bp-acc);outline-offset:2px}" +
    ".bp-fix-t{white-space:pre-wrap;overflow-wrap:anywhere}.bp-fix-t .bp-mut{color:var(--bp-mut)}" +
    ".bp-fix-b{display:flex;gap:6px;flex-wrap:wrap}" +
    ".bp-fix-done{margin:4px 0 0;font-size:12.5px;color:var(--bp-mut)}" +
    ".bp-fix-tag{color:var(--bp-acc)!important;border-color:var(--bp-acc)!important}";
  (document.head || document.documentElement).appendChild(css);

  /* ── 답할 모델 — 모든 앱이 config/ai 의 model 하나를 같이 쓴다 (값: auto 또는 모델 id) ── */
  var MODELS = [["auto", "자동", "auto"], ["claude-haiku-5-5", "빠름", "Haiku"], ["claude-sonnet-5-5", "기본", "Sonnet"], ["claude-opus-5-5", "깊게", "Opus"], ["claude-fable-5-1", "최고", "Fable"]];
  var SHORT = { "claude-haiku-5-5": "haiku", "claude-sonnet-5-5": "sonnet", "claude-opus-5-5": "opus" };   // 맥에서 답할 때 넘기는 이름 (콘텐츠 기획 「Claude 모드」와 같은 꼴)
  var LS = "bp.model", model = "auto", DB = null, fns = [];
  try { model = localStorage.getItem(LS) || "auto"; } catch (e) {}
  function valid(m) { return MODELS.some(function (x) { return x[0] === m; }) ? m : "auto"; }
  model = valid(model);
  function take(m) { m = valid(m); if (m === model) return; model = m; try { localStorage.setItem(LS, m); } catch (e) {} paintModels(); fns.forEach(function (f) { try { f(m); } catch (e) {} }); }
  function modelRow(label) {
    return '<div class="bp-models" role="group" aria-label="' + esc(label || "답할 Claude 모델 — 다음 질문부터, 모든 앱에 같이") + '">' + MODELS.map(function (m) {
      var on = m[0] === model;
      return '<button type="button" class="bp-m" data-bp-model="' + m[0] + '" aria-pressed="' + on + '"' + (DB ? "" : " disabled") + ' title="' + esc(m[1] + " · " + m[2] + (on ? " — 지금 이 모델로 답해요" : " — 누르면 다음 질문부터 (모든 앱)")) + '"><b>' + (on ? "✓ " : "") + m[1] + "</b><small>" + m[2] + "</small></button>";
    }).join("") + "</div>";
  }
  function paintModels() { [].forEach.call(document.querySelectorAll(".bp-models"), function (el) { el.outerHTML = modelRow(el.getAttribute("aria-label")); }); }
  document.addEventListener("click", function (e) {
    var b = e.target.closest && e.target.closest("[data-bp-model]"); if (!b || !DB) return;
    take(b.getAttribute("data-bp-model"));
    DB.doc("config/ai").set({ model: model, at: new Date().toISOString() }).catch(function () {});
  });
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", paintModels); else paintModels();   // 앱 html 에 미리 둔 빈 줄(.bp-models)도 채운다
  function pull() { if (DB && window.BRAINY && BRAINY.fetch) BRAINY.fetch("config/ai").then(function (d) { take((d && d.model) || "auto"); }, function () {}); }
  if (window.claude && claude.use) claude.use("db").then(function (db) {
    if (!db) return; DB = db; paintModels(); pull();
    db.doc("config/ai").onSnapshot(function (s) { if (s.exists) take((s.data() || {}).model || "auto"); }, function () {});   // 홈처럼 config 를 받는 앱은 실시간으로
    document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") pull(); });   // 다른 앱에서 바꾼 것도 다시 볼 때 맞춘다
  }, function () {});

  /* ── 노트 쓰기 도구 — 앱 대화 규칙에 같이 넣는 한 줄 ── */
  var NOTE_RULE = "- 볼트 노트(위키 페이지·단어 뜻·태스크 노트 등)를 쓰거나 고치라고 하면 앱 고치기(app_edit_start)가 아니라 노트 쓰기 도구 vault_write 로 바로 한다: 먼저 vault_search·vault_read 로 지금 내용을 읽고, 바꿀 곳만 patch 로 고치고, 없는 페이지는 같은 영역의 다른 페이지 형식에 맞춰 create 로 만든다. 쓴 뒤엔 어디를 고쳤는지와 맥이 켜져 있으면 몇 초 안에 옵시디언 볼트에 들어간다고 한 줄로 알린다. 시키지 않은 노트는 쓰지 않는다. 노트 쓰기는 .md 노트만 된다.";

  /* ── 첫 안내문 — o: {name 앱 이름, what 첫 문장(없으면 기본), editNote 앱 고치기 설명, local 로컬 앱, pics 사진 보내기 됨} → {title, text} ── */
  function hello(o) {
    o = o || {};
    if (o.local) return { title: "동욱 님, 무엇을 도와드릴까요?", text: (o.name || "이 앱") + "에 대해 묻거나 바꾸고 싶은 걸 말해 주세요. " + (o.editNote || "이 맥의 Claude가 앱 원본을 바로 고쳐요. 고친 뒤 새로고침하면 보여요.") };
    return { title: "동욱 님, 무엇을 도와드릴까요?",
      text: (o.what || (o.name || "이 앱") + "에 대해 묻거나 바꾸고 싶은 걸 말해 주세요.") +
        " 위키 페이지·단어 뜻 같은 볼트 노트도 쓰거나 고쳐 달라고 하면 바로 해요 — 맥이 켜져 있으면 몇 초 안에 볼트에 들어가요." +
        " 앱 화면을 바꿔 달라고 하면 " + (o.editNote || "고친 판이 5~15분 뒤 준비되고, 「적용해 줘」라고 해야 실제 앱에 들어가요.") +
        (o.pics === false ? "" : " 📎로 사진(화면 캡처)도 같이 보낼 수 있어요 — 붙여 넣어도 돼요.") };
  }
  function helloHtml(o) { var h = hello(o); return '<div class="bp-hello"><b>' + esc(h.title) + "</b><p>" + esc(h.text) + "</p></div>"; }

  /* ── 「이 ○○는 고쳐요」 칸 — 체화 단어장 고칠 단어 방식 (2026-11-24 동욱: 맥 단축키도 같은 방식으로)
     o: {id, what "단어"·"단축키", on 표시됨, text 적은 글, at 날짜, editing 쓰는 중, done {at, note} 지난번 고친 내용, placeholder, label 글칸 이름,
         attr(act, id) 단추 속성 — act: edit·save·cancel·del, btn {primary, ghost} 앱의 단추 class}
     저장 = 표시 + 적은 글(글 없이 표시만도 됨) · 표시 풀기 = 둘 다 지움. 글칸은 class rq-in · id "rq-<id>" (앱이 그 값을 읽는다) ── */
  function fixHtml(o) {
    var id = esc(o.id), w = o.what || "항목", A = o.attr || function (a, i) { return 'data-fix="' + a + '" data-id="' + esc(i) + '"'; };
    var P = (o.btn && o.btn.primary) || "btn primary", G = (o.btn && o.btn.ghost) || "btn ghost";
    function bt(cls, a, label) { return '<button type="button" class="' + cls + '" ' + A(a, o.id) + ">" + label + "</button>"; }
    if (o.editing) return '<div class="bp-fix"><span class="bp-fix-l">이 ' + esc(w) + "는 고쳐요 — 무엇이 틀렸나요?</span>" +
      '<textarea class="rq-in" id="rq-' + id + '" maxlength="300" placeholder="' + esc(o.placeholder || "예: 틀림 / 다른 것과 중복 / 설명이 너무 기본적임") + '" aria-label="' + esc((o.label || w) + " 고칠 점") + '">' + esc(o.text || "") + "</textarea>" +
      '<div class="bp-fix-b">' + bt(P, "save", "저장") + bt(G, "cancel", "취소") + (o.on ? bt(G, "del", "표시 풀기") : "") + "</div></div>";
    if (o.on) return '<div class="bp-fix"><span class="bp-fix-l">✓ 고칠 ' + esc(w) + (o.at ? " · " + esc(String(o.at).slice(0, 10)) : "") + '</span><span class="bp-fix-t">' + (o.text ? esc(o.text) : '<span class="bp-mut">적은 글이 없어요</span>') + "</span>" +
      '<div class="bp-fix-b">' + bt(G, "edit", "글 고치기") + bt(G, "del", "표시 풀기") + "</div></div>";
    return bt((o.btn && o.btn.mark) || G, "edit", "✎ 이 " + esc(w) + "는 고쳐요 (오류·중복)") +
      (o.done && o.done.note ? '<p class="bp-fix-done">지난번 고친 내용 · ' + esc(String(o.done.at || "").slice(0, 10)) + " · " + esc(o.done.note) + "</p>" : "");
  }
  /* Brainy에게 맡기기 단추 — o: {n 고칠 개수, sub 무엇까지 하는지, cls, attr} */
  function fixAsk(o) { return o.n ? '<button type="button" class="' + (o.cls || "btn primary") + '" ' + (o.attr || 'data-bp-fixask="1"') + ">✦ Brainy에게 고치기 맡기기" + (o.sub ? " — " + esc(o.sub) : "") + "</button>" : ""; }
  /* 대화창을 열고 그 말로 맡긴다 */
  function ask(q) { if (window.BRAINY_CHAT) window.BRAINY_CHAT.ask(q); else alert("Brainy 대화창이 아직 준비되지 않았어요. 로그인을 확인하고 잠시 뒤 다시 눌러 주세요."); }

  window.BRAINY_PARTS = {
    esc: esc, MODELS: MODELS, NOTE_RULE: NOTE_RULE,
    model: function () { return model; },
    modelShort: function () { return SHORT[model] || ""; },
    onModel: function (f) { fns.push(f); },
    modelRow: modelRow, paintModels: paintModels,
    hello: hello, helloHtml: helloHtml,
    fixHtml: fixHtml, fixAsk: fixAsk, ask: ask
  };
})();

</script>
<script>
/* 용어(terms·pairs)와 외국어(foreign)는 볼트가 정본이다 — 위키 「영상 편집 용어 사전」 표와 외국어 암기 표 → 맥 동기화(app_data.py)
   → Supabase vo.data/main → 아래 db.doc("vo.data/main") 가 채운다. 용어를 바꾸려면 볼트를 고친다 (코드에 넣지 않는다). */
let DATA = { terms: [], pairs: [] };
let FOREIGN = [];
const DOMAINS = {
  "학습 단어장": ["편집·구성","촬영","오디오","색","자막","모션","AI 편집 자동화"],
  "위키 개념": [],   // 위키 영역(관계·자기경영 …) — 볼트가 보내는 대로 wikiCats() 가 채운다
  "외국어 단어장": ["영어 단어","영어 회화","중국어 회화"],
  /* 따로 떼어 보는 단어장 (2026-11-22 동욱 · 11-24 세 칸으로 나눔) — 볼트가 dom 으로 보내거나, 분야 이름에 브랜드·상품 / 스킬 / MCP 가 들어가면 여기로 온다.
     예전 이름(브랜드·상품 페이지 · 스킬·MCP)으로 와도 새 칸으로 간다. 후보 옮기기·붙여 넣어 올린 단어는 vo.marks/add (ADD) */
  "브랜드·상품": [],
  "스킬": [],
  "MCP": []
};
const SPLIT_DOMS = ["브랜드·상품", "스킬", "MCP"];
const domOf = cat => Object.keys(DOMAINS).find(d => DOMAINS[d].includes(cat)) || "학습 단어장";
/* ADD = { items: 붙여 넣어 올린 단어 [{id, term, def, cat, dom, at}], move: { 단어id: 옮긴 단어장 }, cat: { 옮긴 단어id: 넣을 분야 } } — 볼트에 넣기 전까지 앱에서 바로 보이게 */
let ADD = { items: [], move: {}, cat: {} };
const readAdd = v => ({ items: Array.isArray(v.items) ? v.items : [], move: v.move || {}, cat: v.cat || {} });
const withCat = t => { const c = ADD.cat?.[t.id]; return c && ADD.move?.[t.id] ? { ...t, cat: c } : t; };
const domFor = t => {

  if (d === "스킬" || d === "스킬·MCP" || /스킬|MCP|플러그인/i.test(c)) return "스킬";

  return d || domOf(c);
};
/* 단어장·분야는 볼트(위키)가 정한다 — 「위키 개념」(위키 영역별)과 분야 단어장(심리학·개발 용어 …)이 새로 오면 그 단어장의 분야 칩이 저절로 는다 */
function wikiCats(){ ALL.forEach(t => { const d = DOMAINS[t.dom]; if (d && !d.includes(t.cat)) d.push(t.cat); }); }
const addItems = () => (Array.isArray(ADD.items) ? ADD.items : []).filter(x => x && x.id && x.term);
let ALL = DATA.terms.concat(FOREIGN, addItems()).map(t => withCat({ ...t, dom: domFor(t) }));

function rebuild(){

  TERMS = ALL.filter(t => t.dom === S.domain);

}
const DOMKEY = "chewha-vocab-domain";

  S.domain = DOMAINS[d] ? d : "학습 단어장";

  CATS = DOMAINS[S.domain].filter(c => TERMS.some(t => t.cat === c));
  S.listCat = "all"; S.detail = null; S.pick = new Set(); S.batch = null; S.fieldCat = ""; S.fieldMode = "";
  try { localStorage.setItem(DOMKEY, S.domain); } catch(e) {}
}
const epOf = t => t.ep ? "EP " + esc(t.ep) : "볼트 단어장";

"예약 공개면 촬영일과 공개일을 떼어 둘 수 있어 검수 시간이 생깁니다.", "src": "01-02-02 기획부터 촬영, 편집까지. 현업"}, "shoot-03": {"ex": "노출과 밝기를 조정해 형태를 살린 뒤 대비와 색을 보는 식으로 나눕니다. 회색이어야 할 벽까지 푸르게 보이는 경우와 구분해야 합니다.", "src": "05-02-01 밋밋한 화면을 살려주는 기본 색보정"}, "shoot-04": {"ex": "줌은 확대와 축소, 패닝은 좌우 회전이며, 부감은 위에서 내려다보는 시점입니다. 한 컷에 여러 사건을 넣으면 행동이나 순서가 빠질 수 있습니다.", "src": "03-02-04 Higgsfield로 동영상 생성하는 법"}, "shoot-05": {"ex": "프롬프트: 카메라 무빙을 줘서 휩 줌 / 줌아웃 / 패닝 이런거 적재적소에 써봐. 세 가지는 카메라가 움직이는 방식의 이름입니다. 이름만 적어도 Claude가 어디에 넣을지 정합니다.", "src": "05-03-01 크로마키 기능으로 배경 제거하기"}, "shoot-08": {"ex": "박수 편집점은 박수 앞을 지웁니다. 반복 발화는 남는 문장을 소리 내어 읽어 봅니다.", "src": "06-02-01 자동 컷부터 자막, 스톡 이미지까지"}, "shoot-09": {"ex": "프롬프트: 고른 장면으로 90초짜리 편집본 만들어 줘. 찍은 시각 순서대로 가고, 음악은 아직 넣지 말고 현장음만 남겨 줘. 음악을 나중에 넣는 까닭이 있습니다. 현장음만 들으면 컷이 끊기는 지점이 드러납니다.", "src": "06-02-03 장면 고르기부터 색보정까지, 브이로그"}, "shoot-10": {"ex": "디스필(despill)은 경계에 묻은 초록빛을 덜어 냅니다. 두 설정은 제거 기준과 따로 움직입니다.", "src": "05-03-01 크로마키 기능으로 배경 제거하기"}, "shoot-11": {"ex": "카메라 무보정 원본과 로그 촬영본은 색이 이것과 다릅니다. 중간 밝기가 노란 쪽으로 치우쳐 있습니다.", "src": "05-02-02 레퍼런스 분석을 통한 컬러 그레이딩"}, "audio-03": {"ex": "임계값(Threshold)은 어느 수준 이하를 무음으로 볼지 정하는 기준이고, 최소 무음 길이는 그 작은 소리가 얼마나 오래 이어져야 후보가 되는지 정하는 값입니다. 앞뒤 여백은 말의 시작과 끝에 남겨 둘 시간입니다.", "src": "04-01-01 FFmpeg으로 말 없는 무음 구간을"}, "audio-04": {"ex": "무음 자르기는 오디오 파형에서 소리 크기가 기준선 아래로 떨어진 구간을 찾아 삭제 후보로 만드는 작업입니다. 데시벨(dB)은 소리 크기를 나타내며, 값이 작을수록 더 조용한 상태입니다.", "src": "04-01-01 FFmpeg으로 말 없는 무음 구간을"}, "audio-02": {"ex": "무음 자르기는 오디오 파형에서 소리 크기가 기준선 아래로 떨어진 구간을 찾아 삭제 후보로 만드는 작업입니다. 데시벨(dB)은 소리 크기를 나타내며, 값이 작을수록 더 조용한 상태입니다.", "src": "04-01-01 FFmpeg으로 말 없는 무음 구간을"}, "audio-01": {"ex": "데시벨(dB)은 소리 크기를 나타내며, 값이 작을수록 더 조용한 상태입니다.", "src": "04-01-01 FFmpeg으로 말 없는 무음 구간을"}, "audio-05": {"ex": "접합부에서 파형이 급격히 끊기면 팝 노이즈가 생길 수 있습니다. 아주 짧게 소리를 겹치는 크로스페이드로 줄입니다.", "src": "04-01-01 FFmpeg으로 말 없는 무음 구간을"}, "audio-06": {"ex": "“음, 어, 그, 아”처럼 실제 소리가 있는 추임새는 ⑥ 무음 자르기로 없어지지 않습니다. 음성을 텍스트로 전사해 단어와 타임코드를 찾은 뒤, 실제 소리를 들으며 삭제 여부와 경계를 정합니다.", "src": "04-01-02 Whisper로 추임새 단어를 찾아"}, "audio-07": {"ex": "반복 발화의 끝만 남겼을 때 주어, 조건, 숫자가 빠지지 않는지도 앞뒤 문장과 함께 듣습니다.", "src": "04-01-02 Whisper로 추임새 단어를 찾아"}, "audio-10": {"ex": "화자 분석 결과는 발화마다 시작 시각과 끝 시각과 음높이를 적은 표입니다. 발화 16개와 화자 교대 15회가 대본과 같습니다.", "src": "06-02-05 발화자 분리부터 자막 추가, 인트로"}, "audio-11": {"ex": "⑬ 볼륨 노멀라이즈에서는 녹음 안의 편차를 줄이고 유튜브용 -14 LUFS에 맞춥니다. 작은 발화를 키우려고 전체 볼륨을 올리면 큰 발화도 함께 커집니다.", "src": "05-01-01 들쭉날쭉한 볼륨을 방송 규격으로 맞추는"}, "audio-12": {"ex": "피크를 낮추는 것만으로 작은 말과 큰 말의 차이가 해결되지는 않으므로 통합 LUFS와 발화 구간 편차를 따로 읽습니다.", "src": "05-01-01 들쭉날쭉한 볼륨을 방송 규격으로 맞추는"}, "audio-13": {"ex": "⑬ 볼륨 노멀라이즈에서는 녹음 안의 편차를 줄이고 유튜브용 -14 LUFS에 맞춥니다. 작은 발화를 키우려고 전체 볼륨을 올리면 큰 발화도 함께 커집니다.", "src": "05-01-01 들쭉날쭉한 볼륨을 방송 규격으로 맞추는"}, "audio-14": {"ex": "⑭ 노이즈 제거는 말소리를 남기고 배경 잡음을 줄이는 블록입니다. 말 사이의 조용한 부분만 잘라도 말 뒤에 깔린 팬 소리는 남습니다.", "src": "05-01-02 노이즈 제거 기능으로 배경 잡음 없애기"}, "audio-15": {"ex": "⑮ BGM은 이 셋을 한 파일에 섞으면서 말이 묻히지 않게 크기와 시점을 맞추는 블록입니다.", "src": "05-01-03 Epidemic Sound에서 영상에"}, "audio-16": {"ex": "화면이 왼쪽에서 오른쪽으로 밀리는 동안 whoosh가 같이 갑니다. 라이저는 소리가 점점 높아지고, 드론은 낮은 소리가 계속 깔립니다.", "src": "05-01-03 Epidemic Sound에서 영상에"}, "audio-18": {"ex": "프롬프트: 드럼과 베이스 스템만 Epidemic Sound에서 받아 줘. 받은 두 스템을 합쳐서 영상에 깔아줘. 소리 줄이지 말고.", "src": "05-01-03 Epidemic Sound에서 영상에"}, "audio-19": {"ex": "BPM은 1분 동안 반복되는 박의 수입니다. 120 BPM이면 평균적으로 0.5초마다 한 박이지만, 첫 박의 위치와 박 사이 간격은 곡의 실제 파형에 따라 달라집니다.", "src": "04-02-03 음악 비트 분석하여 음악에 맞춰 컷"}, "audio-20": {"ex": "TTS(Text-to-Speech)는 텍스트를 AI 성우의 음성으로 바꾸는 작업입니다. 본인의 목소리가 신뢰에 중요한 지식 채널은 직접 녹음을 우선합니다.", "src": "03-02-05 타입캐스트로 녹음 없이 음성을 생성하는"}, "color-01": {"ex": "기본 색보정(color correction)은 과하게 밝거나 어두운 부분을 살립니다. 컬러 그레이딩(color grading)은 영화 같은 색감을 입힙니다.", "src": "05-02-01 밋밋한 화면을 살려주는 기본 색보정"}, "color-02": {"ex": "컬러 그레이딩에는 기준이 될 사진 한 장이 필요합니다. 좋아하는 영화나 드라마의 한 장면을 쓸 수 있습니다.", "src": "05-02-02 레퍼런스 분석을 통한 컬러 그레이딩"}, "color-04": {"ex": "웨이브폼은 화면의 밝기 신호가 어느 범위에 분포하는지 보여주는 그래프입니다. 웨이브폼을 참고해 밝기 신호가 위아래 한계에 붙지 않는지 확인합니다.", "src": "05-02-01 밋밋한 화면을 살려주는 기본 색보정"}, "color-05": {"ex": "밝은 신호가 위쪽 한계에 붙으면 밝은 부분의 무늬가 사라지는 화이트 클리핑이, 어두운 신호가 아래쪽 한계에 붙으면 어두운 부분의 형태가 뭉개지는 블랙 클리핑이 발생할 수 있습니다.", "src": "05-02-01 밋밋한 화면을 살려주는 기본 색보정"}, "color-06": {"ex": "영화풍 색조를 파일 하나로 옮겨 담은 것이 LUT(Look-Up Table)입니다. LUT는 이 색이 들어오면 저 색으로 바꾼다는 규칙을 모아 둔 변환표입니다.", "src": "05-02-02 레퍼런스 분석을 통한 컬러 그레이딩"}, "color-07": {"ex": "프리셋 14종을 하나씩 열어 보면 앞에서 본 색이 기억에서 사라집니다. 한 화면에 모아 놓으면 나란히 견줄 수 있습니다.", "src": "05-02-02 레퍼런스 분석을 통한 컬러 그레이딩"}, "sub-01": {"ex": "Whisper가 음성을 전사하고 타임코드를 붙여도, 자막의 완성도는 한국어 문맥에 맞는 줄바꿈과 편집본의 시간에 달려 있습니다.", "src": "04-01-03 Whisper를 사용해 정확한 타이밍에"}, "sub-07": {"ex": "전사 파일, 자막(SRT), 그래픽 클립 같은 중간 파일을 보존하면 특정 단계만 수정하고 다시 렌더링하기 편리합니다.", "src": "03-01-02 영상편집 필수 오픈소스 3대장 소개"}, "sub-08": {"ex": "자막 굽기(Burn-in)는 폰트, 색상, 위치 같은 스타일을 영상 화면에 합성하는 작업입니다.", "src": "04-01-03 Whisper를 사용해 정확한 타이밍에"}, "sub-10": {"ex": "자막은 화면 가운데에 1에서 3어절씩 들어갑니다. AI가 대사 16개를 자막 38개로 나눕니다.", "src": "06-02-05 발화자 분리부터 자막 추가, 인트로"}, "sub-11": {"ex": "글자가 화면 밖이나 상자 밖에서 들어옵니다. 글자의 크기나 각도가 바뀌며 섭니다.", "src": "05-04-03 레퍼런스를 통해 움직이는 자막 만들기"}, "motion-02": {"ex": "키프레임: 특정 프레임에 화면 요소의 값을 저장한 표시. 이징: 두 키프레임 사이에서 값이 변하는 속도를 정하는 방식.", "src": "01-02-01 컷편집부터 트랜지션까지, 영상 편집"}, "motion-03": {"ex": "기준점이 가운데면 제자리에서 돕니다. 기준점을 왼쪽 위로 옮기면 그 모서리를 축으로 돕니다.", "src": "05-04-02 멈춰있는 이미지에 움직임을 넣는"}, "motion-04": {"ex": "이징: 두 키프레임 사이에서 값이 변하는 속도를 정하는 방식.", "src": "01-02-01 컷편집부터 트랜지션까지, 영상 편집"}, "motion-05": {"ex": "스태거: 여러 화면 요소의 시작 시간을 차례로 어긋나게 놓는 방식.", "src": "01-02-01 컷편집부터 트랜지션까지, 영상 편집"}, "motion-06": {"ex": "모션 블러: 화면 요소의 움직임 때문에 생기는 흐림 효과.", "src": "01-02-01 컷편집부터 트랜지션까지, 영상 편집"}, "motion-07": {"ex": "AI가 만든 모션 그래픽에는 페이드가 자주 들어갑니다. 페이드가 많으면 AI가 만든 티가 납니다.", "src": "07-01-02 인트로 아웃트로 제작하기"}, "motion-08": {"ex": "와이프와 슬라이드는 움직이는 것이 다릅니다. 와이프는 경계선이 지나가고 장면은 제자리에 있습니다.", "src": "05-04-01 장면과 장면을 매끄럽게 잇는 트랜지션"}, "motion-09": {"ex": "여러 장을 레이어로 쌓으면 한 장의 완성 이미지보다 훨씬 깊이 있는 장면이 됩니다. 한 장으로 완성된 이미지는 통째로만 움직입니다.", "src": "05-04-02 멈춰있는 이미지에 움직임을 넣는"}, "motion-10": {"ex": "오버레이(overlay)는 본 영상 위에 겹쳐 올리는 자료입니다. 본 영상은 그대로 두고 그 위에 자료만 얹습니다.", "src": "05-03-03 시청자의 이해를 돕는 요소 추가하기"}, "motion-11": {"ex": "⑱ 크로마키(chroma key)는 배경을 지워 대상만 남기는 블록입니다. 색으로 지우기(크로마키)는 정한 색과 가까운 화소를 투명하게 만듭니다.", "src": "05-03-01 크로마키 기능으로 배경 제거하기"}, "motion-12": {"ex": "대상이 화면 안에서 움직이면 한 곳에 고정한 블러는 곧 어긋납니다. ⑲ 모자이크/블러는 대상을 따라가며 가리는 블록입니다.", "src": "05-03-02 움직이는 대상도 잘 따라다니는 모자이크"}, "motion-13": {"ex": "RIFE(프레임 보간)는 앞뒤 프레임으로 중간 장면을 추정합니다. 영상을 느리게 재생할 때 움직임이 끊겨 보이는 현상을 줄이는 데 사용합니다.", "src": "03-02-01 영상 퀄리티를 한층 높여주는 오픈소스"}, "motion-14": {"ex": "흐리게 하는 것이 가우시안 블러이고 어둡게 하는 것이 디밍입니다. 둘이 같이 걸리면 눈이 갈 곳이 엠블럼 하나만 남습니다.", "src": "05-04-05 카메라가 따라가며 등장하는 인포그래픽"}, "motion-15": {"ex": "디자인 기준은 색과 규칙을 글로 길게 적는 대신 무드보드 한 장으로 줍니다.", "src": "06-02-02 모션그래픽 영상 여러개 '퀄리티"}, "motion-16": {"ex": "바 차트 레이스를 먼저 만들고 나머지 3가지를 한꺼번에 만듭니다.", "src": "05-04-04 통계 숫자를 움직이는 차트와 그래프로"}, "ai-01": {"ex": "원샷은 어렵지만 쓰리샷, 포샷으로 나누면 가능합니다. 매치컷과 J-cut 같은 용어로 원하는 방식을 전합니다.", "src": "01-01-01 이제, 편집을 말로 시키는 시대"}, "ai-02": {"ex": "블록: 이 강의에서 번호를 붙인 편집 기능 하나입니다. 정식 명칭은 스킬이며, 25개 블록이 각각 스톡 수집, 무음 제거, 말자막 같은 작업을 수행합니다.", "src": "02-02-04 컨텍스트부터 CLI, 서브에이전트까지"}, "ai-03": {"ex": "블록 25종을 한 편에 전부 쓰지 않습니다. 영상을 끌고 가는 것이 쓸 블록을 정합니다.", "src": "06-01-01 내 채널에 맞는 편집 자동화 블록"}, "ai-04": {"ex": "컨텍스트: AI가 답을 만들 때 읽는 내용입니다. 대화, 지침, 열어 본 파일, 실행 결과가 여기에 들어갑니다.", "src": "02-02-04 컨텍스트부터 CLI, 서브에이전트까지"}, "ai-05": {"ex": "세션: 작업을 이어 가는 대화 하나입니다. 새 세션에서는 이전 대화 전체가 자동으로 이어지지 않습니다.", "src": "02-02-04 컨텍스트부터 CLI, 서브에이전트까지"}, "ai-06": {"ex": "지침 파일 CLAUDE.md: Claude Code가 읽는 작업 설명서입니다. 키트에는 도구를 찾는 방법과 원본을 그대로 두는 규칙이 들어 있습니다.", "src": "02-02-04 컨텍스트부터 CLI, 서브에이전트까지"}, "ai-07": {"ex": "서브에이전트: 작은 범위로 나눈 일을 맡는 독립적인 AI 세션입니다. 별도 컨텍스트에서 작업하고 결과를 본 세션에 전달합니다.", "src": "02-02-04 컨텍스트부터 CLI, 서브에이전트까지"}, "ai-08": {"ex": "MCP: AI 앱과 외부 도구를 연결하는 공통 방식입니다. 사용할 기능과 인증 방법은 연결한 서버마다 다릅니다.", "src": "02-02-04 컨텍스트부터 CLI, 서브에이전트까지"}, "ai-09": {"ex": "노력 슬라이더를 오른쪽으로 옮길수록 더 오래 생각하고 비용도 더 듭니다. 짧은 작업은 왼쪽 끝에서 시작하고, 이해하지 못하면 한 단계씩 올립니다.", "src": "02-02-03 클로드 앱 설치부터 요금제 고르기까지"}, "ai-11": {"ex": "프롬프트: FFmpeg 설치해 줘. AI가 컴퓨터 환경에 맞춰 설치하고 확인합니다.", "src": "03-01-02 영상편집 필수 오픈소스 3대장 소개"}, "ai-13": {"ex": "RIFE(프레임 보간)는 앞뒤 프레임으로 중간 장면을 추정합니다. 영상을 느리게 재생할 때 움직임이 끊겨 보이는 현상을 줄이는 데 사용합니다.", "src": "03-02-01 영상 퀄리티를 한층 높여주는 오픈소스"}, "ai-14": {"ex": "이미지 투 비디오는 시작 이미지의 구도와 피사체를 바탕으로 움직임을 더하는 방식입니다.", "src": "03-02-04 Higgsfield로 동영상 생성하는 법"}, "ai-15": {"ex": "크레딧: 일부 생성 서비스에서 사용하는 이용 단위입니다. Claude 사용량과 이미지, 영상, 음성 서비스의 이용료는 따로 확인합니다.", "src": "02-02-04 컨텍스트부터 CLI, 서브에이전트까지"}};

function domEdge(show){

function ensureCtx(id, force){

async function init(){
  let d0 = "학습 단어장"; try { d0 = localStorage.getItem(DOMKEY) || "학습 단어장"; } catch(e) {}
  setDomain(d0);
  render();
  const c = window.claude;
  if (!c?.use) { mode = "local"; loadLocal(); loadCtxLocal(); ctxReady = true; sampleChecked = true; render(); return; }
  c.use("sample").then(s => { sample = s; sampleChecked = true; render(); }).catch(() => { sampleChecked = true; render(); });
  db = await c.use("db").catch(() => null);
  if (!db) { mode = "local"; loadLocal(); loadCtxLocal(); ctxReady = true; render(); return; }
  db.doc("vo.data/main").onSnapshot(s => {
    const v = s.exists ? s.data() : null;
    if (!v || !Array.isArray(v.terms) || !v.terms.length) return;
    DATA = { terms: v.terms, pairs: Array.isArray(v.pairs) ? v.pairs : DATA.pairs };
    FOREIGN = Array.isArray(v.foreign) ? v.foreign : FOREIGN;
    rebuild();
    render();
  }, () => {});
  db.doc("vo.data/palace").onSnapshot(s => { const v = s.exists ? s.data() : null; if (v && Array.isArray(v.palaces)) { PAL = v; if (view() === "palace") render(); } }, () => {});
  db.collection("cmd").onSnapshot(q => {   // 발음매개 cmd — 맥 Brainy 가 적은 초안(drafts)·상태
    MN_CMDS = q.docs.map(d => ({ id: d.id, ...d.data() })).filter(c => c.from === "vocab").sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
    if (S.detail || view() === "list") render();
  }, () => {});
  db.doc("vo.marks/add").onSnapshot(s => { const v = s.exists ? s.data() : null; if (v) { ADD = readAdd(v); rebuild(); render(); } }, () => {});
  db.doc("vo.data/lec").onSnapshot(s => { const v = s.exists ? s.data() : null; if (v && Array.isArray(v.courses)) { LEC = v; lsPut("vo.lec", v); if (view() === "lec") render(); } }, () => {});
  db.doc("vo.marks/lec").onSnapshot(s => { const v = s.exists ? s.data() : null; if (v) { LM = { ...v, ok: v.ok || {}, fav: v.fav || {}, pk: v.pk || {} }; lsPut("vo.lecm", LM); if (view() === "lec") render(); } }, () => {});
  db.collection("ctx").onSnapshot(snap => {
    const m = {}; snap.docs.forEach(d => { if (d.exists) m[d.id] = d.data(); });
    CTX = { ...m, ...Object.fromEntries(Object.entries(CTX).filter(([k]) => !m[k])) };
    if (!snap.metadata.fromCache) ctxReady = true;
    render();
  }, () => { loadCtxLocal(); ctxReady = true; render(); });
  const timer = setTimeout(() => { if (mode === "loading") { note = "기록을 아직 불러오지 못했어요. 연결을 확인해 주세요."; render(); } }, 10000);
  db.collection("progress").onSnapshot(snap => {
    const m = {}; snap.docs.forEach(d => { if (d.exists) m[d.id] = d.data(); });
    prog = m; mode = "db";
    if (!snap.metadata.fromCache) { clearTimeout(timer); if (note.startsWith("기록을 아직")) note = ""; }
    render();
  }, err => { clearTimeout(timer); mode = "local"; loadLocal(); note = "기록 저장소에 연결하지 못해 이 기기에만 저장해요."; render(); });
}
/* ───────── 10분 복습 (간격 반복) — build.py 가 단어장 스크립트 끝(init 앞)에 끼운다 ─────────
   떠올리기 먼저 → 뒤집기 → 몰랐음 / 헷갈림 / 알았음. 간격은 /memory-check 와 같다 (단계 0:1일 1:3일 2:7일 3:14일 4:30일 5:60일).
   기록은 progress/<id>.srs = {box, due, first, last, n, lapses, log:[{at,r}], pending:[{at,r}]}
   - 영어 단어의 pending 은 맥 동기화가 볼트 「영어 단어장」 표(단계·다음 복습·기록 ✓△✗)에 넣고 비운다.
   단계 시험 (2026-11-13 동욱, 매일 복습·단계별 승급 시험 같은 기준): ① 낯섦 → 뜻 보고 단어 맞히기 → ② 만남
   → 맥락(상황) 보고 단어 맞히기 → ③ 소화 → 그 단어로 명령 쓰기(Claude 채점) → ④ 실행. ④는 알아보기/꺼내기 복습만.
   맥에서 실제 작업에 쓴 게 잡혀도 ④ (vocab_use.py). 단계는 내려가지 않는다. ③→④는 단계별 탭에서 여러 개를 골라 한 번에 채점받는다. */
const RV_GAP = [1, 3, 7, 14, 30, 60];
const RV_NEW = 5, RV_MAX = 40;
const RV = { queue: null, i: 0, flipped: false, again: new Set(), stats: { ok: 0, mid: 0, bad: 0 }, dom: null, day: null, drafts: {}, res: null, busy: false, err: "" };
/* 위키 개념 먼저, 그 안에서는 최근에 생기거나 고쳐진 것 먼저 (2026-11-12 동욱).
   wiki(위키 페이지가 있는 개념)·at(위키 날짜, 없으면 단어장에 처음 들어온 날)은 볼트가 붙여 보낸다. */
const isConcept = t => !!(t && t.wiki);
const conceptFirst = (a, b) => isConcept(b) - isConcept(a);
const newerFirst = (a, b) => String(b.at || "").localeCompare(String(a.at || ""));
const isFresh = t => !!(t && t.at && t.at >= kday(-14));
const rvStep = id => lv(id) >= 4 ? 0 : lv(id);   // 1 뜻 보고 맞히기 · 2 맥락 보고 맞히기 · 3 명령 쓰기 · 0 ④ 복습만
const kday = (off = 0) => { const d = new Date(Date.now() + 9 * 3600e3 + off * 86400e3); return d.toISOString().slice(0, 10); };
const vaultSrs = t => (t.stage !== undefined && t.stage !== "" && t.due) ? { box: Math.max(0, Math.min(5, parseInt(t.stage, 10) || 0)), due: t.due } : null;
const srsOf = id => prog[id]?.srs || vaultSrs(BYID[id] || {}) || null;
const isNewCard = id => !srsOf(id);
const firstToday = () => TERMS.filter(t => prog[t.id]?.srs?.first === kday()).length;

function rvBuild(){
  const today = kday();
  const due = TERMS.filter(t => { const s = srsOf(t.id); return s && s.due <= today; })
    .sort((a, b) => conceptFirst(a, b) || srsOf(a.id).due.localeCompare(srsOf(b.id).due) || srsOf(a.id).box - srsOf(b.id).box).slice(0, RV_MAX);
  const room = Math.max(0, RV_NEW - firstToday());
  const fresh = rvFresh().slice(0, room);
  RV.queue = due.map(t => t.id).concat(fresh.map(t => t.id));
  RV.i = 0; RV.flipped = false; RV.again = new Set(); RV.stats = { ok: 0, mid: 0, bad: 0 }; RV.dom = S.domain; RV.day = today; RV.res = null; RV.err = "";
}
function rvFresh(){ return TERMS.filter(t => isNewCard(t.id)).sort((a, b) => conceptFirst(a, b) || newerFirst(a, b) || (isCore(b.id) - isCore(a.id)) || 0); }
/* 방향: 새 단어는 용어→뜻(알아보기), 한 번 넘긴 단어는 장면→용어(꺼내기)와 번갈아 */
function rvDir(t){
  const s = srsOf(t.id), c = CTX[t.id];
  if (!s || !c?.scene) return "recog";
  return ((s.box || 0) + hash(t.id + kday())) % 2 ? "recall" : "recog";
}
function rvNext(box){ return RV_GAP[Math.min(5, Math.max(0, box))]; }
function rvPreview(t){
  const s = srsOf(t.id) || { box: -1 };
  const ok = Math.min(5, (s.box ?? -1) + 1), mid = Math.max(0, s.box ?? 0);
  return { bad: "내일", mid: (Math.max(1, Math.floor(rvNext(mid) / 2))) + "일 뒤", ok: rvNext(ok) + "일 뒤" };
}
function rvGrade(r){
  const id = RV.queue[RV.i], t = BYID[id]; if (!t) return;
  const now = nowIso(), today = kday();
  const s0 = srsOf(id) || { box: -1 };
  const s = { box: s0.box ?? -1, n: 0, lapses: 0, log: [], pending: [], ...(prog[id]?.srs || {}) };
  if (s.box < 0) s.box = 0;
  if (!s.first) s.first = today;
  if (r === "ok") { s.box = Math.min(5, (s0.box ?? -1) + 1); s.due = kday(rvNext(s.box)); RV.stats.ok++; }
  else if (r === "mid") { s.box = Math.max(0, s0.box ?? 0); s.due = kday(Math.max(1, Math.floor(rvNext(s.box) / 2))); RV.stats.mid++; }
  else { s.box = 0; s.due = kday(1); s.lapses = (s.lapses || 0) + 1; RV.stats.bad++; if (!RV.again.has(id)) { RV.again.add(id); RV.queue.splice(Math.min(RV.queue.length, RV.i + 4), 0, id); } }
  s.n = (s.n || 0) + 1; s.last = now;
  s.log = [...(s.log || []), { at: now, r }].slice(-30);
  if (t.cat === "영어 단어") s.pending = [...(s.pending || []), { at: now, r, box: s.box, due: s.due }];
  const patch = { srs: s, lastSeen: now, seen: (prog[id]?.seen || 0) + 1 };
  const step = rvStep(id);
  let how = r === "ok" ? "복습: 떠올림" : r === "mid" ? "복습: 헷갈림" : "복습: 몰랐음";
  if (r === "ok") {
    patch.fuzzy = false;   // 단계는 시험으로만 오른다
    if (step === 1) { patch.level = 2; how = "시험 통과: 뜻 보고 맞힘"; }

  return `<div id="pickbar"><span><b class="mono">${ids.length}</b>개 고름 <span class="small muted">${[1, 2, 3, 4].filter(L => n[L - 1]).map(L => LV[L] + " " + n[L - 1]).join(" · ")}</span></span>

    <p class="small muted">${L < 4 ? `승급 시험: <b>${STAGE_TEST[L]}</b> — 통과한 단어는 바로 ${ro(pill(L + 1).replace(/<[^>]*>/g, "").trim())} 올라가요. 체크해서 고르면 밑 바에서 고른 것만 바로 시험해요.` : "명령 시험까지 통과했거나 실제 작업에 쓴 단어예요. 복습으로 잊지 않게 이어 가요."}</p>
    ${list.length ? pickList(list) : `<p class="empty">${L === 1 ? "이 단어장엔 아직 단어가 없어요." : "이 단계에 있는 단어가 없어요."}</p>`}
  </section>`;

/* ③→④ 한 번에 명령 시험 */

      <p class="small muted">${rich(t.def)}</p>${ctxOk(id) ? `<p class="small"><span class="muted">이럴 때</span> · ${esc(CTX[id].scene)}</p>` : ""}
      ${r?.pass ? `<p class="small">내 ${fg ? "문장" : "명령"} · ${esc(B.drafts[id] || "")}</p>` : `<textarea class="bt-in" data-bid="${id}" placeholder="${fg ? "이 단어를 넣은 영어 한 문장" : "이 단어를 넣어 Claude에게 시키거나 실제로 할 말 한 문장"}">${esc(B.drafts[id] || "")}</textarea>`}
      ${r && !r.self ? `${r.good ? `<p class="small"><span class="muted">잘한 점</span> · ${esc(r.good)}</p>` : ""}${r.fix ? `<p class="small"><span class="muted">${r.pass ? "더하면 좋은 점" : "고칠 점"}</span> · ${esc(r.fix)}</p>` : ""}${r.example ? `<p class="small"><span class="muted">이렇게 써요</span> · ${esc(r.example)}</p>` : ""}` : ""}
      ${B.self && !r?.pass && (B.drafts[id] || "").trim() ? `<div class="btns"><button class="btn" data-bself="${id}" data-ok="0">아직</button><button class="btn primary" data-bself="${id}" data-ok="1">뜻에 맞게 썼어요 → ④</button></div>` : ""}
    </div>`; }).join("");
  h += `</section>${B.err ? `<p class="note">${esc(B.err)}</p>` : ""}
    <div class="btns">${done ? `<span class="small" style="align-self:center">${B.ids.length}개 중 <b>${up}개</b>가 ${ro(LV[4])} 올라갔어요</span>` : ""}
      ${B.ids.some(id => !B.res[id]?.pass) ? (B.self ? "" : `<button class="btn primary" data-batchcheck="1" ${B.busy ? "disabled" : ""}>${B.busy ? "Claude가 한 번에 채점하는 중…" : sample ? "한 번에 채점받기" : "예시와 직접 비교하기"}</button>`) : `<button class="btn primary" data-batchend="1">단계별로 돌아가기</button>`}</div>`;

function batchPrompt(items){
  return `너는 단어를 가르치는 코치다. 학습자(동욱 — 이벤트랩 행사 영상·흑염소 진액 사업을 하고 일은 Claude에게 말로 맡긴다)가 단어마다 그 단어를 넣어 문장을 하나씩 썼다. 영어 단어면 실제로 할 영어 문장이고, 그 밖에는 자기 일·생활에서 Claude에게 내리거나 실제로 할 명령·말이다. 단어마다 적힌 분야와 정의를 기준으로 하나씩 판정하라.

판정 기준:
- 단어를 뜻에 맞게 썼고, 받는 쪽이 무엇을 할지 알 수 있는 명령(영어는 말이 되는 문장)이면 통과.
- 단어가 여러 개(· 또는 /로 묶임)면 하나 이상을 맞게 쓰면 통과.
- 단어를 틀린 뜻으로 썼거나, 단어가 없거나, 명령·문장이 아니면 불통과.

${items.map((x, k) => `[${k + 1}] id: ${x.id}
단어: ${x.term}
정의: ${x.def.replace(/`/g, "")}
분야: ${x.cat}
학습자: ${x.txt}`).join("\n\n")}

JSON 하나만 답하라. results 는 위 순서 그대로, 한국어 존댓말로 짧게:
{"results": [{"id": "위 id 그대로", "pass": true 또는 false, "good": "잘한 점 한 문장", "fix": "고칠 점 한 문장, 없으면 빈 문자열", "example": "더 좋은 명령(영어면 예문) 한 문장"}]}`;
}
function batchPass(id, by){
  const B = S.batch, now = nowIso();
  save(id, { level: 4, fuzzy: false, cmd: { text: (B.drafts[id] || "").trim(), at: now, by } }, "명령 시험 통과 (" + by + ")");
}
async function batchCheck(){
  const B = S.batch; if (B.busy) return;
  const todo = B.ids.filter(id => !B.res[id]?.pass && BYID[id]);
  const items = todo.filter(id => (B.drafts[id] || "").trim().length >= 6).map(id => ({ id, term: BYID[id].term, def: BYID[id].def, cat: fieldLabel(BYID[id]), txt: B.drafts[id].trim() }));
  if (!items.length) { B.err = "단어마다 명령을 한 문장씩 써 주세요."; render(); return; }
  B.err = items.length < todo.length ? `안 쓴 단어 ${todo.length - items.length}개는 빼고 채점해요.` : "";
  if (!sample) { B.self = true; render(); return; }
  B.busy = true; render();
  try {
    const r = await sample.json(batchPrompt(items), { modelTier: "quick", cache: false });
    (Array.isArray(r?.results) ? r.results : []).forEach((x, k) => {
      const id = items.some(it => it.id === x?.id) ? x.id : items[k]?.id; if (!id) return;
      B.res[id] = { pass: !!x.pass, good: String(x.good || ""), fix: String(x.fix || ""), example: String(x.example || "") };
      if (x.pass) batchPass(id, "Claude 확인");
    });
  } catch (e) {
    if (["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(e?.code)) { sample = null; sampleChecked = true; B.self = true; }
    else B.err = e?.code === "rate_limited" ? "요청이 많아요. 잠시 뒤 다시 눌러 주세요." : "채점하지 못했어요. 다시 눌러 주세요.";
  }
  B.busy = false; render();
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-stage],[data-stagetest],[data-pickall],[data-pickclear],[data-picktest],[data-pickup],[data-up],[data-batchend],[data-batchcheck],[data-bself]"); if (!b) return;
  const d = b.dataset;
  if (d.up) { const L = lv(d.up); if (L < 4) save(d.up, { level: L + 1, fuzzy: false }, "바로 올림 (시험 없이)"); return; }
  if (d.pickup) { const ids = [...S.pick].filter(id => BYID[id] && lv(id) < 4); S.pick = new Set(); ids.forEach(id => save(id, { level: lv(id) + 1, fuzzy: false }, "바로 올림 (시험 없이)")); render(); return; }
  if (d.stage) { S.stage = +d.stage; S.batch = null; render(); return; }
  if (d.stagetest) { const L = +d.stagetest; stageStart(stagePool(L).slice(0, STAGE_MAX).map(t => t.id), L); return; }
  if (d.pickall) { d.pickall.split(",").filter(Boolean).forEach(id => { if (S.pick.size < PICK_MAX) S.pick.add(id); }); if (d.thentest) { pickTest(); return; } render(); return; }
  if (d.pickclear) { S.pick = new Set(); render(); return; }
  if (d.picktest) { pickTest(); return; }
  if (d.batchend) { S.batch = null; S.pick = new Set(); render(); return; }
  if (d.batchcheck) { batchCheck(); return; }
  if (d.bself) { const id = d.bself; if (d.ok === "1") { S.batch.res[id] = { pass: true, self: true }; batchPass(id, "직접 비교"); } else { S.batch.res[id] = { pass: false, self: true }; render(); } }
});
document.addEventListener("change", e => { const id = e.target?.dataset?.pickid; if (!id) return; if (e.target.checked && S.pick.size < PICK_MAX) S.pick.add(id); else S.pick.delete(id); e.target.checked = S.pick.has(id); paintPickBar(); });
function paintPickBar(){ const old = document.getElementById("pickbar"); const h = pickBar(); if (old) old.outerHTML = h || ""; else if (h) document.body.insertAdjacentHTML("beforeend", h); }

/* ── 강의 · 분야 — 강의(챕터)별 / 학습 분야별 용어, 거기서 바로 익히기, 용어를 누르면 맥락 (build.py 가 끼움) ──
   데이터: 볼트 `4_Outputs/체화 단어장/강의 용어.json` → 맥 동기화(app_data.py) → vo.data/lec  (용어마다 f = 학습 분야)
           + 용어 사전(vo.data/main)의 영상 편집 용어는 그 분류(cat)로 분야에 함께 나온다
   표시(고른 과정·강의·분야, ✓ 외웠어, ★): vo.marks/lec — 모든 기기에서 같다
   맥락(장면·쉽게·정확히·모르면·Claude에게): 누르면 맥의 Brainy가 만들어 ctx/lt-<번호> 에 둔다 (사전 용어는 기존 ctx/<id>) */
function lsGet(k, d){ try { return JSON.parse(localStorage.getItem(k) || "null") || d; } catch (e) { return d; } }
function lsPut(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
let LEC = lsGet("vo.lec", { courses: [] });
let LM = lsGet("vo.lecm", {});
LM.ok = LM.ok || {}; LM.fav = LM.fav || {}; LM.pk = LM.pk || {};
let lecFilt = "all", LSTUDY = null, LDET = null;   // LSTUDY: 바로 익히기 {list,i,flip,again,ok,title} · LDET: 맥락 보는 용어
function lmSave(){ lsPut("vo.lecm", LM); if (db) db.doc("vo.marks/lec").set({ ...LM, updatedAt: nowIso() }).catch(() => {}); }
const lecKey = t => "t|" + String(t.t).toLowerCase().replace(/\s+/g, "");
const lecList = () => (LEC.courses || []).filter(c => c.chapters.some(ch => (ch.terms || []).length));
const lecCur = () => { const L = lecList(); return L.find(c => c.id === LM.cur) || L[0] || null; };
const lecChs = c => c.chapters.filter(ch => (ch.terms || []).length);
const lecKeep = t => lecFilt === "all" || (lecFilt === "todo" ? !LM.ok[lecKey(t)] : lecFilt === "ok" ? !!LM.ok[lecKey(t)] : !!LM.fav[lecKey(t)]);
const FIELDS = [["영상 편집", ["편집·구성", "촬영", "오디오", "색", "자막", "모션"]],
  ["AI·일", ["AI·Claude 활용", "자동화·에이전트", "터미널·개발 환경", "지식관리·PKM", "비즈니스·기획", "콘텐츠·마케팅", "디자인·이미지"]]];
const CAT2F = { "AI 편집 자동화": "AI·Claude 활용" };

// 모든 용어 (강의 + 용어 사전) — 같은 용어는 한 번, 강의에서 처음 나온 곳을 출처로
let _allLec = null, _allAll = null, _all = [], _byKey = {};
function allTerms(){
  if (_allLec === LEC && _allAll === ALL) return _all;   // 데이터가 새로 오면(새 객체) 다시 만든다
  const out = [], by = {}, refd = new Set();
  (LEC.courses || []).forEach(c => c.chapters.forEach(ch => (ch.terms || []).forEach(t => {
    const k = lecKey(t); if (by[k]) return;
    const o = { ...t, src: `${c.tag ? c.tag + " · " : ""}${ch.title}`, cid: c.id, chid: ch.id };
    by[k] = o; out.push(o); if (t.ref) refd.add(t.ref);
  })));
  ALL.filter(x => x.dom !== "외국어 단어장" && !refd.has(x.id)).forEach(x => {
    const o = { t: x.term, d: String(x.def || "").replace(/`/g, ""), ref: x.id, f: CAT2F[x.cat] || x.cat, src: "용어 사전 · " + x.cat };
    const k = lecKey(o); if (by[k]) return; by[k] = o; out.push(o);
  });
  _allLec = LEC; _allAll = ALL; _all = out; _byKey = by; return out;
}
const termOf = k => (allTerms(), _byKey[k]);
const fieldOf = t => t.f || (t.ref && BYID[t.ref] ? (CAT2F[BYID[t.ref].cat] || BYID[t.ref].cat) : "");

function lecRow(t){
  const k = lecKey(t), ok = !!LM.ok[k], fv = !!LM.fav[k], c = lecCtxOf(t);
  return `<div class="lt${ok ? " ok" : ""}"><button class="lt-m" data-lterm="${esc(k)}"><span class="lt-h"><b>${esc(t.t)}</b>${t.en ? `<small>${esc(t.en)}</small>` : ""}${t.ref && BYID[t.ref] ? " " + pill(lv(t.ref)) : ""}</span>
    <span class="lt-d">${esc(t.d)}</span>${t.ex ? `<span class="lt-ex">${esc(t.ex)}</span>` : ""}<span class="lt-go">${c ? "맥락 보기 →" : "눌러서 맥락 만들기 →"}</span></button>
    <div class="lt-mk"><button class="mk ok" data-lok="${esc(k)}" aria-pressed="${ok}" title="외웠어" aria-label="${esc(t.t)} 외웠어">✓</button><button class="mk fav" data-lfav="${esc(k)}" aria-pressed="${fv}" title="즐겨찾기" aria-label="${esc(t.t)} 즐겨찾기">★</button></div></div>`;
}
function filtChips(base){
  const n = { all: base.length, todo: base.filter(t => !LM.ok[lecKey(t)]).length, ok: base.filter(t => LM.ok[lecKey(t)]).length, fav: base.filter(t => LM.fav[lecKey(t)]).length };
  return `<div class="chips" style="margin:2px 0 12px">${[["all", "전체"], ["todo", "아직"], ["ok", "✓ 외운 것"], ["fav", "★"]].map(([k, l]) =>
    `<button class="chip${lecFilt === k ? " on" : ""}" data-lfilt="${k}">${l} <span>${n[k]}</span></button>`).join("")}</div>`;
}
function studyBtn(list, title){
  const todo = list.filter(t => !LM.ok[lecKey(t)]).length;
  return `<button class="btn primary lc-study" data-lstudy="${esc(title)}">▶ 바로 익히기 · ${todo || list.length}개</button>`;

/* ── 강의 탭 ── */
function renderLec(){
  if (LDET) return renderTermCtx();
  if (LSTUDY) return renderStudy();
  const L = lecList();
  if (!L.length) return `<section class="card"><p class="empty">강의 용어를 불러오는 중… 맥이 켜져 있으면 몇 초 안에 떠요.</p></section>`;
  const c = lecCur(), chs = lecChs(c), sel = chs.find(ch => ch.id === LM.pk[c.id]);
  const base = sel ? sel.terms : chs.flatMap(ch => ch.terms);
  let h = `<div class="chips lc-pick">${L.map(x => { const tn = lecChs(x).reduce((a, ch) => a + ch.terms.length, 0);
    return `<button class="chip${x.id === c.id ? " on" : ""}" data-lcourse="${esc(x.id)}">${x.tag ? `<b>${esc(x.tag)}</b> ` : ""}${esc(x.name)} <span>${tn}</span></button>`; }).join("")}</div>`;
  h += `<div class="lc-sel"><label for="lc-sel">강의</label><select id="lc-sel" data-lsel="1"><option value="">전체 강의 — 순서대로 다 보기</option>${chs.map(ch => {
    const k = ch.terms.filter(t => LM.ok[lecKey(t)]).length;
    return `<option value="${esc(ch.id)}"${sel === ch ? " selected" : ""}>${k === ch.terms.length ? "✓ " : ""}${esc(ch.title)} (${ch.terms.length})</option>`; }).join("")}</select></div>`;
  h += filtChips(base);
  if (sel) {
    const i = chs.indexOf(sel), rows = sel.terms.filter(lecKeep);
    h += `<section class="card lc-card"><div class="meta"><span class="tc">${esc(sel.part || "")}</span>${studyBtn(sel.terms, sel.title)}</div><h3>${esc(sel.title)}</h3>
      ${rows.length ? rows.map(lecRow).join("") : `<p class="empty">여기엔 없어요.</p>`}</section>
      <div class="lc-nav">${i > 0 ? `<button class="btn ghost" data-lpick="${esc(chs[i - 1].id)}">◀ 이전 강의</button>` : "<span></span>"}
      ${i < chs.length - 1 ? `<button class="btn ghost" data-lpick="${esc(chs[i + 1].id)}">다음 강의 ▶</button>` : "<span></span>"}</div>`;
    return h;
  }
  h += `<div class="btns" style="margin:0 0 12px">${studyBtn(base, c.name)}</div>`;
  let part = null;
  chs.forEach(ch => {
    const rows = ch.terms.filter(lecKeep); if (!rows.length) return;
    if (ch.part !== part) { part = ch.part; h += `<p class="lc-part">${esc(part || "")}</p>`; }
    h += `<section class="card lc-card"><button class="lc-h" data-lpick="${esc(ch.id)}"><h3>${esc(ch.title)}</h3><span class="muted">${rows.length} →</span></button>${rows.map(lecRow).join("")}</section>`;
  });
  return h;
}

/* ── 분야 탭 ── */
function renderField(){
  if (LDET) return renderTermCtx();
  if (LSTUDY) return renderStudy();
  const all = allTerms(), cnt = {};
  all.forEach(t => { const f = fieldOf(t); if (f) cnt[f] = (cnt[f] || 0) + 1; });
  const cur = LM.field && cnt[LM.field] ? LM.field : (FIELDS.flatMap(g => g[1]).find(f => cnt[f]) || "");
  let h = FIELDS.map(([g, fs]) => { const xs = fs.filter(f => cnt[f]); return xs.length ? `<p class="lc-part" style="margin:8px 2px 6px">${esc(g)}</p><div class="chips lc-pick">${xs.map(f =>
    `<button class="chip${f === cur ? " on" : ""}" data-lfield="${esc(f)}">${esc(f)} <span>${cnt[f]}</span></button>`).join("")}</div>` : ""; }).join("");
  if (!cur) return h + `<section class="card"><p class="empty">분야를 불러오는 중… 맥이 켜져 있으면 몇 초 안에 떠요.</p></section>`;
  const base = all.filter(t => fieldOf(t) === cur), rows = base.filter(lecKeep);
  h += filtChips(base);
  h += `<section class="card lc-card"><div class="meta"><h3 style="margin:0">${esc(cur)}</h3>${studyBtn(base, cur)}</div>
    ${rows.length ? rows.map(t => lecRow(t).replace('<span class="lt-go">', `<span class="lt-src">${esc(t.src || "")}</span><span class="lt-go">`)).join("") : `<p class="empty">여기엔 없어요.</p>`}</section>`;
  return h;
}

/* ── 바로 익히기: 용어 → 뒤집기 → 알았어 ✓ / 다시 볼래 ── */
function startStudy(list, title){
  const todo = list.filter(t => !LM.ok[lecKey(t)]);
  const pick = (todo.length ? todo : list).slice().sort((a, b) => hash(lecKey(a) + kday()) - hash(lecKey(b) + kday())).slice(0, 15);
  LSTUDY = { list: pick, i: 0, flip: false, again: new Set(), ok: 0, title }; LDET = null; render(); window.scrollTo({ top: 0, behavior: "instant" });
}
function renderStudy(){
  const s = LSTUDY, t = s.list[s.i];
  if (!t) return `<section class="card stack"><h3>다 봤어요 · ${esc(s.title)}</h3><p class="muted">알았어 ✓ ${s.ok}개 · 다시 본 것 ${s.again.size}개</p>
    <div class="btns"><button class="btn" data-lstudyend="1">목록으로</button><button class="btn primary" data-lstudyagain="1">한 번 더</button></div></section>`;
  let h = `<div class="meta" style="margin:4px 2px 8px"><span class="tc">${esc(s.title)} · ${s.i + 1}/${s.list.length}</span><button class="btn ghost" data-lstudyend="1" style="padding:6px 12px">그만</button></div>
    <div class="lc-bar"><i style="width:${Math.round(s.i / s.list.length * 100)}%"></i></div>`;
  h += `<section class="card stack lc-flash" data-lflip="1"><span class="tc">${esc(t.src || "")}</span><h3 style="font-size:26px;margin:6px 0">${esc(t.t)}</h3>${t.en ? `<p class="muted">${esc(t.en)}</p>` : ""}`;
  if (!s.flip) return h + `<p class="muted small">뜻을 떠올린 뒤 눌러서 뒤집어요.</p></section>`;
  const c = lecCtxOf(t);
  h += `<div class="scene"><span class="lbl">뜻</span>${esc(t.d)}</div>${t.ex ? `<p class="small">${esc(t.ex)}</p>` : ""}
    ${c && c.easy ? `<p class="small muted"><b>쉽게 말하면</b> · ${esc(c.easy)}</p>` : ""}
    <button class="btn ghost" data-lterm="${esc(lecKey(t))}" style="align-self:flex-start;padding:6px 12px">맥락 자세히 →</button></section>
    <div class="btns lc-gr"><button class="btn" data-lgrade="again">다시 볼래</button><button class="btn primary" data-lgrade="ok">알았어 ✓</button></div>`;
  return h;
}
function lecGrade(r){
  const s = LSTUDY, t = s.list[s.i]; if (!t) return;
  const k = lecKey(t);
  if (r === "ok") { s.ok++; LM.ok[k] = 1; lmSave(); if (t.ref && BYID[t.ref] && lv(t.ref) < 2) save(t.ref, { level: 2, fuzzy: false, lastSeen: nowIso() }, "강의·분야 익히기: 알았음"); }
  else if (!s.again.has(k)) { s.again.add(k); s.list.splice(Math.min(s.list.length, s.i + 4), 0, t); }
  s.i++; s.flip = false; render();
}

/* ── 용어 맥락: 장면 · 쉽게 · 정확히 · 모르면 · Claude에게 — 없으면 맥의 Brainy가 만든다 ── */
const lecCtxId = t => (t.ref && BYID[t.ref] && ctxOk(t.ref)) ? t.ref : "lt-" + hash(lecKey(t)).toString(36);
const lecCtxOf = t => { const id = lecCtxId(t), c = CTX[id]; return c && c.scene ? c : null; };
const lecBusy = new Set(), lecErr = {};
function lecCtxPrompt(t){
  return `동욱이 강의에서 배운 용어를 정확히 이해하도록 돕는 카드를 만든다. 동욱은 행사·부스 영상 일을 하고, Claude Code·옵시디언으로 자기 일을 자동화하는 중이다.
용어: ${t.t}${t.en ? ` (${t.en})` : ""}
강의에서 준 뜻: ${t.d}${t.ex ? `\n강의 속 쓰임: ${t.ex}` : ""}
나온 곳: ${t.src || ""}

규칙: 한국어 해요체. 중학생도 알아듣게. 강의 뜻과 어긋나지 않게, 확실하지 않은 수치는 쓰지 않는다.
JSON 하나만 출력: {"scene": "동욱 일 속 이 용어가 필요한 한 순간 — 용어 이름은 넣지 말고 '이걸 뭐라고 하죠?'로 끝 (60자 안팎)", "easy": "일상 비유 한 문장", "exact": "정확한 정의 2~3문장 — 무엇이고, 비슷한 것과 무엇이 다른지", "why": "모르면 생기는 일 한 문장", "ask": "Claude에게 이 용어를 넣어 맡길 짧은 요청 한 문장"}`;
}
function ensureLecCtx(t, force){
  const id = lecCtxId(t);
  if (!sample || lecBusy.has(id) || (!force && (lecCtxOf(t) || lecErr[id]))) return;
  lecBusy.add(id); delete lecErr[id];
  sample.json(lecCtxPrompt(t), { cache: false }).then(r => {
    const c = { v: CTXV, scene: String(r?.scene || ""), easy: String(r?.easy || ""), exact: String(r?.exact || ""), why: String(r?.why || ""), ask: String(r?.ask || ""), term: t.t, at: nowIso(), by: "lec" };
    if (!c.scene && !c.exact) throw { code: "empty" };
    CTX = { ...CTX, [id]: c };
    if (mode === "db" && db) db.doc("ctx/" + id).set(c).catch(() => {});
  }).catch(e => {
    if (["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(e?.code)) { sample = null; sampleChecked = true; }
    else lecErr[id] = e?.code === "rate_limited" ? "요청이 많아 아직 못 만들었어요." : "맥락을 만들지 못했어요 — 맥이 켜져 있는지 봐 주세요.";
  }).then(() => { lecBusy.delete(id); render(); });
}
function renderTermCtx(){
  const t = termOf(LDET); if (!t) { LDET = null; return ""; }
  const id = lecCtxId(t), c = lecCtxOf(t), k = lecKey(t), ok = !!LM.ok[k], fv = !!LM.fav[k];
  if (!c) ensureLecCtx(t);
  const row = (lbl, v) => v ? `<div class="ly"><span class="lbl">${lbl}</span>${esc(v)}</div>` : "";
  let h = `<button class="btn ghost" data-lback="1" style="margin:4px 0 10px;padding:6px 12px">← ${LSTUDY ? "익히기로" : "목록으로"}</button>
    <section class="card stack"><div class="meta"><span class="tc">${esc(t.src || "")}</span>${t.ref && BYID[t.ref] ? pill(lv(t.ref)) : ""}</div>
    <h3 style="font-size:24px;margin:2px 0">${esc(t.t)}</h3>${t.en ? `<p class="muted" style="margin:0">${esc(t.en)}</p>` : ""}
    <div class="scene"><span class="lbl">강의에서 뜻</span>${esc(t.d)}</div>${t.ex ? `<p class="small">${esc(t.ex)}</p>` : ""}`;
  if (c) h += `${c.scene ? `<div class="scene"><span class="lbl">이런 순간</span>${esc(c.scene)}</div>` : ""}<div class="layers">${row("정확히", c.exact)}${row("쉽게 말하면", c.easy)}${row("모르면", c.why)}${row("Claude에게 이렇게", c.ask)}</div>
    ${sample ? `<button class="btn ghost" data-lregen="${esc(k)}" style="align-self:flex-start;padding:6px 12px"${lecBusy.has(id) ? " disabled" : ""}>${lecBusy.has(id) ? "다시 만드는 중…" : "맥락 다시 만들기"}</button>` : ""}`;
  else if (lecBusy.has(id)) h += `<p class="muted">맥의 Brainy가 이 용어의 맥락을 만드는 중… (보통 10~30초)</p>`;
  else if (lecErr[id]) h += `<p class="muted">${esc(lecErr[id])}</p><button class="btn" data-lregen="${esc(k)}">다시 만들기</button>`;
  else if (!sample) h += `<p class="muted">이 화면에서는 맥락을 만들 수 없어요.</p>`;
  h += `<div class="btns"><button class="btn${ok ? " primary" : ""}" data-lok="${esc(k)}">${ok ? "✓ 외웠어" : "외웠어 ✓"}</button><button class="btn${fv ? " primary" : ""}" data-lfav="${esc(k)}">★ ${fv ? "즐겨찾기됨" : "즐겨찾기"}</button>
    ${t.ref && BYID[t.ref] ? `<button class="btn ghost" data-detail="${esc(t.ref)}">단어장에서 보기</button>` : ""}</div></section>`;
  return h;
}

function lecPick(id){ const c = lecCur(); if (!c) return; if (id) LM.pk[c.id] = id; else delete LM.pk[c.id]; lmSave(); render(); window.scrollTo({ top: 0, behavior: "instant" }); }
function lecCurList(){
  if (view() === "field") { const all = allTerms(), cur = LM.field; return all.filter(t => fieldOf(t) === cur || (!cur && false)); }
  const c = lecCur(), chs = lecChs(c), sel = chs.find(ch => ch.id === LM.pk[c.id]);
  return sel ? sel.terms : chs.flatMap(ch => ch.terms);
}
document.addEventListener("change", e => { if (e.target && e.target.dataset && e.target.dataset.lsel) lecPick(e.target.value); });
document.addEventListener("click", e => {
  const b = e.target.closest("[data-lcourse],[data-lok],[data-lfav],[data-lpick],[data-lfilt],[data-lfield],[data-lterm],[data-lback],[data-lregen],[data-lstudy],[data-lstudyend],[data-lstudyagain],[data-lgrade],[data-lflip]"); if (!b) return;
  const d = b.dataset;
  if (d.lcourse) { LM.cur = d.lcourse; lmSave(); render(); return; }
  if (d.lfield) { LM.field = d.lfield; lmSave(); render(); return; }
  if (d.lfilt) { lecFilt = d.lfilt; render(); return; }
  if (d.lpick !== undefined) { lecPick(d.lpick); return; }
  if (d.lterm) { LDET = d.lterm; render(); window.scrollTo({ top: 0, behavior: "instant" }); return; }
  if (d.lback) { LDET = null; render(); return; }
  if (d.lregen) { const t = termOf(d.lregen); if (t) ensureLecCtx(t, true); render(); return; }
  if (d.lstudy !== undefined) { if (view() === "field" && !LM.field) { const f = FIELDS.flatMap(g => g[1]).find(x => allTerms().some(t => fieldOf(t) === x)); LM.field = f; }
    startStudy(lecCurList(), d.lstudy); return; }
  if (d.lstudyend) { LSTUDY = null; render(); return; }
  if (d.lstudyagain) { const s = LSTUDY; startStudy(s.list.filter((t, i, a) => a.indexOf(t) === i), s.title); return; }
  if (d.lgrade) { lecGrade(d.lgrade); return; }
  if (d.lflip) { if (LSTUDY && !LSTUDY.flip) { LSTUDY.flip = true; render(); } return; }
  const m = d.lok ? LM.ok : LM.fav, k = d.lok || d.lfav;
  if (m[k]) delete m[k]; else m[k] = 1;
  lmSave(); render();
});
window.addEventListener("hashchange", () => { LSTUDY = null; LDET = null; });

/* ───────── 발음매개 (2026-11-28 동욱 「내 단어장에서 매개법이 진행될 수 있게 버튼 — 발음 매개법 위주로」) — build.py 가 단어장 스크립트 끝(init 앞)에 끼운다 ─────────
   외국어 단어(분야 이름이 「… 단어」)를 펼치면 「🔤 발음매개 만들기」가 있다.
   1. 누르면 cmd 문서 하나({from: "vocab", kind: "mnemonic", params})를 맥에 보낸다 — 맥의 cmd_runner 가 Claude 를 깨우고,
      Claude 는 볼트 「외국어 암기 안내」 「발음매개 만드는 법」(오리쌤 07강) 순서로 초안을 그 cmd 문서의 drafts 에 적는다 (볼트 .claude/routines/cmd.md).
   2. 동욱이 초안 하나를 「이걸로 넣기」 하거나 고쳐서·직접 써서 넣으면 progress/<id>.mnem.pending = {hook, pic} 만 남긴다.
   3. 맥 동기화(app_data.py 발음매개 되쓰기)가 볼트 「영어 단어장」 표의 소리 고리·그림 칸에 넣고 mnem.done 으로 닫는다 — 정본은 볼트 표.
   단어·매개 글은 코드에 넣지 않는다. */
let MN_CMDS = [];                  // 단어장이 보낸 발음매개 cmd (최근 것 먼저)
const MN = { edit: null, draft: {} };   // edit = 「고쳐서·직접 써서」 칸이 열린 단어 id · draft = 그 칸의 처음 값
const isMnWord = t => !!t && t.dom === "외국어 단어장" && /단어$/.test(t.cat || "");
const mnOpenSt = c => /보내는 중|맥 대기|처리 중/.test(c?.status || "");
const mnCmd = id => MN_CMDS.find(c => c.kind === "mnemonic" && c.params?.id === id) || null;
const SIM = { "상": "p4", "중": "p3", "하": "p1" };
function mnAge(iso){ const m = Math.round((Date.now() - Date.parse(iso || "")) / 60000); return !isFinite(m) ? "" : m < 1 ? "방금" : m < 60 ? m + "분 전" : Math.round(m / 60) + "시간 전"; }

function mnemHtml(t){
  if (!isMnWord(t)) return "";
  const c = mnCmd(t.id), m = prog[t.id]?.mnem || {}, busy = mnOpenSt(c);
  const drafts = c && c.status === "끝" && Array.isArray(c.drafts) ? c.drafts.filter(d => d && d.hook) : [];
  let st = "";
  if (m.pending) st = `<p class="note">고른 매개 「${esc(m.pending.hook)}」를 볼트 단어장 표에 넣는 중이에요 — 맥이 켜져 있으면 몇 초 안에 들어가요.</p>`;
  else if (m.err) st = `<p class="note">${esc(m.err)}</p>`;
  else if (m.done && m.done.hook === t.hook) st = `<p class="small muted">✓ 볼트 표에 넣었어요 · ${esc(String(m.done.at || "").slice(0, 10))}</p>`;
  const cmdLine = !c ? "" : busy ? `<p class="small muted" role="status">맥 Brainy가 초안을 만드는 중이에요 (${mnAge(c.sentAt || c.createdAt)} 보냄). 맥이 꺼져 있으면 켜질 때 만들어요.</p>`
    : c.status === "멈춤" ? `<p class="note">초안을 못 만들었어요 — ${esc(String(c.result || "").split("\n")[0])}</p>`
    : c.status === "못 보냄" ? `<p class="note">${esc(c.result || "못 보냈어요")}</p>`
    : !drafts.length ? `<p class="small muted">${esc(String(c.result || "초안이 없어요").split("\n")[0])}</p>` : "";
  const edit = MN.edit === t.id ? `<div class="mn-ed stack">
      <label class="small muted">소리 고리 (한국어로 들리는 말)<input class="mn-in" id="mnH" maxlength="80" value="${esc(MN.draft.hook || "")}" placeholder="원 발음을 한국어로 들리는 말로"></label>
      <label class="small muted">그림 (매개어와 뜻을 묶은 과장된 장면)<textarea class="mn-in" id="mnP" maxlength="200" rows="2" placeholder="소리 고리와 뜻이 한 장면에 — 크게, 움직이게, 웃기게">${esc(MN.draft.pic || "")}</textarea></label>
      <div class="btns"><button class="btn primary" data-mn="save" data-id="${t.id}">이걸로 볼트에 넣기</button><button class="btn ghost" data-mn="cancel">닫기</button></div></div>` : "";
  return `<div class="mn stack">
    <div class="meta"><span class="lbl" style="margin:0">발음매개</span><span class="small muted">뜻 → 소리 고리 → 그림 → ${esc(t.cat.replace(/ ?단어$/, ""))} 발음</span></div>
    ${t.hook ? "" : `<p class="small muted">아직 매개가 없어요.</p>`}
    ${st}${cmdLine}
    ${drafts.length ? `<div class="mn-dr">${drafts.map((d, k) => `<div class="mn-d">
        <div class="meta"><b class="mn-h">${esc(d.hook)}</b>${d.sim ? `<span class="pill ${SIM[d.sim] || ""}">유사도 ${esc(d.sim)}</span>` : ""}</div>
        ${d.how ? `<p class="small muted">${esc(d.how)}</p>` : ""}
        ${d.pic ? `<p class="small">${esc(d.pic)}</p>` : ""}
        ${d.reps ? `<p class="small muted">반복 · ${esc(d.reps)}</p>` : ""}
        <div class="btns"><button class="btn primary" data-mn="pick" data-id="${t.id}" data-k="${k}" ${m.pending ? "disabled" : ""}>이걸로 넣기</button><button class="btn ghost" data-mn="fix" data-id="${t.id}" data-k="${k}">고쳐서 넣기</button></div>
      </div>`).join("")}</div>` : ""}
    ${edit}
    <div class="btns">
      <button class="btn ${drafts.length || t.hook ? "ghost" : "primary"}" data-mn="ask" data-id="${t.id}" ${busy || mode !== "db" ? "disabled" : ""}>${busy ? "초안 만드는 중…" : drafts.length || t.hook ? "🔤 발음매개 다시 만들기" : "🔤 발음매개 만들기"}</button>
      ${MN.edit === t.id ? "" : `<button class="btn ghost" data-mn="own" data-id="${t.id}">직접 쓰기</button>`}
    </div>
    ${mode !== "db" ? `<p class="small muted">기록 저장소에 연결되면 맥에 보낼 수 있어요.</p>` : ""}
  </div>`;
}

function mnAsk(id){
  const t = BYID[id]; if (!t || !db || mode !== "db" || mnOpenSt(mnCmd(id))) return;
  const cid = "c" + Date.now().toString(36), at = nowIso();
  const data = { text: "🔤 체화 단어장 — 발음매개 초안: " + t.term + " (" + t.def + ")", from: "vocab", app: "vocab", kind: "mnemonic",
    params: { id: t.id, term: t.term, def: t.def, cat: t.cat, hook: t.hook || "", pic: t.pic || "" }, createdAt: at, sentAt: at, status: "보내는 중", result: "" };
  MN_CMDS = [{ id: cid, ...data }, ...MN_CMDS];
  db.doc("cmd/" + cid).set(data).catch(() => { const c = MN_CMDS.find(x => x.id === cid); if (c) { c.status = "못 보냄"; c.result = "못 보냈어요 — 인터넷을 확인하고 다시 눌러 주세요"; } render(); });
  render();
  toast("맥에 보냈어요 — 「" + t.term + "」 발음매개 초안을 만들어요");
}
function mnPut(id, hook, pic, how){
  hook = String(hook || "").trim().slice(0, 80); pic = String(pic || "").trim().slice(0, 200);
  if (!hook) { toast("소리 고리를 적어 주세요"); return false; }
  const cur = prog[id]?.mnem || {};
  save(id, { mnem: { ...cur, pending: { hook, pic, how: how || "", at: nowIso() }, err: null } }, "발음매개 고름");
  toast("「" + hook + "」를 볼트 단어장에 넣어요");
  return true;
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-mn]"); if (!b) return;
  const a = b.dataset.mn, id = b.dataset.id, c = id ? mnCmd(id) : null, d = c?.drafts?.[+b.dataset.k];
  if (a === "ask") { mnAsk(id); return; }
  if (a === "pick" && d) { mnPut(id, d.hook, d.pic, d.how); return; }
  if (a === "fix" || a === "own") { MN.edit = id; MN.draft = a === "fix" && d ? { hook: d.hook, pic: d.pic } : { hook: "", pic: "" }; render(); document.getElementById("mnH")?.focus(); return; }
  if (a === "cancel") { MN.edit = null; document.activeElement?.blur?.(); render(); return; }
  if (a === "save") { const h = document.getElementById("mnH")?.value, p = document.getElementById("mnP")?.value; document.activeElement?.blur?.(); if (mnPut(id, h, p, "동욱이 고침")) { MN.edit = null; render(); } }

const PAL_KEY = "chewha-vocab-palace";

const PL_STAGE = [["1", "궁전 결합", "문장을 면 하나에 장면으로 놓는다"], ["2", "메타반복", "단어·구조를 바꿔 다른 데 써 본다"], ["3", "3단 챌린지", "내용 확인 전 — 오리쌤 강의에서 확인한 뒤 채워요"]];
const faceKey = s => { const m = String(s || "").match(/(\d+)\s*-\s*(\d+)/); return m ? m[1] + "-" + m[2] : ""; };   // 「현장 1-3(접수대)」 · 「1-3-7」(소) → 1-3

}

  const rest = needCh ? `<section class="card pl-rest"><p class="small muted">${p.chapters.length + 1}~${p.chapters.length + needCh}장 · ${goal - built}면 — 아직 궁전 노트에 없어요.</p></section>` : "";

  const legend = `<section class="card stack"><h2>문장 스테이지 (오리쌤)</h2><div class="list">${PL_STAGE.map(([n, nm, how]) => `<div class="row" style="cursor:default"><span class="pill">${n}</span><div class="t"><b>${nm}</b><span style="white-space:normal">${how}</span></div></div>`).join("")}</div>
    <p class="small muted">복습 단계(0~5)는 간격이고, 스테이지(1~3)는 문장 훈련의 진도예요. 색: <span class="pl-k p">문장 있음</span> <span class="pl-k d">오늘 복습</span> <span class="pl-k l">장기 기억</span> <span class="pl-k e">빈 면</span></p></section>`;

  function open() { box.hidden = false; fab.hidden = true; if (HOOK.push !== false) document.documentElement.classList.add("bc-push"); window.dispatchEvent(new Event("resize")); unread = false; lift(); render(); try { localStorage.setItem(KEY + ".open", "1"); } catch (e) {} if (window.matchMedia("(pointer: fine)").matches) setTimeout(function () { try { text.focus(); } catch (e) {} }, 50); }
  function close() { box.hidden = true; fab.hidden = false; document.documentElement.classList.remove("bc-push"); window.dispatchEvent(new Event("resize")); paintFab(); try { localStorage.removeItem(KEY + ".open"); } catch (e) {} }
  /* 앱 안 다른 단추에서 대화를 열 때 — ask 는 바로 보내고, fill 은 입력칸만 채워 둔다(동욱이 고쳐서 ↑ — 강의 실습 「Brainy와 이 칸 하기」) */
  function fill(q) { showHist = false; viewPast = -1; open(); text.value = String(q || ""); text.dispatchEvent(new Event("input")); }
  /* 새 대화 — 지금 대화는 지난 대화로 (↺ · 앱 단추 start) */
  function newChat() { if (ctl) ctl.abort(); archive(); turns = []; showHist = false; try { localStorage.removeItem(SID); } catch (e) {} keep(); render(); }
  /* start: 새 대화로 열고 바로 보낸다 — 지난 대화가 같이 가지 않게 (광고 실습 「▶ Brainy 진행」 · 2026-11-28 동욱 「응, 해」) */
  window.BRAINY_CHAT = { open: open, close: close, ask: function (q) { open(); go(q); }, start: function (q) { newChat(); viewPast = -1; open(); go(q); }, fill: fill, busy: function () { return busy; }, repaint: function () { var el = box.querySelector("#bc-xbar"); if (el && HOOK.bar) el.innerHTML = HOOK.bar(); paintSub(); } };   // repaint: 앱이 받는 사람·엔진을 바꾼 뒤 윗줄·아랫글을 다시 그린다   // busy: 답하는 중이면 go() 가 조용히 넘기므로 앱 단추가 먼저 묻는다 (광고 실습 11-28 검증 중간)
  fab.addEventListener("click", open);
  box.addEventListener("click", function (e) {
    var up = e.target.closest("[data-bc-unpic]");
    if (up) { var k = +up.getAttribute("data-bc-unpic"), drop = pics.splice(k, 1)[0]; if (drop) URL.revokeObjectURL(drop.url); paintPics(); return; }
    var pp = e.target.closest("[data-bc-past]"); if (pp) { viewPast = +pp.getAttribute("data-bc-past"); render(); return; }
    var po = e.target.closest("[data-bc-other]"); if (po) { viewPast = 1000 + (+po.getAttribute("data-bc-other")); render(); return; }
    var b = e.target.closest("[data-bc],[data-bc-chip]"); if (!b) return;
    var a = b.getAttribute("data-bc");
    if (a === "close") return close();
    if (a === "new") { newChat(); return; }
    if (a === "hist") { showHist = !(showHist && viewPast < 0); viewPast = -1; render(); return; }
    if (a === "delpast") { var dp = past[viewPast]; if (dp && confirm("이 지난 대화를 지울까요? 다른 기기에서도 지워져요.")) { gone.push(pkey(dp)); past.splice(viewPast, 1); viewPast = -1; keep(); render(); } return; }
    if (a === "resume") { var other = viewPast >= 1000, pr = other ? others()[viewPast - 1000] : past[viewPast]; if (pr && !busy) {
      if (!other) { gone.push(pkey(pr)); past.splice(viewPast, 1); }   // 꺼낸 지난 대화는 지운 표시 — 다른 기기 기록과 합쳐도 다시 안 생긴다
      archive(); turns = pr.turns.slice(); showHist = false; viewPast = -1; keep(); render(); } return; }
    if (a === "old") { openOld = !openOld; render(); return; }
    var c = b.getAttribute("data-bc-chip");
    if (c) { if (c.indexOf("○○") >= 0) { text.value = c.split("○○")[0]; text.focus(); } else go(c); }
  });
  send.addEventListener("click", function () { if (busy) { if (ctl) ctl.abort(); } else go(text.value); });
  if (att) {
    att.addEventListener("click", function () { file.click(); });
    file.addEventListener("change", function () { addPics(file.files); file.value = ""; text.focus(); });
    text.addEventListener("paste", function (e) {   // 캡처한 화면을 바로 붙여 넣기 — 글과 같이 붙여도 글은 그대로 들어간다
      var cd = e.clipboardData; if (!cd) return;
      var fs = [].slice.call(cd.files || []);
      if (!fs.length) fs = [].slice.call(cd.items || []).filter(function (it) { return it.kind === "file"; }).map(function (it) { return it.getAsFile(); });
      if (addPics(fs) && !cd.getData("text/plain")) e.preventDefault();
    });
    box.addEventListener("dragover", function (e) { if (e.dataTransfer && [].indexOf.call(e.dataTransfer.types || [], "Files") >= 0) { e.preventDefault(); box.classList.add("bc-drop"); } });
    box.addEventListener("dragleave", function (e) { if (!box.contains(e.relatedTarget)) box.classList.remove("bc-drop"); });
    box.addEventListener("drop", function (e) { box.classList.remove("bc-drop"); if (e.dataTransfer && e.dataTransfer.files.length) { e.preventDefault(); addPics(e.dataTransfer.files); } });
  }
  text.addEventListener("input", function () { text.style.height = "auto"; text.style.height = Math.min(text.scrollHeight + 2, 132) + "px"; text.style.overflowY = text.scrollHeight > 130 ? "auto" : "hidden"; });
  text.addEventListener("keydown", function (e) { if (e.key === "Enter" && !e.shiftKey && !e.isComposing && e.keyCode !== 229 && window.matchMedia("(pointer: fine)").matches) { e.preventDefault(); go(text.value); } });
  text.addEventListener("focus", function () { setTimeout(lift, 60); setTimeout(lift, 350); });
  text.addEventListener("blur", function () { setTimeout(lift, 60); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !box.hidden) close(); });
  function ready() { var was = false; try { was = localStorage.getItem(KEY + ".open") === "1"; } catch (e) {} lift(); if (was) open(); else fab.hidden = false; }
  if (LOCAL) ready();
  else if (window.claude && claude.use) {
    claude.use("sample").then(function (s) { sample = s; if (s) ready(); }, function () {});   // 로그인돼 Brainy를 부를 수 있을 때만
    claude.use("db").then(function (db) {   // 다른 기기에서 이어 쓴 기록을 받는다 — 더 새것만
      if (!db) return; DBC = db;
      db.doc(PATH).onSnapshot(function (snap) {
        if (!snap.exists) { if (turns.length || past.length) keep(); return; }
        var d = snap.data() || {}; remote = d;
        var before = JSON.stringify([past, gone]);
        gone = gone.concat((d.gone || []).filter(function (k) { return gone.indexOf(k) < 0; }));
        mergePast((d.past || []).concat(past));
        if (firstOpen && !clean(turns).length && !busy) {   // 처음 여는 기기 — 가장 최근에 쓴 지금 대화를 이어받는다 (한 번만)
          var devs = Object.assign({}, d.devs || {}, d.cur ? { legacy: { at: d.at, turns: d.cur } } : {}), best = null;
          Object.keys(devs).forEach(function (k) { var x = devs[k]; if (x && clean(x.turns).length && (!best || x.at > best.at)) best = x; });
          if (best && !past.some(function (p) { return sig(p.turns) === sig(best.turns); })) turns = clean(best.turns);
        }
        firstOpen = false;
        local();
        var mine = (d.devs || {})[DEV];   // 이 기기 대화가 저장소와 다르고 이 기기 쪽이 더 새것 = 지난번에 못 보낸 것 (떠날 때 보내다 끊긴 경우)
        var unsent = !!DEV && stamp > ((mine && mine.at) || 0) && (mine ? sig(mine.turns) !== sig(turns) : clean(turns).length > 0);
        if ((JSON.stringify([past, gone]) !== before || unsent) && !busy) keep();   // 이 기기에만 있던 지난 대화·못 보낸 지금 대화를 저장소에도
        if (!box.hidden && !busy) render();
      });
    }, function () {});
  }
})();
</script>
