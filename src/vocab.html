/* Layout: one narrow column like an editing panel — sticky header with tabs, content cards below; level colors read like timeline track colors */
:root{
  --bg:#EEF1F0; --surface:#FFFFFF; --surface-2:#F6F8F7; --ink:#131718; --muted:#5B6764; --line:#D6DDDA;
  --accent:#E24E1B; --accent-ink:#FFFFFF;
  --l1:#A3ADA9; --l2:#3A78D4; --l3:#D99A00; --l4:#1C9467;
  --ok-bg:#E3F4EC; --warn-bg:#FCF1DA;
  --f-body:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1314; --surface:#171C1D; --surface-2:#1D2324; --ink:#E8EEEC; --muted:#93A19C; --line:#2A3234;
  --accent:#FF6B3D; --accent-ink:#140804;
  --l1:#5A6662; --l2:#5C9BF0; --l3:#F0B52A; --l4:#38C18A;
  --ok-bg:#163126; --warn-bg:#33290F; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F1314; --surface:#171C1D; --surface-2:#1D2324; --ink:#E8EEEC; --muted:#93A19C; --line:#2A3234;
  --accent:#FF6B3D; --accent-ink:#140804;
  --l1:#5A6662; --l2:#5C9BF0; --l3:#F0B52A; --l4:#38C18A;
  --ok-bg:#163126; --warn-bg:#33290F; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--bg);padding-block:14px 8px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:20px;font-weight:700;margin:0;letter-spacing:-.01em}
.brand small{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
nav{display:flex;gap:4px;margin-top:10px;overflow-x:auto}
nav a{flex:1 0 auto;text-align:center;padding:7px 12px;border-radius:999px;color:var(--muted);text-decoration:none;font-weight:600;font-size:14px;white-space:nowrap}
nav a.on{background:var(--ink);color:var(--bg)}
nav a:focus-visible,button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{display:flex;flex-direction:column;gap:16px;padding-top:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
h2{font-size:13px;font-weight:600;letter-spacing:.06em;color:var(--muted);margin:0 0 12px}
h3{font-size:22px;font-weight:700;margin:0;text-wrap:balance;line-height:1.35}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.note{font-size:13px;padding:10px 12px;border-radius:10px;background:var(--warn-bg)}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--surface-2)}
.bar span{display:block;height:100%}
.lv1{background:var(--l1)}.lv2{background:var(--l2)}.lv3{background:var(--l3)}.lv4{background:var(--l4)}
.legend{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.legend div{display:flex;flex-direction:column;gap:2px}
.legend b{font-size:22px;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}
.cats{display:flex;flex-direction:column;gap:12px}
.catrow{display:grid;grid-template-columns:110px 1fr 64px;gap:10px;align-items:center}
.catrow .bar{height:8px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.pill.p1{color:var(--muted)} .pill.p2{color:var(--l2);border-color:var(--l2)} .pill.p3{color:var(--l3);border-color:var(--l3)} .pill.p4{color:var(--l4);border-color:var(--l4)}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:11px 2px;border-top:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;color:inherit;font:inherit;width:100%;cursor:pointer}
.row:first-child{border-top:0}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600}
.row .t span{display:block;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.why{font-size:12px;color:var(--muted);white-space:nowrap}
button{font:inherit}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:11px 16px;border-radius:10px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1 1 140px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:5px 11px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:flex;gap:0;margin-top:10px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);padding:8px 6px;font-weight:700;font-size:14px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.seg button span{font-family:var(--f-mono);font-weight:500;font-size:12px;margin-left:4px;opacity:.8}
.flash{min-height:300px;display:flex;flex-direction:column;justify-content:space-between;gap:18px}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tc{font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.04em}
.def{font-size:17px;line-height:1.65}
.def code,.small code{font-family:var(--f-mono);font-size:.9em;background:var(--surface-2);padding:1px 5px;border-radius:5px}
.pair{border-left:3px solid var(--l2);padding:8px 12px;background:var(--surface-2);border-radius:0 8px 8px 0;font-size:14px}
.prog{height:4px;background:var(--surface-2);border-radius:2px;overflow:hidden}
.prog span{display:block;height:100%;background:var(--accent)}
textarea,select,input[type=search]{width:100%;font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
textarea{min-height:120px;resize:vertical}
.scenario{font-size:15px;padding:12px 14px;border-radius:10px;background:var(--surface-2)}
.result{border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.result.pass{background:var(--ok-bg)} .result.fail{background:var(--warn-bg)}
.result b{font-size:15px}
.stack{display:flex;flex-direction:column;gap:12px}
.rule{font-size:13px;color:var(--muted);display:grid;grid-template-columns:auto 1fr;gap:4px 10px}
.empty{padding:22px 4px;text-align:center;color:var(--muted)}
.stages{display:grid;grid-template-columns:repeat(8,1fr);gap:3px}
.stages span{height:6px;border-radius:3px;background:var(--surface-2);border:1px solid var(--line)}
.stages span.on{background:var(--accent);border-color:var(--accent)}
.stages.all span{background:var(--l2);border-color:var(--l2);opacity:.55}
.stagecap{font-size:12px;color:var(--muted);margin-top:6px}
.stagecap b{color:var(--ink);font-weight:600}
.scene{font-size:16px;line-height:1.7;padding:14px 16px;border-radius:12px;background:var(--surface-2);border-left:3px solid var(--accent)}
.scene .lbl,.ly .lbl{display:block;font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--muted);margin-bottom:4px}
.layers{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--line)}
.ly{padding:11px 0;border-bottom:1px solid var(--line);font-size:15px}
.ly.say{background:var(--surface-2);border-radius:10px;padding:11px 14px;border-bottom:0;margin-top:10px}
.ly.lec{font-size:14px;color:var(--muted)}
.principle{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:14px}
.principle b{font-family:var(--f-mono);color:var(--accent)}
.hist{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
@media (max-width:420px){.catrow{grid-template-columns:86px 1fr 58px}.legend b{font-size:19px}}
@media (prefers-reduced-motion:no-preference){.flash,.result{animation:fade .2s ease-out}@keyframes fade{from{opacity:.4}to{opacity:1}}}
</style>

"예약 공개면 촬영일과 공개일을 떼어 둘 수 있어 검수 시간이 생깁니다.", "src": "01-02-02 기획부터 촬영, 편집까지. 현업"}, "shoot-03": {"ex": "노출과 밝기를 조정해 형태를 살린 뒤 대비와 색을 보는 식으로 나눕니다. 회색이어야 할 벽까지 푸르게 보이는 경우와 구분해야 합니다.", "src": "05-02-01 밋밋한 화면을 살려주는 기본 색보정"}, "shoot-04": {"ex": "줌은 확대와 축소, 패닝은 좌우 회전이며, 부감은 위에서 내려다보는 시점입니다. 한 컷에 여러 사건을 넣으면 행동이나 순서가 빠질 수 있습니다.", "src": "03-02-04 Higgsfield로 동영상 생성하는 법"}, "shoot-05": {"ex": "프롬프트: 카메라 무빙을 줘서 휩 줌 / 줌아웃 / 패닝 이런거 적재적소에 써봐. 세 가지는 카메라가 움직이는 방식의 이름입니다. 이름만 적어도 Claude가 어디에 넣을지 정합니다.", "src": "05-03-01 크로마키 기능으로 배경 제거하기"}, "shoot-08": {"ex": "박수 편집점은 박수 앞을 지웁니다. 반복 발화는 남는 문장을 소리 내어 읽어 봅니다.", "src": "06-02-01 자동 컷부터 자막, 스톡 이미지까지"}, "shoot-09": {"ex": "프롬프트: 고른 장면으로 90초짜리 편집본 만들어 줘. 찍은 시각 순서대로 가고, 음악은 아직 넣지 말고 현장음만 남겨 줘. 음악을 나중에 넣는 까닭이 있습니다. 현장음만 들으면 컷이 끊기는 지점이 드러납니다.", "src": "06-02-03 장면 고르기부터 색보정까지, 브이로그"}, "shoot-10": {"ex": "디스필(despill)은 경계에 묻은 초록빛을 덜어 냅니다. 두 설정은 제거 기준과 따로 움직입니다.", "src": "05-03-01 크로마키 기능으로 배경 제거하기"}, "shoot-11": {"ex": "카메라 무보정 원본과 로그 촬영본은 색이 이것과 다릅니다. 중간 밝기가 노란 쪽으로 치우쳐 있습니다.", "src": "05-02-02 레퍼런스 분석을 통한 컬러 그레이딩"}, "audio-03": {"ex": "임계값(Threshold)은 어느 수준 이하를 무음으로 볼지 정하는 기준이고, 최소 무음 길이는 그 작은 소리가 얼마나 오래 이어져야 후보가 되는지 정하는 값입니다. 앞뒤 여백은 말의 시작과 끝에 남겨 둘 시간입니다.", "src": "04-01-01 FFmpeg으로 말 없는 무음 구간을"}, "audio-04": {"ex": "무음 자르기는 오디오 파형에서 소리 크기가 기준선 아래로 떨어진 구간을 찾아 삭제 후보로 만드는 작업입니다. 데시벨(dB)은 소리 크기를 나타내며, 값이 작을수록 더 조용한 상태입니다.", "src": "04-01-01 FFmpeg으로 말 없는 무음 구간을"}, "audio-02": {"ex": "무음 자르기는 오디오 파형에서 소리 크기가 기준선 아래로 떨어진 구간을 찾아 삭제 후보로 만드는 작업입니다. 데시벨(dB)은 소리 크기를 나타내며, 값이 작을수록 더 조용한 상태입니다.", "src": "04-01-01 FFmpeg으로 말 없는 무음 구간을"}, "audio-01": {"ex": "데시벨(dB)은 소리 크기를 나타내며, 값이 작을수록 더 조용한 상태입니다.", "src": "04-01-01 FFmpeg으로 말 없는 무음 구간을"}, "audio-05": {"ex": "접합부에서 파형이 급격히 끊기면 팝 노이즈가 생길 수 있습니다. 아주 짧게 소리를 겹치는 크로스페이드로 줄입니다.", "src": "04-01-01 FFmpeg으로 말 없는 무음 구간을"}, "audio-06": {"ex": "“음, 어, 그, 아”처럼 실제 소리가 있는 추임새는 ⑥ 무음 자르기로 없어지지 않습니다. 음성을 텍스트로 전사해 단어와 타임코드를 찾은 뒤, 실제 소리를 들으며 삭제 여부와 경계를 정합니다.", "src": "04-01-02 Whisper로 추임새 단어를 찾아"}, "audio-07": {"ex": "반복 발화의 끝만 남겼을 때 주어, 조건, 숫자가 빠지지 않는지도 앞뒤 문장과 함께 듣습니다.", "src": "04-01-02 Whisper로 추임새 단어를 찾아"}, "audio-10": {"ex": "화자 분석 결과는 발화마다 시작 시각과 끝 시각과 음높이를 적은 표입니다. 발화 16개와 화자 교대 15회가 대본과 같습니다.", "src": "06-02-05 발화자 분리부터 자막 추가, 인트로"}, "audio-11": {"ex": "⑬ 볼륨 노멀라이즈에서는 녹음 안의 편차를 줄이고 유튜브용 -14 LUFS에 맞춥니다. 작은 발화를 키우려고 전체 볼륨을 올리면 큰 발화도 함께 커집니다.", "src": "05-01-01 들쭉날쭉한 볼륨을 방송 규격으로 맞추는"}, "audio-12": {"ex": "피크를 낮추는 것만으로 작은 말과 큰 말의 차이가 해결되지는 않으므로 통합 LUFS와 발화 구간 편차를 따로 읽습니다.", "src": "05-01-01 들쭉날쭉한 볼륨을 방송 규격으로 맞추는"}, "audio-13": {"ex": "⑬ 볼륨 노멀라이즈에서는 녹음 안의 편차를 줄이고 유튜브용 -14 LUFS에 맞춥니다. 작은 발화를 키우려고 전체 볼륨을 올리면 큰 발화도 함께 커집니다.", "src": "05-01-01 들쭉날쭉한 볼륨을 방송 규격으로 맞추는"}, "audio-14": {"ex": "⑭ 노이즈 제거는 말소리를 남기고 배경 잡음을 줄이는 블록입니다. 말 사이의 조용한 부분만 잘라도 말 뒤에 깔린 팬 소리는 남습니다.", "src": "05-01-02 노이즈 제거 기능으로 배경 잡음 없애기"}, "audio-15": {"ex": "⑮ BGM은 이 셋을 한 파일에 섞으면서 말이 묻히지 않게 크기와 시점을 맞추는 블록입니다.", "src": "05-01-03 Epidemic Sound에서 영상에"}, "audio-16": {"ex": "화면이 왼쪽에서 오른쪽으로 밀리는 동안 whoosh가 같이 갑니다. 라이저는 소리가 점점 높아지고, 드론은 낮은 소리가 계속 깔립니다.", "src": "05-01-03 Epidemic Sound에서 영상에"}, "audio-18": {"ex": "프롬프트: 드럼과 베이스 스템만 Epidemic Sound에서 받아 줘. 받은 두 스템을 합쳐서 영상에 깔아줘. 소리 줄이지 말고.", "src": "05-01-03 Epidemic Sound에서 영상에"}, "audio-19": {"ex": "BPM은 1분 동안 반복되는 박의 수입니다. 120 BPM이면 평균적으로 0.5초마다 한 박이지만, 첫 박의 위치와 박 사이 간격은 곡의 실제 파형에 따라 달라집니다.", "src": "04-02-03 음악 비트 분석하여 음악에 맞춰 컷"}, "audio-20": {"ex": "TTS(Text-to-Speech)는 텍스트를 AI 성우의 음성으로 바꾸는 작업입니다. 본인의 목소리가 신뢰에 중요한 지식 채널은 직접 녹음을 우선합니다.", "src": "03-02-05 타입캐스트로 녹음 없이 음성을 생성하는"}, "color-01": {"ex": "기본 색보정(color correction)은 과하게 밝거나 어두운 부분을 살립니다. 컬러 그레이딩(color grading)은 영화 같은 색감을 입힙니다.", "src": "05-02-01 밋밋한 화면을 살려주는 기본 색보정"}, "color-02": {"ex": "컬러 그레이딩에는 기준이 될 사진 한 장이 필요합니다. 좋아하는 영화나 드라마의 한 장면을 쓸 수 있습니다.", "src": "05-02-02 레퍼런스 분석을 통한 컬러 그레이딩"}, "color-04": {"ex": "웨이브폼은 화면의 밝기 신호가 어느 범위에 분포하는지 보여주는 그래프입니다. 웨이브폼을 참고해 밝기 신호가 위아래 한계에 붙지 않는지 확인합니다.", "src": "05-02-01 밋밋한 화면을 살려주는 기본 색보정"}, "color-05": {"ex": "밝은 신호가 위쪽 한계에 붙으면 밝은 부분의 무늬가 사라지는 화이트 클리핑이, 어두운 신호가 아래쪽 한계에 붙으면 어두운 부분의 형태가 뭉개지는 블랙 클리핑이 발생할 수 있습니다.", "src": "05-02-01 밋밋한 화면을 살려주는 기본 색보정"}, "color-06": {"ex": "영화풍 색조를 파일 하나로 옮겨 담은 것이 LUT(Look-Up Table)입니다. LUT는 이 색이 들어오면 저 색으로 바꾼다는 규칙을 모아 둔 변환표입니다.", "src": "05-02-02 레퍼런스 분석을 통한 컬러 그레이딩"}, "color-07": {"ex": "프리셋 14종을 하나씩 열어 보면 앞에서 본 색이 기억에서 사라집니다. 한 화면에 모아 놓으면 나란히 견줄 수 있습니다.", "src": "05-02-02 레퍼런스 분석을 통한 컬러 그레이딩"}, "sub-01": {"ex": "Whisper가 음성을 전사하고 타임코드를 붙여도, 자막의 완성도는 한국어 문맥에 맞는 줄바꿈과 편집본의 시간에 달려 있습니다.", "src": "04-01-03 Whisper를 사용해 정확한 타이밍에"}, "sub-07": {"ex": "전사 파일, 자막(SRT), 그래픽 클립 같은 중간 파일을 보존하면 특정 단계만 수정하고 다시 렌더링하기 편리합니다.", "src": "03-01-02 영상편집 필수 오픈소스 3대장 소개"}, "sub-08": {"ex": "자막 굽기(Burn-in)는 폰트, 색상, 위치 같은 스타일을 영상 화면에 합성하는 작업입니다.", "src": "04-01-03 Whisper를 사용해 정확한 타이밍에"}, "sub-10": {"ex": "자막은 화면 가운데에 1에서 3어절씩 들어갑니다. AI가 대사 16개를 자막 38개로 나눕니다.", "src": "06-02-05 발화자 분리부터 자막 추가, 인트로"}, "sub-11": {"ex": "글자가 화면 밖이나 상자 밖에서 들어옵니다. 글자의 크기나 각도가 바뀌며 섭니다.", "src": "05-04-03 레퍼런스를 통해 움직이는 자막 만들기"}, "motion-02": {"ex": "키프레임: 특정 프레임에 화면 요소의 값을 저장한 표시. 이징: 두 키프레임 사이에서 값이 변하는 속도를 정하는 방식.", "src": "01-02-01 컷편집부터 트랜지션까지, 영상 편집"}, "motion-03": {"ex": "기준점이 가운데면 제자리에서 돕니다. 기준점을 왼쪽 위로 옮기면 그 모서리를 축으로 돕니다.", "src": "05-04-02 멈춰있는 이미지에 움직임을 넣는"}, "motion-04": {"ex": "이징: 두 키프레임 사이에서 값이 변하는 속도를 정하는 방식.", "src": "01-02-01 컷편집부터 트랜지션까지, 영상 편집"}, "motion-05": {"ex": "스태거: 여러 화면 요소의 시작 시간을 차례로 어긋나게 놓는 방식.", "src": "01-02-01 컷편집부터 트랜지션까지, 영상 편집"}, "motion-06": {"ex": "모션 블러: 화면 요소의 움직임 때문에 생기는 흐림 효과.", "src": "01-02-01 컷편집부터 트랜지션까지, 영상 편집"}, "motion-07": {"ex": "AI가 만든 모션 그래픽에는 페이드가 자주 들어갑니다. 페이드가 많으면 AI가 만든 티가 납니다.", "src": "07-01-02 인트로 아웃트로 제작하기"}, "motion-08": {"ex": "와이프와 슬라이드는 움직이는 것이 다릅니다. 와이프는 경계선이 지나가고 장면은 제자리에 있습니다.", "src": "05-04-01 장면과 장면을 매끄럽게 잇는 트랜지션"}, "motion-09": {"ex": "여러 장을 레이어로 쌓으면 한 장의 완성 이미지보다 훨씬 깊이 있는 장면이 됩니다. 한 장으로 완성된 이미지는 통째로만 움직입니다.", "src": "05-04-02 멈춰있는 이미지에 움직임을 넣는"}, "motion-10": {"ex": "오버레이(overlay)는 본 영상 위에 겹쳐 올리는 자료입니다. 본 영상은 그대로 두고 그 위에 자료만 얹습니다.", "src": "05-03-03 시청자의 이해를 돕는 요소 추가하기"}, "motion-11": {"ex": "⑱ 크로마키(chroma key)는 배경을 지워 대상만 남기는 블록입니다. 색으로 지우기(크로마키)는 정한 색과 가까운 화소를 투명하게 만듭니다.", "src": "05-03-01 크로마키 기능으로 배경 제거하기"}, "motion-12": {"ex": "대상이 화면 안에서 움직이면 한 곳에 고정한 블러는 곧 어긋납니다. ⑲ 모자이크/블러는 대상을 따라가며 가리는 블록입니다.", "src": "05-03-02 움직이는 대상도 잘 따라다니는 모자이크"}, "motion-13": {"ex": "RIFE(프레임 보간)는 앞뒤 프레임으로 중간 장면을 추정합니다. 영상을 느리게 재생할 때 움직임이 끊겨 보이는 현상을 줄이는 데 사용합니다.", "src": "03-02-01 영상 퀄리티를 한층 높여주는 오픈소스"}, "motion-14": {"ex": "흐리게 하는 것이 가우시안 블러이고 어둡게 하는 것이 디밍입니다. 둘이 같이 걸리면 눈이 갈 곳이 엠블럼 하나만 남습니다.", "src": "05-04-05 카메라가 따라가며 등장하는 인포그래픽"}, "motion-15": {"ex": "디자인 기준은 색과 규칙을 글로 길게 적는 대신 무드보드 한 장으로 줍니다.", "src": "06-02-02 모션그래픽 영상 여러개 '퀄리티"}, "motion-16": {"ex": "바 차트 레이스를 먼저 만들고 나머지 3가지를 한꺼번에 만듭니다.", "src": "05-04-04 통계 숫자를 움직이는 차트와 그래프로"}, "ai-01": {"ex": "원샷은 어렵지만 쓰리샷, 포샷으로 나누면 가능합니다. 매치컷과 J-cut 같은 용어로 원하는 방식을 전합니다.", "src": "01-01-01 이제, 편집을 말로 시키는 시대"}, "ai-02": {"ex": "블록: 이 강의에서 번호를 붙인 편집 기능 하나입니다. 정식 명칭은 스킬이며, 25개 블록이 각각 스톡 수집, 무음 제거, 말자막 같은 작업을 수행합니다.", "src": "02-02-04 컨텍스트부터 CLI, 서브에이전트까지"}, "ai-03": {"ex": "블록 25종을 한 편에 전부 쓰지 않습니다. 영상을 끌고 가는 것이 쓸 블록을 정합니다.", "src": "06-01-01 내 채널에 맞는 편집 자동화 블록"}, "ai-04": {"ex": "컨텍스트: AI가 답을 만들 때 읽는 내용입니다. 대화, 지침, 열어 본 파일, 실행 결과가 여기에 들어갑니다.", "src": "02-02-04 컨텍스트부터 CLI, 서브에이전트까지"}, "ai-05": {"ex": "세션: 작업을 이어 가는 대화 하나입니다. 새 세션에서는 이전 대화 전체가 자동으로 이어지지 않습니다.", "src": "02-02-04 컨텍스트부터 CLI, 서브에이전트까지"}, "ai-06": {"ex": "지침 파일 CLAUDE.md: Claude Code가 읽는 작업 설명서입니다. 키트에는 도구를 찾는 방법과 원본을 그대로 두는 규칙이 들어 있습니다.", "src": "02-02-04 컨텍스트부터 CLI, 서브에이전트까지"}, "ai-07": {"ex": "서브에이전트: 작은 범위로 나눈 일을 맡는 독립적인 AI 세션입니다. 별도 컨텍스트에서 작업하고 결과를 본 세션에 전달합니다.", "src": "02-02-04 컨텍스트부터 CLI, 서브에이전트까지"}, "ai-08": {"ex": "MCP: AI 앱과 외부 도구를 연결하는 공통 방식입니다. 사용할 기능과 인증 방법은 연결한 서버마다 다릅니다.", "src": "02-02-04 컨텍스트부터 CLI, 서브에이전트까지"}, "ai-09": {"ex": "노력 슬라이더를 오른쪽으로 옮길수록 더 오래 생각하고 비용도 더 듭니다. 짧은 작업은 왼쪽 끝에서 시작하고, 이해하지 못하면 한 단계씩 올립니다.", "src": "02-02-03 클로드 앱 설치부터 요금제 고르기까지"}, "ai-11": {"ex": "프롬프트: FFmpeg 설치해 줘. AI가 컴퓨터 환경에 맞춰 설치하고 확인합니다.", "src": "03-01-02 영상편집 필수 오픈소스 3대장 소개"}, "ai-13": {"ex": "RIFE(프레임 보간)는 앞뒤 프레임으로 중간 장면을 추정합니다. 영상을 느리게 재생할 때 움직임이 끊겨 보이는 현상을 줄이는 데 사용합니다.", "src": "03-02-01 영상 퀄리티를 한층 높여주는 오픈소스"}, "ai-14": {"ex": "이미지 투 비디오는 시작 이미지의 구도와 피사체를 바탕으로 움직임을 더하는 방식입니다.", "src": "03-02-04 Higgsfield로 동영상 생성하는 법"}, "ai-15": {"ex": "크레딧: 일부 생성 서비스에서 사용하는 이용 단위입니다. Claude 사용량과 이미지, 영상, 음성 서비스의 이용료는 따로 확인합니다.", "src": "02-02-04 컨텍스트부터 CLI, 서브에이전트까지"}};

function ensureCtx(id, force){
  if (!sample || !ctxReady || genBusy.has(id) || (!force && (ctxOk(id) || genErr[id]))) return;
  genBusy.add(id); delete genErr[id];
  genChain = genChain.then(async () => {
    try {
      const r = await sample.json(ctxPrompt(BYID[id]), { modelTier: "quick", cache: false });
      const c = { v: CTXV, scene: String(r?.scene || ""), easy: String(r?.easy || ""), why: String(r?.why || ""), ask: String(r?.ask || ""), at: nowIso() };
      if (!c.scene) throw { code: "empty" };
      CTX = { ...CTX, [id]: c };
      if (mode === "db" && db) db.doc("ctx/" + id).set(c).catch(() => {}); else saveCtxLocal();
    } catch (e) {
      if (["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(e?.code)) { sample = null; sampleChecked = true; }
      else genErr[id] = e?.code === "rate_limited" ? "요청이 많아 장면을 아직 못 만들었어요." : "장면을 만들지 못했어요.";
    }
    genBusy.delete(id); render();
  });
}

function foreignPrompt(t, txt){ return `너는 영어 회화 코치다. 학습자(동욱)가 영어 단어를 넣어 문장을 만들었다.

학습자 문장: ${txt}

JSON 하나만 답하라. good·fix는 한국어 존댓말로 짧게, example은 더 자연스러운 영어 문장 하나와 괄호 안 한국어 뜻:
{"pass": true 또는 false, "good": "잘한 점 한 문장", "fix": "고칠 점 한 문장, 없으면 빈 문자열", "example": "자연스러운 예문 (뜻)"}`; }
function foreignIdea(t){ return `동욱은 영어 회화를 공부하며 단어를 매개법으로 외운다. 아래 영어 단어를 이번 주 실제로 한 번 말하거나 써 보는 행동 하나를 제안하라. 5분 안에 끝나고, 했는지 확인할 수 있어야 한다.

단어: ${t.term} (${t.def})

JSON 하나만, 한국어 존댓말로: {"action": "구체적인 행동 한 문장", "check": "했는지 확인하는 기준 한 문장"}`; }
async function grade(){
  const t = BYID[S.talkId]; const txt = (S.drafts[t.id] || "").trim();
  if (txt.length < 8) { S.talkErr = "조금 더 길게, 예시를 넣어 써 주세요."; render(); return; }
  S.talkBusy = true; S.talkErr = ""; S.talkRes = null; S.talkCtl = new AbortController(); render();
  const prompt = t.dom === "외국어 단어장" ? foreignPrompt(t, txt) : `너는 ${t.cat === "AI 편집 자동화" ? "AI 도구" : "영상 편집"} 용어를 가르치는 코치다. 학습자(동욱)가 아래 용어를 자기 말로 설명했다. 위키 정의를 기준으로 판정하라.

위키 정의: ${t.def.replace(/`/g,"")}
분야: ${t.cat}
상황: ${scenOf(t)}
학습자 설명: ${txt}

판정 기준:
- 핵심 의미가 맞고, 정의를 그대로 옮기지 않고 자기 말이나 예시로 설명하면 통과.
- 용어가 여러 개(· 또는 /로 묶임)면 핵심 하나 이상을 정확히 설명하면 통과로 보되, 빠진 것을 fix에 짧게 알려 준다.
- 틀린 내용이 있으면 불통과.

JSON 하나만 답하라. 한국어 존댓말, 친근하고 짧게:
{"pass": true 또는 false, "good": "잘한 점 한 문장", "fix": "틀렸거나 빠진 점 한 문장, 없으면 빈 문자열", "example": "이 용어를 실제 작업 상황에서 쓰는 한 문장 예시"}`;
  try {
    const r = await sample.json(prompt, { modelTier: "quick", signal: S.talkCtl.signal, cache: false });
    const res = { id: t.id, pass: !!r?.pass, good: String(r?.good || ""), fix: String(r?.fix || ""), example: String(r?.example || "") };
    S.talkRes = res; S.talkBusy = false;
    const ex = { text: txt, passed: res.pass, feedback: [res.good, res.fix].filter(Boolean).join(" / "), at: nowIso(), scenario: scenOf(t) };
    if (res.pass) save(t.id, { level: 3, fuzzy: false, explain: ex }, "설명하기 통과 (Claude 확인)");
    else save(t.id, { lastAttempt: ex }, "설명하기 시도");
  } catch (e) {
    S.talkBusy = false;
    if (e?.code === "cancelled") { render(); return; }
    if (["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(e?.code)) { sample = null; sampleChecked = true; S.talkErr = "Claude 확인을 쓸 수 없어 직접 비교하는 방식으로 바꿨어요."; }
    else if (e?.code === "rate_limited") S.talkErr = "요청이 많아요. 잠시 뒤 다시 눌러 주세요.";
    else S.talkErr = "확인하지 못했어요. 다시 눌러 주세요.";
    render();
  }
}

  } catch (e) {
    if (["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(e?.code)) { sample = null; sampleChecked = true; }
    else note = e?.code === "rate_limited" ? "요청이 많아요. 잠시 뒤 다시 눌러 주세요." : "아이디어를 받지 못했어요. 다시 눌러 주세요.";
  }
  S.ideaBusy = false; render();
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const dm = e.target.closest("[data-dom]");
  if (dm) { setDomain(dm.dataset.dom); location.hash = "home"; render(); return; }
  const el = e.target.closest("[data-act],[data-go],[data-lcat],[data-listcat],[data-detail],[data-pickdo],[data-do]");
  if (!el) return;
  const d = el.dataset;
  if (d.act === "regen") { ensureCtx(d.id, true); render(); return; }
  if (d.act === "core") { const id = d.id; save(id, { core: !isCore(id) }, "체화/소통용 변경"); return; }
  if (d.go) { const id = d.id;
    if (d.go === "learn") { S.queue = [id, ...((S.queue||[]).filter(x => x !== id))]; S.qi = 0; S.flipped = false; }
    if (d.go === "talk") { S.talkId = id; S.talkRes = null; S.talkErr = ""; }
    if (d.go === "do") { S.doId = id; }
    location.hash = d.go; return; }
  if (d.do) { S.doId = d.do; return; }
  if (d.lcat) { S.learnCat = d.lcat; buildQueue(); render(); return; }
  if (d.listcat) { S.listCat = d.listcat; render(); return; }
  if (d.detail) { S.detail = d.detail; if (view() !== "list") { location.hash = "list"; } else { render(); document.getElementById("detail")?.scrollIntoView({ block: "start", behavior: "smooth" }); } return; }
  if (d.pickdo) { S.doId = d.pickdo; render(); window.scrollTo({ top: 0, behavior: "smooth" }); return; }
  const a = d.act; const qid = S.queue?.[S.qi];
  if (a === "flip") { S.flipped = true; render(); }
  else if (a === "know") { save(qid, { level: 2, fuzzy: false, seen: (prog[qid]?.seen||0)+1, lastSeen: nowIso() }, "알기: 장면이 그려짐"); S.qi++; S.flipped = false; render(); }
  else if (a === "fuzzy") { save(qid, { fuzzy: true, seen: (prog[qid]?.seen||0)+1, lastSeen: nowIso() }, "알기: 흐릿함"); S.qi++; S.flipped = false; render(); }
  else if (a === "newq") { buildQueue(); render(); }
  else if (a === "scen") { S.scen++; render(); }
  else if (a === "grade") { if (sample) grade(); }
  else if (a === "stop") { S.talkCtl?.abort(); }
  else if (a === "selfcheck") { const t = BYID[S.talkId]; if ((S.drafts[t.id]||"").trim().length < 8) { S.talkErr = "조금 더 길게, 예시를 넣어 써 주세요."; } else { S.talkErr = ""; S.talkRes = { id: t.id, self: true }; } render(); }
  else if (a === "selfyes") { const t = BYID[S.talkId]; save(t.id, { level: 3, fuzzy: false, explain: { text: S.drafts[t.id], passed: true, feedback: "직접 비교", at: nowIso(), scenario: scenOf(t) } }, "설명하기 통과 (직접 비교)"); S.talkRes = { id: t.id, pass: true, good: "위키 뜻과 비교해 맞게 설명했어요.", fix: "", example: "" }; render(); }
  else if (a === "selfno") { S.talkRes = null; render(); document.getElementById("talkTxt")?.focus(); }
  else if (a === "nexttalk") { const c = talkCandidates().filter(t => t.id !== S.talkId); S.talkId = (c[0] || TERMS[0]).id; S.talkRes = null; S.talkErr = ""; render(); }
  else if (a === "idea") { if (sample) getIdea(); }
  else if (a === "did") { const t = BYID[S.doId]; const txt = (S.doDrafts[t.id] || "").trim(); if (txt.length < 4) { note = "어떻게 썼는지 한 줄 적어 주세요."; render(); return; } note = ""; save(t.id, { level: 4, action: { idea: S.ideas[t.id]?.action || "", note: txt, at: nowIso() } }, "실행하기: 실제로 써 봄"); S.doDrafts[t.id] = ""; S.doId = null; render(); }
});
document.addEventListener("input", e => {
  if (e.target.id === "talkTxt") S.drafts[S.talkId] = e.target.value;
  if (e.target.id === "doTxt") S.doDrafts[S.doId] = e.target.value;
  if (e.target.id === "listQ") { S.listQ = e.target.value; document.getElementById("listOut").innerHTML = listRows(); }
});
document.addEventListener("change", e => { if (e.target.id === "talkSel") { S.talkId = e.target.value; S.talkRes = null; S.talkErr = ""; render(); } });
/* 입력 중 미뤄 둔 화면 갱신은 다음 버튼 동작 때 함께 반영한다 (focusout에서 다시 그리면 누르려던 버튼이 바뀌어 클릭이 사라짐) */
window.addEventListener("hashchange", () => { if (view() !== "list") S.detail = S.detail; render(); window.scrollTo(0, 0); });

/* ---------- start ---------- */
async function init(){
  let d0 = "학습 단어장"; try { d0 = localStorage.getItem(DOMKEY) || "학습 단어장"; } catch(e) {}
  setDomain(d0);
  render();
  const c = window.claude;
  if (!c?.use) { mode = "local"; loadLocal(); loadCtxLocal(); ctxReady = true; sampleChecked = true; render(); return; }
  c.use("sample").then(s => { sample = s; sampleChecked = true; render(); }).catch(() => { sampleChecked = true; render(); });
  db = await c.use("db").catch(() => null);
  if (!db) { mode = "local"; loadLocal(); loadCtxLocal(); ctxReady = true; render(); return; }
  db.collection("ctx").onSnapshot(snap => {
    const m = {}; snap.docs.forEach(d => { if (d.exists) m[d.id] = d.data(); });
    CTX = { ...m, ...Object.fromEntries(Object.entries(CTX).filter(([k]) => !m[k])) };
    if (!snap.metadata.fromCache) ctxReady = true;
    render();
  }, () => { loadCtxLocal(); ctxReady = true; render(); });
  const timer = setTimeout(() => { if (mode === "loading") { note = "기록을 아직 불러오지 못했어요. 연결을 확인해 주세요."; render(); } }, 10000);
  db.collection("progress").onSnapshot(snap => {
    const m = {}; snap.docs.forEach(d => { if (d.exists) m[d.id] = d.data(); });
    prog = m; mode = "db";
    if (!snap.metadata.fromCache) { clearTimeout(timer); if (note.startsWith("기록을 아직")) note = ""; }
    render();
  }, err => { clearTimeout(timer); mode = "local"; loadLocal(); note = "기록 저장소에 연결하지 못해 이 기기에만 저장해요."; render(); });
}
init();
</script>
