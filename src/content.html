/* 틀: 좁은 한 줄 기둥, 위에 탭, 아래 카드 (맥 단축키·체화 단어장과 같은 뼈대·같은 이름).

:root{

}

.nextbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin:14px 0 4px;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--accent) 8%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 25%,var(--line))}.nb-t{font-weight:700;font-size:14px}

.wbox{border:1px solid var(--line);border-radius:14px;margin-top:10px;background:var(--surface)}.wbox>summary{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:12px 14px;font-size:14px;color:var(--ink)}.wbox[open]>summary{border-bottom:1px solid var(--line)}.wsum{font-weight:500;color:var(--muted);font-size:13px}.wbody{padding:6px 14px 14px}

#setm .setm-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}#setm .setm-h b{font-size:18px}#setm .setm-x{margin-left:auto;width:44px;height:44px;border:0;background:none;font-size:20px;cursor:pointer;color:var(--ink)}

@media (max-width:760px){#setm .setm{left:0;top:0;transform:none;width:100vw;height:100vh;height:100dvh;border-radius:0}#setm .setm-b{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}#setm .setm-nav{border-right:0;border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:8px 12px;align-items:center}#setm .setm-nav input,#setm .sg{display:none}#setm .si{width:auto;flex:none;white-space:nowrap;border:1px solid var(--line);border-radius:999px;min-height:44px;padding:6px 14px}#setm .setm-nav::after{content:"";flex:none;width:8px}#setm .setm-c{padding:14px 16px 40px}}
.nbq{display:block;margin:0 0 12px}.nbq>span{display:block;margin:0 0 4px;font-weight:600;font-size:14px}

.subnav{display:flex;gap:6px;margin:0 0 14px;overflow-x:auto}.subnav button{padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:inherit;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}.subnav button.on{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface))}

p{margin:0}a{color:inherit}
.muted{color:var(--muted)} .small{font-size:13px} .mono{font-family:var(--f-mono)}

/* 브랜드 고르기 — 편집 믹서의 채널 탭처럼 맨 위에서 고르면 그 브랜드 화면·색으로 열린다 */
#brands{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}#brands::-webkit-scrollbar{display:none}

function enterAct(t){   // Enter 로 넣기·저장 — 칸마다 할 일
  if(t.id === "auto-n"){ t.blur(); return true }   // 편 수 — 칸에서 나가며 저장(change)
  if(t.dataset.basekw != null){ act("basekwadd", t); return true }   // 기준 키워드 넣기
  if(t.id === "base-topic"){ act("topicsave", t); return true }   // 영상 주제 한 줄 저장
  if(t.dataset.addseed != null){ act("seedadd", t); return true }
  if(t.dataset.wordin != null){ ui.wDraft = t.value; act("wordfind", t); return true }
  if(t.dataset.dsask != null){ act("dsask", t); return true }
  if(t.dataset.tplin != null){ act("tplsave", t); return true }
  if(t.dataset.pfin != null && t.tagName === "INPUT"){ var pk = t.dataset.pfin;
    if(/^prod:new/.test(pk)) act("paddprod", t);
    else if(/:new$/.test(pk)) act("padd", { dataset: { k: pk.replace(/:new$/, "") } });
    else act("psave", { dataset: { k: ui.pedit } });
    return true }
  return false;
}

  if(name === "chanrec"){ var rids = el.dataset.ids.split(","); if(!confirm("Claude 추천 " + rids.length + "곳을 기획 레퍼런스 카드에 넣을까요? (카드에서 다시 뺄 수 있어요)")) return;   // 참고 페이지 — 추천대로 한 번에 넣기
    var rc = Object.assign({}, (SETS[cur] || {}).chanpick || {}); rids.forEach(function(id){ rc[id] = "add" }); setS({ chanpick: rc }); return }
  if(name === "chanpick"){ var cp = Object.assign({}, (SETS[cur] || {}).chanpick || {}); if(el.dataset.v) cp[el.dataset.id] = el.dataset.v; else delete cp[el.dataset.id]; setS({ chanpick: cp }); return }
  if(name === "ideapick"){ var ip = Object.assign({}, ideaPicks()); if(ip[el.dataset.vid]) delete ip[el.dataset.vid]; else ip[el.dataset.vid] = 1; setS({ ideaPick: ip }); return }

  if(name === "ideas"){ var srI = ((part("search") || {}).items) || [], vids = Object.keys(ideaPicks());
    var vs = vids.map(function(v){ var x = srI.filter(function(y){ return y.vid === v })[0] || videoOf(v); return { vid: v, title: x.title, channel: x.channel, kw: x.kw, replayed: x.replayed } });
    if(!vs.length) return; send("ideas", "댓글·파동에서 아이디어 뽑기 — 영상 " + vs.length + "개", { videos: vs }); setS({ ideaPick: {} }); ui.refView = "ideas"; render(); return }
  if(name === "idearesearch" || name === "ideascript"){ var idea = (((part("ideas") || {}).items) || []).filter(function(x){ return x.id === el.dataset.id })[0]; if(!idea) return;
    if(name === "idearesearch"){ if(searchState().busy) return; setS({ searchReq: { at: new Date().toISOString(), kws: (idea.keywords || []).slice(0, 3), country: kwCountry() } }); ui.refView = "search"; render(); return }
    send("script", "아이디어로 바로 원고 — " + (idea.title || idea.idea), { ideas: [idea] }); return }
  if(name === "stoggle"){ ui.sOff = Object.assign({}, ui.sOff); if(ui.sOff[el.dataset.kw]) delete ui.sOff[el.dataset.kw]; else ui.sOff[el.dataset.kw] = 1; render(); return }
  if(name === "search"){ var off = ui.sOff || {}, kws = scored().filter(function(x){ return s.pin[x.kw] && !s.ex[x.kw] && !off[x.kw] }).map(function(x){ return x.kw }).slice(0, 10);
    if(!kws.length || searchState().busy) return; setS({ searchReq: { at: new Date().toISOString(), kws: kws, country: kwCountry() } }); return }
  if(name === "favc"){ var fv = Object.assign({}, (SETS[cur] || {}).favc || {}), vid = el.dataset.vid;
    if(fv[vid]) delete fv[vid]; else fv[vid] = Object.assign(videoOf(vid), { at: new Date().toISOString() });
    setS({ favc: fv }); return }
  if(name === "seedsrc"){ if(el.dataset.v !== seedSrc()) setS({ seedSrc: el.dataset.v }); return }
  if(name === "seeddel"){ var wd = el.dataset.word; if(!confirm("씨앗 단어 「" + wd + "」을 뺄까요? 이 단어에서만 나온 검색어는 다음에 받을 때 목록에서 빠져요 (★한 것은 남아요).")) return;
    setS({ seeds: seedsOf().filter(function(x){ return x.word !== wd }) }); return }
  if(name === "autoplan"){ setS({ plan: autoPlan(s) }); return }
  if(name === "clearplan"){ setS({ plan: {} }); return }
  if(name === "refresh"){ send("refresh", "레퍼런스 반응·채널 새 영상 최신화", {}); return }
  if(name === "recommend"){ var rp = recParams();   // 추천 기준(재료·최소 배수·우선순위)대로
    send("recommend", "콘텐츠 추천 (" + roleNames().map(function(n){ return n + " " + s.roles[n] }).join(" · ") + " · 우선 " + rp.criteria.priority.slice(0, 2).map(function(x){ return x.name }).join(" > ") + ")", rp); return }
  if(name === "prompt"){ promptSend(el.dataset.key); return }   // ✍️ 내 말로 끼어들기

  if(name === "cmtreq"){ setS({ cmtReq: { at: new Date().toISOString() } }); return }   // 추천 근거 영상 댓글 — 좋아요 순 5개
  if(name === "autostart"){ autoStart(); return }   // 🚀 자동 진행 — 키워드 → 추천 → 구축 → 대본 → 보고
  if(name === "autoopt"){ var ao5 = autoOpt(); ao5[el.dataset.k] = el.dataset.k === "n" ? autoN(el.dataset.v) : el.dataset.v; setS({ autoOpt: ao5 }); return }

}

/* ── 시작: 저장소 붙이기 ── */
(function(){
  if(!window.claude || typeof claude.use !== "function"){ render(); return }
  claude.use("db").then(function(d){
    if(!d){ render(); return }
    DB = d;
    DB.collection("ct.data").onSnapshot(function(q){
      RAW = {}; q.docs.forEach(function(x){ RAW[x.id] = x.data() });
      if(WANT && RAW[WANT] && RAW[WANT].name) cur = WANT;
      else if(!RAW[cur] || !RAW[cur].name){ var first = brands().filter(function(x){ return RAW[x.id + ".kw"] })[0] || brands()[0]; cur = first ? first.id : ""; }
      if(cur && cur === WANT && new URLSearchParams(location.search).get("b") !== cur){ try{ history.replaceState(null, "", location.pathname + "?b=" + encodeURIComponent(cur) + location.hash) }catch(e){} }   // 주소가 늘 지금 브랜드를 가리키게 (없는 브랜드로 열었을 때도)
      renderSoft();
    }, function(){});
    DB.collection("ct.set").onSnapshot(function(q){
      var first = !SETS_LIVE && !(q.metadata && q.metadata.fromCache);
      q.docs.forEach(function(x){ var d = x.data(), l = SETS[x.id];
        if(!first && ((SAVING[x.id] || {}).busy || (l && l.updatedAt && d.updatedAt && d.updatedAt < l.updatedAt))) return;   // 내가 저장 중이거나 더 옛 값이면 화면 값을 지킨다
        SETS[x.id] = d });
      if(first){ SETS_LIVE = true; Object.keys(SET_Q).forEach(function(id){ SETS[id] = Object.assign({}, SETS[id] || {}, SET_Q[id], { updatedAt: new Date().toISOString() }); saveSet(id) }); SET_Q = {} }
      renderSoft() }, function(){});
    DB.collection("cmd").onSnapshot(function(q){
      CMDS = q.docs.map(function(x){ return Object.assign({ id: x.id }, x.data()) }).filter(function(c){ return c.from === "content" })
        .sort(function(a, b){ return String(b.createdAt).localeCompare(String(a.createdAt)) });
      renderSoft();
    }, function(){});
  }, function(){ render() });
})();
render();
