<style>
/* 체화 단어장과 같은 틀 (2026-11-11 동욱: "단어장 앱처럼 정리") — 좁은 한 줄 기둥, 위에 탭, 아래 카드.
   표시는 셋 중 하나만: ★ 즐겨찾기(목록에 남음) · ✓ 외웠어 · ✕ 필요없어(둘 다 목록에서 빠지고 자기 탭으로) */
:root{
  --bg:#EEF1F0; --surface:#FFFFFF; --surface-2:#F6F8F7; --ink:#131718; --muted:#5B6764; --line:#D6DDDA;
  --accent:#E24E1B; --accent-ink:#FFFFFF; --ok:#1C9467; --no:#7A8581; --blue:#3A78D4;
  --ok-bg:#E3F4EC; --warn-bg:#FCF1DA;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1314; --surface:#171C1D; --surface-2:#1D2324; --ink:#E8EEEC; --muted:#93A19C; --line:#2A3234;
  --accent:#FF6B3D; --accent-ink:#140804; --ok:#38C18A; --no:#6F7B77; --blue:#5C9BF0;
  --ok-bg:#163126; --warn-bg:#33290F; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F1314; --surface:#171C1D; --surface-2:#1D2324; --ink:#E8EEEC; --muted:#93A19C; --line:#2A3234;
  --accent:#FF6B3D; --accent-ink:#140804; --ok:#38C18A; --no:#6F7B77; --blue:#5C9BF0;
  --ok-bg:#163126; --warn-bg:#33290F; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 90px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--bg);padding-block:14px 8px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:4px 12px;flex-wrap:wrap}
h1{font-size:20px;font-weight:700;margin:0;letter-spacing:-.01em}
.brand small{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.brand .links{flex-basis:100%;font-family:var(--f-body);font-size:12px}
.links a,.links button{font:inherit;color:inherit;background:none;border:0;padding:0;text-decoration:underline;cursor:pointer}
nav{display:flex;gap:4px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:1 0 auto;text-align:center;padding:7px 11px;border-radius:999px;color:var(--muted);background:none;border:0;font:inherit;font-weight:600;font-size:14px;white-space:nowrap;cursor:pointer}
nav button.on{background:var(--ink);color:var(--bg)}
nav button span{font-family:var(--f-mono);font-weight:500;font-size:11px;opacity:.75;margin-left:3px}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{display:flex;flex-direction:column;gap:14px;padding-top:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
.card-h h3{font-size:17px;font-weight:700;margin:0;line-height:1.35}
.card-h .n{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.lead{font-size:13px;color:var(--muted);margin:0 0 6px;line-height:1.55}
.lead code,.lead kbd{font-family:var(--f-mono);font-size:.9em;background:var(--surface-2);padding:1px 5px;border-radius:5px}
.lbl{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--muted);margin:0 2px 6px}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px} .mono{font-family:var(--f-mono)}
.empty{padding:22px 4px;text-align:center;color:var(--muted);font-size:14px}
.note{font-size:13px;padding:10px 12px;border-radius:10px;background:var(--warn-bg)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:5px 11px;border-radius:999px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip span{font-family:var(--f-mono);font-weight:500;font-size:11px;opacity:.75;margin-left:3px}
.chip b{font-family:var(--f-mono);font-size:11px;color:var(--accent)}.chip.on b{color:inherit}
.chip.dash{border-style:dashed;color:var(--accent)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 15px;border-radius:10px;font:inherit;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
input[type=search],input[type=text],select{width:100%;font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
select{background:var(--surface);border-color:var(--accent);font-size:15px;padding:10px 11px}
.row2{display:flex;gap:8px;align-items:center}.row2>input,.row2>select{flex:1;min-width:0}
/* 단축키 한 줄 — 이름·설명·키 / 오른쪽 표시 셋 */
.list{display:flex;flex-direction:column}
.it{display:flex;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.it:first-child{border-top:0}
.it-m{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.it-h b{font-weight:700;font-size:15px}
.it-h .tag{margin-left:6px;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.it-h .tag.unver{color:var(--accent);border-color:var(--accent)}
.it-d{font-size:13px;color:var(--muted);line-height:1.5}
.it-k{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.it-src{font:inherit;font-family:var(--f-mono);font-size:11px;color:var(--muted);background:none;border:0;padding:0;cursor:pointer;text-align:left;text-decoration:underline;text-underline-offset:2px}
.it.m-pass .it-m,.it.m-no .it-m{opacity:.5}
.combo{display:inline-flex;flex-wrap:wrap;gap:3px;align-items:center}
.combo .sep{color:var(--muted);font-size:12px;margin:0 3px}
kbd{display:inline-block;min-width:24px;text-align:center;font-family:var(--f-mono);font-weight:600;font-size:12px;line-height:1.5;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 6px}
.code{font-family:var(--f-mono);font-size:13px;line-height:1.5;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:5px 9px;overflow-wrap:anywhere;white-space:pre-wrap}
.code i{color:var(--muted);font-style:normal}
.copy{font:inherit;font-size:12px;color:var(--muted);background:none;border:1px solid var(--line);border-radius:7px;padding:4px 9px;cursor:pointer}
.mk3{display:flex;gap:5px;align-items:flex-start}
.mk{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:14px;cursor:pointer;padding:0;line-height:1}
.mk.fav[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mk.pass[aria-pressed=true]{background:var(--ok);border-color:var(--ok);color:#fff}
.mk.no[aria-pressed=true]{background:var(--no);border-color:var(--no);color:#fff}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.legend i{font-style:normal;font-weight:700;margin-right:3px}
.legend .f{color:var(--accent)}.legend .p{color:var(--ok)}.legend .x{color:var(--no)}
/* 지금 */
.modes{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.why{font-size:14px;line-height:1.6}
.status{font-size:13px;color:var(--muted);margin-top:8px}.status.err{color:var(--accent)}
details.card>summary{cursor:pointer;font-weight:700;list-style:none}details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:" ▾";color:var(--muted)}details.card[open]>summary::after{content:" ▴"}
.proj{padding:10px 0;border-top:1px solid var(--line)}.proj:first-of-type{border-top:0;margin-top:6px}
.proj h4{margin:0;font-size:15px}.proj .role{font-size:12px;color:var(--muted)}
.proj ul{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:6px}.proj li{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:14px}
/* 강의 */
.cs-part{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin:10px 2px -4px}
.cs-nav{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.cs-goto{display:flex;gap:10px;align-items:center;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--warn-bg);border:1px solid transparent;border-radius:12px;padding:12px 14px;cursor:pointer}
.cs-goto span:first-child{font-size:12px;font-weight:700;color:var(--accent);white-space:nowrap}.cs-goto b{flex:1;min-width:0;font-weight:600;font-size:14px}.cs-goto .n{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.card.here{border-color:var(--accent)}.card.here .card-h h3{color:var(--accent)}
.card.done .card-h h3{color:var(--muted)}
.cs-req{font-size:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.cs-req span{color:var(--muted)}.cs-req.ok{color:var(--ok)}.cs-req.bad{color:var(--accent)}
.cs-x{padding:2px 8px}
@media (max-width:480px){
  .card{padding:14px 14px}
  .mk3{gap:4px}.mk{width:31px;height:31px;font-size:13px}
  nav button{padding:7px 10px;font-size:13.5px}
}
@media (prefers-reduced-motion:no-preference){main>.card{animation:fade .18s ease-out}@keyframes fade{from{opacity:.5}to{opacity:1}}}
</style>

  <header>

    </div>
    <nav id="nav" role="tablist" aria-label="보기"></nav>
  </header>
  <main id="view"></main>
</div>

<script>
"use strict";
/* 단축키 목록은 볼트가 정본이다 — `4_Outputs/단축키 앱/단축키 데이터.json` 의 groups(앱·묶음·안내) · items(단축키) · modes(지금 탭 작업 모드) · projects.
   맥 동기화(app_data.py) → Supabase sc.data/main → 아래 DB.doc("sc.data/main") 가 채운다. 목록·안내 글·모드를 바꾸려면 볼트 파일을 고친다 (코드에 넣지 않는다).
   id 는 바꾸지 않는다 — ★✓✕ 표시가 id 에 붙어 있다. */
var GROUPS = [], D = [], PROJECTS = [], MODES = [];
var ADDED = [];            // 앱에서 채워 넣은 것 (db additions)
var ITEMS = D;             // D + ADDED
var BY_ID = {};
function reindex(){
  ITEMS = D.concat(ADDED);
  BY_ID = {}; ITEMS.forEach(function(s){ BY_ID[s.id] = s });
}
reindex();
var STARTER = D.filter(function(s){ return s.starter });

/* ── 분야 — 단어장처럼 큰 묶음 → 앱. 볼트 데이터의 groups[].cat 이 정본, 없으면 아래 표 ── */
var CATS = ["맥 기본", "기록·할 일", "웹·구글", "영상·녹화", "터미널·AI"];
var CAT_OF = {"맥 공통":"맥 기본","창·화면":"맥 기본","캡처":"맥 기본","글쓰기·편집":"맥 기본","Finder":"맥 기본",
  "옵시디언":"기록·할 일","노션":"기록·할 일","Todoist":"기록·할 일",
  "크롬":"웹·구글","Gmail":"웹·구글","구글 문서":"웹·구글","구글 시트":"웹·구글",
  "프리미어 프로":"영상·녹화","캡컷":"영상·녹화","녹화·미리보기":"영상·녹화",
  "iTerm2 · 클로드 코드":"터미널·AI"};
// 「iTerm2 · 클로드 코드」 한 그룹을 화면에선 둘로 — 클로드 코드(cc-…)가 칩 이름에 바로 보이게 (2026-11-11 동욱: "클로드 단축키가 안 보여")
var CC_SPLIT = "iTerm2 · 클로드 코드", A_CC = "클로드 코드", A_TERM = "iTerm2 · 터미널";
function areaOf(s){ return s.g === CC_SPLIT ? (/^cc-/.test(s.id) ? A_CC : A_TERM) : s.g }
function groupInfo(g){
  if(g === A_CC || g === A_TERM){
    var G = GROUPS.filter(function(x){ return x.g === CC_SPLIT })[0] || {};
    return g === A_CC ? { g: g, cat: "터미널·AI", lead: G.lead || G.hint } : { g: g, cat: "터미널·AI", hint: "창 분할·이동과 터미널 기본 명령. 한 창에 claude, 한 창에 결과." };
  }
  return GROUPS.filter(function(x){ return x.g === g })[0] || null;
}
var TERM_RE = /iterm|아이템|아이텀|터미널|terminal|claude|클로드|셸|shell|zsh|bash/i;
function catOf(g){ var G = groupInfo(g); return (G && G.cat) || CAT_OF[g] || (TERM_RE.test(g) ? "터미널·AI" : "앱에서 넣은 것") }
function areaList(){
  var names = [];
  GROUPS.forEach(function(G){ if(G.g === CC_SPLIT) names.push(A_CC, A_TERM); else names.push(G.g) });
  ADDED.forEach(function(s){ var a = areaOf(s); if(names.indexOf(a) < 0) names.push(a) });
  return names;
}
function catList(){
  var cs = CATS.slice();
  areaList().forEach(function(g){ var c = catOf(g); if(cs.indexOf(c) < 0) cs.push(c) });
  return cs.filter(function(c){ return areaList().some(function(g){ return catOf(g) === c }) });
}
function areaLead(name){
  var G = groupInfo(name);
  if(G && (G.lead || G.hint)) return G.lead || G.hint;
  if(ADDED.some(function(s){ return areaOf(s) === name }))
    return "앱에서 채운 영역이에요. <b>공식 문서로 검증한 값이 아니에요</b> — 눌러 보고 안 먹으면 ✕로 빼요.";
  return "";
}

function load(k, fb){ try{ var v = localStorage.getItem(k); return v ? JSON.parse(v) : fb }catch(e){ return fb } }
function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)) }catch(e){} }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c] }) }

/* ── 표시 셋 — 하나만 붙는다 ── */
var marks = load("mk.marks", null);
if(!marks){
  marks = {};
  (load("mk.favs", []) || []).forEach(function(id){ marks[id] = "fav" });
  (load("mk.core", []) || []).forEach(function(id){ marks[id] = "pass" });
  save("mk.marks", marks);
}
Object.keys(marks).forEach(function(k){ if(marks[k] === "known") marks[k] = "pass" });
var MK = {
  fav:  { i:"★", n:"즐겨찾기", t:"즐겨찾기 — 목록에 남고 「즐겨찾기」 탭에도 모여요" },
  pass: { i:"✓", n:"외웠어",   t:"외웠어 — 목록에서 빠지고 「외웠어」 탭으로" },
  no:   { i:"✕", n:"필요없어", t:"필요없어 — 목록에서 빠지고 「필요없어」 탭으로" }
};
var MK_ORDER = ["fav", "pass", "no"];
function gone(m){ return m === "pass" || m === "no" }
function mkBtns(attr, id, cur, label){
  return "<div class=\"mk3\">" + MK_ORDER.map(function(k){
    return "<button type=\"button\" class=\"mk " + k + "\" " + attr + "=\"" + k + "\" data-id=\"" + esc(id) + "\" aria-pressed=\"" + (cur === k) +
      "\" title=\"" + MK[k].t + "\" aria-label=\"" + label + " " + MK[k].n + "\">" + MK[k].i + "</button>";
  }).join("") + "</div>";
}
function legend(){
  return "<p class=\"legend\"><span><i class=\"f\">★</i>즐겨찾기 — 남겨 두고 모아 보기</span><span><i class=\"p\">✓</i>외웠어</span><span><i class=\"x\">✕</i>필요없어 — 둘 다 목록에서 빠져요</span></p>";
}
function setMark(id, kind){
  if(!kind || kind === "none" || marks[id] === kind) delete marks[id]; else marks[id] = kind;
  save("mk.marks", marks);
  if(DB && DB.doc) DB.doc("sc.marks/main").set({ marks: marks, updatedAt: new Date().toISOString() }).catch(function(){});
}

/* ── 그리기 조각 ── */
function cap(k){ return "<kbd>" + k + "</kbd>" }
function combo(cs){
  return "<span class=\"combo\">" + cs.map(function(c){ return c.map(cap).join("") }).join("<span class=\"sep\">/</span>") + "</span>";
}
function row(s, o){
  var m = marks[s.id] || "";
  return "<div class=\"it" + (m ? " m-" + m : "") + "\"><div class=\"it-m\">" +
    "<div class=\"it-h\"><b>" + s.t + "</b>" + (s.tag ? "<span class=\"tag" + (s.unver ? " unver" : "") + "\">" + s.tag + "</span>" : "") + "</div>" +
    (s.d ? "<div class=\"it-d\">" + s.d + "</div>" : "") +
    "<div class=\"it-k\">" + combo(s.k) + "</div>" +
    (o && o.src ? "<button type=\"button\" class=\"it-src\" data-goarea=\"" + esc(areaOf(s)) + "\">" + esc(catOf(areaOf(s))) + " · " + esc(areaOf(s)) + "</button>" : "") +
    "</div>" + mkBtns("data-mark", s.id, m, esc(s.t)) + "</div>";
}
function card(title, inner, o){
  o = o || {};
  return "<section class=\"card" + (o.cls ? " " + o.cls : "") + "\"" + (o.attr || "") + "><div class=\"card-h\"><h3>" + title + "</h3>" +
    (o.right != null ? o.right : (o.n != null ? "<span class=\"n\">" + o.n + "</span>" : "")) + "</div>" +
    (o.lead ? "<p class=\"lead\">" + o.lead + "</p>" : "") + inner + "</section>";
}
function listCard(title, list, o){
  o = o || {};
  var inner = list.length ? "<div class=\"list\">" + list.map(function(s){ return row(s, o) }).join("") + "</div>"
                          : "<p class=\"empty\">" + (o.empty || "없어요") + "</p>";
  return card(title, inner, { n: o.n != null ? o.n : list.length, lead: o.lead, cls: o.cls, right: o.right });
}

var capReady;   // sample·db 준비가 끝나면 resolve
(function(){
  var done;
  capReady = new Promise(function(r){ done = r });
  if(!window.claude || typeof claude.use !== "function"){ done(); return }
  var a = claude.use("sample").then(function(s){ SAMPLE = s }, function(){});
  var b = claude.use("db").then(function(d){
    if(!d) return;
    DB = d;
    DB.doc("sc.data/main").onSnapshot(function(s){
      var v = s.exists ? s.data() : null;
      if(!v || !Array.isArray(v.items) || !v.items.length) return;
      GROUPS = v.groups || []; D = v.items; MODES = v.modes || []; PROJECTS = v.projects || [];
      STARTER = D.filter(function(x){ return x.starter });
      repaint();
    }, function(){});
    DB.doc("sc.data/course").onSnapshot(function(s){
      var v = s.exists ? s.data() : null;
      if(!v || !Array.isArray(v.courses) || !v.courses.length) return;
      COURSE = v; save("sc.course.data", v); refresh();
    }, function(){});
    DB.collection("sc.creq").onSnapshot(function(q){ csSetReqs(q.docs.map(function(d){ return Object.assign({ id: d.id }, d.data()); })); }, function(){});
    DB.doc("sc.marks/course").onSnapshot(function(s){
      var v = s.exists ? s.data() : null;
      if(v && v.at){ CPROG = { cur: v.cur || "", at: v.at || {}, done: v.done || {}, sd: v.sd || {}, all: !!v.all, cp: v.cp || {}, cf: v.cf || {}, cn: v.cn || {}, pk: v.pk || {} }; save("sc.course", CPROG); refresh(); }
      else if(CPROG.cur || Object.keys(CPROG.at).length) csSave();
    }, function(){});
    DB.doc("sc.marks/main").onSnapshot(function(s){
      var v = s.exists ? s.data() : null;
      if(v && v.marks){ marks = v.marks; save("mk.marks", marks); refresh(); }
      else if(Object.keys(marks).length){ DB.doc("sc.marks/main").set({ marks: marks, updatedAt: new Date().toISOString() }).catch(function(){}); }
    }, function(){});
    try{
      DB.collection("additions").onSnapshot(function(snap){
        ADDED = [];
        snap.docs.forEach(function(doc){ var v = doc.data(); if(v) ADDED = ADDED.concat(docToItems(doc.id, v)) });
        repaint();
      }, function(){});
    }catch(e){}
  }, function(){});
  Promise.all([a, b]).then(function(){ done() }, function(){ done() });
  setTimeout(done, 12000);
})();
var ASK_RULES =
 "너는 macOS 키보드 단축키 레퍼런스다. 아래 요청에 해당하는 맥 단축키를 JSON으로만 답한다.\n\n" +

 "keys는 조합의 배열이다 — 대안이 둘이면 [[\"⌘\",\"K\"],[\"⌘\",\"T\"]].\n\n요청: ";
function finishAsk(){

  DB.collection("requests").doc(slug(q) + "-" + Date.now().toString(36).slice(-4))
    .set({ q: q, createdAt: new Date().toISOString(), done: false })
    .then(function(){ var a = document.getElementById("ask"); if(a) a.value = ""; statusMsg(why + " 요청으로 남겼어요 — 맥의 Brainy가 공식 문서로 찾아 넣어요.") })
    .catch(function(){ statusMsg(why + " 저장도 안 됐어요 — Brainy에게 말해 주세요.", true) })

function askFor(q){

      if(!items.length){ statusMsg("쓸 만한 게 안 나왔어요. 더 좁혀서 — 예: “슬랙 메시지 작성”, “줌 음소거”.", true); finishAsk(); return }
      var ar = String((v && v.area) || q).slice(0, 20);
      var id = slug(ar) + "-" + Date.now().toString(36).slice(-4);
      var body = { area: ar, q: q, items: items.slice(0, 14), createdAt: new Date().toISOString(), verified: false };
      function land(local){

      var code = e && e.code;
      if(code === "not_granted" || code === "sampling_disabled" || code === "not_declared") logRequest(q, "Claude에게 묻는 것이 허용되지 않았어요.");
      else if(code === "rate_limited"){ statusMsg("지금은 너무 자주 불렀어요. 잠시 뒤에 다시.", true); finishAsk() }
      else if(code === "invalid_json" || code === "empty_completion"){ statusMsg("답이 깨졌어요. 더 짧게 — 예: “피그마”.", true); finishAsk() }
      else if(code === "cancelled"){ statusMsg(""); finishAsk() }
      else { statusMsg("못 가져왔어요 (" + (code || "오류") + "). 잠시 뒤에 다시.", true); finishAsk() }
    });
  });
}

render();
</script>
