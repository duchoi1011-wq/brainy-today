function groupInfo(g){ return GROUPS.filter(function(x){ return x.g === g })[0] || null }

function areaList(){
  var names = GROUPS.map(function(G){ return G.g });
  ADDED.forEach(function(s){ if(names.indexOf(s.g) < 0) names.push(s.g) });

}
function catList(){
  var cs = CATS.slice();
  areaList().forEach(function(g){ var c = catOf(g); if(cs.indexOf(c) < 0) cs.push(c) });
  return cs.filter(function(c){ return areaList().some(function(g){ return catOf(g) === c }) });
}
function areaLead(name){
  var G = groupInfo(name);
  if(G && (G.lead || G.hint)) return G.lead || G.hint;

    return "앱에서 채운 영역이에요. <b>공식 문서로 검증한 값이 아니에요</b> — 눌러 보고 안 먹으면 ✕로 빼요.";

}

function matchMode(text){
  var t = (text || "").toLowerCase();
  if(!t.trim()) return null;
  var best = null, bestN = 0;
  MODES.forEach(function(M){
    var n = 0; M.keys.forEach(function(w){ if(t.indexOf(w) > -1) n++ });
    if(n > bestN){ bestN = n; best = M }
  });
  return best;
}
function viewNow(){
  return card("지금 무슨 일을 하는 중?",
      "<input id=\"ctx\" type=\"text\" placeholder=\"예: EP3 컷 편집 / 위키 ingest 정리 / 견적 보내는 중\" autocomplete=\"off\" value=\"" + esc(ctxText) + "\">" +
      "<div class=\"modes\" id=\"modes\"></div>") +
    "<div id=\"now-out\" style=\"display:flex;flex-direction:column;gap:14px\"></div>" +
    card("여기 없어요?",
      "<div class=\"row2\"><input id=\"ask\" type=\"text\" placeholder=\"예: 슬랙 / 피그마 / 줌 미팅 / 카카오톡 PC\" autocomplete=\"off\"><button class=\"btn primary\" id=\"ask-go\" type=\"button\">찾아서 넣기</button></div>" +
      "<p class=\"status\" id=\"ask-status\" hidden></p>",
      { lead: "쓰려는 앱이나 하는 일을 적으면 찾아서 「분야」에 넣어요. 모든 기기에서 보여요." }) +
    "<details class=\"card\"><summary>프로젝트별로 쓸 것</summary>" + boardHtml() + "</details>";
}
function fillNow(){
  var auto = matchMode(ctxText);
  var M = pickedMode ? MODES.filter(function(m){ return m.id === pickedMode })[0] : auto;
  var md = document.getElementById("modes");
  if(md) md.innerHTML = MODES.map(function(m){
    return "<button type=\"button\" class=\"chip" + (M && M.id === m.id ? " on" : "") + "\" data-mode=\"" + m.id + "\">" + m.name + "</button>";
  }).join("");
  var out = document.getElementById("now-out"); if(!out) return;
  if(!M){
    var open = STARTER.filter(function(s){ return !gone(marks[s.id]) });
    var pick = open.length ? open[Math.floor(Date.now() / 86400000) % open.length] : null;
    out.innerHTML = listCard("먼저 이것만 " + STARTER.length + "개", open, {
      n: open.length + "/" + STARTER.length,
      lead: "하루 열 번 하는 동작부터" + (pick ? " — 오늘은 <b>" + pick.t + "</b>" : "") + ". 위에서 하는 일을 고르면 그 일에 쓰는 것만 나와요.",
      empty: STARTER.length + "개 다 붙였어요 — 「외웠어」 탭에 있어요." });
    return;
  }
  var list = M.ids.map(function(id){ return BY_ID[id] }).filter(Boolean);
  var shown = list.filter(function(s){ return !gone(marks[s.id]) });
  var obs = shown.filter(function(s){ return s.g === "옵시디언" }).length;
  out.innerHTML = listCard(M.name, shown, {
    n: shown.length + (list.length > shown.length ? "/" + list.length : ""),
    lead: M.why + (auto && !pickedMode ? " <span class=\"muted\">(적은 내용으로 골랐어요)</span>" : "") +
      (obs ? " 옵시디언 키 " + obs + "개는 <code>hotkeys.json</code>에 걸어 둔 것 — 옵시디언을 ⌘Q로 껐다 켜야 먹어요." : ""),
    empty: "이 일에 쓰는 건 다 외웠거나 뺐어요." });
}
function boardHtml(){
  return PROJECTS.map(function(p){
    return "<div class=\"proj\"><h4>" + p.name + "</h4><span class=\"role\">" + p.role + "</span><ul>" +
      p.ids.map(function(id){ var s = BY_ID[id]; return s ? "<li><span>" + s.t + "</span>" + combo(s.k) + "</li>" : "" }).join("") + "</ul></div>";
  }).join("");
}

/* ── 분야: 큰 묶음 → 앱 → 아직 / ★ / ✓ / ✕ ── */
var ST = [["todo","아직"], ["fav","★ 즐겨찾기"], ["pass","✓ 외웠어"], ["no","✕ 필요없어"], ["all","전체"]];
function stOk(s, k){ var m = marks[s.id] || ""; return k === "all" || (k === "todo" ? !gone(m) : m === k) }
function viewField(){
  var names = areaList(); if(names.indexOf(area) < 0) area = names[0];
  var h = catList().map(function(c){
    return "<div><p class=\"lbl\">" + esc(c) + "</p><div class=\"chips\">" + names.filter(function(g){ return catOf(g) === c }).map(function(g){
      var left = ITEMS.filter(function(s){ return s.g === g && !gone(marks[s.id]) }).length;
      return "<button type=\"button\" class=\"chip" + (g === area ? " on" : "") + "\" data-area=\"" + esc(g) + "\">" + esc(g) + "<span>" + left + "</span></button>";
    }).join("") + "</div></div>";
  }).join("");
  var all = ITEMS.filter(function(s){ return s.g === area });
  h += "<div class=\"chips\">" + ST.map(function(x){
    var n = all.filter(function(s){ return stOk(s, x[0]) }).length;
    return "<button type=\"button\" class=\"chip" + (st === x[0] ? " on" : "") + "\" data-st=\"" + x[0] + "\">" + x[1] + "<span>" + n + "</span></button>";
  }).join("") + "</div>";
  var list = all.filter(function(s){ return stOk(s, st) });
  // 처음 붙일 7개는 맨 위로
  if(st === "todo" || st === "all") list.sort(function(a, b){ return (b.starter ? 1 : 0) - (a.starter ? 1 : 0) });
  h += listCard(esc(area), list, {
    n: list.length, lead: (st === "todo" ? areaLead(area) : ""),
    empty: st === "todo" ? "이 앱은 다 외웠거나 뺐어요 — 위 ✓·✕ 칸에 있어요." : "여기엔 아직 없어요." });
  return h + legend();
}

/* ── 전체: 찾기 + 모든 단축키 ── */
function viewAll(){
  return "<input id=\"q\" type=\"search\" placeholder=\"이름·키·앱으로 찾기 — 복사, 캡처, ⌘K, premiere…\" autocomplete=\"off\" value=\"" + esc(query) + "\">" +
    "<div id=\"all-out\" style=\"display:flex;flex-direction:column;gap:14px\"></div>";
}
function fillAll(){
  var out = document.getElementById("all-out"); if(!out) return;
  var t = query.trim().toLowerCase();
  if(!t){
    out.innerHTML = legend() + catList().map(function(c){
      return "<p class=\"lbl\" style=\"margin-top:6px\">" + esc(c) + "</p>" + areaList().filter(function(g){ return catOf(g) === c }).map(function(g){
        return listCard(esc(g), ITEMS.filter(function(s){ return s.g === g }), {});
      }).join("");
    }).join("");
    return;
  }
  var res = ITEMS.filter(function(s){
    var hay = (s.t + " " + (s.d || "") + " " + (s.x || "") + " " + s.g + " " + catOf(s.g) + " " + s.k.map(function(c){ return c.join("") }).join(" ")).toLowerCase();
    return hay.indexOf(t) > -1;
  });
  var cs = typeof courseSearch === "function" ? courseSearch(t) : "";
  out.innerHTML = (res.length ? listCard("‘" + esc(t) + "’", res, { src: true }) : "") + cs +
    (!res.length && !cs ? card("‘" + esc(t) + "’ — 없어요",
      "<p class=\"lead\">한글(복사·캡처·리플)이나 영문(cmd, finder, premiere)으로 다시 찾아보거나, 정말 없으면 채워 넣어요.</p>" +
      "<button class=\"btn primary\" type=\"button\" data-fill=\"" + esc(t) + "\">‘" + esc(t) + "’ 찾아서 넣기</button>") : "");
}

/* ── ★ · ✓ · ✕ 탭 — 앱 단축키는 앱별로, 강의 것은 강의별로 ── */
var MK_EMPTY = {
  fav:  "아직 없어요. 자주 볼 건 줄 옆 ★을 눌러 모아요.",
  pass: "아직 없어요. 손에 붙은 건 ✓ — 목록이 가벼워져요.",
  no:   "아직 없어요. 안 쓰는 앱·단축키는 ✕로 치워요."
};
var MK_LEAD = {
  fav:  "★ 한 것 — 목록에도 그대로 있어요. ✓를 누르면 「외웠어」로 넘어가요.",
  pass: "✓ 외운 것 — 목록에서 빠졌어요. 다시 누르면 목록으로 돌아가요.",
  no:   "✕ 필요없다고 뺀 것 — 목록에서 빠졌어요. 다시 누르면 목록으로 돌아가요."
};
function viewMarked(kind){
  var h = "", any = false;
  areaList().forEach(function(g){
    var list = ITEMS.filter(function(s){ return s.g === g && marks[s.id] === kind });
    if(list.length){ any = true; h += listCard(esc(g), list, { right: "<span class=\"n\">" + esc(catOf(g)) + " · " + list.length + "</span>" }) }
  });
  var cs = typeof csMarkedBlock === "function" ? csMarkedBlock(kind) : "";
  return "<p class=\"lead\" style=\"margin:0 2px\">" + MK_LEAD[kind] + "</p>" + h + cs + (!any && !cs ? card(MK[kind].i + " " + MK[kind].n, "<p class=\"empty\">" + MK_EMPTY[kind] + "</p>") : "");
}

/*@@COURSE@@*/

/* ── 누르기 ── */
document.addEventListener("click", function(e){
  var b;
  if((b = e.target.closest("[data-mark]"))){ setMark(b.getAttribute("data-id"), b.getAttribute("data-mark")); refresh(); return }
  if((b = e.target.closest("[data-tab]"))){ show(b.getAttribute("data-tab")); return }
  if((b = e.target.closest("[data-area]"))){ area = b.getAttribute("data-area"); save("sc.area", area); render(); return }
  if((b = e.target.closest("[data-goarea]"))){ area = b.getAttribute("data-goarea"); save("sc.area", area); st = "all"; show("field"); return }
  if((b = e.target.closest("[data-st]"))){ st = b.getAttribute("data-st"); render(); return }
  if((b = e.target.closest("[data-mode]"))){ var mid = b.getAttribute("data-mode"); pickedMode = pickedMode === mid ? null : mid; fillNow(); return }
  if((b = e.target.closest("[data-fill]"))){
    query = ""; show("now");
    var box = document.getElementById("ask"); box.value = b.getAttribute("data-fill"); askFor(box.value); return;
  }
  if(e.target.closest("#ask-go")){ askFor(document.getElementById("ask").value); return }
});
document.addEventListener("input", function(e){
  if(e.target.id === "ctx"){ ctxText = e.target.value; pickedMode = null; fillNow() }
  if(e.target.id === "q"){ query = e.target.value; fillAll() }
});
document.addEventListener("keydown", function(e){
  var a = document.activeElement, typing = a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName);
  if(e.target.id === "ask" && e.key === "Enter"){ e.preventDefault(); askFor(e.target.value); return }
  if(e.key === "/" && !typing){ e.preventDefault(); if(current !== "all") show("all"); var q = document.getElementById("q"); if(q) q.focus(); return }
  if(e.key === "Escape" && a && a.id === "q"){ query = ""; a.value = ""; fillAll(); a.blur() }
});

/* ── 없어요 → 채우기: Claude에게 묻고 db에 남긴다 ── */
var SAMPLE = null, DB = null, askBusy = false;
function slug(s){
  return String(s || "").replace(/[^0-9A-Za-z가-힣]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 32) || "x";
}
function statusMsg(t, err){
  var el = document.getElementById("ask-status"); if(!el) return;
  el.hidden = !t; el.textContent = t || ""; el.className = "status" + (err ? " err" : "");
}
function docToItems(id, v){
  var out = [];
  (v.items || []).forEach(function(it, i){
    if(!it || !Array.isArray(it.keys) || !it.keys.length) return;
    var keys = it.keys.map(function(c){ return Array.isArray(c) ? c.map(String) : [String(c)] });
    out.push({ id: "add-" + id + "-" + i, k: keys, t: esc(String(it.title || "").slice(0, 60)),
      d: esc(String(it.desc || "").slice(0, 90)), g: String(v.area || "추가됨").slice(0, 20),
      tag: it.confidence === "low" ? "확인 필요" : "앱 추가", unver: 1,
      x: String((v.area || "") + " " + (it.title || "") + " " + (v.q || "")) });
  });
  return out;
}
var capReady;   // sample·db 준비가 끝나면 resolve
(function(){
  var done;
  capReady = new Promise(function(r){ done = r });
  if(!window.claude || typeof claude.use !== "function"){ done(); return }
  var a = claude.use("sample").then(function(s){ SAMPLE = s }, function(){});
  var b = claude.use("db").then(function(d){
    if(!d) return;
    DB = d;
    try{
      DB.collection("additions").onSnapshot(function(snap){
        ADDED = [];
        snap.docs.forEach(function(doc){ var v = doc.data(); if(v) ADDED = ADDED.concat(docToItems(doc.id, v)) });
        repaint();
      }, function(){});
    }catch(e){}
  }, function(){});
  Promise.all([a, b]).then(function(){ done() }, function(){ done() });
  setTimeout(done, 12000);
})();
var ASK_RULES =
 "너는 macOS 키보드 단축키 레퍼런스다. 아래 요청에 해당하는 맥 단축키를 JSON으로만 답한다.\n\n" +
 "규칙:\n" +
 "- macOS 조합만. 기호는 ⌘ ⌥ ⌃ ⇧ fn 를 쓰고 글자는 대문자 한 글자로 쓴다. Windows의 Ctrl 버전은 쓰지 않는다.\n" +
 "- 하루에 여러 번 쓰는 동작만 6~12개. 전부 나열하지 않는다.\n" +
 "- 확실하지 않은 항목은 confidence를 \"low\"로 한다. 모르면 아예 넣지 않는다. 지어내지 않는다.\n" +
 "- title과 desc는 한국어. desc는 한 줄, 없으면 빈 문자열.\n" +
 "- area는 그 도구나 작업의 짧은 한국어 이름 (예: 슬랙, 피그마, 줌, 카카오톡).\n" +
 "- 그 도구에 단축키가 없거나 요청이 단축키와 무관하면 items를 빈 배열로 둔다.\n\n" +
 "형식 — 이 JSON 값 하나만, 다른 말 없이:\n" +
 "{\"area\":\"슬랙\",\"items\":[{\"keys\":[[\"⌘\",\"K\"]],\"title\":\"대화로 이동\",\"desc\":\"채널·사람 이름으로\",\"confidence\":\"high\"}]}\n" +
 "keys는 조합의 배열이다 — 대안이 둘이면 [[\"⌘\",\"K\"],[\"⌘\",\"T\"]].\n\n요청: ";
function finishAsk(){
  askBusy = false;
  var b = document.getElementById("ask-go");
  if(b){ b.disabled = false; b.textContent = "찾아서 넣기" }
}
function logRequest(q, why){
  if(!DB){ statusMsg(why + " 이 화면에서는 저장도 안 돼요 — Brainy에게 “단축키에 " + q + " 넣어줘”라고 해 주세요.", true); finishAsk(); return }
  DB.collection("requests").doc(slug(q) + "-" + Date.now().toString(36).slice(-4))
    .set({ q: q, createdAt: new Date().toISOString(), done: false })
    .then(function(){ var a = document.getElementById("ask"); if(a) a.value = ""; statusMsg(why + " 요청으로 남겼어요 — 맥의 Brainy가 공식 문서로 찾아 넣어요.") })
    .catch(function(){ statusMsg(why + " 저장도 안 됐어요 — Brainy에게 말해 주세요.", true) })
    .then(finishAsk);
}
function askFor(q){
  q = String(q || "").trim();
  if(!q || askBusy) return;
  askBusy = true;
  var btn = document.getElementById("ask-go");
  if(btn){ btn.disabled = true; btn.textContent = "찾는 중…" }
  statusMsg("준비 중…");
  capReady.then(function(){
    if(!SAMPLE){ logRequest(q, "이 화면에서는 바로 찾을 수 없어요."); return }
    statusMsg("찾는 중… (처음 한 번은 허용할지 물어요)");
    SAMPLE.json(ASK_RULES + q).then(function(v){
      var items = (v && Array.isArray(v.items)) ? v.items : [];
      if(!items.length){ statusMsg("쓸 만한 게 안 나왔어요. 더 좁혀서 — 예: “슬랙 메시지 작성”, “줌 음소거”.", true); finishAsk(); return }
      var ar = String((v && v.area) || q).slice(0, 20);
      var id = slug(ar) + "-" + Date.now().toString(36).slice(-4);
      var body = { area: ar, q: q, items: items.slice(0, 14), createdAt: new Date().toISOString(), verified: false };
      function land(local){
        if(local){ ADDED = ADDED.concat(docToItems(id, body)); reindex() }
        finishAsk();
        area = ar; save("sc.area", area); st = "todo"; show("field");
      }
      if(DB) DB.collection("additions").doc(id).set(body).then(function(){ land(false) }, function(){ land(true) });
      else land(true);
    }, function(e){
      var code = e && e.code;
      if(code === "not_granted" || code === "sampling_disabled" || code === "not_declared") logRequest(q, "Claude에게 묻는 것이 허용되지 않았어요.");
      else if(code === "rate_limited"){ statusMsg("지금은 너무 자주 불렀어요. 잠시 뒤에 다시.", true); finishAsk() }
      else if(code === "invalid_json" || code === "empty_completion"){ statusMsg("답이 깨졌어요. 더 짧게 — 예: “피그마”.", true); finishAsk() }
      else if(code === "cancelled"){ statusMsg(""); finishAsk() }
      else { statusMsg("못 가져왔어요 (" + (code || "오류") + "). 잠시 뒤에 다시.", true); finishAsk() }
    });
  });
}

render();
</script>
