<style>
/* Layout: 폰 한 손 앱 — 위에 오늘 날짜와 브리핑, 가운데 카드 흐름, 아래 고정 탭. 이해도 ①~⑤를 초록 농도 램프로. */

  --accent: #6cc2ad; --accent-ink: #0d1f1a; --accent-soft: #1b3530; --warn: #e3a35e; --warn-soft: #3a2a18; --good: #6cc48e;
