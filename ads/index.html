<style>
:root{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}
/* 폰: 입력칸 글자가 16px보다 작으면 아이폰이 칸을 누를 때 화면을 확대해 버린다 → 왼쪽이 잘리고 아래 탭이 밀림 */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{max-width:100%;overflow-x:clip}
@media (pointer:coarse){input,textarea,select{font-size:16px!important}}
:root{--g-bg:var(--bg);--g-fg:var(--ink);--g-mut:var(--muted);--g-card:var(--surface);--g-line:var(--line);--g-acc:var(--accent);--g-acc-ink:var(--accent-ink);--g-warn:var(--s-stop);--g-ok:var(--s-run)}
#gate{position:fixed;inset:0;z-index:50;background:var(--g-bg);color:var(--g-fg);display:grid;place-items:center;padding:24px;font-family:inherit}
#gate .gbox{width:100%;max-width:340px;display:grid;gap:10px;justify-items:stretch}
#gate img{border-radius:14px;justify-self:start}
#gate h1{font-size:24px;margin:0}#gate .gsub{color:var(--g-mut);margin:0 0 8px}
#gate label{font-size:13px;color:var(--g-mut);margin-top:4px}
#gate input{font:inherit;font-size:16px;color:var(--g-fg);background:var(--g-card);border:1px solid var(--g-line);border-radius:10px;padding:11px 12px;width:100%}
#gate button{font:inherit;font-weight:600;cursor:pointer;margin-top:8px;padding:11px 14px;border-radius:999px;border:1px solid var(--g-line);background:var(--g-card);color:var(--g-fg)}
#gate button[type=submit]{background:var(--g-acc);border-color:var(--g-acc);color:var(--g-acc-ink)}
#gate .gerr{color:var(--g-warn);font-size:13px;min-height:18px}
/* 새로고침 버튼 (세 앱 공통, shim.js) — 오른쪽 위 작은 알약: 실시간 점 · ↻ · 마지막 동기화/반영 상태 */
#bsync{position:fixed;z-index:11;top:calc(8px + env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));display:inline-flex;align-items:center;gap:6px;max-width:min(62vw,240px);height:30px;padding:0 11px 0 9px;border-radius:999px;border:1px solid var(--g-line);background:var(--g-card);color:var(--g-mut);font:inherit;font-size:12px;font-weight:600;line-height:1;cursor:pointer;-webkit-tap-highlight-color:transparent}
#bsync:hover{color:var(--g-fg)}#bsync:focus-visible{outline:2px solid var(--g-acc);outline-offset:2px}
#bsync .bs-tx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
#bsync .bs-ic{font-size:14px;color:var(--g-acc)}
#bsync.busy{color:var(--g-fg);border-color:var(--g-acc)}#bsync.busy .bs-ic{animation:bsspin 1s linear infinite}
#bsync.macoff{border-style:dashed}
@keyframes bsspin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#bsync.busy .bs-ic{animation:none}}
#rtdot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--g-line)}
#rtdot.on{background:var(--g-ok)}#rtdot.off{background:var(--g-warn)}
#bsync-tip{position:fixed;z-index:11;top:calc(44px + env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));max-width:min(86vw,340px);padding:8px 12px;border-radius:12px;border:1px solid var(--g-line);background:var(--g-card);color:var(--g-fg);font-size:13px;line-height:1.45;box-shadow:0 4px 14px rgba(0,0,0,.12)}
header>.brand{padding-right:min(46vw,190px)}

</style>

<style>
/* 틀은 강의 실습과 같다 — 한 줄 칸(640px) · 고정 머리말(브랜드 고르기 + 숫자 5개) · 카드 · 아래 탭 막대.
   상태 색 4개(집행 중·멈춤·준비·없음)와 급함 색 3개(높음·중간·참고)는 모든 탭이 같이 쓴다 — 여기 한 곳에서만 정한다 */
:root{
  --bg:#F1F3F2; --surface:#FFFFFF; --surface-2:#F5F7F6; --ink:#141A18; --muted:#5B6662; --line:#D8DEDB;
  --accent:#0F6E5E; --accent-ink:#FFFFFF; --now-bg:#E3F1EE;
  --s-run:#1C9467; --s-stop:#B97F00; --s-prep:#3A78D4; --s-none:#A3A6B3; --s-bad:#C23B2C;
  --f-body:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1413; --surface:#171E1C; --surface-2:#1C2422; --ink:#E5ECE9; --muted:#97A39F; --line:#29332F;
  --accent:#5CC3AE; --accent-ink:#0B1F1A; --now-bg:#17302B;
  --s-run:#38C18A; --s-stop:#F0B52A; --s-prep:#5C9BF0; --s-none:#5E6272; --s-bad:#F07A6A;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F1413; --surface:#171E1C; --surface-2:#1C2422; --ink:#E5ECE9; --muted:#97A39F; --line:#29332F;
  --accent:#5CC3AE; --accent-ink:#0B1F1A; --now-bg:#17302B;
  --s-run:#38C18A; --s-stop:#F0B52A; --s-prep:#5C9BF0; --s-none:#5E6272; --s-bad:#F07A6A;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 calc(84px + env(safe-area-inset-bottom, 0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--bg)}
html{overflow-y:scroll}
.wrap{max-width:640px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--bg);padding-block:14px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:20px;font-weight:700;margin:0;letter-spacing:-.01em}
.brand small{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.brand #sub{font-family:var(--f-body);flex:1 1 0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .out{font:inherit;color:inherit;background:none;border:0;padding:0;text-decoration:underline;cursor:pointer}
.brand .links a,.brand .links .out{display:inline-flex;align-items:center;min-height:44px;margin-block:-13px;padding-inline:2px}
main{display:flex;flex-direction:column;gap:16px;padding-top:16px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
h2{font-size:13px;font-weight:600;letter-spacing:.06em;color:var(--muted);margin:0 0 12px}
h3{font-size:18px;font-weight:700;margin:0;text-wrap:balance;line-height:1.4}
p{margin:0}
a{color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.empty{padding:22px 4px;text-align:center;color:var(--muted)}
button{font:inherit}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:11px 16px;border-radius:10px;font-weight:600;cursor:pointer;min-height:44px;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1 1 160px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;min-height:44px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip b{font-family:var(--f-mono);font-weight:500;font-size:12px;margin-left:4px;opacity:.8}
.filt{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.filt::-webkit-scrollbar{display:none}.filt .chip{flex:none;white-space:nowrap}
/* 브랜드 고르기 — 강의 실습의 강의 고르기와 같은 띠 */
.seg{display:flex;gap:0;margin-top:10px;border:1px solid var(--line);border-radius:10px;overflow-x:auto;background:var(--surface);scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;border:0;background:transparent;color:var(--muted);padding:8px 12px;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap;min-height:44px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.seg button span{font-family:var(--f-mono);font-weight:500;font-size:11px;margin-left:5px;opacity:.8}
.segwrap{position:relative}
.segwrap.more::after{content:"›";position:absolute;right:1px;top:11px;bottom:1px;width:36px;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;font-size:20px;font-weight:700;color:var(--accent);background:linear-gradient(90deg,transparent,var(--surface) 60%);border-radius:0 10px 10px 0;pointer-events:none}
/* 머리말 숫자 — 누르면 그 숫자가 나온 탭으로 */
.sum{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:10px}
.sum button{all:unset;cursor:pointer;display:flex;flex-direction:column;padding:6px 8px;border-radius:10px;background:var(--surface);border:1px solid var(--line);min-width:0}
.sum button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sum b{font-size:16px;font-variant-numeric:tabular-nums;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sum b small{font-size:11px;font-weight:500;color:var(--muted)}
.sum span{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sum .bad b{color:var(--s-bad)}
/* 상태 알약 · 급함 띠 */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;border:1px solid var(--line);white-space:nowrap;color:var(--muted)}
.pill.run{color:var(--s-run);border-color:var(--s-run)}.pill.stop{color:var(--s-stop);border-color:var(--s-stop)}.pill.prep{color:var(--s-prep);border-color:var(--s-prep)}.pill.none{border-style:dashed}
.pill.high{color:var(--s-bad);border-color:var(--s-bad)}.pill.mid{color:var(--s-stop);border-color:var(--s-stop)}
.pill.solid{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.row{all:unset;box-sizing:border-box;display:flex;gap:10px;align-items:flex-start;width:100%;padding:10px 10px 10px 12px;border-top:1px solid var(--line)}
button.row{cursor:pointer}
.row:first-child{border-top:0}
.row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:8px}
.row::before{content:"";flex:none;width:4px;align-self:stretch;border-radius:2px;background:var(--s-none)}
.row.run::before{background:var(--s-run)}.row.stop::before{background:var(--s-stop)}.row.prep::before{background:var(--s-prep)}
.row.high::before{background:var(--s-bad)}.row.mid::before{background:var(--s-stop)}.row.low::before{background:var(--s-prep)}
.row.none::before{background:repeating-linear-gradient(180deg,var(--s-none) 0 4px,transparent 4px 8px)}
.row .ct{flex:1;min-width:0}
.row .ct b{display:block;font-weight:600;line-height:1.45}
.row .ct span{display:block;font-size:13px;color:var(--muted)}
.row .tags{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.figs{display:flex;flex-wrap:wrap;gap:2px 12px;font-family:var(--f-mono);font-size:12.5px;color:var(--muted);margin-top:2px}
.figs i{font-style:normal;color:var(--ink)}
.part{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 0 4px}
.part h2{margin:0;letter-spacing:.02em;font-size:14px;color:var(--ink)}
.part small{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--s-none)}
.legend i.run{background:var(--s-run)}.legend i.stop{background:var(--s-stop)}.legend i.prep{background:var(--s-prep)}.legend i.high{background:var(--s-bad)}.legend i.none{background:transparent;border:1px dashed var(--s-none)}
/* 지금 — 조율할 일 */
.todo .act{margin-top:8px}
.todo .act .btn{flex:0 1 auto;padding:8px 14px;font-size:14px;min-height:40px}
.why{font-size:13.5px;color:var(--muted);margin-top:2px}
/* 숫자 칸 */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px;margin-top:10px}
.stat{background:var(--surface-2);border-radius:10px;padding:8px 10px;min-width:0}
.stat .k{display:block;font-size:12px;color:var(--muted);font-weight:600}
.stat .v{display:block;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:17px;overflow-wrap:anywhere}
.stat .s{display:block;font-size:11.5px;color:var(--muted)}
/* 매체 줄 (지도) */
.chrow{display:grid;grid-template-columns:64px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.chrow:first-of-type{border-top:0}
.chrow>b{font-size:14px}
.chrow .plan{font-size:13.5px;color:var(--muted)}
.tasklist{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
/* 판정 막대 — 누적 클릭 · 조정·정지 눈금 */
.meter{position:relative;height:6px;border-radius:99px;background:var(--surface-2);margin-top:6px;border:1px solid var(--line)}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--accent);max-width:100%}
.meter b{position:absolute;top:-4px;width:2px;height:12px;background:var(--muted);border-radius:1px}
/* 14일 막대 */
.bars{display:flex;align-items:flex-end;gap:3px;height:64px;margin-top:10px}
.bars i{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:1px;opacity:.85}
.bars i.zero{background:var(--line)}
.barcap{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-top:3px}
.back{all:unset;cursor:pointer;font-weight:600;color:var(--accent);font-size:14px;min-height:44px;display:inline-flex;align-items:center}
.plain{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.plain li{padding-left:14px;position:relative}.plain li::before{content:"·";position:absolute;left:2px;color:var(--muted)}
.logline{display:grid;grid-template-columns:84px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.logline:first-child{border-top:0}
.logline .d{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:2px}
.more{all:unset;cursor:pointer;color:var(--accent);font-weight:600;font-size:14px;min-height:44px;display:flex;align-items:center;justify-content:center;width:100%}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;gap:4px;background:var(--surface);border-top:1px solid var(--line);padding:6px max(12px, env(safe-area-inset-left, 0px)) calc(6px + env(safe-area-inset-bottom, 0px))}
#tabbar a{flex:0 1 160px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;border-radius:12px;color:var(--muted);text-decoration:none;font-weight:600;font-size:13px;min-height:44px;position:relative}
#tabbar a span{font-size:18px;line-height:1.1}
#tabbar a.on{color:var(--accent);background:var(--surface-2)}
#tabbar a em{position:absolute;top:2px;right:calc(50% - 26px);font-style:normal;background:var(--s-bad);color:#fff;font-family:var(--f-mono);font-size:10px;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center;padding:0 4px}
#toast{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));max-width:calc(100vw - 32px);background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;font-size:14px;box-shadow:0 10px 28px rgba(0,0,0,.25)}
@media (max-width:480px){.brand #sub{display:none}}
@media (max-width:420px){.sum{gap:4px}.sum button{padding:5px 6px}.sum b{font-size:14px}.card{padding:16px}.chrow{grid-template-columns:52px 1fr}}
@media (prefers-reduced-motion:no-preference){main>.card{animation:fade .18s ease-out}@keyframes fade{from{opacity:.5}to{opacity:1}}}
</style>

    <div class="brand"><h1>광고 한눈에</h1><small id="sub">모든 브랜드 × 네이버·메타·구글</small><small class="muted links" style="font-size:12px;flex-basis:100%"><a href="../home/" style="color:inherit">← Brainy 홈</a> · <a href="../ad/" style="color:inherit">광고 실습</a> · <button type="button" class="out" data-brainy="out">로그아웃</button></small></div>

<script>/* Brainy 공통 부품 — 모든 앱이 같이 쓴다 */
/* Brainy 공통 부품 — 모든 앱(Brainy 홈 · 맥 단축키 · 체화 단어장 · 콘텐츠 기획)이 같이 쓴다. 여기 한 곳만 고치면 모든 앱이 바뀐다 (2026-11-24 동욱).
   원본 html 의 앱 스크립트 바로 앞, 이 파일을 끼우는 include 자리에 들어간다 → 앱 코드와 대화창(brainy-chat.js)보다 먼저 선다.
   · 답할 모델 버튼 줄 — modelRow() · 고른 값은 config/ai 의 model 하나를 모든 앱이 공유 (클라우드 Brainy 가 다음 질문부터 이 모델로, 짧은 일은 늘 Haiku)
   · 첫 안내문 — hello() · 노트 쓰기 도구(vault_write) 규칙 — NOTE_RULE
   · 「이 ○○는 고쳐요」 표시 + Brainy에게 맡기기 — fixHtml() · fixAsk() · ask()
   · 위 것들의 생김새 — 앱의 색(--ink·--accent …, 없으면 --g-*)을 따른다 */
(function () {
  "use strict";
  if (window.BRAINY_PARTS) return;
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  /* ── 생김새 ── */
  var css = document.createElement("style");
  css.textContent =
    /* 색 — 네 앱이 같이 쓰는 이름(--ink·--muted·--line·--surface·--accent)을 먼저, 없으면 받침의 --g-* */
    ".bp-models,.bp-hello,.bp-fix,.bp-fix-done,.bp-fix-tag,.bp-fixask{--bp-fg:var(--ink,var(--bp-fg));--bp-mut:var(--muted,var(--bp-mut));--bp-line:var(--line,var(--bp-line));" +
    "--bp-bg:var(--bg,var(--g-bg,#fff));--bp-card:var(--surface,var(--g-card,#fff));--bp-acc:var(--accent,var(--g-acc,#2f6f5e));--bp-acc-ink:var(--accent-ink,var(--g-acc-ink,#fff))}" +
    /* 모델 버튼 줄 */
    ".bp-models{display:flex;gap:4px;padding:8px 10px;border-bottom:1px solid var(--bp-line);background:var(--bp-card);min-width:0}" +
    ".bp-m{flex:1;min-width:0;min-height:44px;padding:4px 2px;border:1px solid var(--bp-line);border-radius:12px;background:var(--bp-bg);color:var(--bp-fg);font:inherit;line-height:1.2;display:grid;place-content:center;text-align:center;cursor:pointer}" +
    ".bp-m b{display:block;font-size:13.5px;white-space:nowrap}.bp-m small{display:block;font-size:11px;color:var(--bp-mut)}" +
    ".bp-m:hover{border-color:var(--bp-acc)}.bp-m:disabled{opacity:.5;cursor:default}" +
    ".bp-m[aria-pressed=true]{background:var(--bp-acc);border-color:var(--bp-acc);color:var(--bp-acc-ink)}.bp-m[aria-pressed=true] small{color:inherit;opacity:.85}" +
    /* 첫 안내문 */
    ".bp-hello{align-self:flex-start;justify-self:start;max-width:90%}.bp-hello b{display:block;font-size:17px;margin-bottom:4px}" +
    ".bp-hello p{margin:0;font-size:13.5px;line-height:1.6;color:var(--bp-mut)}" +
    /* 「이 ○○는 고쳐요」 칸 */
    ".bp-fix{display:flex;flex-direction:column;gap:8px;padding:10px 12px;border-radius:10px;background:var(--surface-2,var(--bp-card));border-left:3px solid var(--bp-acc);font-size:14px;color:var(--bp-fg)}" +
    ".bp-fix-l{display:block;font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--bp-mut)}" +
    ".bp-fix textarea{width:100%;box-sizing:border-box;min-height:64px;resize:vertical;font:inherit;color:var(--bp-fg);background:var(--bp-card);border:1px solid var(--bp-line);border-radius:10px;padding:9px 11px}" +
    ".bp-fix textarea:focus-visible{outline:2px solid var(--bp-acc);outline-offset:2px}" +
    ".bp-fix-t{white-space:pre-wrap;overflow-wrap:anywhere}.bp-fix-t .bp-mut{color:var(--bp-mut)}" +
    ".bp-fix-b{display:flex;gap:6px;flex-wrap:wrap}" +
    ".bp-fix-done{margin:4px 0 0;font-size:12.5px;color:var(--bp-mut)}" +
    ".bp-fix-tag{color:var(--bp-acc)!important;border-color:var(--bp-acc)!important}";
  (document.head || document.documentElement).appendChild(css);

  /* ── 답할 모델 — 모든 앱이 config/ai 의 model 하나를 같이 쓴다 (값: auto 또는 모델 id) ── */
  var MODELS = [["auto", "자동", "auto"], ["claude-haiku-5-5", "빠름", "Haiku"], ["claude-sonnet-5-5", "기본", "Sonnet"], ["claude-opus-5-5", "깊게", "Opus"], ["claude-fable-5-1", "최고", "Fable"]];
  var SHORT = { "claude-haiku-5-5": "haiku", "claude-sonnet-5-5": "sonnet", "claude-opus-5-5": "opus" };   // 맥에서 답할 때 넘기는 이름 (콘텐츠 기획 「Claude 모드」와 같은 꼴)
  var LS = "bp.model", model = "auto", DB = null, fns = [];
  try { model = localStorage.getItem(LS) || "auto"; } catch (e) {}
  function valid(m) { return MODELS.some(function (x) { return x[0] === m; }) ? m : "auto"; }
  model = valid(model);
  function take(m) { m = valid(m); if (m === model) return; model = m; try { localStorage.setItem(LS, m); } catch (e) {} paintModels(); fns.forEach(function (f) { try { f(m); } catch (e) {} }); }
  function modelRow(label) {
    return '<div class="bp-models" role="group" aria-label="' + esc(label || "답할 Claude 모델 — 다음 질문부터, 모든 앱에 같이") + '">' + MODELS.map(function (m) {
      var on = m[0] === model;
      return '<button type="button" class="bp-m" data-bp-model="' + m[0] + '" aria-pressed="' + on + '"' + (DB ? "" : " disabled") + ' title="' + esc(m[1] + " · " + m[2] + (on ? " — 지금 이 모델로 답해요" : " — 누르면 다음 질문부터 (모든 앱)")) + '"><b>' + (on ? "✓ " : "") + m[1] + "</b><small>" + m[2] + "</small></button>";
    }).join("") + "</div>";
  }
  function paintModels() { [].forEach.call(document.querySelectorAll(".bp-models"), function (el) { el.outerHTML = modelRow(el.getAttribute("aria-label")); }); }
  document.addEventListener("click", function (e) {
    var b = e.target.closest && e.target.closest("[data-bp-model]"); if (!b || !DB) return;
    take(b.getAttribute("data-bp-model"));
    DB.doc("config/ai").set({ model: model, at: new Date().toISOString() }).catch(function () {});
  });
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", paintModels); else paintModels();   // 앱 html 에 미리 둔 빈 줄(.bp-models)도 채운다
  function pull() { if (DB && window.BRAINY && BRAINY.fetch) BRAINY.fetch("config/ai").then(function (d) { take((d && d.model) || "auto"); }, function () {}); }
  if (window.claude && claude.use) claude.use("db").then(function (db) {
    if (!db) return; DB = db; paintModels(); pull();
    db.doc("config/ai").onSnapshot(function (s) { if (s.exists) take((s.data() || {}).model || "auto"); }, function () {});   // 홈처럼 config 를 받는 앱은 실시간으로
    document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") pull(); });   // 다른 앱에서 바꾼 것도 다시 볼 때 맞춘다
  }, function () {});

  /* ── 노트 쓰기 도구 — 앱 대화 규칙에 같이 넣는 한 줄 ── */
  var NOTE_RULE = "- 볼트 노트(위키 페이지·단어 뜻·태스크 노트 등)를 쓰거나 고치라고 하면 앱 고치기(app_edit_start)가 아니라 노트 쓰기 도구 vault_write 로 바로 한다: 먼저 vault_search·vault_read 로 지금 내용을 읽고, 바꿀 곳만 patch 로 고치고, 없는 페이지는 같은 영역의 다른 페이지 형식에 맞춰 create 로 만든다. 쓴 뒤엔 어디를 고쳤는지와 맥이 켜져 있으면 몇 초 안에 옵시디언 볼트에 들어간다고 한 줄로 알린다. 시키지 않은 노트는 쓰지 않는다. 노트 쓰기는 .md 노트만 된다.";

  /* ── 첫 안내문 — o: {name 앱 이름, what 첫 문장(없으면 기본), editNote 앱 고치기 설명, local 로컬 앱, pics 사진 보내기 됨} → {title, text} ── */
  function hello(o) {
    o = o || {};
    if (o.local) return { title: "동욱 님, 무엇을 도와드릴까요?", text: (o.name || "이 앱") + "에 대해 묻거나 바꾸고 싶은 걸 말해 주세요. " + (o.editNote || "이 맥의 Claude가 앱 원본을 바로 고쳐요. 고친 뒤 새로고침하면 보여요.") };
    return { title: "동욱 님, 무엇을 도와드릴까요?",
      text: (o.what || (o.name || "이 앱") + "에 대해 묻거나 바꾸고 싶은 걸 말해 주세요.") +
        " 위키 페이지·단어 뜻 같은 볼트 노트도 쓰거나 고쳐 달라고 하면 바로 해요 — 맥이 켜져 있으면 몇 초 안에 볼트에 들어가요." +
        " 앱 화면을 바꿔 달라고 하면 " + (o.editNote || "고친 판이 5~15분 뒤 준비되고, 「적용해 줘」라고 해야 실제 앱에 들어가요.") +
        (o.pics === false ? "" : " 📎로 사진(화면 캡처)도 같이 보낼 수 있어요 — 붙여 넣어도 돼요.") };
  }
  function helloHtml(o) { var h = hello(o); return '<div class="bp-hello"><b>' + esc(h.title) + "</b><p>" + esc(h.text) + "</p></div>"; }

  /* ── 「이 ○○는 고쳐요」 칸 — 체화 단어장 고칠 단어 방식 (2026-11-24 동욱: 맥 단축키도 같은 방식으로)
     o: {id, what "단어"·"단축키", on 표시됨, text 적은 글, at 날짜, editing 쓰는 중, done {at, note} 지난번 고친 내용, placeholder, label 글칸 이름,
         attr(act, id) 단추 속성 — act: edit·save·cancel·del, btn {primary, ghost} 앱의 단추 class}
     저장 = 표시 + 적은 글(글 없이 표시만도 됨) · 표시 풀기 = 둘 다 지움. 글칸은 class rq-in · id "rq-<id>" (앱이 그 값을 읽는다) ── */
  function fixHtml(o) {
    var id = esc(o.id), w = o.what || "항목", A = o.attr || function (a, i) { return 'data-fix="' + a + '" data-id="' + esc(i) + '"'; };
    var P = (o.btn && o.btn.primary) || "btn primary", G = (o.btn && o.btn.ghost) || "btn ghost";
    function bt(cls, a, label) { return '<button type="button" class="' + cls + '" ' + A(a, o.id) + ">" + label + "</button>"; }
    if (o.editing) return '<div class="bp-fix"><span class="bp-fix-l">이 ' + esc(w) + "는 고쳐요 — 무엇이 틀렸나요?</span>" +
      '<textarea class="rq-in" id="rq-' + id + '" maxlength="300" placeholder="' + esc(o.placeholder || "예: 틀림 / 다른 것과 중복 / 설명이 너무 기본적임") + '" aria-label="' + esc((o.label || w) + " 고칠 점") + '">' + esc(o.text || "") + "</textarea>" +
      '<div class="bp-fix-b">' + bt(P, "save", "저장") + bt(G, "cancel", "취소") + (o.on ? bt(G, "del", "표시 풀기") : "") + "</div></div>";
    if (o.on) return '<div class="bp-fix"><span class="bp-fix-l">✓ 고칠 ' + esc(w) + (o.at ? " · " + esc(String(o.at).slice(0, 10)) : "") + '</span><span class="bp-fix-t">' + (o.text ? esc(o.text) : '<span class="bp-mut">적은 글이 없어요</span>') + "</span>" +
      '<div class="bp-fix-b">' + bt(G, "edit", "글 고치기") + bt(G, "del", "표시 풀기") + "</div></div>";
    return bt((o.btn && o.btn.mark) || G, "edit", "✎ 이 " + esc(w) + "는 고쳐요 (오류·중복)") +
      (o.done && o.done.note ? '<p class="bp-fix-done">지난번 고친 내용 · ' + esc(String(o.done.at || "").slice(0, 10)) + " · " + esc(o.done.note) + "</p>" : "");
  }
  /* Brainy에게 맡기기 단추 — o: {n 고칠 개수, sub 무엇까지 하는지, cls, attr} */
  function fixAsk(o) { return o.n ? '<button type="button" class="' + (o.cls || "btn primary") + '" ' + (o.attr || 'data-bp-fixask="1"') + ">✦ Brainy에게 고치기 맡기기" + (o.sub ? " — " + esc(o.sub) : "") + "</button>" : ""; }
  /* 대화창을 열고 그 말로 맡긴다 */
  function ask(q) { if (window.BRAINY_CHAT) window.BRAINY_CHAT.ask(q); else alert("Brainy 대화창이 아직 준비되지 않았어요. 로그인을 확인하고 잠시 뒤 다시 눌러 주세요."); }

  window.BRAINY_PARTS = {
    esc: esc, MODELS: MODELS, NOTE_RULE: NOTE_RULE,
    model: function () { return model; },
    modelShort: function () { return SHORT[model] || ""; },
    onModel: function (f) { fns.push(f); },
    modelRow: modelRow, paintModels: paintModels,
    hello: hello, helloHtml: helloHtml,
    fixHtml: fixHtml, fixAsk: fixAsk, ask: ask
  };
})();

</script>
<script>
/* 광고 한눈에 — 모든 브랜드의 모든 광고(네이버·메타·구글)를 한 화면에서 파악하고, 조율은 Brainy에게 넘긴다.
   데이터는 볼트가 정본이다: 4_Outputs/광고 한눈에 앱/광고 한눈에.json (브랜드·매체 상태·판정 기준·변경 기록)
   + 맥 동기화(볼트 .claude/scripts/adhub_app.py)가 네이버 검색광고·스마트스토어 API 에서 받은 숫자 → Supabase ah.data/main.
   광고 태스크 상태는 광고 실습 앱과 같은 ad.data/main 을 읽는다. 이 앱은 아무것도 쓰지 않는다 — 「Brainy와 조율」은 대화창을 채울 뿐(보내기는 동욱이 ↑).
   숫자·목록을 코드에 넣지 않는다. 판정 기준 숫자(30·50)도 데이터의 hub.rules 에서 읽는다. */
let D = null, AD = null, loaded = false;
const S = { bid: lsGet("ah.bid", "all"), filt: "act", camp: "", from: "map", kwMore: false };

function lsGet(k, d){ try { const v = JSON.parse(localStorage.getItem(k) || "null"); return v == null ? d : v; } catch (e) { return d; } }
function lsPut(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const won = n => n == null || !isFinite(n) ? "—" : Math.round(n).toLocaleString("ko-KR");
const wonK = n => n == null || !isFinite(n) ? "—" : n >= 100000 ? (n / 10000).toFixed(n >= 1000000 ? 0 : 1).replace(/\.0$/, "") + "만" : Math.round(n).toLocaleString("ko-KR");
const ago = iso => { if (!iso) return "—"; const m = Math.round((Date.now() - new Date(iso)) / 60000); return m < 1 ? "방금" : m < 60 ? m + "분 전" : m < 1440 ? Math.round(m / 60) + "시간 전" : Math.round(m / 1440) + "일 전"; };
function toast(msg){
  let el = document.getElementById("toast");
  if (!el) { el = document.createElement("div"); el.id = "toast"; el.setAttribute("role", "status"); document.body.appendChild(el); }
  el.textContent = msg; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { el.hidden = true; }, 5000);
}

/* ── 셈 — 브랜드·캠페인 짝, 매체 상태, 합계, 키워드 판정, 조율할 일 (build.py 가 ads.html 에 끼움) ──
   판정 기준 숫자(조정 30 · 정지 50)와 대표 키워드는 데이터(hub.rules · brand.coreKeywords)에서 읽는다. 여기는 셈법만. */
const brands = () => (D && D.hub.brands) || [];
const selBrands = () => S.bid === "all" ? brands() : brands().filter(b => b.id === S.bid);
const rules = () => Object.assign({ adjust: 30, stop: 50 }, (D && D.hub.rules) || {});
const chName = ch => ((D && D.hub.channels[ch]) || {}).name || ch;
const chOrder = () => (D && D.hub.order) || ["naver", "meta", "google"];
const NV = () => (D && D.naver) || {};
const matchName = (b, name) => (b.naverMatch || []).some(m => String(name || "").includes(m));
const campsOf = b => (NV().campaigns || []).filter(c => matchName(b, c.name));
const campBy = id => (NV().campaigns || []).find(c => c.id === id) || null;
const brandOf = c => brands().find(b => matchName(b, c.name)) || null;
const groupBy = id => (NV().groups || []).find(g => g.id === id) || null;
const groupsOf = c => (NV().groups || []).filter(g => g.camp === c.id);
const kwsOf = b => { const ids = new Set(campsOf(b).map(c => c.id)); return (NV().keywords || []).filter(k => ids.has(k.camp)); };
const taskBy = id => ((AD && AD.tasks) || []).find(t => t.id === id) || null;
const daysSince = d => Math.max(1, Math.round((Date.now() - new Date(d + "T00:00:00+09:00")) / 86400000) + 1);
const pctOf = (a, b) => b > 0 ? Math.round(a / b * 100) : 0;

/* 매체 상태 — 네이버는 실제 캠페인에서, 메타·구글은 볼트 JSON 의 state 에서 */
const STATE = { run: "집행 중", stop: "꺼 둠", prep: "준비", none: "없음" };
function chState(b, ch){
  const conf = (b.channels || {})[ch] || {};
  if (ch === "naver") {
    const L = campsOf(b);
    if (L.some(c => c.on)) return { k: "run", t: STATE.run };
    if (L.length) return { k: "stop", t: STATE.stop, sub: `캠페인 ${L.length}개 모두 꺼짐` };
    return (conf.tasks || []).length ? { k: "prep", t: STATE.prep } : { k: "none", t: STATE.none };
  }
  const s = conf.state || "없음";
  return { k: s === "집행" || s === "집행 중" ? "run" : s === "준비" ? "prep" : s === "멈춤" || s === "꺼 둠" ? "stop" : "none", t: s === "집행" ? STATE.run : s };
}
const stPill = st => `<span class="pill ${st.k}">${esc(st.t)}</span>`;
/* 메타·구글 숫자 — 광고 실습 계획 metrics (주간 통합 리뷰가 채움) */
const metricOf = (b, ch) => b.plan ? ((D.metrics || {}).values || {})[`${b.plan}-${ch}`] || null : null;
const hasSlot = (b, ch) => b.plan && ((D.metrics || {}).slots || []).some(s => s.product === b.plan && s.channel === ch);
/* 그 매체의 다음 광고 태스크 — 볼트 32_태스크 (광고 실습 앱과 같은 ad.data) */
function nextTask(b, ch){
  const ids = ((b.channels || {})[ch] || {}).tasks || [];
  const L = ids.map(taskBy).filter(Boolean);
  return L.find(t => t.status === "진행") || L.find(t => !["완료", "보류"].includes(t.status)) || null;
}
const taskName = t => String(t.title || "").replace(/^T-/, "");

/* 합계 — 고른 브랜드들의 네이버 캠페인 */
function totalsOf(list){
  const L = list.flatMap(campsOf);
  const t = { camps: L.length, on: L.filter(c => c.on).length, cost7: 0, clk7: 0, imp7: 0, costAll: 0, clkAll: 0, impAll: 0 };
  L.forEach(c => { t.cost7 += c.s7.cost; t.clk7 += c.s7.clk; t.imp7 += c.s7.imp; if (c.all) { t.costAll += c.all.cost; t.clkAll += c.all.clk; t.impAll += c.all.imp; } });
  return t;
}
/* 스토어 실제 주문 (판정의 기준 숫자) — store:true 인 브랜드만 */
function storeOrders(list){
  const st = (D && D.store) || {};
  if (!list.some(b => b.store)) return { none: true, ok: false };
  if (!st.ok || !st.total) return { ok: false, err: st.error || "아직 한 번도 못 받았어요", at: st.tried || st.at };
  const days = st.days || [], since14 = new Date(Date.now() - 13 * 86400000).toISOString().slice(0, 10);
  return { ok: true, n: st.total.orders, amount: st.total.paymentAmount, n14: days.filter(d => d.d >= since14).reduce((a, d) => a + d.orders, 0), at: st.at, period: st.period, products: st.products || [] };
}
const storeWhy = err => /IP/.test(err || "") ? "커머스API센터에 이 맥의 공인 IP가 등록돼 있지 않아요 — 동욱이 커머스API센터에 로그인해 애플리케이션 「API 호출 IP」에 넣으면 다음 바퀴(60분 안)부터 자동으로 받아요." : (err || "");

/* 키워드 판정 — 누적 클릭(캠페인 켠 날부터)으로. 기간이 아니라 클릭 수 */
const KJ = {
  stop:  { lv: "high", name: "정지 후보",   how: "클릭이 정지 기준을 넘었는데 전환 0" },
  core:  { lv: "mid",  name: "대표 — 유지", how: "정지 기준을 넘었지만 대표 키워드라 끄지 않음 — 입찰·페이지를 먼저 본다" },
  watch: { lv: "mid",  name: "조정 구간",   how: "조정 기준을 넘었고 전환 0 — 입찰 조정을 볼 수 있음, 정지까지 남은 클릭" },
  win:   { lv: "low",  name: "전환 있음",   how: "조정 기준을 넘었고 전환이 있음 — 승격 후보" },
  wait:  { lv: "",     name: "표본 부족",   how: "조정 기준까지 클릭이 모자람 — 그대로 둔다" },
  off:   { lv: "",     name: "꺼 둠",       how: "키워드·광고그룹·캠페인 중 하나가 꺼져 있음" }
};
const KJ_ORDER = ["stop", "core", "watch", "win", "wait", "off"];
function judgeKw(k, b){
  const R = rules(), g = groupBy(k.group), c = campBy(k.camp), clk = k.all.clk, conv = k.all.conv;
  if (!k.on || (g && !g.on) || (c && !c.on)) return { code: "off", left: 0 };
  const core = ((b || brandOf(c) || {}).coreKeywords || []).includes(k.kw);
  if (conv === 0 && clk >= R.stop) return { code: core ? "core" : "stop", left: 0 };
  if (clk >= R.adjust) return { code: conv > 0 ? "win" : "watch", left: Math.max(0, R.stop - clk) };
  return { code: "wait", left: R.adjust - clk };
}

/* 조율할 일 — 급함 high(빨강) · mid(노랑) · low(파랑 · 참고). 각 일에는 Brainy에게 넘길 말이 붙는다 */
const ASK_TAIL = " 볼트 기준(광고 손익분기와 표본 기준 · C-진액 키워드 광고 집행 기획)대로 판단하고, 바꿀 것은 「대상 · 지금 · 바꿀 값 · 근거」 표로 보여 줘. 적용은 내가 승인한 줄만.";
function todosOf(list){
  if (!D) return [];
  const R = rules(), out = [];
  const add = (lv, b, ch, title, why, ask, extra = {}) => out.push(Object.assign({ lv, b, ch, title, why, ask: ask ? `광고 한눈에 — ${b.name} ${chName(ch)}: ${ask}` : "" }, extra));
  list.forEach(b => {
    const camps = campsOf(b);
    camps.filter(c => c.on).forEach(c => {
      if (c.all) {
        const days = daysSince(c.start), wk = c.all.imp / (days / 7);
        if (days >= 10 && wk > 0 && c.s7.imp < wk * 0.1)
          add("high", b, "naver", `「${c.name}」 노출이 거의 멈췄어요`,
            `최근 7일 노출 ${won(c.s7.imp)} · 클릭 ${won(c.s7.clk)} · 광고비 ${won(c.s7.cost)}원 — 켠 뒤 주당 평균 노출 ${won(wk)}회의 ${pctOf(c.s7.imp, wk)}%. 일예산 ${won(c.budget)}원 중 하루 ${won(c.s7.cost / 7)}원만 쓰는 중이에요.`,
            `「${c.name}」 노출이 최근 7일 ${won(c.s7.imp)}회로 거의 멈췄어. 꺼진 키워드·광고그룹, 입찰가와 순위, 검수 상태를 네이버 API로 확인해서 왜 멈췄는지 말해 주고 다시 돌게 할 조정안을 줘.` + ASK_TAIL, { camp: c.id });
      }
      if (!c.tracking) add("mid", b, "naver", "전환추적이 꺼져 있어요", `「${c.name}」은 매체 전환이 늘 0으로 보여요. 그래서 판정은 키워드 누적 클릭과 스토어 실제 주문으로만 해요.`,
        `「${c.name}」 전환추적이 꺼져 있어. 켜는 게 맞는지, 켠다면 어디서 어떻게 하는지 단계로 알려 줘 (설정 변경은 내가 직접).`, { camp: c.id });
    });
    const J = kwsOf(b).map(k => ({ k, j: judgeKw(k, b) }));
    const of = code => J.filter(x => x.j.code === code);
    const names = L => L.sort((x, y) => y.k.all.clk - x.k.all.clk).slice(0, 3).map(x => `${x.k.kw}(${x.k.all.clk})`).join(" · ") + (L.length > 3 ? " …" : "");
    if (of("stop").length) add("high", b, "naver", `정지 후보 키워드 ${of("stop").length}개`, `클릭 ${R.stop}번이 넘었는데 전환 0 — ${names(of("stop"))}`,
      `정지 후보 키워드 ${of("stop").length}개(${names(of("stop"))})를 끌지 판단해 줘. 전환추적이 꺼져 있으면 스토어 주문도 같이 봐.` + ASK_TAIL, { go: "judge", filt: "stop" });
    if (of("core").length) add("mid", b, "naver", `대표 키워드가 정지 기준을 넘었어요`, `${names(of("core"))} — 끄지 않고 입찰을 낮추거나 상세페이지를 먼저 봐요.`,
      `대표 키워드 ${names(of("core"))}가 정지 기준을 넘었어. 끄지 않는 대신 입찰·페이지 중 뭘 먼저 볼지 정리해 줘.` + ASK_TAIL, { go: "judge", filt: "core" });
    if (of("watch").length) add("mid", b, "naver", `조정 구간 키워드 ${of("watch").length}개`, `클릭 ${R.adjust}~${R.stop - 1}번, 전환 0 — ${names(of("watch"))}`,
      `조정 구간 키워드 ${of("watch").length}개(${names(of("watch"))})의 입찰 조정안을 만들어 줘.` + ASK_TAIL, { go: "judge", filt: "watch" });
    const rej = J.filter(x => x.j.code !== "off" && x.k.inspect && x.k.inspect !== "APPROVED");
    if (rej.length) add("mid", b, "naver", `검수 통과 못 한 키워드 ${rej.length}개가 켜져 있어요`, rej.slice(0, 3).map(x => x.k.kw).join(" · ") + (rej.length > 3 ? " …" : ""),
      `검수 통과 못 한 키워드 ${rej.length}개를 정리할지(끄기·지우기·문구 바꾸기) 판단해 줘.` + ASK_TAIL);
    if (b.store) {
      const o = storeOrders([b]);
      if (!o.ok) add("mid", b, "naver", "스토어 주문을 못 받고 있어요", storeWhy(o.err) + " 그 전까지 주문은 「—」로 보여요.", "");
      else {
        const daily = camps.flatMap(c => c.daily || []), cost14 = daily.reduce((a, d) => a + d.cost, 0), clk14 = daily.reduce((a, d) => a + d.clk, 0);
        if (clk14 >= R.adjust && o.n14 === 0) add("high", b, "naver", `14일 동안 클릭 ${clk14}번에 주문 0`, "클릭이 쌓였는데 주문이 0이면 키워드가 아니라 상세페이지를 고쳐요.",
          `14일 클릭 ${clk14}번에 스토어 주문 0이야. 상세페이지에서 무엇부터 볼지 점검 순서를 줘.` + ASK_TAIL);
        else if (o.n14 > 0 && b.breakeven) {
          const cpa = cost14 / o.n14;
          add(cpa > b.breakeven ? "high" : "low", b, "naver", `구매당 광고비 ${won(cpa)}원 (14일)`, `손익분기 ${won(b.breakeven)}원 ${cpa > b.breakeven ? "초과" : "안"} — 광고비 ${won(cost14)}원 ÷ 스토어 주문 ${o.n14}건. 주문은 광고 밖에서 온 것도 섞여 있어요.`,
            cpa > b.breakeven ? `14일 구매당 광고비가 ${won(cpa)}원으로 손익분기 ${won(b.breakeven)}원을 넘었어. 어디를 줄일지 조정안을 줘.` + ASK_TAIL : "");
        }
      }
    }
    chOrder().forEach(ch => {
      const st = chState(b, ch), t = nextTask(b, ch);
      if (st.k === "prep") add("low", b, ch, `${chName(ch)} 준비 중`, t ? `다음 태스크 「${taskName(t)}」 · ${t.status || "할일"}` : (((b.channels || {})[ch] || {}).plan || ""),
        t ? `${chName(ch)} 광고를 켜려면 지금 뭐가 남았는지 태스크 「${taskName(t)}」 완료 기준으로 보여 주고, 내가 할 것과 네가 할 것을 나눠 줘.` : "", { task: t && t.id });
      if (st.k === "run" && ch !== "naver" && hasSlot(b, ch) && !metricOf(b, ch)) add("mid", b, ch, `${chName(ch)} 숫자가 비어 있어요`, "집행 중인데 이번 주 광고비·결과가 없어요 — 주간 통합 리뷰가 채워요.",
        `${chName(ch)} 이번 주 광고비·결과를 광고 실습 계획 metrics 에 채워 줘 (못 읽는 건 내가 볼 곳을 알려 줘).`);
    });
  });
  const rank = { high: 0, mid: 1, low: 2 };
  return out.sort((x, y) => rank[x.lv] - rank[y.lv]);
}

/* ── 「지금」 탭 — 오늘 조율할 일 (build.py 가 ads.html 에 끼움) ──
   일은 ads-calc.js todosOf() 가 숫자에서 뽑는다: 빨강 = 오늘 손대야 함 · 노랑 = 보고 판단 · 파랑 = 참고·준비.
   「✦ Brainy와 조율」은 대화창을 그 일의 말로 채운다 — 맥의 Brainy가 볼트 기준으로 조정안 표를 보여 주고, 동욱이 승인한 줄만 적용한다. */
const LV = { high: "오늘 손대기", mid: "보고 판단", low: "참고" };
function todoRow(x, showBrand){
  const more = x.camp ? `<button type="button" class="btn" data-camp="${esc(x.camp)}">캠페인 보기</button>` : x.filt ? `<button type="button" class="btn" data-jf="${x.filt}">키워드 보기</button>` : "";
  return `<div class="row ${x.lv} todo"><div class="ct">
    <b>${esc(x.title)}</b><span>${showBrand ? esc(x.b.short || x.b.name) + " · " : ""}${esc(chName(x.ch))}</span>
    ${x.why ? `<p class="why">${esc(x.why)}</p>` : ""}
    ${x.ask || more ? `<div class="btns act">${x.ask ? askBtn(x.ask, "✦ Brainy와 조율", x.lv === "high" ? "primary" : "") : ""}${more}</div>` : ""}
  </div><div class="tags"><span class="pill ${x.lv}">${LV[x.lv]}</span></div></div>`;
}
function renderNow(){
  const list = selBrands(), T = todosOf(list), many = list.length > 1;
  let h = "";
  if (many) {
    h += `<section class="card"><h2>브랜드 한눈에</h2>${list.map(b => {
      const t = totalsOf([b]), n = todosOf([b]).filter(x => x.lv === "high").length;
      return `<button type="button" class="row ${n ? "high" : chOrder().some(ch => chState(b, ch).k === "run") ? "run" : "none"}" data-brand="${esc(b.id)}" aria-label="${esc(b.name)} 열기">
        <span class="ct"><b>${esc(b.name)}</b><span>${esc(b.product || "")}${b.goal ? " · 목표 " + esc(b.goal) : ""}</span>
        <span class="figs">${chOrder().map(ch => `<span>${esc(chName(ch))} <i>${esc(chState(b, ch).t)}</i></span>`).join("")}${t.camps ? `<span>7일 <i>${won(t.cost7)}원</i></span>` : ""}</span></span>
        <span class="tags">${n ? `<span class="pill high">급한 일 ${n}</span>` : ""}</span></button>`;
    }).join("")}</section>`;
  } else {
    const b = list[0];
    if (b) h += `<p class="small muted" style="padding:0 4px">${esc(b.product || "")}${b.goal ? " · 목표 " + esc(b.goal) : ""}${b.breakeven ? ` · 손익분기 구매당 광고비 <span class="num">${won(b.breakeven)}</span>원` : b.breakevenNote ? " · " + esc(b.breakevenNote) : ""}${b.note ? "<br>" + esc(b.note) : ""}</p>`;
  }
  const hi = T.filter(x => x.lv !== "low"), lo = T.filter(x => x.lv === "low");
  h += `<section class="card"><h2>조율할 일 · ${hi.length}</h2>${hi.length ? hi.map(x => todoRow(x, many)).join("") : `<p class="empty">지금 손댈 일이 없어요. 숫자가 기준을 넘으면 여기에 떠요.</p>`}</section>`;
  if (lo.length) h += `<section class="card"><h2>참고 · 준비 중 ${lo.length}</h2>${lo.map(x => todoRow(x, many)).join("")}</section>`;
  const nv = NV(), st = D.store || {};
  h += `<p class="small muted" style="text-align:center;padding:0 8px">네이버 숫자 ${nv.ok ? ago(nv.at) : "못 받음"} · 스토어 주문 ${st.ok ? ago(st.at) : "연결 안 됨"} · 메타·구글은 주간 리뷰 숫자<br>이 앱은 광고를 바꾸지 않아요. 「Brainy와 조율」로 제안을 받고, 승인한 것만 Brainy가 적용해요.</p>`;
  return h;
}

/* ── 「지도」 탭 — 브랜드 × 매체 전부, 상태 색으로 + 캠페인 자세히 (build.py 가 ads.html 에 끼움) ──
   네이버 줄은 실제 캠페인(API), 메타·구글 줄은 볼트 JSON 상태 + 광고 실습 계획 metrics(주간 리뷰 숫자).
   태스크 칩은 그 매체를 잇는 볼트 32_태스크 (광고 실습 앱과 같은 ad.data). 캠페인을 누르면 자세히. */
function chNums(b, ch){
  if (ch === "naver") {
    const t = totalsOf([b]);
    return t.camps ? `<div class="figs"><span>7일 <i>${won(t.cost7)}원</i> · 클릭 <i>${won(t.clk7)}</i></span><span>누적 <i>${won(t.costAll)}원</i> · 클릭 <i>${won(t.clkAll)}</i></span></div>` : "";
  }
  const m = metricOf(b, ch);
  if (m) return `<div class="figs"><span>${esc(m.week || "")} 주 광고비 <i>${won(m.spend)}원</i></span><span>${esc(b.resultLabel || "결과")} <i>${won(m.result)}</i>${m.contracts != null ? ` · 계약 <i>${won(m.contracts)}</i>` : ""}</span></div>`;
  return hasSlot(b, ch) ? `<div class="figs"><span>숫자 없음 — 주간 통합 리뷰가 채워요</span></div>` : "";
}
function taskChips(b, ch){
  const ids = ((b.channels || {})[ch] || {}).tasks || [];
  if (!ids.length) return "";
  return `<div class="tasklist">${ids.map(id => { const t = taskBy(id); return `<span class="pill ${t && t.status === "완료" ? "run" : t && t.status === "진행" ? "prep" : ""}" title="${esc(t ? t.title : id)}">${esc(id)} ${esc(t ? taskName(t).slice(0, 14) : "")}${t ? " · " + esc(t.status || "할일") : ""}</span>`; }).join("")}</div>`;
}
const campRow = c => `<button type="button" class="row ${c.on ? "run" : "none"}" data-camp="${esc(c.id)}" aria-label="${esc(c.name)} 자세히">
  <span class="ct"><b>${esc(c.name)}</b><span>${c.type === "SHOPPING" ? "쇼핑검색" : c.type === "POWER_CONTENTS" ? "파워콘텐츠" : "파워링크"}${c.budget ? ` · 일예산 ${won(c.budget)}원` : ""} · ${esc(c.start)}부터</span>
  <span class="figs"><span>7일 <i>${won(c.s7.cost)}원</i> · 노출 <i>${won(c.s7.imp)}</i> · 클릭 <i>${won(c.s7.clk)}</i></span>${c.all ? `<span>누적 <i>${won(c.all.cost)}원</i> · 클릭 <i>${won(c.all.clk)}</i></span>` : ""}</span></span>
  <span class="tags">${stPill({ k: c.on ? "run" : "stop", t: c.on ? "켜짐" : "꺼 둠" })}</span></button>`;
function renderMap(){
  let h = `<div class="legend" aria-label="색 뜻" style="padding:0 4px">${["run", "stop", "prep", "none"].map(k => `<span><i class="${k}"></i>${STATE[k]}</span>`).join("")}</div>`;
  selBrands().forEach(b => {
    const camps = campsOf(b).sort((x, y) => (y.on - x.on) || (y.all ? 1 : 0) - (x.all ? 1 : 0));
    h += `<section class="card"><div class="part"><h2>${esc(b.name)}</h2><small>${esc(b.product || "")}</small></div>${b.note ? `<p class="small muted">${esc(b.note)}</p>` : ""}
      <div style="margin-top:8px">${chOrder().map(ch => { const st = chState(b, ch), conf = (b.channels || {})[ch] || {};
        return `<div class="chrow"><b>${esc(chName(ch))}</b><div><div class="btns" style="gap:6px;align-items:center">${stPill(st)}${st.sub ? `<span class="small muted">${esc(st.sub)}</span>` : ""}</div>
          ${conf.plan ? `<p class="plan" style="margin-top:4px">${esc(conf.plan)}</p>` : ""}${chNums(b, ch)}${taskChips(b, ch)}</div></div>`; }).join("")}</div>
      ${camps.length ? `<h2 style="margin:14px 0 4px">네이버 캠페인 ${camps.length}</h2><div>${camps.map(campRow).join("")}</div>` : ""}</section>`;
  });
  return h;
}
/* ── 캠페인 자세히 ── */
function renderCamp(c){
  const b = brandOf(c), G = groupsOf(c), K = (NV().keywords || []).filter(k => k.camp === c.id);
  const ctr = c.all && c.all.imp ? (c.all.clk / c.all.imp * 100).toFixed(2) + "%" : "—", cpc = c.all && c.all.clk ? won(c.all.cost / c.all.clk) + "원" : "—";
  const days = c.daily || [], max = Math.max(1, ...days.map(d => d.cost));
  let h = `<div><button type="button" class="back" data-back>← 돌아가기</button></div>
    <section class="card"><div class="btns" style="gap:6px;align-items:center">${stPill({ k: c.on ? "run" : "stop", t: c.on ? "켜짐" : "꺼 둠" })}<span class="small muted">${esc(b ? b.name : "")} · 네이버</span></div>
      <h3 style="margin-top:6px">${esc(c.name)}</h3>
      <p class="small muted">${c.budget ? `일예산 ${won(c.budget)}원 · ` : ""}${esc(c.start)}부터 · 전환추적 ${c.tracking ? "켜짐" : "꺼짐"}</p>
      <div class="stats">
        <div class="stat"><span class="k">광고비 7일</span><span class="v">${won(c.s7.cost)}</span><span class="s">원 · 하루 ${won(c.s7.cost / 7)}</span></div>
        <div class="stat"><span class="k">클릭 7일</span><span class="v">${won(c.s7.clk)}</span><span class="s">노출 ${won(c.s7.imp)}</span></div>
        ${c.all ? `<div class="stat"><span class="k">누적 광고비</span><span class="v">${won(c.all.cost)}</span><span class="s">원 · CPC ${cpc}</span></div>
        <div class="stat"><span class="k">누적 클릭</span><span class="v">${won(c.all.clk)}</span><span class="s">노출 ${won(c.all.imp)} · CTR ${ctr}</span></div>` : ""}
      </div>
      ${days.length ? `<h2 style="margin:14px 0 0">최근 14일 광고비</h2><div class="bars" role="img" aria-label="최근 14일 하루 광고비">${days.map(d => `<i class="${d.cost ? "" : "zero"}" style="height:${Math.max(2, d.cost / max * 100)}%" title="${esc(d.d)} · ${won(d.cost)}원 · 클릭 ${d.clk}"></i>`).join("")}</div><div class="barcap"><span>${esc((days[0] || {}).d || "")}</span><span>최고 ${won(max)}원</span><span>${esc((days[days.length - 1] || {}).d || "")}</span></div>` : ""}
      <div class="btns" style="margin-top:14px">${askBtn(`광고 한눈에 — ${b ? b.name : ""} 네이버 「${c.name}」 캠페인을 점검해 줘: 지금 상태·노출 추이·광고그룹별로 손볼 곳.` + ASK_TAIL, "✦ Brainy와 이 캠페인 조율", "primary")}</div></section>`;
  if (G.length) h += `<section class="card"><h2>광고그룹 ${G.length}</h2>${G.map(g => {
      const ks = K.filter(k => k.group === g.id), J = ks.map(k => judgeKw(k, b).code), cnt = code => J.filter(x => x === code).length;
      return `<div class="row ${!g.on ? "none" : cnt("stop") ? "high" : cnt("watch") || cnt("core") ? "mid" : "run"}"><div class="ct"><b>${esc(g.name)}</b>
        <span>입찰 ${won(g.bid)}원 · 키워드 ${ks.length}개${cnt("stop") ? ` · 정지 후보 ${cnt("stop")}` : ""}${cnt("watch") ? ` · 조정 구간 ${cnt("watch")}` : ""}</span>
        <span class="figs"><span>누적 광고비 <i>${won(g.all.cost)}원</i> · 클릭 <i>${won(g.all.clk)}</i> · 노출 <i>${won(g.all.imp)}</i></span></span></div>
        <div class="tags">${stPill({ k: g.on ? "run" : "stop", t: g.on ? "켜짐" : "꺼 둠" })}</div></div>`; }).join("")}</section>`;
  else if (!c.all) h += `<section class="card"><p class="empty">오래 꺼 둔 캠페인이라 광고그룹·키워드는 받지 않았어요.</p></section>`;
  return h;
}

/* ── 「판정」 탭 — 네이버 키워드마다 누적 클릭 판정 (build.py 가 ads.html 에 끼움) ──
   셈법은 ads-calc.js judgeKw(): 기준 숫자(조정·정지)는 hub.rules, 대표 키워드는 brand.coreKeywords.
   거르기(S.filt): act 손볼 것(정지 후보·대표·조정 구간·전환 있음) · all 전체 · 판정 이름 하나. 막대 = 누적 클릭, 눈금 = 조정·정지 */
const JF = [["act", "손볼 것"], ["stop", KJ.stop.name], ["core", KJ.core.name], ["watch", KJ.watch.name], ["win", KJ.win.name], ["wait", KJ.wait.name], ["off", KJ.off.name], ["all", "전체"]];
const keepJ = code => S.filt === "all" ? true : S.filt === "act" ? ["stop", "core", "watch", "win"].includes(code) : code === S.filt;
function kwRow(x, b){
  const k = x.k, j = x.j, R = rules(), g = groupBy(k.group), scale = Math.max(R.stop * 1.2, k.all.clk), info = KJ[j.code];
  const note = j.code === "wait" ? `판정까지 ${j.left}클릭` : j.code === "watch" ? `정지 기준까지 ${j.left}클릭` : info.how;
  return `<div class="row ${info.lv || (j.code === "off" ? "none" : "")}"><div class="ct">
    <b>${esc(k.kw)}</b><span>${esc(g ? g.name : "")} · 입찰 ${won(k.bid)}원${k.inspect && k.inspect !== "APPROVED" ? " · 검수 " + esc(k.inspect) : ""}</span>
    <span class="figs"><span>클릭 <i>${won(k.all.clk)}</i></span><span>광고비 <i>${won(k.all.cost)}원</i></span><span>노출 <i>${won(k.all.imp)}</i></span>${k.all.rank ? `<span>순위 <i>${k.all.rank}</i></span>` : ""}${k.all.conv ? `<span>전환 <i>${k.all.conv}</i></span>` : ""}</span>
    ${j.code !== "off" ? `<div class="meter" aria-hidden="true"><i style="width:${Math.min(100, k.all.clk / scale * 100)}%"></i><b style="left:${R.adjust / scale * 100}%"></b><b style="left:${R.stop / scale * 100}%"></b></div>` : ""}
    <span style="margin-top:4px">${esc(note)}</span></div>
    <div class="tags"><span class="pill ${info.lv}">${esc(info.name)}</span></div></div>`;
}
function renderJudge(){
  const R = rules(), list = selBrands().filter(b => kwsOf(b).length);
  const J = list.flatMap(b => kwsOf(b).map(k => ({ k, b, j: judgeKw(k, b) })));
  const cnt = f => J.filter(x => f === "all" ? true : f === "act" ? ["stop", "core", "watch", "win"].includes(x.j.code) : x.j.code === f).length;
  let h = `<div><div class="filt" role="group" aria-label="판정 거르기">${JF.map(([f, t]) => `<button type="button" class="chip ${S.filt === f ? "on" : ""}" data-filt="${f}" aria-pressed="${S.filt === f}">${esc(t)}<b>${cnt(f)}</b></button>`).join("")}</div>
    <p class="small muted" style="margin-top:6px;padding:0 4px">켠 날부터 쌓인 클릭으로 판정해요 — ${R.adjust}번이면 조정, ${R.stop}번에 전환 0이면 정지. 대표 키워드는 끄지 않아요. 막대의 눈금 두 개가 ${R.adjust}·${R.stop}이에요.</p></div>`;
  if (!list.length) return h + `<section class="card"><p class="empty">고른 브랜드에 네이버 키워드가 없어요.</p></section>`;
  const LIM = 40;
  list.forEach(b => {
    const L = J.filter(x => x.b === b && keepJ(x.j.code)).sort((x, y) => KJ_ORDER.indexOf(x.j.code) - KJ_ORDER.indexOf(y.j.code) || y.k.all.clk - x.k.all.clk || y.k.all.imp - x.k.all.imp);
    /* 손볼 것이 0이면 빈 칸 대신 판정에 가장 가까운 키워드(클릭 많은 순 10개)를 보여 준다 */
    if (S.filt === "act" && !L.length) {
      const near = J.filter(x => x.b === b && x.j.code === "wait").sort((x, y) => y.k.all.clk - x.k.all.clk).slice(0, 10);
      h += `<section class="card"><div class="part"><h2>${esc(b.name)}</h2><small>손볼 것 0</small></div>
        <p class="small muted" style="margin-bottom:6px">아직 ${R.adjust}클릭을 넘은 켜진 키워드가 없어요 — 판정에 가장 가까운 ${near.length}개예요.</p>${near.map(x => kwRow(x, b)).join("")}</section>`;
      return;
    }
    const shown = S.kwMore ? L : L.slice(0, LIM);
    h += `<section class="card"><div class="part"><h2>${esc(b.name)}</h2><small>${L.length}개</small></div>
      ${L.length ? shown.map(x => kwRow(x, b)).join("") + (L.length > shown.length ? `<button type="button" class="more" data-kwmore>나머지 ${L.length - shown.length}개 더 보기</button>` : "") : `<p class="empty">이 거르기에 맞는 키워드가 없어요.</p>`}
      ${L.length && S.filt !== "off" && S.filt !== "wait" ? `<div class="btns" style="margin-top:10px">${askBtn(`광고 한눈에 — ${b.name} 네이버: 판정 탭 「${(JF.find(f => f[0] === S.filt) || [])[1]}」 키워드 ${L.length}개를 기준대로 볼게. 손볼 순서와 조정안을 줘. 목록: ${L.slice(0, 25).map(x => `${x.k.kw}(클릭 ${x.k.all.clk}·${won(x.k.all.cost)}원·${KJ[x.j.code].name})`).join(", ")}${L.length > 25 ? " …" : ""}.` + ASK_TAIL, "✦ 이 목록으로 Brainy와 조율")}</div>` : ""}</section>`;
  });
  return h;
}

/* ── 「기록」 탭 — 바꾼 것 · 판정 기준 · 숫자 출처 (build.py 가 ads.html 에 끼움) ──
   변경 기록 정본은 볼트 광고 한눈에.json 의 changes (Brainy가 적용한 뒤 한 줄씩 위에 더함). 기준 글은 hub.rules.lines. */
function renderLog(){
  const ids = new Set(selBrands().map(b => b.id)), C = (D.hub.changes || []).filter(c => ids.has(c.brand));
  const nv = NV(), st = D.store || {}, o = storeOrders(selBrands()), R = rules();
  let h = `<section class="card"><h2>바꾼 것 · ${C.length}</h2>${C.length ? C.map(c => { const b = brands().find(x => x.id === c.brand);
      return `<div class="logline"><span class="d">${esc(c.d)}</span><div><b style="font-weight:600">${esc(c.t)}</b><p class="small muted">${esc((b ? (b.short || b.name) + " · " : "") + chName(c.ch))}${c.why ? " — " + esc(c.why) : ""}</p></div></div>`; }).join("") : `<p class="empty">이 브랜드는 아직 바꾼 기록이 없어요.</p>`}
    <p class="small muted" style="margin-top:8px">Brainy가 승인받아 적용하면 볼트 「광고 한눈에.json」에 한 줄씩 더해요.</p></section>`;
  h += `<section class="card"><h2>판정 기준</h2><ul class="plain">${(R.lines || []).map(l => `<li>${esc(l)}</li>`).join("")}</ul>${R.doc ? `<p class="small muted" style="margin-top:8px">정본: 볼트 ${esc(R.doc)}</p>` : ""}</section>`;
  h += `<section class="card"><h2>숫자 출처</h2>
    <div class="row ${nv.ok ? "run" : "high"}"><div class="ct"><b>네이버 검색광고</b><span>${nv.ok ? `${ago(nv.at)} 받음 · 캠페인 ${(nv.campaigns || []).length} · 광고그룹 ${(nv.groups || []).length} · 키워드 ${(nv.keywords || []).length}` : "못 받음 — " + esc(nv.error || "")}</span><span>맥이 30분마다 API에서 받아요 (읽기만). 누적은 캠페인 켠 날부터, 92일까지.</span></div></div>
    ${o.none ? "" : `<div class="row ${o.ok ? "run" : "mid"}"><div class="ct"><b>스마트스토어 주문</b><span>${o.ok ? `${ago(o.at)} 받음 · ${esc(o.period || "")} 주문 ${won(o.n)}건 · ${won(o.amount)}원` : "연결 안 됨"}</span><span>${o.ok ? o.products.slice(0, 3).map(p => esc(p.name) + " " + p.qty + "개").join(" · ") : esc(storeWhy(o.err))}</span></div></div>`}
    <div class="row ${Object.keys((D.metrics || {}).values || {}).length ? "run" : "none"}"><div class="ct"><b>메타 · 구글</b><span>${Object.keys((D.metrics || {}).values || {}).length ? "주간 통합 리뷰 숫자" : "아직 숫자 없음 — 두 매체 모두 준비 단계"}</span><span>정본: 볼트 광고 실습 계획.json metrics (주간 통합 리뷰가 채움)</span></div></div>
    <p class="small muted" style="margin-top:8px">브랜드·매체 상태·기준·기록 정본: 볼트 4_Outputs/광고 한눈에 앱/광고 한눈에.json · 화면 갱신 ${ago(D.updatedAt)}</p></section>`;
  return h;
}


/* ── Brainy와 조율 — 대화창을 이 말로 채워 연다 (보내기는 동욱이 ↑) ── */
function brainy(text){
  if (window.BRAINY_CHAT && window.BRAINY_CHAT.fill) { window.BRAINY_CHAT.fill(text); return; }
  toast("Brainy 대화창을 아직 못 불러왔어요. 로그인을 확인하고 잠시 뒤 다시 눌러 주세요.");
}
const ASKS = [];   // 그린 화면의 「Brainy와 조율」 문장들 — 버튼은 번호만 들고 있다 (긴 글을 속성에 넣지 않게)
const askBtn = (text, label = "✦ Brainy와 조율", cls = "") => `<button type="button" class="btn ${cls}" data-ask="${ASKS.push(text) - 1}">${esc(label)}</button>`;

/* ── 머리말: 브랜드 고르기 + 숫자 ── */
function segMore(){ const seg = document.getElementById("brands"); document.getElementById("segwrap").classList.toggle("more", seg.scrollLeft + seg.clientWidth < seg.scrollWidth - 4); }
window.addEventListener("resize", segMore);
document.getElementById("brands").addEventListener("scroll", segMore, { passive: true });
function renderHead(){
  const seg = document.getElementById("brands"), sum = document.getElementById("sum");
  if (!D) { seg.innerHTML = ""; sum.innerHTML = ""; return; }
  const all = [{ id: "all", name: "전체" }].concat(brands());
  seg.innerHTML = all.map(b => { const n = todosOf(b.id === "all" ? brands() : [b]).filter(t => t.lv === "high").length; return `<button type="button" role="tab" aria-selected="${S.bid === b.id}" class="${S.bid === b.id ? "on" : ""}" data-brand="${b.id}">${esc(b.short || b.name)}${n ? `<span>!${n}</span>` : ""}</button>`; }).join("");
  const t = totalsOf(selBrands()), ord = storeOrders(selBrands());
  sum.innerHTML = [
    ["", "map", wonK(t.cost7), "광고비 7일"],
    ["", "map", won(t.clk7), "클릭 7일"],
    ["", "judge", wonK(t.costAll), "광고비 누적"],
    [ord.ok && ord.n === 0 && t.clkAll >= rules().adjust ? "bad" : "", "log", ord.ok ? won(ord.n) : "—", ord.none ? "주문 (스토어 없음)" : ord.ok ? "주문 28일" : "주문 못 받음"],
    ["", "map", `${t.on}<small>/${t.camps}</small>`, "켜진 캠페인"]
  ].map(([k, v, val, label]) => `<button type="button" class="${k}" data-go="${v}" aria-label="${label} ${String(val).replace(/<[^>]+>/g, "")}"><b>${val}</b><span>${label}</span></button>`).join("");
  const on = seg.querySelector(".on");
  if (on && (on.offsetLeft < seg.scrollLeft || on.offsetLeft + on.offsetWidth > seg.scrollLeft + seg.clientWidth)) seg.scrollLeft = on.offsetLeft - 8;
  segMore();
  const high = todosOf(selBrands()).filter(x => x.lv === "high").length;
  document.querySelector('#tabbar a[data-v="now"]').innerHTML = `<span aria-hidden="true">▶</span>지금${high ? `<em aria-label="급한 일 ${high}개">${high}</em>` : ""}`;
}

/* ── 화면 고르기 ── */
const view = () => { const v = (location.hash || "#now").slice(1); return ["now", "map", "judge", "log", "camp"].includes(v) ? v : "now"; };
function render(){
  ASKS.length = 0;
  let v = view();
  if (v === "camp" && !(D && campBy(S.camp))) v = "map";
  document.querySelectorAll("#tabbar a").forEach(a => a.classList.toggle("on", a.dataset.v === v || (v === "camp" && a.dataset.v === S.from)));
  renderHead();
  const main = document.getElementById("view");
  if (!D) { main.innerHTML = `<section class="card"><p class="empty">${loaded ? "광고 데이터가 아직 없어요.<br>맥의 동기화가 볼트 「광고 한눈에.json」과 네이버 광고 숫자를 올리면 여기에 보여요." : "광고 숫자를 불러오는 중이에요…"}</p></section>`; return; }
  main.innerHTML = v === "map" ? renderMap() : v === "judge" ? renderJudge() : v === "log" ? renderLog() : v === "camp" ? renderCamp(campBy(S.camp)) : renderNow();
}
function setBrand(id){ S.bid = id; lsPut("ah.bid", id); S.kwMore = false; if (view() === "camp") location.hash = S.from || "map"; else render(); window.scrollTo(0, 0); }
function openCamp(id){ const v = view(); if (v !== "camp") S.from = v; S.camp = id; location.hash = "camp"; }

document.addEventListener("click", e => {
  const t = e.target.closest("[data-brand],[data-go],[data-ask],[data-camp],[data-filt],[data-back],[data-kwmore],[data-jf]");
  if (!t) return;
  const d = t.dataset;
  if (d.brand) return setBrand(d.brand);
  if (d.ask !== undefined) { const s = ASKS[+d.ask]; if (s) brainy(s); return; }
  if (d.camp) return openCamp(d.camp);
  if (d.jf) { S.filt = d.jf; S.kwMore = false; if (view() === "judge") render(); else location.hash = "judge"; return; }
  if (d.go) { if (view() === d.go) window.scrollTo(0, 0); else location.hash = d.go; return; }
  if (d.filt) { S.filt = d.filt; S.kwMore = false; render(); return; }
  if (d.kwmore !== undefined) { S.kwMore = true; render(); return; }
  if (d.back !== undefined) { location.hash = S.from || "map"; return; }
});
window.addEventListener("hashchange", () => { window.scrollTo(0, 0); render(); });

/* 다른 앱(Brainy 연결)이 쓰는 창구 */
window.ADS_APP = { data: () => D, tasks: () => AD, view, selBrands, todosOf, rules, judgeKw, campsOf, kwsOf, brandOf, chState, totalsOf, storeOrders, setBrand, openCamp };

/* ── 시작 ── */
async function init(){
  render();
  const cl = window.claude;
  if (!cl || !cl.use) { loaded = true; render(); return; }
  const db = await cl.use("db").catch(() => null);
  if (!db) { loaded = true; render(); return; }
  db.doc("ah.data/main").onSnapshot(s => { loaded = true; const v = s.exists ? s.data() : null; if (v && v.hub) D = v; render(); }, () => { loaded = true; render(); });
  db.doc("ad.data/main").onSnapshot(s => { const v = s.exists ? s.data() : null; if (v && Array.isArray(v.tasks)) { AD = v; render(); } }, () => {});
}
init();
</script>
<script>
/* 광고 한눈에 — Brainy 연결 (build.py 가 brainy-chat.js 앞에 붙인다)
   mode(): 맥에서만 답한다 — 볼트 폴더의 Claude Code(본계정)가 네이버 API·볼트 기준 문서를 직접 읽는다. 클라우드로 넘기지 않는다.
   ctx(): 지금 고른 브랜드·화면·조율할 일·숫자를 통째로 보낸다 · tools: 브랜드·탭·캠페인 열기. 앱 데이터는 ads.html 이 window.ADS_APP 으로 내준다. */
(function () {
  function A() { return window.ADS_APP || null; }
  function norm(s) { return String(s || "").replace(/\s+/g, "").toLowerCase(); }

    var vv = window.visualViewport, kb = vv ? Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop)) : 0;
    box.style.setProperty("--bc-kb", (kb > 80 ? kb : 0) + "px"); box.classList.toggle("kb", kb > 80);
    if (kb > 80 && vv) box.style.height = Math.min(Math.round(vv.height - 16), Math.round(window.innerHeight * 0.68)) + "px"; else box.style.height = "";
  }
  window.addEventListener("resize", lift);
  if (window.visualViewport) { visualViewport.addEventListener("resize", lift); visualViewport.addEventListener("scroll", lift); }
  setInterval(lift, 1500);   // 앱이 탭 막대를 나중에 그려도 맞춘다
  function open() { box.hidden = false; fab.hidden = true; if (HOOK.push !== false) document.documentElement.classList.add("bc-push"); window.dispatchEvent(new Event("resize")); unread = false; lift(); render(); try { localStorage.setItem(KEY + ".open", "1"); } catch (e) {} if (window.matchMedia("(pointer: fine)").matches) setTimeout(function () { try { text.focus(); } catch (e) {} }, 50); }
  function close() { box.hidden = true; fab.hidden = false; document.documentElement.classList.remove("bc-push"); window.dispatchEvent(new Event("resize")); paintFab(); try { localStorage.removeItem(KEY + ".open"); } catch (e) {} }
  /* 앱 안 다른 단추에서 대화를 열 때 — ask 는 바로 보내고, fill 은 입력칸만 채워 둔다(동욱이 고쳐서 ↑ — 강의 실습 「Brainy와 이 칸 하기」) */
  function fill(q) { showHist = false; viewPast = -1; open(); text.value = String(q || ""); text.dispatchEvent(new Event("input")); }
  window.BRAINY_CHAT = { open: open, close: close, ask: function (q) { open(); go(q); }, fill: fill };
  fab.addEventListener("click", open);
  box.addEventListener("click", function (e) {
    var up = e.target.closest("[data-bc-unpic]");
    if (up) { var k = +up.getAttribute("data-bc-unpic"), drop = pics.splice(k, 1)[0]; if (drop) URL.revokeObjectURL(drop.url); paintPics(); return; }
    var pp = e.target.closest("[data-bc-past]"); if (pp) { viewPast = +pp.getAttribute("data-bc-past"); render(); return; }
    var po = e.target.closest("[data-bc-other]"); if (po) { viewPast = 1000 + (+po.getAttribute("data-bc-other")); render(); return; }
    var b = e.target.closest("[data-bc],[data-bc-chip]"); if (!b) return;
    var a = b.getAttribute("data-bc");
    if (a === "close") return close();
    if (a === "new") { if (ctl) ctl.abort(); archive(); turns = []; showHist = false; try { localStorage.removeItem(SID); } catch (e) {} keep(); render(); return; }
    if (a === "hist") { showHist = !(showHist && viewPast < 0); viewPast = -1; render(); return; }
    if (a === "delpast") { var dp = past[viewPast]; if (dp && confirm("이 지난 대화를 지울까요? 다른 기기에서도 지워져요.")) { gone.push(pkey(dp)); past.splice(viewPast, 1); viewPast = -1; keep(); render(); } return; }
    if (a === "resume") { var other = viewPast >= 1000, pr = other ? others()[viewPast - 1000] : past[viewPast]; if (pr && !busy) {
      if (!other) { gone.push(pkey(pr)); past.splice(viewPast, 1); }   // 꺼낸 지난 대화는 지운 표시 — 다른 기기 기록과 합쳐도 다시 안 생긴다
      archive(); turns = pr.turns.slice(); showHist = false; viewPast = -1; keep(); render(); } return; }
    if (a === "old") { openOld = !openOld; render(); return; }
    var c = b.getAttribute("data-bc-chip");
    if (c) { if (c.indexOf("○○") >= 0) { text.value = c.split("○○")[0]; text.focus(); } else go(c); }
  });
  send.addEventListener("click", function () { if (busy) { if (ctl) ctl.abort(); } else go(text.value); });
  if (att) {
    att.addEventListener("click", function () { file.click(); });
    file.addEventListener("change", function () { addPics(file.files); file.value = ""; text.focus(); });
    text.addEventListener("paste", function (e) {   // 캡처한 화면을 바로 붙여 넣기 — 글과 같이 붙여도 글은 그대로 들어간다
      var cd = e.clipboardData; if (!cd) return;
      var fs = [].slice.call(cd.files || []);
      if (!fs.length) fs = [].slice.call(cd.items || []).filter(function (it) { return it.kind === "file"; }).map(function (it) { return it.getAsFile(); });
      if (addPics(fs) && !cd.getData("text/plain")) e.preventDefault();
    });
    box.addEventListener("dragover", function (e) { if (e.dataTransfer && [].indexOf.call(e.dataTransfer.types || [], "Files") >= 0) { e.preventDefault(); box.classList.add("bc-drop"); } });
    box.addEventListener("dragleave", function (e) { if (!box.contains(e.relatedTarget)) box.classList.remove("bc-drop"); });
    box.addEventListener("drop", function (e) { box.classList.remove("bc-drop"); if (e.dataTransfer && e.dataTransfer.files.length) { e.preventDefault(); addPics(e.dataTransfer.files); } });
  }
  text.addEventListener("input", function () { text.style.height = "auto"; text.style.height = Math.min(text.scrollHeight + 2, 132) + "px"; text.style.overflowY = text.scrollHeight > 130 ? "auto" : "hidden"; });
  text.addEventListener("keydown", function (e) { if (e.key === "Enter" && !e.shiftKey && !e.isComposing && e.keyCode !== 229 && window.matchMedia("(pointer: fine)").matches) { e.preventDefault(); go(text.value); } });
  text.addEventListener("focus", function () { setTimeout(lift, 60); setTimeout(lift, 350); });
  text.addEventListener("blur", function () { setTimeout(lift, 60); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !box.hidden) close(); });
  function ready() { var was = false; try { was = localStorage.getItem(KEY + ".open") === "1"; } catch (e) {} lift(); if (was) open(); else fab.hidden = false; }
  if (LOCAL) ready();
  else if (window.claude && claude.use) {
    claude.use("sample").then(function (s) { sample = s; if (s) ready(); }, function () {});   // 로그인돼 Brainy를 부를 수 있을 때만
    claude.use("db").then(function (db) {   // 다른 기기에서 이어 쓴 기록을 받는다 — 더 새것만
      if (!db) return; DBC = db;
      db.doc(PATH).onSnapshot(function (snap) {
        if (!snap.exists) { if (turns.length || past.length) keep(); return; }
        var d = snap.data() || {}; remote = d;
        var before = JSON.stringify([past, gone]);
        gone = gone.concat((d.gone || []).filter(function (k) { return gone.indexOf(k) < 0; }));
        mergePast((d.past || []).concat(past));
        if (firstOpen && !clean(turns).length && !busy) {   // 처음 여는 기기 — 가장 최근에 쓴 지금 대화를 이어받는다 (한 번만)
          var devs = Object.assign({}, d.devs || {}, d.cur ? { legacy: { at: d.at, turns: d.cur } } : {}), best = null;
          Object.keys(devs).forEach(function (k) { var x = devs[k]; if (x && clean(x.turns).length && (!best || x.at > best.at)) best = x; });
          if (best && !past.some(function (p) { return sig(p.turns) === sig(best.turns); })) turns = clean(best.turns);
        }
        firstOpen = false;
        local();
        if (JSON.stringify([past, gone]) !== before && !busy) keep();   // 이 기기에만 있던 지난 대화를 저장소에도
        if (!box.hidden && !busy) render();
      });
    }, function () {});
  }
})();
