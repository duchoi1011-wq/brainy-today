<style>
:root{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}
/* 폰: 입력칸 글자가 16px보다 작으면 아이폰이 칸을 누를 때 화면을 확대해 버린다 → 왼쪽이 잘리고 아래 탭이 밀림 */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{max-width:100%;overflow-x:clip}
@media (pointer:coarse){input,textarea,select{font-size:16px!important}}
:root{--g-bg:var(--bg);--g-fg:var(--ink);--g-mut:var(--muted);--g-card:var(--surface);--g-line:var(--line);--g-acc:var(--accent);--g-acc-ink:var(--accent-ink);--g-warn:var(--s-sim);--g-ok:var(--s-done)}
#gate{position:fixed;inset:0;z-index:50;background:var(--g-bg);color:var(--g-fg);display:grid;place-items:center;padding:24px;font-family:inherit}
#gate .gbox{width:100%;max-width:340px;display:grid;gap:10px;justify-items:stretch}
#gate img{border-radius:14px;justify-self:start}
#gate h1{font-size:24px;margin:0}#gate .gsub{color:var(--g-mut);margin:0 0 8px}
#gate label{font-size:13px;color:var(--g-mut);margin-top:4px}
#gate input{font:inherit;font-size:16px;color:var(--g-fg);background:var(--g-card);border:1px solid var(--g-line);border-radius:10px;padding:11px 12px;width:100%}
#gate button{font:inherit;font-weight:600;cursor:pointer;margin-top:8px;padding:11px 14px;border-radius:999px;border:1px solid var(--g-line);background:var(--g-card);color:var(--g-fg)}
#gate button[type=submit]{background:var(--g-acc);border-color:var(--g-acc);color:var(--g-acc-ink)}
#gate .gerr{color:var(--g-warn);font-size:13px;min-height:18px}
/* 새로고침 버튼 (세 앱 공통, shim.js) — 오른쪽 위 작은 알약: 실시간 점 · ↻ · 마지막 동기화/반영 상태 */
#bsync{position:fixed;z-index:11;top:calc(8px + env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));display:inline-flex;align-items:center;gap:6px;max-width:min(62vw,240px);height:30px;padding:0 11px 0 9px;border-radius:999px;border:1px solid var(--g-line);background:var(--g-card);color:var(--g-mut);font:inherit;font-size:12px;font-weight:600;line-height:1;cursor:pointer;-webkit-tap-highlight-color:transparent}
#bsync:hover{color:var(--g-fg)}#bsync:focus-visible{outline:2px solid var(--g-acc);outline-offset:2px}
#bsync .bs-tx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
#bsync .bs-ic{font-size:14px;color:var(--g-acc)}
#bsync.busy{color:var(--g-fg);border-color:var(--g-acc)}#bsync.busy .bs-ic{animation:bsspin 1s linear infinite}
#bsync.macoff{border-style:dashed}
@keyframes bsspin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#bsync.busy .bs-ic{animation:none}}
#rtdot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--g-line)}
#rtdot.on{background:var(--g-ok)}#rtdot.off{background:var(--g-warn)}
#bsync-tip{position:fixed;z-index:11;top:calc(44px + env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));max-width:min(86vw,340px);padding:8px 12px;border-radius:12px;border:1px solid var(--g-line);background:var(--g-card);color:var(--g-fg);font-size:13px;line-height:1.45;box-shadow:0 4px 14px rgba(0,0,0,.12)}
header>.brand{padding-right:min(46vw,190px)}

</style>

<style>
/* 틀은 체화 단어장과 같다 — 한 줄 칸(640px) · 고정 머리말(강의 고르기 + 숫자) · 카드 · 아래 탭 막대. 칸 상태 색 4개(끝·빠진 것 있음·하는 중·아직)는 모든 탭이 같이 쓴다 */
:root{
  --bg:#F1F1F6; --surface:#FFFFFF; --surface-2:#F6F6FA; --ink:#15161C; --muted:#5E6170; --line:#DADBE5;
  --accent:#5B45D6; --accent-ink:#FFFFFF; --now-bg:#EEEAFE;
  --s-done:#1C9467; --s-sim:#B97F00; --s-doing:#3A78D4; --s-todo:#A3A6B3;
  --f-body:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101117; --surface:#181A22; --surface-2:#1E2029; --ink:#E9EAF2; --muted:#9A9DAE; --line:#2B2E3A;
  --accent:#8F7DFF; --accent-ink:#120D2B; --now-bg:#231F3D;
  --s-done:#38C18A; --s-sim:#F0B52A; --s-doing:#5C9BF0; --s-todo:#5E6272;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#101117; --surface:#181A22; --surface-2:#1E2029; --ink:#E9EAF2; --muted:#9A9DAE; --line:#2B2E3A;
  --accent:#8F7DFF; --accent-ink:#120D2B; --now-bg:#231F3D;
  --s-done:#38C18A; --s-sim:#F0B52A; --s-doing:#5C9BF0; --s-todo:#5E6272;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 calc(84px + env(safe-area-inset-bottom, 0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--bg)}
html{overflow-y:scroll}
.wrap{max-width:640px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--bg);padding-block:14px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:20px;font-weight:700;margin:0;letter-spacing:-.01em}
.brand small{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.brand #sub{font-family:var(--f-body);flex:1 1 0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .out{font:inherit;color:inherit;background:none;border:0;padding:0;text-decoration:underline;cursor:pointer}
/* 머리말 작은 링크 — 보이는 크기는 그대로, 누르는 자리만 44px (위아래로 넓힘) */
.brand .links a,.brand .links .out{display:inline-flex;align-items:center;min-height:44px;margin-block:-13px;padding-inline:2px}
main{display:flex;flex-direction:column;gap:16px;padding-top:16px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
h2{font-size:13px;font-weight:600;letter-spacing:.06em;color:var(--muted);margin:0 0 12px}
h3{font-size:20px;font-weight:700;margin:0;text-wrap:balance;line-height:1.4}
p{margin:0}
a{color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.empty{padding:22px 4px;text-align:center;color:var(--muted)}
code{font-family:var(--f-mono);font-size:.88em;background:var(--surface-2);border:1px solid var(--line);padding:0 5px;border-radius:5px;overflow-wrap:anywhere}
button{font:inherit}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:11px 16px;border-radius:10px;font-weight:600;cursor:pointer;min-height:44px;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.5;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1 1 160px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;min-height:44px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip b{font-family:var(--f-mono);font-weight:500;font-size:12px;margin-left:4px;opacity:.8}
/* 강의 고르기 — 단어장의 단어장 고르기와 같은 띠 */
.seg{display:flex;gap:0;margin-top:10px;border:1px solid var(--line);border-radius:10px;overflow-x:auto;background:var(--surface);scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;border:0;background:transparent;color:var(--muted);padding:8px 12px;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap;min-height:44px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
/* 강의가 화면 밖에도 있으면 오른쪽 끝을 흐리게 + ›  (옆으로 밀어 보라는 표시) */
.segwrap{position:relative}
.segwrap.more::after{content:"›";position:absolute;right:1px;top:11px;bottom:1px;width:36px;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;font-size:20px;font-weight:700;color:var(--accent);background:linear-gradient(90deg,transparent,var(--surface) 60%);border-radius:0 10px 10px 0;pointer-events:none}
.seg button span{font-family:var(--f-mono);font-weight:500;font-size:11px;margin-left:5px;opacity:.8}
/* 머리말 숫자 — 누르면 지도에서 그 칸만 */
.sum{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:10px}
.sum button{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:0;padding:6px 8px;border-radius:10px;background:var(--surface);border:1px solid var(--line);min-width:0}
.sum button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sum b{font-size:17px;font-variant-numeric:tabular-nums;line-height:1.3;white-space:nowrap}
.sum b small{font-size:12px;font-weight:500;color:var(--muted)}
.sum span{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sum .k-done b{color:var(--s-done)}.sum .k-sim b{color:var(--s-sim)}.sum .k-doing b{color:var(--s-doing)}
/* 칸 상태 — 색 띠 · 알약 */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;border:1px solid var(--line);white-space:nowrap;color:var(--muted)}
.pill.done{color:var(--s-done);border-color:var(--s-done)}.pill.similar{color:var(--s-sim);border-color:var(--s-sim)}.pill.doing{color:var(--s-doing);border-color:var(--s-doing)}
.pill.merged,.pill.skip{border-style:dashed}
.pill.now{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cell{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:10px;align-items:flex-start;width:100%;padding:10px 10px 10px 12px;border-top:1px solid var(--line);position:relative}
.cell:first-child{border-top:0}
.cell:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:8px}
.cell::before{content:"";flex:none;width:4px;align-self:stretch;border-radius:2px;background:var(--s-todo)}
.cell.done::before{background:var(--s-done)}.cell.similar::before{background:var(--s-sim)}.cell.doing::before{background:var(--s-doing)}
.cell.merged::before,.cell.skip::before{background:repeating-linear-gradient(180deg,var(--s-todo) 0 4px,transparent 4px 8px)}
.cell.merged .ct b,.cell.skip .ct b,.cell.done .ct b{color:var(--muted)}
.cell.isnow{background:var(--now-bg);border-radius:10px}
.cell:disabled{cursor:default}
.cell .ct{flex:1;min-width:0}
.cell .ct b{display:block;font-weight:600;line-height:1.45}
.cell .ct span{display:block;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cell .tags{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.part{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 0 4px}
.part h2{margin:0;letter-spacing:.02em;font-size:14px;color:var(--ink)}
.part small{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.filt{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.filt::-webkit-scrollbar{display:none}.filt .chip{flex:none;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--s-todo)}
.legend i.done{background:var(--s-done)}.legend i.similar{background:var(--s-sim)}.legend i.doing{background:var(--s-doing)}.legend i.now{background:var(--now-bg);border:1px solid var(--accent)}
.legend i.merged{background:transparent;border:1px dashed var(--s-todo)}
details.fold>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:44px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary h2{margin:0}
details.fold>summary::after{content:"펼치기";font-size:12px;color:var(--accent);font-weight:600}
details.fold[open]>summary::after{content:"접기"}
details.fold[open]>summary{margin-bottom:8px}
/* 지금 탭 */
.nowcell h3{margin:4px 0 8px}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.remain{border-left:3px solid var(--s-sim);background:var(--surface-2);border-radius:0 10px 10px 0;padding:9px 12px;font-size:14px;margin:10px 0 12px}
.remain .lbl,.lbl{display:block;font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--muted);margin-bottom:2px}
.crit{display:flex;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.crit:first-of-type{border-top:0}
.crit .box{all:unset;box-sizing:border-box;cursor:pointer;flex:none;width:26px;height:26px;border-radius:7px;border:1.5px solid var(--muted);display:grid;place-items:center;font-size:14px;font-weight:700;margin-top:0;position:relative;color:var(--ink)}
.crit .box::after{content:"";position:absolute;inset:-10.5px}  /* 누르는 자리 44px */
.crit .box:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.crit.on .box{background:var(--s-done);border-color:var(--s-done);color:#fff}
.crit .cb{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.crit .cb>b{font-weight:600}
.crit .cb>p{font-size:13.5px;color:var(--muted)}
.crit .cb .btns .btn{flex:0 1 auto;padding:8px 14px;font-size:14px}
/* 체크 목록 — 줄 전체가 누르는 자리 */
.checks{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.checks li{display:flex;gap:10px;font-size:14.5px;line-height:1.55;padding:6px 0}
.checks li.qnote{padding:2px 0}
.ckrow{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:10px;align-items:flex-start;width:100%;min-height:44px;padding:6px 4px;margin:-6px -4px;border-radius:8px}
.ckrow:focus-visible{outline:2px solid var(--accent);outline-offset:0}
.ckrow:disabled{cursor:default}
.ck{flex:none;width:22px;height:22px;border-radius:6px;border:1.5px solid var(--muted);display:grid;place-items:center;font-size:13px;font-weight:700;margin-top:1px}
.ck.skip{border-style:dashed;color:var(--muted);font-size:11px}
.ckrow.on .ck{background:var(--s-done);border-color:var(--s-done);color:#fff}
.ckrow.on>span:last-child{color:var(--muted)}
.btn.ok{border-color:var(--s-done);color:var(--s-done)}
.miss{margin:4px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.remain.ok{border-left-color:var(--s-done)}
.linkbtn{all:unset;cursor:pointer;color:var(--accent);font-weight:600;font-size:14px;display:inline-flex;align-items:center;min-height:44px}
.linkbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
/* 공부 */
.tldr{background:var(--now-bg);border-radius:10px;padding:10px 12px;font-size:14.5px;line-height:1.6;margin-bottom:6px}
details.sfold{border-top:1px solid var(--line);padding:4px 0}
details.sfold>summary{min-height:44px;align-items:center}
details.sfold>summary b{font-size:15px}
/* 칸 자세히 */
.back{all:unset;cursor:pointer;font-weight:600;color:var(--accent);font-size:14px;min-height:44px;display:inline-flex;align-items:center}
.sec{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.sec:first-child{border-top:0;padding-top:0;margin-top:0}
.reqs{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.reqs li{display:flex;gap:10px;font-size:14.5px;line-height:1.55}
.reqs li::before{content:"";flex:none;width:16px;height:16px;margin-top:4px;border:1.5px solid var(--muted);border-radius:4px}
.reqs li.na{color:var(--muted)}.reqs li>span{flex:1;min-width:0}
.qs{margin:6px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:6px;font-size:14.5px}
.qs li.qnote{list-style:none;margin-left:-22px}
a.ext{display:inline-flex;align-items:center;min-height:44px;margin-block:-12px;font-weight:600}
.plain{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.plain li{padding-left:14px;position:relative}.plain li::before{content:"·";position:absolute;left:2px;color:var(--muted)}
textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-height:96px;resize:vertical}
textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.saved{font-size:12px;color:var(--muted);min-height:18px}
.saved.fail{color:var(--s-sim)}
/* 배운 것 — 볼트 학습 노트 본문 (표·코드는 칸 안에서만 옆으로 밀린다) */
.md{font-size:14.5px;line-height:1.65;min-width:0}
.md>*+*{margin-top:10px}
.md h4{font-size:15.5px;margin:18px 0 0;line-height:1.45}
.md h5{font-size:14.5px;margin:14px 0 0}

<script>/* Brainy 공통 부품 — 모든 앱이 같이 쓴다 (모델 버튼 줄 · 첫 안내 · 노트 쓰기 규칙) */
/* Brainy 공통 부품 — 모든 앱(Brainy 홈 · 맥 단축키 · 체화 단어장 · 콘텐츠 기획)이 같이 쓴다. 여기 한 곳만 고치면 모든 앱이 바뀐다 (2026-11-24 동욱).
   원본 html 의 앱 스크립트 바로 앞, 이 파일을 끼우는 include 자리에 들어간다 → 앱 코드와 대화창(brainy-chat.js)보다 먼저 선다.
   · 답할 모델 버튼 줄 — modelRow() · 고른 값은 config/ai 의 model 하나를 모든 앱이 공유 (클라우드 Brainy 가 다음 질문부터 이 모델로, 짧은 일은 늘 Haiku)
   · 첫 안내문 — hello() · 노트 쓰기 도구(vault_write) 규칙 — NOTE_RULE
   · 「이 ○○는 고쳐요」 표시 + Brainy에게 맡기기 — fixHtml() · fixAsk() · ask()
   · 위 것들의 생김새 — 앱의 색(--ink·--accent …, 없으면 --g-*)을 따른다 */
(function () {
  "use strict";
  if (window.BRAINY_PARTS) return;
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  /* ── 생김새 ── */
  var css = document.createElement("style");
  css.textContent =
    /* 색 — 네 앱이 같이 쓰는 이름(--ink·--muted·--line·--surface·--accent)을 먼저, 없으면 받침의 --g-* */
    ".bp-models,.bp-hello,.bp-fix,.bp-fix-done,.bp-fix-tag,.bp-fixask{--bp-fg:var(--ink,var(--bp-fg));--bp-mut:var(--muted,var(--bp-mut));--bp-line:var(--line,var(--bp-line));" +
    "--bp-bg:var(--bg,var(--g-bg,#fff));--bp-card:var(--surface,var(--g-card,#fff));--bp-acc:var(--accent,var(--g-acc,#2f6f5e));--bp-acc-ink:var(--accent-ink,var(--g-acc-ink,#fff))}" +
    /* 모델 버튼 줄 */
    ".bp-models{display:flex;gap:4px;padding:8px 10px;border-bottom:1px solid var(--bp-line);background:var(--bp-card);min-width:0}" +
    ".bp-m{flex:1;min-width:0;min-height:44px;padding:4px 2px;border:1px solid var(--bp-line);border-radius:12px;background:var(--bp-bg);color:var(--bp-fg);font:inherit;line-height:1.2;display:grid;place-content:center;text-align:center;cursor:pointer}" +
    ".bp-m b{display:block;font-size:13.5px;white-space:nowrap}.bp-m small{display:block;font-size:11px;color:var(--bp-mut)}" +
    ".bp-m:hover{border-color:var(--bp-acc)}.bp-m:disabled{opacity:.5;cursor:default}" +
    ".bp-m[aria-pressed=true]{background:var(--bp-acc);border-color:var(--bp-acc);color:var(--bp-acc-ink)}.bp-m[aria-pressed=true] small{color:inherit;opacity:.85}" +
    /* 첫 안내문 */
    ".bp-hello{align-self:flex-start;justify-self:start;max-width:90%}.bp-hello b{display:block;font-size:17px;margin-bottom:4px}" +
    ".bp-hello p{margin:0;font-size:13.5px;line-height:1.6;color:var(--bp-mut)}" +
    /* 「이 ○○는 고쳐요」 칸 */
    ".bp-fix{display:flex;flex-direction:column;gap:8px;padding:10px 12px;border-radius:10px;background:var(--surface-2,var(--bp-card));border-left:3px solid var(--bp-acc);font-size:14px;color:var(--bp-fg)}" +
    ".bp-fix-l{display:block;font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--bp-mut)}" +
    ".bp-fix textarea{width:100%;box-sizing:border-box;min-height:64px;resize:vertical;font:inherit;color:var(--bp-fg);background:var(--bp-card);border:1px solid var(--bp-line);border-radius:10px;padding:9px 11px}" +
    ".bp-fix textarea:focus-visible{outline:2px solid var(--bp-acc);outline-offset:2px}" +
    ".bp-fix-t{white-space:pre-wrap;overflow-wrap:anywhere}.bp-fix-t .bp-mut{color:var(--bp-mut)}" +
    ".bp-fix-b{display:flex;gap:6px;flex-wrap:wrap}" +
    ".bp-fix-done{margin:4px 0 0;font-size:12.5px;color:var(--bp-mut)}" +
    ".bp-fix-tag{color:var(--bp-acc)!important;border-color:var(--bp-acc)!important}";
  (document.head || document.documentElement).appendChild(css);

  /* ── 답할 모델 — 모든 앱이 config/ai 의 model 하나를 같이 쓴다 (값: auto 또는 모델 id) ── */
  var MODELS = [["auto", "자동", "auto"], ["claude-haiku-5-5", "빠름", "Haiku"], ["claude-sonnet-5-5", "기본", "Sonnet"], ["claude-opus-5-5", "깊게", "Opus"], ["claude-fable-5-1", "최고", "Fable"]];
  var SHORT = { "claude-haiku-5-5": "haiku", "claude-sonnet-5-5": "sonnet", "claude-opus-5-5": "opus" };   // 맥에서 답할 때 넘기는 이름 (콘텐츠 기획 「Claude 모드」와 같은 꼴)
  var LS = "bp.model", model = "auto", DB = null, fns = [];
  try { model = localStorage.getItem(LS) || "auto"; } catch (e) {}
  function valid(m) { return MODELS.some(function (x) { return x[0] === m; }) ? m : "auto"; }
  model = valid(model);
  function take(m) { m = valid(m); if (m === model) return; model = m; try { localStorage.setItem(LS, m); } catch (e) {} paintModels(); fns.forEach(function (f) { try { f(m); } catch (e) {} }); }
  function modelRow(label) {
    return '<div class="bp-models" role="group" aria-label="' + esc(label || "답할 Claude 모델 — 다음 질문부터, 모든 앱에 같이") + '">' + MODELS.map(function (m) {
      var on = m[0] === model;
      return '<button type="button" class="bp-m" data-bp-model="' + m[0] + '" aria-pressed="' + on + '"' + (DB ? "" : " disabled") + ' title="' + esc(m[1] + " · " + m[2] + (on ? " — 지금 이 모델로 답해요" : " — 누르면 다음 질문부터 (모든 앱)")) + '"><b>' + (on ? "✓ " : "") + m[1] + "</b><small>" + m[2] + "</small></button>";
    }).join("") + "</div>";
  }
  function paintModels() { [].forEach.call(document.querySelectorAll(".bp-models"), function (el) { el.outerHTML = modelRow(el.getAttribute("aria-label")); }); }
  document.addEventListener("click", function (e) {
    var b = e.target.closest && e.target.closest("[data-bp-model]"); if (!b || !DB) return;
    take(b.getAttribute("data-bp-model"));
    DB.doc("config/ai").set({ model: model, at: new Date().toISOString() }).catch(function () {});
  });
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", paintModels); else paintModels();   // 앱 html 에 미리 둔 빈 줄(.bp-models)도 채운다
  function pull() { if (DB && window.BRAINY && BRAINY.fetch) BRAINY.fetch("config/ai").then(function (d) { take((d && d.model) || "auto"); }, function () {}); }
  if (window.claude && claude.use) claude.use("db").then(function (db) {
    if (!db) return; DB = db; paintModels(); pull();
    db.doc("config/ai").onSnapshot(function (s) { if (s.exists) take((s.data() || {}).model || "auto"); }, function () {});   // 홈처럼 config 를 받는 앱은 실시간으로
    document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") pull(); });   // 다른 앱에서 바꾼 것도 다시 볼 때 맞춘다
  }, function () {});

  /* ── 노트 쓰기 도구 — 앱 대화 규칙에 같이 넣는 한 줄 ── */
  var NOTE_RULE = "- 볼트 노트(위키 페이지·단어 뜻·태스크 노트 등)를 쓰거나 고치라고 하면 앱 고치기(app_edit_start)가 아니라 노트 쓰기 도구 vault_write 로 바로 한다: 먼저 vault_search·vault_read 로 지금 내용을 읽고, 바꿀 곳만 patch 로 고치고, 없는 페이지는 같은 영역의 다른 페이지 형식에 맞춰 create 로 만든다. 쓴 뒤엔 어디를 고쳤는지와 맥이 켜져 있으면 몇 초 안에 옵시디언 볼트에 들어간다고 한 줄로 알린다. 시키지 않은 노트는 쓰지 않는다. 노트 쓰기는 .md 노트만 된다.";

  /* ── 첫 안내문 — o: {name 앱 이름, what 첫 문장(없으면 기본), editNote 앱 고치기 설명, local 로컬 앱, pics 사진 보내기 됨} → {title, text} ── */
  function hello(o) {
    o = o || {};
    if (o.local) return { title: "동욱 님, 무엇을 도와드릴까요?", text: (o.name || "이 앱") + "에 대해 묻거나 바꾸고 싶은 걸 말해 주세요. " + (o.editNote || "이 맥의 Claude가 앱 원본을 바로 고쳐요. 고친 뒤 새로고침하면 보여요.") };
    return { title: "동욱 님, 무엇을 도와드릴까요?",
      text: (o.what || (o.name || "이 앱") + "에 대해 묻거나 바꾸고 싶은 걸 말해 주세요.") +
        " 위키 페이지·단어 뜻 같은 볼트 노트도 쓰거나 고쳐 달라고 하면 바로 해요 — 맥이 켜져 있으면 몇 초 안에 볼트에 들어가요." +
        " 앱 화면을 바꿔 달라고 하면 " + (o.editNote || "고친 판이 5~15분 뒤 준비되고, 「적용해 줘」라고 해야 실제 앱에 들어가요.") +
        (o.pics === false ? "" : " 📎로 사진(화면 캡처)도 같이 보낼 수 있어요 — 붙여 넣어도 돼요.") };
  }
  function helloHtml(o) { var h = hello(o); return '<div class="bp-hello"><b>' + esc(h.title) + "</b><p>" + esc(h.text) + "</p></div>"; }

  /* ── 「이 ○○는 고쳐요」 칸 — 체화 단어장 고칠 단어 방식 (2026-11-24 동욱: 맥 단축키도 같은 방식으로)
     o: {id, what "단어"·"단축키", on 표시됨, text 적은 글, at 날짜, editing 쓰는 중, done {at, note} 지난번 고친 내용, placeholder, label 글칸 이름,
         attr(act, id) 단추 속성 — act: edit·save·cancel·del, btn {primary, ghost} 앱의 단추 class}
     저장 = 표시 + 적은 글(글 없이 표시만도 됨) · 표시 풀기 = 둘 다 지움. 글칸은 class rq-in · id "rq-<id>" (앱이 그 값을 읽는다) ── */
  function fixHtml(o) {
    var id = esc(o.id), w = o.what || "항목", A = o.attr || function (a, i) { return 'data-fix="' + a + '" data-id="' + esc(i) + '"'; };
    var P = (o.btn && o.btn.primary) || "btn primary", G = (o.btn && o.btn.ghost) || "btn ghost";
    function bt(cls, a, label) { return '<button type="button" class="' + cls + '" ' + A(a, o.id) + ">" + label + "</button>"; }
    if (o.editing) return '<div class="bp-fix"><span class="bp-fix-l">이 ' + esc(w) + "는 고쳐요 — 무엇이 틀렸나요?</span>" +
      '<textarea class="rq-in" id="rq-' + id + '" maxlength="300" placeholder="' + esc(o.placeholder || "예: 틀림 / 다른 것과 중복 / 설명이 너무 기본적임") + '" aria-label="' + esc((o.label || w) + " 고칠 점") + '">' + esc(o.text || "") + "</textarea>" +
      '<div class="bp-fix-b">' + bt(P, "save", "저장") + bt(G, "cancel", "취소") + (o.on ? bt(G, "del", "표시 풀기") : "") + "</div></div>";
    if (o.on) return '<div class="bp-fix"><span class="bp-fix-l">✓ 고칠 ' + esc(w) + (o.at ? " · " + esc(String(o.at).slice(0, 10)) : "") + '</span><span class="bp-fix-t">' + (o.text ? esc(o.text) : '<span class="bp-mut">적은 글이 없어요</span>') + "</span>" +
      '<div class="bp-fix-b">' + bt(G, "edit", "글 고치기") + bt(G, "del", "표시 풀기") + "</div></div>";
    return bt((o.btn && o.btn.mark) || G, "edit", "✎ 이 " + esc(w) + "는 고쳐요 (오류·중복)") +
      (o.done && o.done.note ? '<p class="bp-fix-done">지난번 고친 내용 · ' + esc(String(o.done.at || "").slice(0, 10)) + " · " + esc(o.done.note) + "</p>" : "");
  }
  /* Brainy에게 맡기기 단추 — o: {n 고칠 개수, sub 무엇까지 하는지, cls, attr} */
  function fixAsk(o) { return o.n ? '<button type="button" class="' + (o.cls || "btn primary") + '" ' + (o.attr || 'data-bp-fixask="1"') + ">✦ Brainy에게 고치기 맡기기" + (o.sub ? " — " + esc(o.sub) : "") + "</button>" : ""; }
  /* 대화창을 열고 그 말로 맡긴다 */
  function ask(q) { if (window.BRAINY_CHAT) window.BRAINY_CHAT.ask(q); else alert("Brainy 대화창이 아직 준비되지 않았어요. 로그인을 확인하고 잠시 뒤 다시 눌러 주세요."); }

  window.BRAINY_PARTS = {
    esc: esc, MODELS: MODELS, NOTE_RULE: NOTE_RULE,
    model: function () { return model; },
    modelShort: function () { return SHORT[model] || ""; },
    onModel: function (f) { fns.push(f); },
    modelRow: modelRow, paintModels: paintModels,
    hello: hello, helloHtml: helloHtml,
    fixHtml: fixHtml, fixAsk: fixAsk, ask: ask
  };
})();

</script>
<script>
/* 강의 실습 — 볼트의 강의 지도·학습 노트·지금 태스크를 보며 Brainy와 한 칸씩 실습한다.
   데이터는 볼트가 정본이다: 3_Action/33_카드/C-<강의> 수강·실습 분류.md · C-<강의> 실습 학습 노트.md · 그 지도를 잇는 32_태스크
   → 맥 동기화(볼트 .claude/scripts/course_app.py) → Supabase cr.data/main → 아래 db.doc("cr.data/main") 가 채운다. 강의 내용을 코드에 넣지 않는다.
   이 앱이 쓰는 것: cr.memo/<강의 id>-<칸 번호표> (칸마다 내 메모) · cr.tog/<번호표> (동욱이 누른 체크 — 맥이 볼트 지도 카드에 적는다, course-check.js) · taskwork/cr-<번호표> (지금 태스크 기준 줄·상태 — 맥 task_sync 가 태스크 노트에 적는다, course-task.js) · Brainy 대화(ai·bchat).
   공부 본문은 cr.study/<강의 id> (볼트 위키 요약, course-study.js). Brainy(course-practice 스킬)는 요구 대조 + 확인 질문 뒤 같은 지도 카드에 체크를 쓴다. */
let DATA = { courses: [] };
let db = null, loaded = false, pendingRender = false;
const S = { cid: lsGet("cr.cid", ""), cell: lsGet("cr.cell", ""), from: "map", filt: "all", backTo: "" };

function lsGet(k, d){ try { const v = JSON.parse(localStorage.getItem(k) || "null"); return v == null ? d : v; } catch (e) { return d; } }
function lsPut(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const inline = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
/* 남은 것 — 괄호 속 지난 기록(날짜·누가 무엇을 했나)은 흐리게: 할 일은 괄호 밖만 */
const remainHtml = s => inline(s).replace(/ \(([^()]*)\)/g, ' <span class="muted">($1)</span>');
const nowIso = () => new Date().toISOString();

/* 칸 상태 — 이름·뜻은 여기 한 곳. 값(st)은 동기화가 지도 카드의 표시(✅ 🔁 ⏳ ↪ ⏭)에서 읽어 온다 */
const ST = {
  done:    { icon: "✅", name: "끝",            how: "교안 요구사항을 다 맞추고 확인 질문까지 마친 칸 (Brainy 대조 또는 내가 끝 표시)" },
  similar: { icon: "🔁", name: "빠진 것 있음",  how: "비슷한 걸 해 봤지만 교안 요구가 남은 칸 — 빠진 것만 하면 끝" },
  doing:   { icon: "⏳", name: "하는 중",       how: "시작했고 아직 남은 칸" },
  todo:    { icon: "○",  name: "아직",          how: "아직 시작 안 한 칸" },
  merged:  { icon: "↪",  name: "다른 칸과 합침", how: "같은 실습이라 다른 칸에서 함께 하는 칸" },
  skip:    { icon: "⏭",  name: "건너뜀",        how: "쓰지 않는 도구라 건너뛴 칸" }
};
const pill = st => `<span class="pill ${st}">${ST[st].icon} ${ST[st].name}</span>`;

/* ── 고른 강의와 그 칸들 ── */
const course = () => DATA.courses.find(c => c.id === S.cid) || DATA.courses[0] || null;
const practice = c => c ? c.parts.flatMap(p => p.cells) : [];
const cellsOf = c => c ? c.listen.concat(practice(c)) : [];
const cellBy = (c, k) => cellsOf(c).find(x => x.key === k) || null;
const isListen = x => x.key[0] === "l";
const partOf = (c, x) => isListen(x) ? "🎧 듣기만" : (c.parts.find(p => p.cells.includes(x)) || {}).name || "";
function counts(c){
  const n = { done: 0, similar: 0, doing: 0, todo: 0, merged: 0, skip: 0 };
  practice(c).forEach(x => n[x.st]++);
  const L = c ? c.listen.filter(x => x.st !== "skip") : [];
  return { ...n, all: practice(c).length, goal: practice(c).length - n.merged - n.skip, lDone: L.filter(x => x.st === "done").length, lAll: L.length };
}
/* 숫자 세는 법 (한 곳) — 실습 끝 x/N 의 N 과 듣기 끝 x/N 의 N 은 「다른 칸과 합침」·「건너뜀」 칸을 뺀 수. 화면 글 COUNT_RULE 도 이것 하나 */
const COUNT_RULE = "끝 x/N 의 N은 합친 칸·건너뛴 칸을 빼고 세요.";
/* 지금 태스크 — 지도 칸과 이어진 완료 기준이 있는 태스크 (동기화가 진행 → 할일 순으로 보낸다) */
const taskOf = c => !c || !c.tasks.length ? null : (c.tasks.find(t => t.crit.some(k => k.cell)) || c.tasks[0]);
const nowKeys = c => { const t = taskOf(c); return new Set(t ? t.crit.filter(k => k.cell && !k.done).map(k => k.cell) : []); };
/* 다음 칸: 지금 태스크의 첫 빈 기준 → 없으면 지도에서 교안 순서로 첫 「끝 아닌」 실습 칸 */
function nextCell(c){
  const t = taskOf(c), k = t && t.crit.find(x => !x.done && x.cell);
  return (k && cellBy(c, k.cell)) || practice(c).find(x => ["similar", "doing", "todo"].includes(x.st)) || null;
}

/* ── Brainy와 같이 하기 — 대화창을 이 말로 채워 연다 (보내기는 동욱이 ↑) ── */
const sayDo = (c, x) => `/course-practice ${c.name} — ${x.title} 진행하자`;
const sayListen = (c, x) => `/course-practice ${c.name} — 듣기 칸 「${x.title}」 실습에 필요한 것만 3줄로 요약해 줘`;
const sayTask = c => `/course-practice ${c.name} — 지도에서 다음 실습 태스크 하나 만들자`;
function brainy(text){
  if (window.BRAINY_CHAT && window.BRAINY_CHAT.fill) { window.BRAINY_CHAT.fill(text); return; }
  toast("Brainy 대화창을 아직 못 불러왔어요. 로그인을 확인하고 잠시 뒤 다시 눌러 주세요.");
}
const doBtn = (x, cls = "primary") => isListen(x)
  ? `<button type="button" class="btn ${cls}" data-listen="${esc(x.key)}">✦ Brainy에게 3줄 요약 듣기</button>`
  : `<button type="button" class="btn ${cls}" data-do="${esc(x.key)}">✦ Brainy와 이 칸 하기</button>`;

function segMore(){ const seg = document.getElementById("courses"); document.getElementById("segwrap").classList.toggle("more", seg.scrollLeft + seg.clientWidth < seg.scrollWidth - 4); }
window.addEventListener("resize", segMore);
document.getElementById("courses").addEventListener("scroll", segMore, { passive: true });
/* 교안 정보(지도 카드 source) — 맨 주소면 「교안 열기」 링크로 */
const fullHtml = s => /^https?:\/\/\S+$/.test(s || "") ? `<a class="ext" href="${esc(s)}" target="_blank" rel="noopener">교안 열기 ↗</a>` : inline(s || "");
/* 「~로 / ~으로」: 받침이 있으면(ㄹ 받침 빼고) 「으로」 */
const josaRo = w => { const ch = String(w).trim().slice(-1).charCodeAt(0) - 0xAC00; if (ch < 0 || ch > 11171) return "로"; const jong = ch % 28; return jong && jong !== 8 ? "으로" : "로"; };
function toast(msg){
  let el = document.getElementById("toast");
  if (!el) { el = document.createElement("div"); el.id = "toast"; el.setAttribute("role", "status"); document.body.appendChild(el); }
  el.textContent = msg; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { el.hidden = true; }, 5000);
}

/* ── 머리말: 강의 고르기 + 숫자 ── */
function renderHead(){
  const c = course();
  document.getElementById("courses").innerHTML = DATA.courses.map(x => { const n = counts(x); return `<button type="button" role="tab" aria-selected="${x === c}" class="${x === c ? "on" : ""}" data-course="${x.id}">${esc(x.name)}<span>${n.done}/${n.goal}</span></button>`; }).join("");
  const sum = document.getElementById("sum");
  if (!c) { sum.innerHTML = ""; return; }
  const n = counts(c);
  sum.innerHTML = [
    ["k-done", "done", `${n.done}<small>/${n.goal}</small>`, "실습 끝"],
    ["k-sim", "similar", n.similar, "🔁 덜 끝남"],
    ["k-doing", "doing", n.doing, "⏳ 하는 중"],
    ["", "todo", n.todo, "남음 (아직)"],
    ["", "listen", `${n.lDone}<small>/${n.lAll}</small>`, "듣기 끝"]
  ].map(([k, f, v, t]) => `<button type="button" class="${k}" data-sum="${f}" aria-label="${t} ${String(v).replace(/<[^>]+>/g, "")} — 지도에서 보기"><b>${v}</b><span>${t}</span></button>`).join("");
  document.getElementById("sub").textContent = c.full && !/^https?:/.test(c.full) ? c.full.split(" · ")[0] : c.name + " 강의";
  const seg = document.getElementById("courses"), on = seg.querySelector(".on");
  if (on && (on.offsetLeft < seg.scrollLeft || on.offsetLeft + on.offsetWidth > seg.scrollLeft + seg.clientWidth)) seg.scrollLeft = on.offsetLeft - 8;
  segMore();
}

/* ── 화면 고르기 ── */
const view = () => { const v = (location.hash || "#now").slice(1); return ["now", "study", "map", "notes", "memo", "cell"].includes(v) ? v : "now"; };
function render(){
  const ae = document.activeElement;
  if (ae && ae.classList && ae.classList.contains("memo-in")) { pendingRender = true; return; }   // 메모를 쓰는 중에는 다시 그리지 않는다 (한글 조합·커서 보호)
  pendingRender = false;
  let v = view();
  const c = course();
  if (v === "cell" && !(c && cellBy(c, S.cell))) v = "map";
  document.querySelectorAll("#tabbar a").forEach(a => a.classList.toggle("on", a.dataset.v === v || (v === "cell" && a.dataset.v === S.from)));
  renderHead();
  const main = document.getElementById("view");
  if (!c) { main.innerHTML = `<section class="card"><p class="empty">${loaded ? "볼트에 강의 지도가 아직 없어요.<br>Brainy에게 「이 강의 분류해 줘」라고 하면 지도 카드를 만들어요." : "강의를 불러오는 중이에요…"}</p></section>`; return; }
  main.innerHTML = v === "study" ? renderStudy(c) : v === "map" ? renderMap(c) : v === "notes" ? renderNotes(c) : v === "memo" ? renderMemo(c) : v === "cell" ? renderCell(c, cellBy(c, S.cell)) : renderNow(c);
  if (v === "cell") { paintMemoState(); studyLoad(c); }
  if (v === "study" && S.page != null) { const el = document.getElementById("page-" + S.page); if (el) { jumpTo(el); S.page = null; } }
  if (S.backTo) { const el = main.querySelector(`[data-cell="${CSS.escape(S.backTo)}"]`); S.backTo = ""; if (el) el.scrollIntoView({ block: "center" }); }
}
/* 장·단원으로 건너뛰기 — 위에 붙은 머리 칸(강의 고르기·숫자) 아래에 제목이 보이게 (11-24 검증 중간 4) */
function jumpTo(el){
  if (!el) return;
  const head = document.querySelector("header").getBoundingClientRect().bottom;
  window.scrollTo(0, window.scrollY + el.getBoundingClientRect().top - head - 12);
}
function openCell(key){
  if (document.activeElement && document.activeElement.classList.contains("memo-in")) document.activeElement.blur();   // 다른 칸으로 갈 때 쓰던 메모 칸을 놓아야 화면이 바뀐다
  const v = view(); if (v !== "cell") S.from = v;
  S.cell = key; lsPut("cr.cell", key);
  if (v === "cell") { render(); window.scrollTo(0, 0); } else location.hash = "cell";
}
function setCourse(id){ S.cid = id; lsPut("cr.cid", id); S.filt = "all"; if (view() === "cell") location.hash = S.from || "map"; else render(); window.scrollTo(0, 0); }

/* ── 누르기 ── */
document.addEventListener("click", e => {
  const c = course();
  const t = e.target.closest("[data-course],[data-cell],[data-do],[data-listen],[data-sum],[data-filt],[data-back],[data-newtask],[data-unit]");
  if (!t) return;
  const d = t.dataset;
  if (d.course) return setCourse(d.course);
  if (d.do !== undefined) { const x = cellBy(c, d.do); if (x) brainy(sayDo(c, x)); return; }
  if (d.listen !== undefined) { const x = cellBy(c, d.listen); if (x) brainy(sayListen(c, x)); return; }
  if (d.newtask !== undefined) return brainy(sayTask(c));
  if (d.cell !== undefined) return openCell(d.cell);
  if (d.back !== undefined) { S.backTo = S.cell; location.hash = S.from || "map"; return; }
  if (d.sum) { S.filt = d.sum; if (view() === "map") render(); else location.hash = "map"; return; }
  if (d.filt) { S.filt = d.filt; render(); return; }
  if (d.unit) { const el = document.getElementById("unit-" + d.unit); if (el) { el.open = true; jumpTo(el); } return; }
});
window.addEventListener("hashchange", () => { const keep = !!S.backTo; if (!keep) window.scrollTo(0, 0); render(); });   // 칸에서 돌아오면 그 칸 줄로 (render 가 옮긴다)
document.addEventListener("focusout", e => { if (e.target.classList && e.target.classList.contains("memo-in")) setTimeout(() => { if (pendingRender) render(); }, 0); });

/* ── 내 체크 — 동욱이 앱에서 직접 누르는 체크 (build.py 가 course.html 에 끼움 · 2026-11-24 동욱 「내가 한 건 수동으로도 체크」) ──
   정본은 볼트 지도 카드다. 앱은 누른 것 하나를 Supabase 문서 하나로 보낸다:
     cr.tog/<번호표> = { cid, map 지도 카드 경로, key 칸, title, kind: cell|req|chk, id 항목 번호표, t 항목 글, done, at }
   맥 동기화(볼트 .claude/scripts/course_app.py apply_toggles)가 지도 카드에 적는다 — 항목 맨 앞 「☑ 」, 칸 끝은 「✅ MM-DD 동욱 체크」 —
   그리고 그 문서에 { ok_at: at, result } 를 붙인다. 지도 카드가 바뀌면 cr.data/main 이 다시 와서 화면이 그 결과를 보여 준다.
   그 사이(보통 몇 초)에는 누른 대로 먼저 보여 준다(TOG_WAIT). 맥이 꺼져 있으면 켜질 때 적힌다. */
let TOG = {};                               // 문서 id -> 저장소에서 받은 것
let TOG_WAIT = lsGet("cr.tog.wait", {});    // 아직 맥이 지도 카드에 적었다고 확인 안 된 것: 문서 id -> 보낸 것 (sent: 저장소가 받았나)
Object.values(TOG_WAIT).forEach(w => { delete w.sending; });
const togId = (cid, key, kind, id) => memoId(cid, key + "|" + kind + "|" + (id || ""));

/* 지금 보이는 체크 상태 — 기다리는 것이 있으면 그것, 없으면 볼트 지도 카드 그대로 */
function itemOn(c, x, kind, it){
  const w = TOG_WAIT[togId(c.id, x.key, kind, it.id)];
  if (w) return w.done;
  return !!it.ok || (x.st === "done" && !x.mine);   // Brainy가 끝낸 칸은 다 맞춘 칸
}
function cellOn(c, x){
  const w = TOG_WAIT[togId(c.id, x.key, "cell")];
  return w ? w.done : x.st === "done";
}
const naItem = it => /해당 없음/.test((it.note || "") + " " + (it.t || ""));
/* 빠진 것 — 교안 요구·확인 항목 중 아직 체크 안 된 것 (☑ 충족 · ⏭ 넘김 · 「해당 없음」은 뺀다). 셈은 여기 한 곳 */
function missingOf(c, x){
  const req = (x.req || []).filter(it => it.id && !it.skip && !naItem(it) && !itemOn(c, x, "req", it));
  const chk = (x.chk || []).filter(it => it.id && it.t && !it.skip && !itemOn(c, x, "chk", it));
  return { req, chk, n: req.length + chk.length, has: (x.req || []).some(it => it.id) || (x.chk || []).some(it => it.id && it.t) };
}

/* 빠진 것 세는 말 — 요구와 확인 질문을 따로 (「빠진 것 17개」만으로는 무엇이 몇 개인지 모름) */
const missWord = m => [m.req.length ? `요구 ${m.req.length}개` : "", m.chk.length ? `확인 질문 ${m.chk.length}개` : ""].filter(Boolean).join(" · ");
function togSend(c, x, kind, it, done){
  const id = togId(c.id, x.key, kind, it && it.id);
  TOG_WAIT[id] = { cid: c.id, map: c.map, key: x.key, title: x.title, kind, id: it ? it.id : "", t: it ? it.t : "", done, at: nowIso(), sent: 0 };
  lsPut("cr.tog.wait", TOG_WAIT);
  render();
  togPush(id, true);
}
/* 보내기 — 저장소가 「받았다」고 답한 것만 sent:1. 못 보낸 것(sent:0)은 연결이 돌아올 때·30초마다 다시 보낸다.
   받침은 보내기 전에 이 기기 사본을 먼저 바꾸므로, 「서버에 그 문서가 있나」로는 보냈는지 알 수 없다 (11-24 검증 높음 1 · 지침 F25). */
function togPush(id, say){
  const w = TOG_WAIT[id];
  if (!w || w.sent || w.sending) return;
  const r = TOG[id];
  if (r && r.at > w.at) { delete TOG_WAIT[id]; lsPut("cr.tog.wait", TOG_WAIT); render(); return; }   // 다른 기기가 더 나중에 누름 — 옛 것을 보내 덮지 않는다 (11-25 재검증 중간 2)
  if (!db) { if (say) toast("아직 연결이 안 됐어요. 이 기기에 두었다가 연결되면 보내요."); return; }
  w.sending = 1;
  const { sent, sending, ...body } = w;
  db.doc("cr.tog/" + id).set(body).then(() => {
    w.sending = 0;
    if (TOG_WAIT[id] !== w) return;   // 그 사이 또 누름 — 새 것이 따로 간다
    w.sent = 1; lsPut("cr.tog.wait", TOG_WAIT); render();   // 「아직 못 보냄」 → 「볼트에 적는 중」 (11-25 재검증 중간 1)
    if (say) toast(w.kind === "cell" ? (w.done ? "끝 표시했어요 · 볼트 지도 카드에 적는 중" : "끝 표시를 풀었어요 · 볼트에 적는 중") : (w.done ? "체크했어요 · 볼트 지도 카드에 적는 중" : "체크를 풀었어요 · 볼트에 적는 중"));
  }, () => { w.sending = 0; if (say) toast("아직 못 보냈어요. 이 기기에 두었다가 연결되면 다시 보내요."); });
}
/* 연결이 돌아오면 서버 소식(다른 기기가 더 나중에 누른 것)을 먼저 받은 뒤에 보낸다 — 소식이 오거나 15초가 지나면.
   그 전에 보내면 이 기기의 옛 체크가 다른 기기의 새 체크를 덮는다 (11-25 재검증 중간 2) */
let togNetBack = Date.now(), togLiveAt = 0;   // 앱을 막 열었을 때도 서버 소식을 먼저 (또는 15초)
const togReady = () => navigator.onLine !== false && (togLiveAt > togNetBack || Date.now() - togNetBack > 15000);
const togRetry = () => { if (togReady()) Object.keys(TOG_WAIT).forEach(id => togPush(id, false)); };
window.addEventListener("offline", () => { togNetBack = Infinity; });
window.addEventListener("online", () => { togNetBack = Date.now(); setTimeout(togRetry, 15500); });
setInterval(() => { if (Object.values(TOG_WAIT).some(w => !w.sent)) togRetry(); }, 30000);
/* 저장소 소식 — 맥이 적은 결과를 보고 기다리던 것을 놓는다. 적지 못했으면(칸·항목 글이 바뀜 등) 이유를 알리고 원래대로.
   다른 기기가 같은 항목을 더 나중에 눌렀으면(r.at > w.at) 그쪽이 이긴다 — 이 기기의 기다림을 놓는다. 소식은 저장을 부르지 않는다(F23). */
function togListen(){
  if (!db) return;
  db.collection("cr.tog").onSnapshot(snap => {
    const m = {};
    snap.docs.forEach(d => { if (d.exists) m[d.id] = d.data(); });
    TOG = m;
    if (!snap.metadata.fromCache) { togLiveAt = Date.now(); togRetry(); }   // 서버 소식을 받은 뒤 못 보낸 것을 견주어 보낸다 (더 나중 것이 있으면 놓음) — 이미 보낸 것은 다시 안 보낸다(F23)
    let changed = false;
    Object.entries(TOG_WAIT).forEach(([id, w]) => {
      const r = TOG[id];
      if (!r) return;
      if (w.sent && r.at > w.at) { delete TOG_WAIT[id]; changed = true; return; }   // 다른 기기가 더 나중에 누름
      if (r.at !== w.at || r.ok_at !== w.at) return;   // 아직 맥이 안 적음
      if (!/^적음|^이미/.test(r.result || "")) toast("볼트에 못 적었어요 — " + (r.result || "이유 모름"));
      else if (!reflected(w)) return;   // 지도 카드가 다시 올 때까지 누른 대로 보여 준다
      delete TOG_WAIT[id]; changed = true;
    });
    if (changed) { lsPut("cr.tog.wait", TOG_WAIT); render(); }
  }, () => {});
}
/* 받은 지도(cr.data)가 그 체크를 이미 담고 있나 */
function reflected(w){
  const c = DATA.courses.find(o => o.id === w.cid), x = c && cellBy(c, w.key);
  if (!x) return true;
  if (w.kind === "cell") return (x.st === "done") === w.done;
  const it = (x[w.kind] || []).find(i => i.id === w.id);
  return !it || !!it.ok === w.done;
}
/* cr.data 가 새로 오면 이미 담긴 체크는 놓는다 */
function togSettle(){
  let changed = false;
  Object.entries(TOG_WAIT).forEach(([id, w]) => { const r = TOG[id]; if (r && r.ok_at === w.at && reflected(w)) { delete TOG_WAIT[id]; changed = true; } });
  if (changed) lsPut("cr.tog.wait", TOG_WAIT);
}

/* 칸 자세히의 체크 목록 — 줄 전체가 누르는 자리 (44px) */
function checkList(c, x, kind){
  const L = (x[kind] || []);
  if (!L.length) return "";
  const noteHtml = n => n ? ` <span class="muted small">— ${remainHtml(n)}</span>` : "";
  return `<ul class="checks">${L.map(it => {
    if (!it.t) return `<li class="qnote muted small">${inline(it.note || "")}</li>`;   // 안내 줄 (질문이 아님)
    if (it.skip) return `<li><span class="ck skip" aria-hidden="true">⏭</span><span class="muted">${inline(it.t)} <span class="small">— 넘김</span>${noteHtml(it.note)}</span></li>`;
    if (naItem(it)) return `<li><span class="ck skip" aria-hidden="true">–</span><span class="muted">${inline(it.t)}${/해당 없음/.test(it.note || "") ? noteHtml(it.note) : ` <span class="small">— 해당 없음 (빠진 것으로 안 세요)</span>`}</span></li>`;
    const on = itemOn(c, x, kind, it), wait = !!TOG_WAIT[togId(c.id, x.key, kind, it.id)];
    const text = kind === "chk" ? (it.q || it.t) : it.t;
    return `<li><button type="button" class="ckrow${on ? " on" : ""}" data-tog="${esc(kind)}" data-id="${esc(it.id)}" aria-pressed="${on}" ${x.st === "done" && !x.mine ? "disabled" : ""}>
      <span class="ck" aria-hidden="true">${on ? "✓" : ""}</span><span>${inline(text)}${noteHtml(it.note)}${wait ? ` <span class="small muted">· ${TOG_WAIT[togId(c.id, x.key, kind, it.id)].sent ? "볼트에 적는 중" : (navigator.onLine === false ? "아직 못 보냄 — 연결되면 보내요" : "보내는 중 — 몇 초 안에")}</span>` : ""}</span></button></li>`;
  }).join("")}</ul>`;
}
/* 칸 끝 표시 단추 — 실습은 「내가 끝냈어요」, 듣기는 「들었어요」. Brainy가 대조해 끝낸 칸은 풀지 않는다 */
function cellBtn(c, x){
  const on = cellOn(c, x), listen = isListen(x);
  if (x.st === "done" && !x.mine && !TOG_WAIT[togId(c.id, x.key, "cell")]) return `<p class="small muted">✅ Brainy가 교안 요구를 대조하고 확인 질문까지 마친 칸이에요.</p>`;
  return `<button type="button" class="btn${on ? "" : " ok"}" data-togcell="${esc(x.key)}" aria-pressed="${on}">${on ? (listen ? "↺ 들었어요 풀기" : "↺ 끝 표시 풀기") : (listen ? "✓ 들었어요" : "✓ 내가 끝냈어요 — 끝 표시")}</button>`;
}
document.addEventListener("click", e => {

/* ── 「공부」 탭 — 강의 내용 쉬운 설명 + 그 Part 의 칸 (build.py 가 course.html 에 끼움 · 2026-11-24 동욱 「공부하면서 실습도」) ──
   본문 정본: 볼트 위키 요약 2_LLMWiki/wiki/<영역>/요약 - <지도 카드 study:>*.md → 맥 동기화 → Supabase cr.study/<강의 id>
   = { name, pages: [{ title, part, path, tldr, secs: [{h, body}] }] }. 목차(c.study)는 cr.data/main 에 같이 온다.
   본문(강의마다 15~45KB)은 cr.data/main 과 따로 둔다 — 위키가 바뀔 때만 다시 오고, 지도·체크가 바뀔 때는 안 온다 (전송량 — 앱 검증 지침 F17).
   칸마다 맞는 차시 한 줄은 cell.easy = { t, code, page } — 칸 자세히에 보인다. */
const STUDY = {};          // 강의 id -> cr.study 문서 (받은 것)
const studyOn = {};        // 강의 id -> 받기 시작함
function studyLoad(c){
  if (!c || !db || studyOn[c.id]) return;
  studyOn[c.id] = true;
  db.doc("cr.study/" + c.id).onSnapshot(s => { STUDY[c.id] = s.exists ? s.data() : { pages: [] }; if (["study", "cell"].includes(view())) render(); }, () => {});
}
const KEEP_OPEN = /^핵심/;   // 처음부터 펼쳐 둘 칸 (나머지는 접어 둔다)
/* 장 이름 — Part 가 있으면 「Part N」, 없으면 제목의 차시 번호(「CH01-02 iTerm2 세팅」 같은 따로 만든 요약) 또는 「강의 전체」(전체 커리큘럼) */
const pageName = t => t.part != null ? "Part " + t.part : ((t.title || "").match(/(?:CH|Ch)\d+-\d+\s*\S+/) || ["강의 전체"])[0];
const partName = p => p == null ? "강의 전체" : "Part " + p;
function renderStudy(c){
  studyLoad(c);
  const toc = c.study || [];
  if (!toc.length) return `<section class="card"><h2>공부</h2><p>${esc(c.name)} 강의는 아직 공부할 요약이 이어져 있지 않아요.</p>
    <p class="small muted" style="margin-top:6px">볼트 지도 카드 머리말(frontmatter)에 <code>study:</code> 로 위키 요약 이름 앞부분을 적으면 여기에 강의 내용 쉬운 설명이 보여요.</p></section>`;
  const doc = STUDY[c.id];
  let h = `<section class="card"><h2>공부 · 요약 ${toc.length}장</h2><p class="small muted" style="margin-bottom:8px">볼트 위키에 Part마다 정리한 강의 내용이에요. 읽고, 그 아래 칸으로 바로 실습하거나 들은 칸을 체크해요.</p>
    <div class="chips">${toc.map((t, i) => `<button type="button" class="chip" data-page="${i}">${esc(pageName(t))}</button>`).join("")}</div></section>`;
  if (!doc) return h + `<section class="card"><p class="empty">공부 내용을 불러오는 중이에요…</p></section>`;
  (doc.pages || []).forEach((pg, i) => {
    const cells = pg.part == null ? [] : cellsOf(c).filter(x => partNo(c, x) === pg.part);
    /* 숫자는 지도와 같은 셈 — 실습 「끝 x/N」의 N은 합친 칸·건너뛴 칸을 뺀 수, 듣기도 건너뛴 칸을 뺀다 (COUNT_RULE 한 곳) */
    const pr = cells.filter(x => !isListen(x) && !["merged", "skip"].includes(x.st)), ls = cells.filter(x => isListen(x) && x.st !== "skip");
    const cnt = [pr.length ? `실습 끝 ${pr.filter(x => cellOn(c, x)).length}/${pr.length}` : "", ls.length ? `듣기 끝 ${ls.filter(x => cellOn(c, x)).length}/${ls.length}` : ""].filter(Boolean).join(" · ");
    h += `<section class="card" id="page-${i}"><div class="part"><h2>${esc(pageName(pg))}</h2>${cnt ? `<small>${cnt}</small>` : ""}</div>
      <h3 style="font-size:17px;margin:2px 0 8px">${inline(pg.title)}</h3>
      ${pg.tldr ? `<div class="tldr">${inline(pg.tldr)}</div>` : ""}
      ${(pg.secs || []).map(s => `<details class="fold sfold"${KEEP_OPEN.test(s.h) ? " open" : ""}><summary><b>${inline(s.h)}</b></summary><div class="md">${mdHtml(s.body)}</div></details>`).join("")}
      ${cells.length ? `<div class="sec"><span class="lbl">이 Part의 칸 — 누르면 자세히·체크</span>${cells.map(x => cellRow(c, x, nowKeys(c))).join("")}</div>` : ""}
      <p class="small muted sec">정본: 볼트 「${esc(pg.title)}」</p></section>`;
  });

}
/* 칸의 Part 번호 — 실습은 지도의 Part, 듣기는 「P1 …」 */
const partNo = (c, x) => x.part != null ? x.part : (x.easy && (c.study[x.easy.page] || {}).part) ?? null;
/* 칸 자세히의 「쉬운 설명」 칸 */
function easyBox(c, x){
  if (!x.easy) return (c.study || []).length ? `<div class="sec"><span class="lbl">쉬운 설명</span><p class="small muted">위키 요약에 이 차시만의 줄이 없어요. ${partNo(c, x) != null ? `<button type="button" class="linkbtn" data-studypart="${partNo(c, x)}">${esc(partName(partNo(c, x)))} 공부 보기 →</button>` : ""}</p></div>` : "";

/* ── 지금 태스크 — 완료 기준 체크·상태 바꾸기 (build.py 가 course.html 에 끼움 · 2026-11-24 동욱 「볼트의 액션(3_Action 태스크)과 연동돼서 움직이도록」) ──
   볼트 태스크 노트가 정본이다. 앱은 누른 것을 문서 하나에 모아 보낸다 (광고 실습 앱과 같은 규약):
     taskwork/cr-<번호표> = { task: "T- 뺀 노트 이름", from: "강의 실습", status: "할일|진행|완료|보류"(안 바꿨으면 ""),
                             steps: { "<본문 체크칸 번호 = crit.box>": true|false }, log: [], synced: false, updatedAt }
   맥의 task_sync.py 가 노트 status·머리줄·로그·허브·실행 로그·데일리 노트에 적고 synced:true 로 바꾼다.
   그 뒤 노트가 바뀌어 cr.data/main 이 다시 오면 화면은 노트 그대로. 그 사이에는 누른 대로 먼저 보여 준다. */
let TW = {};   // 문서 id -> taskwork 문서 (강의 실습 것만)
const TW_UNSENT = lsGet("cr.tw.wait", {});   // 아직 저장소가 받았다고 답하지 않은 것: 문서 id -> 보낼 문서 (앱을 닫아도 남는다 — 지침 F25 · 11-25 재검증 중간 6)
const twId = t => "cr-" + memoId("t", t.name);
const twName = t => t.name.replace(/^T-/, "");
function twOf(t){ const d = TW[twId(t)]; return d && d.synced === false ? d : null; }   // 아직 노트에 안 들어간 것만
function critOn(t, k){ const d = twOf(t); return d && d.steps && d.steps[k.box] !== undefined ? !!d.steps[k.box] : k.done; }
function taskStatus(t){ const d = twOf(t); return (d && d.status) || t.status; }
function twListen(){
  if (!db) return;
  db.collection("taskwork").onSnapshot(snap => {
    const m = {};
    snap.docs.forEach(d => { if (d.exists && d.id.indexOf("cr-") === 0) m[d.id] = d.data(); });
    Object.entries(TW_UNSENT).forEach(([id, w]) => { if (m[id] && m[id].updatedAt > w.updatedAt) { delete TW_UNSENT[id]; lsPut("cr.tw.wait", TW_UNSENT); } else m[id] = w; });   // 못 보낸 것은 이 기기 것을 지킨다 — 다른 기기가 더 나중이면 그쪽
    TW = m;
    if (!snap.metadata.fromCache) Object.keys(TW_UNSENT).forEach(id => twPush(id));
    if (view() === "now") render();
  }, () => {});
}
function twChange(t, mutate){
  if (!db) { toast("아직 연결이 안 됐어요. 잠시 뒤 다시 눌러 주세요."); return; }
  const id = twId(t);
  const cur = JSON.parse(JSON.stringify(TW[id] || {}));
  if (cur.synced !== false) { cur.steps = {}; cur.status = ""; }   // 지난번 것은 이미 노트에 들어감 — 새로 시작
  cur.task = twName(t); cur.from = "강의 실습"; cur.steps = cur.steps || {}; cur.log = cur.log || [];
  mutate(cur);
  // 노트와 같아 보여도 빼지 않고 보낸다 — 노트 사본(cr.data)이 늦게 와서, 바꿨다 바로 되돌린 값이 「같음」으로 빠지면 노트가 앞 값으로 남는다 (광고 실습 11-28 검증 F2와 같은 문제). 같은 값이면 task_sync 가 그냥 넘어간다
  cur.synced = false; cur.updatedAt = nowIso();
  TW[id] = cur; TW_UNSENT[id] = cur; lsPut("cr.tw.wait", TW_UNSENT); render();
  twPush(id, true);
}
/* 못 보낸 것은 연결이 돌아올 때·30초마다 다시 (받침이 이 기기 사본을 먼저 바꾸므로 「보냈나」는 저장소 답으로만 안다 — 지침 F25) */
function twPush(id, say){
  const body = TW_UNSENT[id];
  if (!body || !db || twPush.busy[id]) return;
  twPush.busy[id] = 1;
  db.doc("taskwork/" + id).set(body).then(() => { twPush.busy[id] = 0; if (TW_UNSENT[id] === body) { delete TW_UNSENT[id]; lsPut("cr.tw.wait", TW_UNSENT); } else twPush(id); render(); if (say) toast("볼트 태스크 노트에 적는 중이에요 (몇 초)"); },
    () => { twPush.busy[id] = 0; if (say) toast("아직 못 보냈어요. 연결되면 다시 보내요."); });
}
twPush.busy = {};
window.addEventListener("online", () => setTimeout(() => Object.keys(TW_UNSENT).forEach(id => twPush(id)), 15500));   // 서버 소식을 먼저 받고
setInterval(() => Object.keys(TW_UNSENT).forEach(id => twPush(id)), 30000);
const TASK_ST = ["할일", "진행", "완료", "보류"];
function statusBtns(t){
  const now = taskStatus(t);
  return `<div class="chips" role="group" aria-label="태스크 상태" style="margin-top:8px;align-items:center"><span class="small muted" style="margin-right:2px">태스크 상태</span>${TASK_ST.map(s => `<button type="button" class="chip ${s === now ? "on" : ""}" data-tstatus="${s}" aria-pressed="${s === now}">${s}</button>`).join("")}</div>`;
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-tbox],[data-tstatus]");
  if (!b) return;
  const c = course(), t = taskOf(c); if (!t) return;
  if (b.dataset.tbox !== undefined) {
    const k = t.crit.find(x => String(x.box) === b.dataset.tbox); if (!k) return;
    const on = critOn(t, k);
    return twChange(t, cur => { cur.steps[k.box] = !on; });
  }
  const s = b.dataset.tstatus;
  if (s === taskStatus(t)) return;
  if (s === "완료") {
    const left = t.crit.filter(k => !critOn(t, k)).length;
    if (!confirm(left ? `완료 기준 ${left}줄이 아직 체크 안 됐어요.\n그래도 이 태스크를 완료로 바꿀까요? (볼트 태스크 노트에 적혀요)` : "이 태스크를 완료로 바꿀까요? (볼트 태스크 노트에 적혀요)")) return;
  }
  twChange(t, cur => { cur.status = s; });
});

/* ── 「지금」 탭 — 오늘 할 칸 하나 + 지금 태스크의 완료 기준 (build.py 가 course.html 에 끼움) ──
   지금 태스크 = 볼트 32_태스크 중 이 강의 지도를 잇는 것 (동기화가 진행 → 할일 순으로 보냄). 기준 줄마다 맞는 지도 칸(crit.cell)이 붙어 온다.
   기준 줄 체크(☑)와 상태 버튼은 course-task.js — 누르면 taskwork/cr-… 로 가서 맥이 볼트 태스크 노트에 적는다. 화면은 노트 그대로(그 사이엔 누른 대로). */
function renderNow(c){
  const t = taskOf(c), x = nextCell(c), keys = nowKeys(c);
  let h = c.full || c.meta ? `<p class="small muted" style="padding:0 4px">${fullHtml(c.full)}${c.full && c.meta ? "<br>" : ""}${inline(c.meta || "")}</p>` : "";
  if (x) {
    h += `<section class="card nowcell"><h2>지금 할 칸</h2>
      <div class="meta">${esc(partOf(c, x))}${keys.has(x.key) ? ` · <span class="pill now">지금 태스크</span>` : ""} ${pill(x.st)}</div>
      <h3>${esc(x.title)}</h3>
      ${(() => { const m = missingOf(c, x); return m.has && m.n ? `<div class="remain"><span class="lbl">빠진 것 — ${missWord(m)}</span>${m.req.concat(m.chk).slice(0, 3).map(it => inline(it.t)).join("<br>")}${m.n > 3 ? `<br><span class="muted">… 외 ${m.n - 3}개 — 요구사항 보기에서 전부</span>` : ""}</div>` : ""; })() || (x.remain ? `<div class="remain"><span class="lbl">남은 것</span>${remainHtml(x.remain)}</div>` : "") || (x.desc ? `<p class="small muted" style="margin-bottom:12px">${inline(x.desc)}</p>` : "")}
      <div class="btns">${doBtn(x)}<button type="button" class="btn" data-cell="${esc(x.key)}">요구사항 보기</button></div>
      <p class="small muted" style="margin-top:10px">누르면 Brainy 대화창에 「${esc(sayDo(c, x))}」가 채워져요. ↑ 로 보내면 맥의 Brainy(본계정)가 이 칸을 한 단계씩 직접 진행하고, 단계마다 결과를 보여 주며 확인 질문을 해요. 맥이 꺼져 있으면 답하지 않아요.</p>
    </section>`;
  } else {
    h += `<section class="card"><h2>지금 할 칸</h2><p class="empty">남은 실습 칸이 없어요. 이 강의는 실습을 다 끝냈어요.</p></section>`;
  }
  if (t) {
    const done = t.crit.filter(k => critOn(t, k)).length;
    h += `<section class="card"><h2>지금 태스크 · ${done}/${t.crit.length} 끝</h2>
      <p style="font-weight:700;margin-bottom:2px">${esc(t.name.replace(/^T-/, ""))}</p>
      <p class="small muted">${t.estimate ? "예상 " + esc(t.estimate) : ""}${t.due ? " · 기한 " + esc(t.due) : ""}${t.estimate || t.due ? " · " : ""}기준 줄을 다 체크하면 끝이에요 · 누르면 볼트 태스크 노트에 적혀요${twOf(t) ? ` <span class="muted">· 볼트에 적는 중</span>` : ""}</p>
      ${statusBtns(t)}
      <div style="margin-top:6px">${t.crit.map(k => critRow(c, t, k)).join("") || `<p class="empty">이 태스크에 완료 기준 줄이 없어요.</p>`}</div>
    </section>`;
  } else {
    h += `<section class="card"><h2>지금 태스크</h2>
      <p>이 강의를 잇는 태스크가 아직 없어요.</p>
      <p class="small muted" style="margin:4px 0 12px">Brainy가 지도에서 아직 안 끝난 첫 Part로 1~3시간짜리 태스크 하나를 만들어요.</p>
      <div class="btns"><button type="button" class="btn primary" data-newtask>✦ Brainy와 다음 태스크 만들기</button></div></section>`;
  }
  const others = c.tasks.filter(o => o !== t);
  if (others.length) h += `<section class="card"><h2>이 강의를 쓰는 다른 태스크</h2><ul class="plain">${others.map(o => `<li>${esc(o.name.replace(/^T-/, ""))} <span class="muted small">· ${esc(o.status)}</span></li>`).join("")}</ul></section>`;
  h += `<p class="small muted" style="text-align:center;padding:0 8px">위 태스크 기준 줄 체크와 상태는 볼트 태스크 노트에, 칸을 열어 하는 요구·확인 체크와 「내가 끝냈어요」는 볼트 지도 카드에 적혀요. Brainy와 하면 Brainy가 대조하고 확인 질문을 한 뒤 체크해요.</p>`;
  return h;
}
function critRow(c, t, k){
  const x = k.cell && cellBy(c, k.cell), on = critOn(t, k);
  const [head, ...rest] = k.text.split(" — ");
  return `<div class="crit ${on ? "on" : ""}"><button type="button" class="box" data-tbox="${k.box}" aria-pressed="${on}" aria-label="${esc(head)} — ${on ? "체크됨, 누르면 풀기" : "누르면 체크"}">${on ? "✓" : ""}</button><div class="cb">
    <b>${inline(head)}</b>${rest.length ? `<p>${inline(rest.join(" — "))}</p>` : ""}
    ${x ? `<div class="meta">${pill(x.st)}${x.remain && !on ? ` <span>지도 카드의 남은 것: ${remainHtml(x.remain)}</span>` : ""}</div>
    ${on ? "" : `<div class="btns">${doBtn(x)}<button type="button" class="btn" data-cell="${esc(x.key)}">요구사항 보기</button></div>`}` : `<p class="small muted">지도에서 맞는 칸을 못 찾았어요 — 태스크 줄 그대로예요.</p>`}
  </div></div>`;
}

/* ── 「지도」 탭 — 강의의 모든 칸을 Part 별로, 상태 색으로 (build.py 가 course.html 에 끼움) ──
   거르기(S.filt): all 전체 · left 남은 칸(🔁·⏳·아직) · done · similar · doing · todo · listen 듣기만. 머리말 숫자를 눌러도 여기로 온다.
   지금 태스크의 칸은 보라 바탕(isnow). 칸을 누르면 자세히(course-detail.js). */
const FILTS = [["all", "전체"], ["left", "남은 칸"], ["similar", "🔁 빠진 것 있음"], ["doing", "⏳ 하는 중"], ["todo", "○ 아직"], ["done", "✅ 끝"], ["listen", "🎧 듣기"]];
const keepCell = x => {
  const f = S.filt;
  if (f === "all") return true;
  if (f === "listen") return isListen(x);
  if (isListen(x)) return false;
  return f === "left" ? ["similar", "doing", "todo"].includes(x.st) : x.st === f;
};
function cellRow(c, x, keys){
  const memo = memoOf(c.id, x.key), miss = missingOf(c, x), done = cellOn(c, x);
  const sub = !done && miss.has && miss.n ? `빠진 것 ${missWord(miss)}: ` + miss.req.concat(miss.chk).map(it => it.t.replace(/\*\*/g, "")).slice(0, 2).join(" · ") + (miss.n > 2 ? " …" : "") : x.remain && !done ? "남은 것: " + x.remain : x.desc;
  const tags = [keys.has(x.key) ? `<span class="pill now">지금</span>` : "", x.need ? `<span class="pill" title="계정·열쇠가 필요해요">🔑</span>` : "", memo ? `<span class="pill" title="내 메모 있음">✍︎</span>` : ""].join("");
  return `<button type="button" class="cell ${done ? "done" : x.st}${keys.has(x.key) ? " isnow" : ""}" data-cell="${esc(x.key)}" aria-label="${esc(x.title)} — ${ST[x.st].name}">
    <span class="ct"><b>${esc(x.title)}</b>${sub ? `<span>${inline(sub)}</span>` : ""}</span>
    <span class="tags">${pill(done ? "done" : x.st)}${tags}</span></button>`;
}
function renderMap(c){
  const keys = nowKeys(c), n = counts(c);
  const fcount = f => f === "all" ? n.all + c.listen.length : f === "listen" ? c.listen.length : f === "left" ? n.similar + n.doing + n.todo : n[f];
  /* 거르기 줄은 옆으로 밀리는 한 줄 — 본 목록이 첫 화면에 보이게 (색 뜻은 그 밑 한 줄, 자세한 뜻은 칸을 열면) */
  let h = `<div><div class="filt" role="group" aria-label="칸 거르기">${FILTS.map(([f, t]) => `<button type="button" class="chip ${S.filt === f ? "on" : ""}" data-filt="${f}" aria-pressed="${S.filt === f}">${t}<b>${fcount(f)}</b></button>`).join("")}</div>
    <div class="legend" aria-label="색 뜻">${["done", "similar", "doing", "todo", "merged"].map(s => `<span title="${esc(ST[s].how)}"><i class="${s}"></i>${ST[s].name}</span>`).join("")}<span><i class="now"></i>지금 태스크</span></div><p class="small muted" style="margin-top:4px">칩의 숫자는 그 칸 수 그대로예요. ${COUNT_RULE}</p></div>`;
  const showListen = S.filt === "all" || S.filt === "listen";
  if (showListen && c.listen.length) {
    const L = c.listen.filter(keepCell);
    h += `<section class="card"><details class="fold"${S.filt === "listen" ? " open" : ""}><summary><h2>🎧 듣기만 ${c.listen.length}칸 · 끝 ${n.lDone}/${n.lAll}${c.listen.length > n.lAll ? ` (건너뜀 ${c.listen.length - n.lAll}칸 뺌)` : ""}</h2></summary>
      <p class="small muted" style="margin-bottom:6px">실습 문제가 없는 차시예요. 실습 사이에 Brainy가 필요한 것만 3줄로 요약해 줘요.</p>
      <div>${L.map(x => cellRow(c, x, keys)).join("")}</div></details></section>`;
  }
  if (S.filt !== "listen") {
    c.parts.forEach(p => {
      const L = p.cells.filter(keepCell);
      if (!L.length) return;
      const pd = p.cells.filter(x => x.st === "done").length, pg = p.cells.filter(x => !["merged", "skip"].includes(x.st)).length;
      h += `<section class="card"><div class="part"><h2>${esc(p.name || "실습")}</h2><small>끝 ${pd}/${pg}</small></div>${p.note ? `<p class="small muted">${inline(p.note)}</p>` : ""}
        <div style="margin-top:6px">${L.map(x => cellRow(c, x, keys)).join("")}</div></section>`;
    });
  }
  if (!h.includes('class="cell')) h += `<section class="card"><p class="empty">이 거르기에 맞는 칸이 없어요.</p></section>`;
  return h;
}

/* ── 칸 자세히 — 제목 · 상태 · 빠진 것 · 끝 표시 · 쉬운 설명 · 요구(체크) · 확인 질문(체크) · 결과 · 원문 · 교안 오류 · 재료 · 열쇠 · 내 메모 (build.py 가 course.html 에 끼움) ──
   볼트 지도 카드의 칸 밑 줄(원문·요구·확인·결과·교안 오류)을 보여 준다. 항목 나누기·판정 메모 떼기·질문 끝말·체크 표시(☑ ⏭)는 맥 동기화(course_app.py)가 한 곳에서 정해 보낸다:
   req [{id, t, note, ok|skip}] · chk [{id, t, q, note, ok|skip}] (q 가 비면 원문 t 그대로, t 가 비면 안내 줄) · out·err [글].
   체크·끝 표시는 course-check.js — 누르면 볼트 지도 카드에 적힌다. 빠진 것 = 체크 안 된 요구·확인 항목 (missingOf 한 곳). */
function renderCell(c, x){
  const keys = nowKeys(c), memo = memoOf(c.id, x.key), listen = isListen(x), miss = missingOf(c, x), done = cellOn(c, x);
  const sec = (title, body) => body ? `<div class="sec"><span class="lbl">${title}</span>${body}</div>` : "";
  const list = L => (L || []).length ? `<ul class="plain">${L.map(r => `<li>${inline(r)}</li>`).join("")}</ul>` : "";
  const back = { now: "지금", memo: "내 메모", notes: "배운 것", map: "지도", study: "공부" }[S.from] || "지도";
  const nReq = (x.req || []).filter(it => it.id).length, nChk = (x.chk || []).filter(it => it.id && it.t).length;
  /* 빠진 것 — 항목이 있는 칸은 체크 안 된 항목 그대로, 항목이 없는 칸은 지도 카드의 「빠진 것/남은 것」 글 */
  let missHtml = "";
  if (!done && !listen && miss.has) {
    missHtml = miss.n ? `<div class="remain"><span class="lbl">빠진 것 — ${missWord(miss)} · 교안이 요구했는데 아직 체크 안 된 것</span>
      ${miss.req.length ? `<ul class="miss">${miss.req.map(it => `<li>${inline(it.t)}</li>`).join("")}</ul>` : ""}
      ${miss.chk.length ? `<p class="small" style="margin-top:6px"><b>아직 답 안 한 확인 질문 ${miss.chk.length}개</b> — 아래 「확인 질문」에서 답할 수 있으면 체크해요.</p>` : ""}
      <p class="small muted" style="margin-top:6px">한 것은 아래 목록에서 눌러 체크하면 여기서 빠져요.</p></div>`
      : `<div class="remain ok"><span class="lbl">빠진 것 없음</span>요구 ${nReq}개${nChk ? `·확인 ${nChk}개` : ""}를 다 체크했어요. 끝났으면 「내가 끝냈어요」를 눌러요.</div>`;
  } else if (!done && x.remain) missHtml = `<div class="remain"><span class="lbl">남은 것 (지도 카드 글)</span>${remainHtml(x.remain)}</div>`;
  return `<section class="card">
    <button type="button" class="back" data-back>← ${back}${josaRo(back)} 돌아가기</button>
    <div class="meta" style="margin-top:6px">${esc(partOf(c, x))}${keys.has(x.key) ? ` · <span class="pill now">지금 태스크</span>` : ""}</div>
    <h3 style="margin:4px 0 8px">${esc(x.title)}</h3>
    <div class="meta">${pill(done ? "done" : x.st)}<span>${esc(done && x.st !== "done" ? "내가 끝 표시함 · 볼트에 적는 중" : x.mine ? "내가 앱에서 끝 표시한 칸" : ST[x.st].how)}</span></div>
    ${missHtml}
    <div class="btns" style="margin-top:12px">${doBtn(x)}${cellBtn(c, x)}</div>
    <p class="small muted" style="margin-top:8px">${listen ? "들은 뒤 「들었어요」를 누르면 볼트 지도에 체크돼요. 요약이 필요하면 Brainy에게 3줄 요약을 부탁해요." : "혼자 한 것은 직접 체크해요. Brainy와 하면 Brainy가 요구를 하나씩 대조하고 확인 질문을 한 뒤 체크해요. 체크는 모두 볼트 지도 카드에 적혀요."}</p>
  </section>
  <section class="card">
    ${easyBox(c, x)}
    ${sec("지도 카드에 적힌 것", x.desc && x.desc.replace(x.remain || "", "").replace(/[🔁⏳✅·\s]|(빠진|남은) 것\s*[:：]/g, "") ? `<p>${inline(x.desc)}</p>` : "")}
    ${sec(`요구 — 교안이 정한 완료 기준 ${nReq}개 · 한 것은 눌러 체크`, checkList(c, x, "req"))}
    ${sec(nChk ? `확인 질문 ${nChk}개 — 답할 수 있으면 체크` : "확인 질문 — 이 칸은 따로 없어요", checkList(c, x, "chk"))}
    ${sec("이 실습이 만드는 것", list(x.out))}
    ${sec("📎 쓸 재료 — 동욱의 실제 파일·자료", x.mat ? `<p>${inline(x.mat)}</p>` : "")}
    ${sec("🔑 계정·열쇠 필요 — 로그인·열쇠는 동욱이 직접 넣어요", x.need ? `<p>${inline(x.need)}</p>` : "")}
    ${sec("교안이 틀린 곳 — 실제 도구와 달라 고쳐서 해요", list(x.err))}
    ${sec("원문 위치 — 볼트 교안의 줄 번호", x.src ? `<p class="small">${inline(x.src)}</p>` : "")}
    ${sec("그 밖에 적힌 것", x.extra ? `<ul class="plain">${x.extra.map(r => `<li>${inline(r)}</li>`).join("")}</ul>` : "")}
    ${!(x.req || []).length && !(x.chk || []).length && !(x.out || []).length && !x.src && !listen ? `<p class="small muted">이 칸에는 아직 교안 대조 줄(원문·요구·확인)이 없어요. Brainy와 이 칸을 할 때 원문에서 옮겨 적어요.</p>` : ""}
    <p class="small muted sec">정본: 볼트 「${esc(c.map.split("/").pop().replace(/\.md$/, ""))}」 ${x.line}번째 줄</p>
  </section>
  ${memoBox(c, x, memo)}`;
}

/* ── 「배운 것」 탭 — 볼트 「C-<강의> 실습 학습 노트」의 단원 목록과 단원 본문 (build.py 가 course.html 에 끼움) ──
   본문은 노트의 마크다운 그대로 온다 (c.note.units[].body). 아래 mdHtml 이 표·코드 블록·목록·인용·굵게·코드만 그린다.
   노트가 없는 강의는 빈 안내 — 칸 하나를 끝낼 때마다 Brainy가 노트에 단원을 하나씩 더한다. */
function mdHtml(src){
  const L = String(src || "").split("\n"), out = [];
  let i = 0;
  const isBlock = l => /^```/.test(l.trim()) || /^#{1,6}\s/.test(l) || /^\|/.test(l) || /^>\s?/.test(l) || /^\s*([-*]|\d+[.)])\s/.test(l);
  while (i < L.length) {
    const l = L[i];
    if (/^```/.test(l.trim())) {
      const buf = []; i++;
      while (i < L.length && !/^```/.test(L[i].trim())) buf.push(L[i++]);
      i++; out.push(`<pre><code>${esc(buf.join("\n"))}</code></pre>`); continue;
    }
    const hm = l.match(/^(#{1,6})\s+(.*)$/);
    if (hm) { out.push(`<${hm[1].length >= 5 ? "h5" : "h4"}>${inline(hm[2])}</${hm[1].length >= 5 ? "h5" : "h4"}>`); i++; continue; }
    if (/^\|/.test(l)) {
      const rows = [];
      while (i < L.length && /^\|/.test(L[i])) rows.push(L[i++]);
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(x => x.trim());
      const body = rows.filter((r, k) => !(k === 1 && /^\|?\s*:?-/.test(r)));
      const [head, ...rest] = body.map(cells);
      out.push(`<div class="tbl"><table><thead><tr>${head.map(x => `<th>${inline(x)}</th>`).join("")}</tr></thead><tbody>${rest.map(r => `<tr>${r.map(x => `<td>${inline(x)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
      continue;
    }
    if (/^>\s?/.test(l)) {
      const buf = [];
      while (i < L.length && /^>\s?/.test(L[i])) buf.push(L[i++].replace(/^>\s?/, ""));
      out.push(`<blockquote>${buf.map(inline).join("<br>")}</blockquote>`); continue;
    }
    if (/^\s*([-*]|\d+[.)])\s/.test(l)) {
      const ordered = /^\s*\d/.test(l), items = [];
      while (i < L.length && (/^\s*([-*]|\d+[.)])\s/.test(L[i]) || (/^\s{2,}\S/.test(L[i]) && items.length))) {
        const m = L[i].match(/^(\s*)(?:[-*]|\d+[.)])\s+(.*)$/);
        if (m) items.push({ d: m[1].length >= 2 ? 1 : 0, t: m[2] }); else items[items.length - 1].t += " " + L[i].trim();
        i++;
      }
      const tag = ordered ? "ol" : "ul";
      out.push(`<${tag}>${items.map(it => `<li${it.d ? ' style="margin-left:18px;list-style-type:circle"' : ""}>${inline(it.t)}</li>`).join("")}</${tag}>`); continue;
    }
    if (!l.trim()) { i++; continue; }
    const buf = [];
    while (i < L.length && L[i].trim() && !isBlock(L[i])) buf.push(L[i++]);
    out.push(`<p>${buf.map(inline).join("<br>")}</p>`);
  }
  return out.join("");
}
function renderNotes(c){
  const n = c.note, name = `C-${c.name} 실습 학습 노트`;
  if (!n || !(n.units || []).length) {
    return `<section class="card"><h2>배운 것</h2>
      <p>${esc(c.name)} 강의는 아직 배운 것 노트가 없어요.</p>
      <p class="small muted" style="margin-top:6px">실습 칸 하나를 끝낼 때마다 Brainy가 볼트 「${esc(name)}」에 단원 하나를 더해요. 더해지면 여기에 저절로 보여요.</p></section>`;
  }
  const units = n.units.slice().sort((a, b) => a.n - b.n);
  const have = new Set(units.map(u => u.n));
  let h = `<section class="card"><h2>단원 목록 · ${(n.list.length || units.length)}개</h2><p class="small muted" style="margin-bottom:6px">실습 칸마다 무엇을 배웠는지 모은 볼트 노트예요. 누르면 그 단원으로 가요.</p><div class="ulist">` +
    (n.list.length ? n.list : units.map(u => ({ n: u.n, what: u.title, state: "" }))).map(r => {
      const ok = have.has(r.n);
      return `<button type="button" class="cell ${ok ? "done" : "todo"}"${ok ? ` data-unit="${r.n}"` : " disabled"}><span class="ct"><b>단원 ${esc(r.n)} · ${inline(r.what)}</b>${r.state ? `<span>${esc(r.state.replace(/`/g, ""))}</span>` : ""}</span><span class="tags">${ok ? `<span class="pill">읽기</span>` : `<span class="pill">아직 본문 없음</span>`}</span></button>`;
    }).join("") + `</div></section>`;
  units.forEach((u, k) => {
    h += `<section class="card"><details class="fold unit" id="unit-${u.n}"${k === 0 ? " open" : ""}><summary><b>단원 ${u.n}. ${inline(u.title)}</b></summary>
      ${u.src ? `<p class="src">${inline(u.src)}</p>` : ""}<div class="md">${mdHtml(u.body)}</div></details></section>`;
  });
  return h;
}

/* ── 내 메모 — 칸마다 동욱이 적는 메모 (build.py 가 course.html 에 끼움) ──
   저장: 칸 하나 = 문서 하나 — Supabase cr.memo/<강의 id>-<칸 번호표> = { cid, key 칸 key, title 칸 제목, t 글, at 쓴 시각 }.
   칸마다 따로라서 두 기기가 다른 칸에 쓰면 서로 지우지 않는다. 같은 칸이면 나중에 쓴 글이 남는다. 지운 메모는 t: "" 로 남는다.
   이 앱이 직접 쓰는 유일한 자료다(볼트에는 안 들어간다).
   저장은 「쓰기 → 0.7초 쉬면 그 칸 하나만 보낸다」 뿐이다. 저장소에서 온 소식(스냅숏)은 화면만 맞추고 절대 저장을 부르지 않는다
   (2026-11-24 검증: 소식마다 다시 보내 한 번 쓰기가 실시간 UPDATE 약 1,400건이 됨 — 11-19 전송량 초과 선례).
   못 보낸 칸은 이 기기(localStorage cr.memo.wait)에 두었다가 연결이 돌아오면(online · 30초마다) 그 칸만 다시 보낸다. */
let MEMO = {};                              // 문서 id -> {cid, key, title, t, at}  (저장소에서 받은 것)
let WAIT = lsGet("cr.memo.wait", {});       // 아직 저장소가 받았다고 확인 안 된 칸: 문서 id -> 같은 모양
Object.values(WAIT).forEach(d => { delete d.sending; });
let memoT = 0, memoState = "";
const memoId = (cid, key) => { let h = 2166136261; for (const ch of key) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619); } return cid + "-" + (h >>> 0).toString(36); };
const memoGet = (cid, key) => WAIT[memoId(cid, key)] || MEMO[memoId(cid, key)] || null;
const memoOf = (cid, key) => (memoGet(cid, key) || {}).t || "";
function memoListen(){
  if (!db) return;
  db.collection("cr.memo").onSnapshot(snap => {
    const m = {};
    snap.docs.forEach(d => { if (d.exists) m[d.id] = d.data(); });
    MEMO = m;
    if (!snap.metadata.fromCache && !memoListen.live) { memoListen.live = true; memoRetry(); }   // 지난번 못 보낸 칸 — 처음 한 번만
    if (["memo", "map", "cell"].includes(view())) render();   // 쓰는 중이면 render 가 미룬다 — 여기서 저장은 부르지 않는다
  }, () => {});
}
function memoSet(c, x, t){
  const id = memoId(c.id, x.key);
  WAIT[id] = { cid: c.id, key: x.key, title: x.title, t, at: nowIso() };
  lsPut("cr.memo.wait", WAIT);
  memoState = "saving"; paintMemoState();
  clearTimeout(memoT); memoT = setTimeout(() => { memoT = 0; memoSend(id); }, 700);
}
function memoSend(id){
  const doc = WAIT[id];
  if (!doc || doc.sending) return;
  if (!db) { memoState = "fail"; paintMemoState(); return; }
  doc.sending = true;
  const { sending, ...body } = doc;
  db.doc("cr.memo/" + id).set(body).then(() => {
    if (WAIT[id] === doc) { delete WAIT[id]; lsPut("cr.memo.wait", WAIT); }   // 보내는 사이 더 썼으면 그 글은 다음 차례에
    MEMO[id] = body;
    if (WAIT[id]) memoSend(id); else { memoState = "saved"; paintMemoState(); }   // 저장소가 받은 글 = 지금 칸의 글일 때만 「저장했어요」
  }, () => { doc.sending = false; memoState = "fail"; paintMemoState(); });
}
const memoRetry = () => { if (!memoT) Object.keys(WAIT).forEach(memoSend); };
window.addEventListener("online", memoRetry);
setInterval(() => { if (Object.keys(WAIT).length) memoRetry(); }, 30000);
function paintMemoState(){
  const el = document.getElementById("memo-state"); if (!el) return;
  el.className = "saved" + (memoState === "fail" ? " fail" : "");
  el.textContent = memoState === "saving" ? "저장하는 중…" : memoState === "saved" ? "저장했어요 · 다른 기기에서도 보여요" : memoState === "fail" ? "아직 저장 못 했어요 — 이 기기에 두었다가 연결되면 저절로 보내요" : "쓰면 바로 저장돼요 · 모든 기기에서 같아요";
}
function memoBox(c, x, memo){
  return `<section class="card"><h2>내 메모</h2>
    <textarea class="memo-in" id="memo-in" data-key="${esc(x.key)}" placeholder="이 칸을 하며 떠오른 것, 막힌 곳, 다음에 할 것을 적어 두세요" aria-label="${esc(x.title)} 메모">${esc(memo)}</textarea>
    <p id="memo-state" class="saved" style="margin-top:6px"></p></section>`;
}
document.addEventListener("input", e => {
  if (e.target.id !== "memo-in") return;
  const c = course(), x = c && cellBy(c, e.target.dataset.key);
  if (x) memoSet(c, x, e.target.value);
});

/* 「내 메모」 탭 — 이 강의에서 메모를 적은 칸 전부 (최근 순) */
function memoList(cid){
  const all = { ...MEMO, ...WAIT };
  return Object.values(all).filter(v => v && v.cid === cid && (v.t || "").trim()).sort((a, b) => (b.at || "").localeCompare(a.at || ""));
}
function renderMemo(c){
  const rows = memoList(c.id);
  const other = DATA.courses.filter(o => o !== c).map(o => [o, memoList(o.id).length]).filter(([, n]) => n);
  let h = `<section class="card"><h2>내 메모 · ${rows.length}칸</h2>`;
  if (!rows.length) h += `<p class="empty">아직 적은 메모가 없어요.<br>지도에서 칸을 열면 맨 아래에 메모 칸이 있어요. 쓰면 바로 저장되고 모든 기기에서 같아요.</p>`;
  else h += rows.map(v => {
    const x = cellBy(c, v.key), when = new Date(v.at);
    return `<button type="button" class="cell ${x ? x.st : "todo"}"${x ? ` data-cell="${esc(v.key)}"` : " disabled"}><span class="ct"><b>${esc(x ? x.title : v.title || v.key)}</b><span style="white-space:pre-wrap;-webkit-line-clamp:4">${esc(v.t)}</span></span>
      <span class="tags">${x ? pill(x.st) : `<span class="pill" title="지도에서 칸 이름이 바뀌어 못 찾았어요">칸 없음</span>`}<small class="muted mono">${when.getMonth() + 1}/${when.getDate()}</small></span></button>`;
  }).join("");
  h += `</section>`;
  if (other.length) h += `<section class="card"><h2>다른 강의의 메모</h2><div class="chips">${other.map(([o, n]) => `<button type="button" class="chip" data-course="${o.id}">${esc(o.name)}<b>${n}</b></button>`).join("")}</div></section>`;
  return h;
}


/* ── 시작 ── */
async function init(){
  render();   // 받침(shim.js)이 지난번 받은 것을 먼저 내준다 — 여기서 따로 두지 않는다
  const cl = window.claude;
  if (!cl || !cl.use) { loaded = true; render(); return; }
  db = await cl.use("db").catch(() => null);
  if (!db) { loaded = true; render(); return; }
  db.doc("cr.data/main").onSnapshot(s => {
    const v = s.exists ? s.data() : null;
    loaded = true;
    if (v && Array.isArray(v.courses)) { DATA = v; togSettle(); }
    render();
  }, () => { loaded = true; render(); });
  memoListen();
  togListen();
  twListen();
}
init();
</script>
<script>
/* 강의 실습 — Brainy 연결 (build.py 가 brainy-chat.js 앞에 붙인다)
   mode(): 맥에서만 답한다 — 볼트 폴더에서 도는 Claude Code(본계정 구독)가 course-practice 스킬·지도 카드·교안 원문을 읽고 칸을 직접 진행한다. 맥이 꺼져 있어도 클라우드(콘솔 API 키)로 넘기지 않는다 (cloud:false · 2026-11-28 동욱 「원격으로 너가 대신해 주는 방식 … 클로드 콘솔 말고 내 본계정 사용으로」).

(function () {
  function norm(s) { return String(s || "").toLowerCase().replace(/\s+/g, ""); }
  function findCourse(q) { var n = norm(q); return !n ? course() : DATA.courses.filter(function (c) { return c.id === q || norm(c.name).indexOf(n) >= 0 || n.indexOf(norm(c.name)) >= 0; })[0] || null; }
  function findCell(c, q) {
    var n = norm(q), L = cellsOf(c); if (!n) return null;
    return L.filter(function (x) { return x.key === q || norm(x.title) === n; })[0] || L.filter(function (x) { return norm(x.title).indexOf(n) >= 0 || n.indexOf(norm(x.title)) >= 0; })[0] || null;
  }
  function cellText(c, x) {
    return ["  · 칸: " + partOf(c, x) + " › " + x.title + " [" + ST[x.st].icon + " " + ST[x.st].name + "] (지도 카드 " + x.line + "번째 줄)",
      x.remain ? "  · 남은 것: " + x.remain : "", x.desc ? "  · 지도에 적힌 것: " + x.desc : "",
      x.src ? "  · 원문: " + x.src : "",
      (x.req || []).length ? "  · 요구 " + x.req.length + "개: " + x.req.map(function (r) { return r.t + (r.note ? " — " + r.note : ""); }).join(" / ") : "",
      (x.chk || []).length ? "  · 확인: " + x.chk.map(function (q) { return (q.t || "") + (q.note ? " — " + q.note : ""); }).join(" / ") : "",
      (x.out || []).length ? "  · 결과: " + x.out.join(" / ") : "", (x.err || []).length ? "  · 교안 오류: " + x.err.join(" / ") : "", x.mat ? "  · 📎 재료: " + x.mat : "", x.need ? "  · 🔑 열쇠: " + x.need : "",
      memoOf(c.id, x.key) ? "  · 동욱의 메모: " + memoOf(c.id, x.key) : ""].filter(Boolean).join("\n");
  }
  window.BRAINY_HOOK = {

      return ["[강의 실습 — Brainy가 동욱의 맥에서 칸을 직접 진행하고 동욱은 보며 배운다 (2026-11-28 동욱 「원격으로 너가 대신해 주는 방식」)]",
        "- 이건 앱 고치기(app_edit_start)가 아니라 볼트 일이다. 먼저 볼트 `.claude/skills/course-practice/SKILL.md` 를 읽고 그 규칙대로 한다 — 앱에서 온 칸은 §1-4-1 「Brainy가 진행」.",
        "- 「진행하자·진행해 줘」면: 이 칸이 뭔지·왜·요구 몇 개·무엇이 나오는지 3~5줄 → 교안 단계를 네가 직접 한다, 한 번에 한 단계: ① 지금 하는 일 한 줄 ② 실제로 한다(교안의 프롬프트·명령·설정을 동욱 재료로 실행, 결과 파일 만들기 — 결과와 파일 경로를 보여 줌) ③ 왜 이렇게 하는지 + 교안이 「확인하라」는 지점 한 줄 ④ 동욱에게 확인 질문 하나. 동욱이 답하거나 「다음」 하면 다음 단계.",
        "- 한 번 답은 8분 안에 끝나야 한다 — 긴 단계는 나눠서 하고 「다음」을 기다린다.",
        "- 동욱의 생각이 답인 단계(워크시트·기획·고르기)는 답 후보와 근거를 보여 주고 동욱이 고르게 한다. 🔑 로그인·비밀번호·결제·계정 만들기는 그 직전까지 준비하고 동욱에게 넘긴다. 되돌리기 어려운 것(푸시·발송·게시·삭제)은 한 줄로 보여 주고 승인받은 뒤에만.",

        "- 칸을 끝내면 그 강의 학습 노트(경로는 [지금 앱 상태])에 단원 하나를 더한다 — 단원 목록 표 한 줄 + 「### 단원 N. 칸 이름」 본문. 노트가 없으면 같은 폴더에 「C-<강의> 실습 학습 노트.md」를 " + (ex ? "`" + ex.note.path + "` 와" : "다른 강의 학습 노트와") + " 같은 모양으로 만든다 (만들기 전에 묻는다).",
        "- 듣기 칸 요약은 볼트 교안·위키 요약에서 실습에 필요한 것만 3줄. 동욱이 「들었어」 하면 지도 카드의 그 줄을 [x] 로.",
        "- 「보여 줘·정리해 줘」는 보여 주기까지. 볼트 쓰기는 「넣어·해·반영해」를 들은 뒤."].join("\n");

    },
    tools: [
      { name: "course_open", description: "강의 실습 앱에서 강의·탭·칸을 연다. course 는 강의 이름(비우면 지금 강의), view 는 now(지금)·map(지도)·notes(배운 것)·memo(내 메모)·cell(칸 자세히 — cell 에 칸 제목), cell 은 칸 제목 일부.",

})();

<script>
/* Brainy 대화창 — 모든 앱 공통 (원본은 이 파일 하나)

   생김새: 서비스형 채팅 — 오른쪽 아래 말풍선 단추 → 컴퓨터는 오른쪽 아래에 붙는 창, 폰은 아래에서 올라오는 창. 앱 화면은 그대로 보이고 쓸 수 있다.

   모델 버튼 줄 · 첫 안내문 · 노트 쓰기 규칙은 공통 부품 brainy-parts.js(window.BRAINY_PARTS)가 정한다 — 모든 앱이 같이 쓴다.
   대화는 이 기기에 최근 30개만 남긴다. */
